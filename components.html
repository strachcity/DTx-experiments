let state;
function resetState(){
  state = {screen:'all-screens', showNotes:false};
}
resetState();

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function navigate(h){ if(location.hash===h){ route(); } else { location.hash = h; } }
function note(title, body){
  if(!state.showNotes) return '';
  return '<div class="design-note"><strong>Design note — '+esc(title)+'</strong>'+body+'</div>';
}
function toggleNotes(){ state.showNotes = !state.showNotes; route(); }
function stub(e){ e.preventDefault(); alert('Not built in this reference. This file demonstrates components, it does not run a journey.'); }

/* Demo markup and the code sample beside it come from one string, so
   the sample can never drift from what is rendered above it. */
function demo(html, opts){
  const o = opts || {};
  /* The code sample shows the markup a real page would use, h1 and all.
     The rendered copy demotes that h1 to an h2 so this catalogue does not
     itself ship several h1s on one page, which is the rule it is here to
     teach. Both come from the same string, so the sample cannot drift
     from what is shown; only the heading level differs, and the visual
     size is carried by the class either way. */
  const shown = html.replace(/<h1(\s|>)/g,'<h2$1').replace(/<\/h1>/g,'</h2>');
  return '<div class="ref-demo'+(o.plain?' ref-demo--plain':'')+'">'+shown+'</div>'
    + (o.hideCode ? '' : '<div class="ref-code">'+esc(html.trim())+'</div>');
}
function block(title, body){
  return '<div class="ref-block"><h2 class="govuk-heading-m ref-block__title">'+esc(title)+'</h2>'+body+'</div>';
}

function warn(){
  return '<div class="prototype-warning"><strong>⚠ Fictional prototype</strong>'
    +'This is a component reference for the Drivers Medical prototypes. It is not a real DVLA or GOV.UK service, it makes no licensing decisions, and every name, reference and licence number shown is invented.'
    +'</div>';
}

        '<p>CLAUDE.md used to say to copy the <code>&lt;style&gt;</code> block from &ldquo;the prototype you are extending&rdquo;. There were three prototypes and three different style blocks, so that instruction pointed at three different authorities and the drift grew with every new file.</p>'
       +'<p>This page is the one authority. It carries the <code>govuk-*</code> layer and nothing else. Classes specific to a single prototype &mdash; a case-status hero, a condition strand &mdash; stay in that prototype.</p>')

       +'<p>The reveal here is shown permanently open. In a real prototype it would be wired to the radio.</p>')
    + block('Checkboxes — choose any, with an exclusive option',
        demo('<div class="govuk-form-group">\n  <fieldset class="govuk-fieldset">\n    <legend class="govuk-fieldset__legend">Which of these apply to you?</legend>\n    <div class="govuk-checkboxes">\n      <div class="govuk-checkboxes__item">\n        <input class="govuk-checkboxes__input" id="k-fits" name="cond" type="checkbox" value="fits">\n        <label class="govuk-checkboxes__label" for="k-fits">I have had a blackout or a seizure</label>\n      </div>\n      <div class="govuk-checkboxes__item">\n        <input class="govuk-checkboxes__input" id="k-eyes" name="cond" type="checkbox" value="eyes">\n        <label class="govuk-checkboxes__label" for="k-eyes">My eyesight has changed</label>\n      </div>\n      <p class="govuk-checkboxes__divider">or</p>\n      <div class="govuk-checkboxes__item">\n        <input class="govuk-checkboxes__input" id="k-none" name="cond" type="checkbox" value="none">\n        <label class="govuk-checkboxes__label" for="k-none">None of these</label>\n      </div>\n    </div>\n  </fieldset>\n</div>'))
    + note('Radios and checkboxes are not interchangeable',
        '<p>Radios mean the answers are mutually exclusive and one must be chosen. Checkboxes mean any number, including none. Using checkboxes for a single choice is the most common version of this mistake, and it produces a page that cannot be validated sensibly.</p>');
}

function renderButtons(){
  return '<h1 class="govuk-heading-xl">Buttons and links</h1>'
    + block('Default and start',
        demo('<button class="govuk-button" onclick="stub(event)">Continue</button>\n<a href="#" class="govuk-button govuk-button--start" onclick="stub(event)">Start now</a>'))
    + block('Secondary and warning',
        demo('<button class="govuk-button govuk-button--secondary" onclick="stub(event)">Save and come back later</button>\n<button class="govuk-button govuk-button--warning" onclick="stub(event)">Surrender licence</button>'))
    + block('Button group',
        demo('<div class="govuk-button-group">\n  <button class="govuk-button" onclick="stub(event)">Accept and send</button>\n  <a class="govuk-link" href="#" onclick="stub(event)">Cancel</a>\n</div>'))
    + note('One primary action per page',
        '<p>Two green buttons side by side make the customer choose before they have understood the difference. The secondary route is a link or a secondary button, never a second primary.</p>')
    + block('Back link',
        demo('<a class="govuk-back-link" href="#" onclick="stub(event)">Back</a>'));
}

function renderContent(){
  const tags = ['blue','green','purple','red','orange','teal','magenta','yellow','grey'];
  let tagDemo = '';
  tags.forEach(t=>{ tagDemo += '<strong class="govuk-tag govuk-tag--'+t+'">'+t+'</strong>\n'; });
  return '<h1 class="govuk-heading-xl">Content components</h1>'
    + block('Inset text',
        demo('<div class="govuk-inset-text">You can keep driving while we look at your case, unless your doctor has told you to stop.</div>'))
    + block('Details',
        demo('<details class="govuk-details">\n  <summary class="govuk-details__summary"><span class="govuk-details__summary-text">Where do I find my licence number?</span></summary>\n  <div class="govuk-details__text">It is in section 5 on the front of your photocard licence.</div>\n</details>'))
    + note('Details hides content. Decide whether it should be hidden',
        '<p>Anything a customer would otherwise phone to ask does not belong behind a disclosure. Use details for the genuinely occasional question, not to tidy a page that is saying too much.</p>')
    + block('Warning text',
        demo('<div class="govuk-warning-text">\n  <span class="govuk-warning-text__icon" aria-hidden="true">!</span>\n  <strong class="govuk-warning-text__text">\n    <span class="govuk-visually-hidden">Warning</span>\n    You must not drive until a doctor tells you it is safe.\n  </strong>\n</div>'))
    + block('Notification banner',
        demo('<div class="govuk-notification-banner" role="region" aria-labelledby="nb-title">\n  <div class="govuk-notification-banner__header">\n    <h2 class="govuk-notification-banner__title" id="nb-title">Important</h2>\n  </div>\n  <div class="govuk-notification-banner__content">\n    <p class="govuk-notification-banner__heading">We need a reply from your GP before we can go further.</p>\n  </div>\n</div>'))
    + note('Warning text and a notification banner do different jobs',
        '<p>Warning text is about the customer&rsquo;s own safety or a legal duty on them. A notification banner reports a change in the state of the case. Swapping them makes a status update look like a legal warning, which is the kind of thing that generates a call.</p>')
    + block('Tags',
        demo(tagDemo.trim()))
    + note('Never meaning by colour alone',
        '<p>Every tag carries its own words. A red tag and a green tag must still be distinguishable read aloud, in greyscale, and by someone who cannot tell them apart. The colour is reinforcement, never the message.</p>'
       +'<p>These are the rebrand tag styles: dark text on a pale tint, sentence case. The older prototypes use the previous solid-fill uppercase tag.</p>')
    + block('Confirmation panel',
        demo('<div class="govuk-panel">\n  <h1 class="govuk-panel__title">We have your report</h1>\n  <div class="govuk-panel__body">Your reference number<br><strong>'+esc(EXAMPLE.reference)+'</strong></div>\n</div>'))
    + note('A confirmation panel is not the end of the page',
        '<p>A reference number alone is the thing that generates the next call. Under the panel, say what happens next and roughly when, as a range with a reason. If DVLA does not know, say that plainly rather than leaving the space empty.</p>');
}

function renderLists(){
  return '<h1 class="govuk-heading-xl">Lists and tables</h1>'
    + block('Summary list — check your answers',
        demo('<dl class="govuk-summary-list">\n  <div class="govuk-summary-list__row">\n    <dt class="govuk-summary-list__key">Name</dt>\n    <dd class="govuk-summary-list__value">'+esc(EXAMPLE.name)+'</dd>\n    <dd class="govuk-summary-list__actions"><a class="govuk-link" href="#" onclick="stub(event)">Change<span class="govuk-visually-hidden"> name</span></a></dd>\n  </div>\n  <div class="govuk-summary-list__row">\n    <dt class="govuk-summary-list__key">Date of birth</dt>\n    <dd class="govuk-summary-list__value">'+esc(EXAMPLE.dob)+'</dd>\n    <dd class="govuk-summary-list__actions"><a class="govuk-link" href="#" onclick="stub(event)">Change<span class="govuk-visually-hidden"> date of birth</span></a></dd>\n  </div>\n  <div class="govuk-summary-list__row govuk-summary-list__row--no-actions">\n    <dt class="govuk-summary-list__key">Licence number</dt>\n    <dd class="govuk-summary-list__value">'+esc(EXAMPLE.licenceNo)+'</dd>\n  </div>\n</dl>'))
    + note('Every journey ends with this page before it ends with a panel',
        '<p>Start, then one question per page, then check your answers, then a confirmation. The check page is where a customer discovers what they have actually told DVLA, and every Change link returns them to the question and then back here.</p>'
       +'<p>A row with no Change link needs a reason, and usually the reason is that the value came from DVLA rather than from the customer.</p>')
    + block('Task list',
        demo('<ul class="govuk-task-list">\n  <li class="govuk-task-list__item">\n    <div class="govuk-task-list__name-and-hint">\n      <a class="govuk-link" href="#" onclick="stub(event)">Tell us about your condition</a>\n      <div class="govuk-task-list__hint">What it is and when it was diagnosed</div>\n    </div>\n    <div class="govuk-task-list__status"><strong class="govuk-tag govuk-tag--blue">Incomplete</strong></div>\n  </li>\n  <li class="govuk-task-list__item">\n    <div class="govuk-task-list__name-and-hint">\n      <a class="govuk-link" href="#" onclick="stub(event)">Your doctor&rsquo;s details</a>\n    </div>\n    <div class="govuk-task-list__status">Completed</div>\n  </li>\n</ul>'))
    + note('A task list is a claim that the parts are independent',
        '<p>It is right when a customer can genuinely do the parts in any order and come back later. It is wrong when the journey is really linear, because it then invites someone to start in the middle and hit a question that depends on an answer they have not given.</p>'
       +'<p>Note also that a completed task shows plain text, not a green tag. A tag on every row makes the incomplete ones harder to find, which is the only thing the page is for.</p>')
    + block('Table',
        demo('<table class="govuk-table">\n  <thead>\n    <tr><th scope="col">Date</th><th scope="col">What happened</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>3 March 2026</td><td>We received your report</td></tr>\n    <tr><td>18 March 2026</td><td>We wrote to your GP</td></tr>\n  </tbody>\n</table>'));
}

function renderErrors(){
  return '<h1 class="govuk-heading-xl">Error states</h1>'
    + block('Error summary',
        demo('<div class="govuk-error-summary" role="alert" tabindex="-1">\n  <h2>There is a problem</h2>\n  <ul>\n    <li><a href="#e-dob">Enter your date of birth</a></li>\n    <li><a href="#e-licence">Licence number must be 16 characters</a></li>\n  </ul>\n</div>'))
    + block('Input in an error state',
        demo('<div class="govuk-form-group govuk-form-group--error">\n  <label class="govuk-label" for="e-licence">What is your driving licence number?</label>\n  <div class="govuk-hint">It is 16 characters, on the front of your licence.</div>\n  <p class="govuk-error-message"><span class="govuk-visually-hidden">Error:</span> Licence number must be 16 characters</p>\n  <input class="govuk-input govuk-input--error govuk-input--width-20" id="e-licence" name="e-licence" type="text">\n</div>'))
    + note('The summary and the message say the same thing',
        '<p>Each link in the summary moves focus to the field it names, and the wording in the summary matches the wording next to the field. Different wording in the two places reads as two different problems.</p>'
       +'<p>An error message says what to do, not what went wrong. &ldquo;Enter your date of birth&rdquo;, not &ldquo;Date of birth is required&rdquo;.</p>')
    + note('This is where generated screens fail most often',
        '<p>DESIGN.md lists the edge cases that render as blank space if nobody thought about them: a case with one timeline entry, a third party who has not replied after repeated chasing, a condition name long enough to wrap to three lines, a revoked licence. None of those are error states in the form sense, and all of them need the same discipline &mdash; say what the absence means rather than leaving the space empty.</p>');
}

/* ---------------------------------------------------------------- */

const RENDER = {
  'all-screens': renderAllScreens,
  'colour': renderColour,
  'furniture': renderFurniture,
  'typography': renderTypography,
  'forms': renderForms,
  'choices': renderChoices,
  'buttons': renderButtons,
  'content': renderContent,
  'lists': renderLists,
  'errors': renderErrors
};

function renderChrome(inner){
  let html = '<header class="govuk-header" role="banner"><div class="govuk-header__container">'
    +'<a href="#/all-screens" class="govuk-header__homepage-link">'+LOGO+'</a>'
    +'</div></header>';

  html += '<div class="service-nav"><div class="service-nav__wrapper">'
    +'<a class="service-nav__name" href="#/all-screens">Drivers Medical &mdash; component reference</a>'
    +'</div></div>';

  html += '<div class="govuk-phase-banner"><div class="govuk-phase-banner__wrapper">'
    +'<span class="govuk-phase-banner__tag">Prototype</span>'
    +'<span>This is not a real service.</span>'
    +'<span class="phase-actions">'
      +'<a href="#" onclick="toggleNotes();return false;">'+(state.showNotes?'Hide':'Show')+' design notes</a>'
      +'<a href="#/all-screens">All screens</a>'
    +'</span>'
    +'</div></div>';

  html += '<div class="govuk-width-container"><main class="govuk-main-wrapper" id="main">'
    + warn();

  if(state.screen !== 'all-screens'){
    html += '<a class="govuk-back-link" href="#/all-screens">Back to all screens</a>';
  }

  html += '<div class="govuk-grid-row"><div class="govuk-grid-column-full">'
    + inner
    +'</div></div></main></div>';

  return html;
}

function route(){
  const h = (location.hash || '#/all-screens').replace(/^#\/?/, '');
  const key = h === '' ? 'all-screens' : h;
  state.screen = RENDER[key] ? key : 'all-screens';
  document.getElementById('app').innerHTML = renderChrome(RENDER[state.screen]());
  const t = SCREENS[state.screen];
  document.title = 'Drivers Medical — ' + (t ? t.title : 'Components');
  window.scrollTo(0,0);
}

window.addEventListener('hashchange',route);
window.addEventListener('DOMContentLoaded',route);
</script>
</body>
</html>

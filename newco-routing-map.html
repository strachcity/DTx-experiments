<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>NewCo routing map</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

/* --- govuk-* layer: copied from components.html, the single authority
       for this repo. Palette is the govuk-frontend 6.0.0 rebrand. --- */
:root{--black:#0b0c0c;--white:#fff;--blue:#1d70b8;--link:#1a65a6;--link-hover:#0f385c;--dark-blue:#0f385c;--green:#0f7a52;--green-hover:#0b5c3e;--green-shade:#083d29;--yellow:#fd0;--light-yellow:#fff7bf;--light-grey:#f4f8fb;--mid-grey:#cecece;--dark-grey:#484949;--red:#ca3535;--red-shade:#651b1b;--purple:#54319f;--focus:#fd0;--focus-text:#0b0c0c}
*,*::before,*::after{box-sizing:border-box}
body{font-family:"GDS Transport","Inter",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--black);background:var(--white);margin:0;padding:0;line-height:1.5;font-size:19px}
.govuk-header{background:var(--blue);color:var(--white);padding:10px 0}
.govuk-header__container{max-width:960px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:10px}
.govuk-header__homepage-link{display:inline-flex;align-items:center;color:var(--white);text-decoration:none}
.govuk-header__logotype{height:30px;width:162px;fill:currentcolor}
.service-nav{border-bottom:1px solid var(--mid-grey);background:var(--white);padding:12px 0}
.service-nav__wrapper{max-width:960px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.service-nav__name{font-weight:700;font-size:19px;color:var(--black);text-decoration:none}
.govuk-phase-banner{border-bottom:1px solid var(--mid-grey);padding:10px 0}
.govuk-phase-banner__wrapper{max-width:960px;margin:0 auto;padding:0 15px;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.govuk-phase-banner__tag{display:inline-block;background:var(--blue);color:var(--white);font-weight:700;font-size:14px;padding:2px 8px;text-transform:uppercase;letter-spacing:1px}
.govuk-width-container{max-width:960px;margin:0 auto;padding:0 15px}
.govuk-main-wrapper{padding:30px 0 60px}
.govuk-skip-link{position:absolute;left:-9999px;top:0;background:var(--yellow);color:var(--black);padding:10px 15px;font-weight:700;z-index:10}
.govuk-skip-link:focus{left:0}
h1,.govuk-heading-xl{font-size:48px;line-height:1.04;font-weight:700;margin:0 0 30px}
h2,.govuk-heading-l{font-size:36px;line-height:1.11;font-weight:700;margin:30px 0 20px}
h3,.govuk-heading-m{font-size:24px;line-height:1.25;font-weight:700;margin:20px 0 15px}
h4,.govuk-heading-s{font-size:19px;line-height:1.3;font-weight:700;margin:15px 0 10px}
p,.govuk-body{font-size:19px;margin:0 0 20px}
.govuk-body-s{font-size:16px}
.govuk-body-l{font-size:24px;line-height:1.25;margin:0 0 20px}
.govuk-caption{font-size:24px;color:var(--dark-grey);display:block;margin-bottom:5px}
a{color:var(--link)}a:hover{color:var(--link-hover)}
a:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--focus-text);text-decoration:none}
.govuk-list{margin:0 0 20px;padding:0;list-style:none}
.govuk-list>li{margin-bottom:5px}
.govuk-list--bullet{list-style:disc;padding-left:20px}
.govuk-visually-hidden{position:absolute!important;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);border:0;white-space:nowrap}
hr.govuk-section-break{border:none;border-bottom:1px solid var(--mid-grey);margin:30px 0}
.govuk-button{display:inline-block;padding:8px 20px;font-size:19px;font-weight:700;color:var(--white);background:var(--green);border:none;border-radius:0;border-bottom:2px solid var(--green-shade);cursor:pointer;text-decoration:none;line-height:1.2;-webkit-appearance:none;font-family:inherit}
.govuk-button:focus{outline:3px solid var(--focus);outline-offset:0}
.govuk-button--secondary{background:#f3f3f3;color:var(--black);border-bottom-color:#858686}
.govuk-button--secondary:hover{background:#dbdad9;color:var(--black)}
.govuk-form-group{margin-bottom:30px}
.govuk-fieldset{border:0;margin:0;padding:0}
.govuk-fieldset__legend{font-weight:700;font-size:19px;margin-bottom:10px;display:block}
.govuk-radios__item{display:flex;align-items:flex-start;margin-bottom:15px;gap:12px}
.govuk-radios__input{width:44px;height:44px;min-width:44px;margin:0;cursor:pointer;accent-color:var(--black)}
.govuk-radios__label{font-size:19px;padding-top:10px;cursor:pointer}
.govuk-label{display:block;font-weight:700;margin-bottom:5px}
.govuk-hint{font-size:16px;color:var(--dark-grey);margin-bottom:10px;display:block}
.govuk-select{font-family:inherit;font-size:19px;padding:5px 10px;border:2px solid var(--black);max-width:400px;background:var(--white)}
.govuk-select:focus{outline:3px solid var(--focus);outline-offset:0}
.govuk-summary-list{border-top:1px solid var(--mid-grey);margin:0 0 30px}
.govuk-summary-list__row{display:flex;border-bottom:1px solid var(--mid-grey);padding:12px 0;gap:15px}
.govuk-summary-list__key{flex:0 0 32%;font-weight:700}
.govuk-summary-list__value{flex:1}
@media(max-width:640px){.govuk-summary-list__row{flex-direction:column;gap:4px}.govuk-summary-list__key{flex:auto}}
.govuk-tag{display:inline-block;font-size:19px;line-height:1.32;font-weight:700;padding:2px 8px 3px;border-radius:1px;max-width:160px;overflow-wrap:break-word;color:#0f385c;background:#d2e2f1}
.govuk-tag--blue{color:#0f385c;background:#d2e2f1}
.govuk-tag--green{color:#083d29;background:#cfe4dc}
.govuk-tag--red{color:#651b1b;background:#f4d7d7}
.govuk-tag--magenta{color:#651b3e;background:#f4d7e5}
.govuk-tag--yellow{color:#7a3c1c;background:#ffee80}
.govuk-tag--grey{color:#0b0c0c;background:#cecece}
.govuk-inset-text{border-left:10px solid var(--mid-grey);padding:15px 20px;margin:0 0 30px}
.govuk-details{margin-bottom:30px;display:block}
.govuk-details__summary{color:var(--link);cursor:pointer;text-decoration:underline;font-size:19px;margin-bottom:5px}
.govuk-details__summary:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--focus-text);text-decoration:none}
.govuk-details__text{border-left:5px solid var(--mid-grey);padding:15px 20px;font-size:19px}
.govuk-footer{background:var(--light-grey);border-top:10px solid var(--blue);padding:30px 0;margin-top:60px}
.govuk-footer__wrapper{max-width:960px;margin:0 auto;padding:0 15px}
.govuk-footer__meta-item{font-size:16px;color:var(--dark-grey)}

/* Desktop only: this map is a workshop tool and is not built for phones.

   --- This prototype only. Everything below is specific to the routing
       map and does not belong in components.html. --- */
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:0}
.govuk-header{padding:8px 0}
.service-nav{padding:0}
.service-nav__wrapper,.govuk-phase-banner__wrapper,.govuk-header__container{max-width:none;padding:0 20px}
.service-nav__name{padding:12px 0;margin-right:10px}
.service-nav__list{display:flex;gap:0 25px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.service-nav__link{display:block;padding:12px 0 9px;font-size:16px;color:var(--link);border-bottom:4px solid transparent}
.service-nav__link[aria-current="page"]{color:var(--black);font-weight:700;border-bottom-color:var(--blue);text-decoration:none}
.govuk-phase-banner{padding:6px 0}
.govuk-phase-banner__wrapper{font-size:16px}

.app{display:flex;flex-direction:column;min-height:100vh}
body.is-map .app{height:100vh;height:100dvh;min-height:0}
main.map{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 460px}

/* map column */
.mapcol{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--mid-grey)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;padding:12px 20px;border-bottom:1px solid var(--mid-grey)}
.chan{display:flex;gap:0;margin:0;padding:0;list-style:none;border-bottom:0}
.chan button{font:inherit;font-size:16px;font-weight:700;padding:8px 16px;background:#f3f3f3;border:1px solid var(--mid-grey);cursor:pointer;color:var(--link)}
.chan button[aria-pressed="true"]{background:var(--white);color:var(--black);border-color:var(--black);box-shadow:inset 0 -4px 0 var(--blue)}
.toolbar .govuk-label{font-size:16px;margin:0 0 4px}
.toolbar .govuk-select{font-size:16px;padding:4px 8px}
.toolbar .links{display:flex;gap:18px;font-size:16px;margin-left:auto;align-items:center;padding-bottom:6px}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--link-hover)}
.linkbtn:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--focus-text);text-decoration:none}
.zoom{display:inline-flex;gap:6px;align-items:center}
.zoom .govuk-button{font-size:16px;padding:4px 12px;margin:0}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--dark-grey);padding:8px 20px;border-top:1px solid var(--mid-grey)}
.key span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:20px;height:13px;border:2px solid}
.sw.today{background:#f3f3f3;border-color:#858686}
.sw.req{background:#d2e2f1;border-color:var(--blue)}
.sw.prop{background:#f4d7e5;border-color:#651b3e;border-style:dashed}
.sw.ans{background:var(--white);border:1.5px solid var(--black);border-radius:6px}
.sw.route{height:0;border:0;border-top:4px solid var(--blue);width:26px}
.diam{width:12px;height:12px;background:var(--black);transform:rotate(45deg);display:inline-block;margin:0 3px}
.enddot{width:13px;height:13px;border-radius:50%;background:var(--black);display:inline-block}
.canvas{flex:1;min-height:0;overflow:auto;background:var(--white)}
.lanes{display:flex;flex-direction:column;align-items:flex-start;gap:32px;padding:40px 40px 60px;width:max-content;margin:0 auto}
.lane{background:var(--light-grey);border:1px solid #dfe5eb}
.lane h2{margin:0;background:#505a5f;color:var(--white);font-size:16px;line-height:1.3;padding:8px 14px;scroll-margin-top:20px}
.lane h2 .n{font-weight:400;opacity:.85;margin-right:6px}
.lanestart{font:inherit;font-size:14px;font-weight:400;margin-left:12px;background:none;border:0;color:var(--white);text-decoration:underline;cursor:pointer;padding:0}
.lanestart:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--black)}
.lane svg{display:block}
.whole{padding:30px 40px 60px;width:max-content;margin:0 auto;min-height:100%;display:flex;align-items:center}
.whole svg{display:block;overflow:visible}
.cluster{fill:var(--light-grey);stroke:#dfe5eb}
.clusterhead{fill:#505a5f}
.clustertext{font:700 15px "GDS Transport","Inter",Arial,sans-serif;fill:var(--white)}

/* svg */
.edge path{fill:none;stroke:#8e9296;stroke-width:1.5}
.edge text{font:13px "GDS Transport","Inter",Arial,sans-serif;fill:var(--dark-grey)}
.edge rect{fill:var(--light-grey)}
.edge.on path{stroke:var(--blue);stroke-width:4}
.edge.on text{fill:var(--black);font-weight:700}
.node{cursor:pointer}
.node text{font:14px "GDS Transport","Inter",Arial,sans-serif;fill:var(--black)}
.node .box{stroke-width:2}
.node.today .box{fill:#f3f3f3;stroke:#858686}
.node.req .box{fill:#d2e2f1;stroke:var(--blue)}
.node.prop .box{fill:#f4d7e5;stroke:#651b3e;stroke-dasharray:6 3}
.node .tag{font-size:11px;font-weight:700;fill:#651b3e;letter-spacing:.06em}
.node .diamond{fill:var(--black)}
.node .qtext{font-weight:700}
.node .dot{fill:var(--black)}
.node .goto{fill:var(--white);stroke:var(--blue);stroke-width:2}
.node .gototext{fill:var(--link);text-decoration:underline}
.node .ans{fill:var(--white);stroke:var(--black);stroke-width:1.5}
.node .anstext{font-size:13.5px}
.node.on .ans{fill:#1d70b8;stroke:#1d70b8;stroke-width:3}
.node.on .anstext{fill:var(--white);font-weight:700}
.node.on .box{stroke:var(--blue);stroke-width:4;stroke-dasharray:none}
.node.on .diamond,.node.on .dot{fill:var(--blue)}
.node.on .goto{stroke-width:4}
.node .ring,.node .ringy{fill:none;stroke:none}
.node.sel .ring{stroke:var(--black);stroke-width:3}
.node.sel .ringy{stroke:var(--focus);stroke-width:7}
.node:focus{outline:none}
.node:focus-visible .ringy{stroke:var(--focus);stroke-width:7}
.node:focus-visible .ring{stroke:var(--black);stroke-width:3}
.node .badge{fill:var(--red)}
.node .badgetxt{font-size:11px;font-weight:700;fill:var(--white)}

/* list view */
.steplist{padding:20px 30px 60px;max-width:760px}
.steplist h2{font-size:24px;margin:30px 0 10px}
.steplist ol{list-style:none;margin:0;padding:0}
.steplist li{border-top:1px solid var(--mid-grey);padding:10px 0;font-size:16px}
.steplist li.on{border-left:5px solid var(--blue);padding-left:12px}
.steplist .next{margin:4px 0 0;padding:0;list-style:none}
.steplist .next li{border:0;padding:0}

/* sidebar */
.side{display:flex;flex-direction:column;min-height:0;background:var(--white)}
.tabs{display:flex;border-bottom:1px solid var(--mid-grey);padding:0 20px;gap:4px}
.tabs button{font:inherit;font-size:16px;font-weight:700;background:#f3f3f3;border:1px solid var(--mid-grey);border-bottom:0;padding:8px 14px;margin-top:10px;cursor:pointer;color:var(--link)}
.tabs button[aria-selected="true"]{background:var(--white);color:var(--black);margin-bottom:-1px;padding-bottom:9px}
.sidebody{overflow:auto;padding:20px 20px 40px;font-size:16px;flex:1}
.sidebody p,.sidebody li{font-size:16px}
.sidebody p{margin:0 0 15px}
.sidebody h2{font-size:24px;line-height:1.25;margin:0 0 10px}
.sidebody h3{font-size:19px;margin:25px 0 10px;padding-top:15px;border-top:1px solid var(--mid-grey)}
.sidebody .govuk-caption{font-size:16px}
.sidebody .govuk-tag{font-size:14px}
.sidebody .govuk-radios__label{font-size:16px}
.sidebody .govuk-radios__input{width:32px;height:32px;min-width:32px}
.sidebody .govuk-radios__label{padding-top:5px}
.sidebody .govuk-radios__item{margin-bottom:8px}
.script{border-left:5px solid var(--blue);background:var(--light-grey);padding:12px 15px;margin:0 0 15px}
.script.prop{border-left:5px dashed #651b3e;background:#fbeff5}
.script .who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700;margin:0 0 6px;font-size:16px}
.script .said{margin:0;font-size:17px;white-space:pre-line}
.ph{background:var(--light-yellow);border-bottom:2px solid var(--yellow);padding:0 2px}
.script .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.script .btns span{border:2px solid var(--black);padding:1px 8px;font-size:15px}
.script .note{font-size:15px;color:var(--dark-grey);margin:8px 0 0}
.req{border:1px solid var(--mid-grey);margin:0 0 15px}
.req > .head{padding:10px 12px;background:#f3f3f3;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.req > .head strong{font-size:16px}
.req .id{font-size:14px;color:var(--dark-grey);font-weight:700}
.req .part{padding:10px 12px}
.req .part + .part{border-top:1px solid var(--mid-grey)}
.req .part.prop{background:#fbeff5;border-left:5px dashed #651b3e}
.req .lab{display:block;font-size:14px;font-weight:700;margin:0 0 4px}
.req .g{white-space:pre-line;margin:0;font-size:15px;overflow-wrap:anywhere}
.req .why{margin:8px 0 0;font-size:15px}
.answers li{margin-bottom:12px}
.answers .linkbtn{font-size:16px}
.answers .linkbtn[aria-pressed="true"]{font-weight:700}
.transcript{list-style:none;margin:0;padding:0}
.transcript li{padding:10px 0;border-top:1px solid var(--mid-grey);white-space:pre-line}
.transcript li:first-child{border-top:0}
.transcript .who{display:block;font-size:14px;font-weight:700;color:var(--dark-grey)}
.transcript .caller{font-weight:700}
.transcript .does{color:var(--dark-grey)}

/* document pages */
.doc{max-width:1100px;margin:0 auto;padding:30px 20px 60px}
.doc h1{font-size:48px}
.lede{max-width:40em}
.filter{margin:0 0 30px}
.filter .govuk-radios__item{margin-bottom:6px}
.filter .govuk-radios__input{width:32px;height:32px;min-width:32px}
.filter .govuk-radios__label{padding-top:4px;font-size:19px}
.toc{columns:2 280px;margin:0 0 40px;padding:0;list-style:none}
.toc li{margin:0 0 6px;break-inside:avoid}
.frsec{margin:0 0 50px}
.frsec > h2{border-bottom:2px solid var(--black);padding-bottom:8px;scroll-margin-top:20px}
.feature{margin:0 0 35px}
.feature > h3{margin:0 0 8px}
.story{white-space:pre-line;color:var(--dark-grey);font-size:16px;margin:0 0 15px}
.scen{border-top:1px solid var(--mid-grey);padding:15px 0;scroll-margin-top:20px}
.scen.flash{outline:3px solid var(--focus);outline-offset:6px}
.scen h4{margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.scen h4 .id{font-size:16px;color:var(--dark-grey)}
.scen h4 .govuk-tag{font-size:14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pair.one{grid-template-columns:1fr}
.col{padding:10px 15px;font-size:16px}
.col.asw{border-left:5px solid var(--mid-grey)}
.col.prop{border-left:5px dashed #651b3e;background:#fbeff5}
.col .lab{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.col .g{white-space:pre-line;margin:0;font-size:16px;overflow-wrap:anywhere}
.col .why{margin:10px 0 0;font-size:16px}
.onmap{font-size:16px;margin:10px 0 0}
details.unch summary{font-size:16px}
.oi-list{list-style:none;margin:0 0 40px;padding:0;border-top:1px solid var(--mid-grey)}
.oi-list li{padding:15px 0;border-bottom:1px solid var(--mid-grey);scroll-margin-top:20px}
.oi-list h3{font-size:19px;margin:0 0 6px}
.oi-list p{font-size:16px;margin:0 0 6px}
.oi-list .meta{font-size:16px;color:var(--dark-grey)}
</style>
</head>
<body>
<a class="govuk-skip-link" href="#main">Skip to main content</a>

 */function zipObject(props,values){return baseZipObject(props||[],values||[],assignValue)}module.exports=zipObject},{"./_assignValue":75,"./_baseZipObject":130}]},{},[1])(1)});

<script>
(function(){
"use strict";

/* Requirements as written: parsed word for word from the Confluence
   export "User Stories for IVR Day 1 Readiness" (26 September 2026). */
const REQS = [{"code": "FR1", "title": "IVR Call Routing and Cohort Identification", "features": [{"id": "FR1-F1", "t": "Retain the existing IVR routing", "story": "As a NewCo customer calling the NewCo DM Line,\nI want to continue through the existing IVR journey,\nso that I can access the appropriate service without disruption from the introduction of NewCo routing.", "sc": [{"id": "FR1-01", "title": "Customer enters the IVR", "t": "Scenario: Customer enters the IVR\nGiven the customer has called the existing IVR telephone number\nWhen the call is connected to the IVR\nThen the customer must enter the existing IVR routing flow\nAnd the existing IVR options must remain available", "script": ""}, {"id": "FR1-02", "title": "Customer is not eligible for NewCo routing", "t": "Scenario: Customer is not eligible for NewCo routing\nGiven the customer is progressing through the existing IVR routing flow\nAnd the customer is not identified as eligible for the NewCo cohort\nWhen the IVR determines the route for the call\nThen the call must continue through the standard BAU route", "script": ""}]}, {"id": "FR1-F2", "t": "Identify eligible customers using a shared routing table (Given the IVR and web chat use the same shared cohort routing table)", "story": "As a customer with an eligible case,\nI want the IVR to identify my case using my reference number,\nso that my call can be routed to the appropriate NewCo team.", "sc": [{"id": "FR1-03", "title": "Customer provides a reference number that matches an eligible NewCo record", "t": "Scenario: Customer provides a reference number that matches an eligible NewCo record\nGiven the customer has been prompted to provide their case reference number\nAnd the customer's case reference number is recorded in the shared routing table\nAnd the record is active and eligible for NewCo routing\nWhen the IVR validates the case reference number\nThen the IVR must identify the customer as belonging to the NewCo cohort\nAnd the call must branch from the existing IVR route to the route specified for that record", "script": ""}, {"id": "FR1-04", "title": "Customer provides a reference number that does not match an eligible record", "t": "Scenario: Customer provides a reference number that does not match an eligible record\nGiven the customer has provided a case reference number\nAnd the case reference number is not recorded as an active eligible record in the shared routing table\nWhen the IVR validates the case reference number\nThen the call must continue through the standard BAU route", "script": ""}, {"id": "FR1-05", "title": "Customer cannot provide a reference number", "t": "Scenario: Customer cannot provide a reference number\nGiven the customer has been prompted to provide their case reference number\nWhen the customer cannot provide the required reference number\nThen the call must continue through the standard BAU route", "script": ""}, {"id": "FR1-06", "title": "Customer provides an invalidly formatted reference number", "t": "Scenario: Customer provides an invalidly formatted reference number\nGiven the customer has been prompted to provide their case reference number\nWhen the customer provides a reference number in an invalid format\nThen the IVR must not route the customer to the NewCo cohort\nAnd the call must continue through the standard BAU route", "script": ""}, {"id": "FR1-07", "title": "The reference number cannot be validated", "t": "Scenario: The reference number cannot be validated\nGiven the customer has provided a case reference number\nWhen the IVR is unable to validate the reference number against the shared routing table\nThen the call must continue through the standard BAU route\nAnd the customer must not be left in an incomplete routing journey", "script": ""}]}, {"id": "FR1-F3", "t": "Route first-notification calls using the Super Cell approach (Given the call has been identified as a first-notification call and NewCo agents are configured as an availability based routing option)", "story": "As a NewCo customer making a first-notification call,\nI want my call to be offered to an available NewCo agent,\nso that I can receive support promptly without being in an additional queue.", "sc": [{"id": "FR1-08", "title": "A NewCo agent is available", "t": "Scenario: A NewCo agent is available\nGiven at least one eligible NewCo agent is available at the point of routing\nWhen the IVR routes the first-notification call\nThen the call must be sent to an available NewCo agent\nAnd no separate NewCo agent queue must be created or used", "script": "Connecting to a NewCo agent: Thank you. We're putting you through to the team looking after your case."}, {"id": "FR1-09", "title": "No NewCo agent is available", "t": "Scenario: No NewCo agent is available\nGiven no eligible NewCo agent is available at the point of routing\nWhen the IVR routes the first-notification call\nThen the call must immediately fall back to the standard BAU queue\nAnd the NewCo customer must not wait for a NewCo agent to become available", "script": ""}, {"id": "FR1-10", "title": "NewCo agent availability cannot be confirmed", "t": "Scenario: NewCo agent availability cannot be confirmed\nGiven the IVR cannot determine whether a NewCo agent is available\nWhen the call reaches the routing decision\nThen the call must immediately fall back to the standard BAU queue", "script": ""}, {"id": "FR1-11", "title": "A NewCo agent becomes unavailable during routing", "t": "Scenario: A NewCo agent becomes unavailable during routing\nGiven a NewCo agent appears to be available\nAnd the NewCo agent becomes unavailable before the call is connected\nWhen the IVR completes the routing attempt\nThen the call must fall back to the standard BAU queue\nAnd the NewCo customer must not be in a NewCo only queue", "script": ""}, {"id": "FR1-12", "title": "NewCo Customer is not held in a universal-agent-only queue", "t": "Scenario: NewCo Customer is not held in a universal-agent-only queue\nGiven no NewCo agent is currently available\nWhen the first-notification call reaches the Super Cell routing decision\nThen the call must not be in a queue that exists solely for NewCo agents\nAnd the call must follow the standard BAU queue route", "script": ""}]}, {"id": "FR1-F4", "t": "Route customers with existing cases", "story": "As a NewCo customer with an existing case,\nI want to provide my case reference number or another agreed identifier,\nso that the IVR can route me to the team responsible for my case.", "sc": [{"id": "FR1-13", "title": "Existing-case NewCo customer provides a matching case reference number", "t": "Scenario: Existing-case NewCo customer provides a matching case reference number\nGiven the NewCo customer has indicated that they have an existing case\nAnd the NewCo customer has provided their case reference number\nAnd the case reference number matches an active NewCo cohort record\nWhen the IVR checks the identifier against the cohort routing data\nThen the call must be routed to the NewCo team or route stored against that record", "script": ""}, {"id": "FR1-14", "title": "Existing-case NewCo customer provides another agreed identifier", "t": "Scenario: Existing-case NewCo customer provides another agreed identifier\nGiven the NewCo customer has indicated that they have an existing case\nAnd the NewCo customer provides an agreed alternative identifier\nAnd the identifier matches an active NewCo cohort record\nWhen the IVR checks the identifier against the cohort routing data\nThen the call must be routed to the NewCo team or route stored against that record", "script": ""}, {"id": "FR1-15", "title": "Existing-case identifier does not match", "t": "Scenario: Existing-case identifier does not match\nGiven the NewCo customer has indicated that they have an existing case\nAnd the NewCo customer has provided a case reference number or agreed identifier\nAnd the identifier does not match an active NewCo cohort record\nWhen the IVR completes the identifier check\nThen the call must continue through the standard BAU route", "script": ""}, {"id": "FR1-16", "title": "Existing-case identifier cannot be validated", "t": "Scenario: Existing-case identifier cannot be validated\nGiven the NewCo customer has provided a case reference number or agreed identifier\nWhen the NewCo cohort routing data cannot be accessed or the identifier cannot be validated\nThen the call must continue through the standard BAU route", "script": ""}]}, {"id": "FR1-F5", "t": "Provide clear IVR instructions", "story": "As a NewCo customer using the IVR,\nI want clear instructions about which identifier I need to provide,\nso that I can supply the correct information and be routed appropriately.", "sc": [{"id": "FR1-17", "title": "NewCo Customer is asked to provide a case reference number", "t": "Scenario: NewCo Customer is asked to provide a case reference number\nGiven the NewCo customer has reached a stage where their case must be identified\nWhen the IVR requests the customer's case reference number\nThen the message must explain which reference number is required\nAnd the message must explain where the customer can find it\nAnd the message must explain how the customer should enter or provide it", "script": ""}, {"id": "FR1-18", "title": "An alternative identifier is accepted", "t": "Scenario: An alternative identifier is accepted\nGiven an agreed alternative identifier can be used\nWhen the IVR asks the NewCo customer to identify their case\nThen the message must explain which alternative identifier is accepted\nAnd the message must explain the required format", "script": ""}, {"id": "FR1-19", "title": "NewCo Customer enters information in an invalid format", "t": "Scenario: NewCo Customer enters information in an invalid format\nGiven the customer has been asked to provide an identifier\nWhen the customer enters the identifier in an invalid format\nThen the IVR must provide a clear error message\nAnd the IVR must provide another opportunity to enter the identifier\nAnd the number of retry attempts must follow the agreed IVR retry rules", "script": ""}, {"id": "FR1-20", "title": "Maximum retry attempts are reached", "t": "Scenario: Maximum retry attempts are reached\nGiven the NewCo customer has reached the maximum permitted number of identifier-entry attempts\nWhen the identifier has not been successfully captured\nThen the call must continue through the standard BAU route", "script": ""}]}, {"id": "FR1-F6", "t": "Maintain daily NewCo cohort routing data table", "story": "As an authorised operational user,\nI want eligible customers to be added to and removed from the shared routing table daily,\nso that IVR and web chat use current and consistent NEWCO cohort information.", "sc": [{"id": "FR1-21", "title": "Add a customer to the NewCo cohort", "t": "Scenario: Add a customer to the NewCo cohort\nGiven a customer has become eligible for the NewCo cohort\nWhen the customer's record is added during the daily routing-table update\nThen the customer's identifier must be available for IVR and web-chat routing\nAnd the record must include the customer's active routing destination", "script": ""}, {"id": "FR1-22", "title": "Remove a customer from the NewCo cohort", "t": "Scenario: Remove a customer from the NewCo cohort\nGiven a customer is no longer eligible for the NewCo cohort\nWhen the customer's record is removed or made inactive during the daily update\nThen the customer must no longer be routed to an NEWCO team\nAnd subsequent calls must follow the standard BAU route unless another routing rule applies", "script": ""}, {"id": "FR1-23", "title": "Apply the same routing data to IVR and web chat", "t": "Scenario: Apply the same routing data to IVR and web chat\nGiven the daily NewCo cohort routing update has been completed\nWhen IVR or web chat checks a customer's identifier\nThen both channels must use the same current routing record\nAnd both channels must identify the same owning team or routing destination", "script": ""}, {"id": "FR1-24", "title": "Reject an incomplete routing record", "t": "Scenario: Reject an incomplete routing record\nGiven a new cohort record does not contain all mandatory routing information\nWhen the daily update is validated\nThen the incomplete record must not be activated\nAnd the validation issue must be recorded for investigation", "script": ""}, {"id": "FR1-25", "title": "Record routing table changes", "t": "Scenario: Record routing table changes\nGiven an authorised user or automated process changes a cohort record\nWhen the change is completed\nThen the system must record the identifier affected\nAnd the type of change\nAnd the date and time of the change\nAnd the user or process that made the change", "script": ""}]}, {"id": "FR1-F7", "t": "Support multiple NewCo teams and case-reference ranges", "story": "As an NewCo manager,\nI want the routing table to support multiple NEWCO teams and case-reference ranges,\nso that calls can be directed to the correct team as the programme scales.", "sc": [{"id": "FR1-26", "title": "Route a case to its owning NEWCO team", "t": "Scenario: Route a case to its owning NEWCO team\nGiven the NewCo customer has provided a valid case reference number\nAnd the case reference number is recorded against \"<owning_team>\"\nAnd the active routing destination is \"<routing_destination>\"\nWhen the IVR validates the reference number\nThen the call must be routed to \"<routing_destination>\"", "script": ""}, {"id": "FR1-27", "title": "Route using an assigned case-reference range", "t": "Scenario: Route using an assigned case-reference range\nGiven a case reference range is assigned to an NEWCO team\nAnd the customer's case reference number falls within that range\nWhen the IVR validates the reference number\nThen the call must be routed to the destination assigned to that case-reference range", "script": ""}, {"id": "FR1-28", "title": "Use individual ownership where it overrides a case-reference range", "t": "Scenario: Use individual ownership where it overrides a case-reference range\nGiven the customer's reference number falls within a configured case-reference range\nAnd the customer's routing record contains a specific active owning team\nWhen the IVR determines the routing destination\nThen the call must be routed to the specific owning team recorded against the customer\nAnd the agreed routing precedence rules must be applied", "script": ""}, {"id": "FR1-29", "title": "Add another NEWCO team", "t": "Scenario: Add another NEWCO team\nGiven a new NEWCO team and routing destination have been approved\nWhen the team is added to the routing configuration\nThen eligible reference numbers must be assignable to the new team\nAnd existing IVR and web-chat routing must continue to operate", "script": ""}, {"id": "FR1-30", "title": "Owning team or routing destination is missing", "t": "Scenario: Owning team or routing destination is missing\nGiven the customer's identifier matches an active NewCo cohort record\nAnd the record does not contain a valid owning team or routing destination\nWhen the IVR attempts to route the call\nThen the call must follow the standard BAU route\nAnd the routing-data issue must be recorded for investigation", "script": ""}, {"id": "FR1-31", "title": "Configured NewCo destination is unavailable", "t": "Scenario: Configured NewCo destination is unavailable\nGiven the customer's identifier matches an active NewCo cohort record\nAnd the configured NewCo routing destination is unavailable\nWhen the IVR attempts to route the call\nThen the call must follow the agreed fallback route\nAnd the customer must not be left in an incomplete routing journey", "script": ""}]}]}, {"code": "FR2", "title": "Out-of-Hours and No-Agent Handling", "features": [{"id": "FR2-F1", "t": "Inform callers when the NewCo team is unavailable", "story": "As a customer calling the NewCo line,\nI want to receive a clear message when the team is unavailable,\nso that I understand why my call cannot be answered and what I can do next.\ni.e. “Our advisors currently unavailable to help you, Please leave a message with your reference number and an agent will call you back or, please call back Monday to Friday 8:30 – 4:30.”", "sc": [{"id": "FR2-01", "title": "Customer calls outside NewCo operating hours", "t": "Scenario: Customer calls outside NewCo operating hours\nGiven the NewCo line is configured to close at 5:00pm\nAnd the current time is outside the configured operating hours\nWhen a customer calls the NewCo line\nThen the IVR must play the approved out-of-hours message\nAnd the message must explain that NewCo agents are currently unavailable\nAnd the caller must be offered the option to leave a voicemail for a callback", "script": "Team closed, BAU open:\nThe team looking after your case is closed at the moment. They're open [days and hours]. You can leave them a message and they'll call you back. Or an adviser can help you now.\nTo leave a message for your team, press 1. To speak to an adviser now, press 2."}, {"id": "FR2-02", "title": "Customer calls when the line is open, but no NewCo agents are available", "t": "Scenario: Customer calls when the line is open, but no NewCo agents are available\nGiven the current time is within the configured NewCo operating hours\nAnd no NewCo agents are available based on the agreed availability settings\nWhen a customer calls the NewCo line\nThen the IVR must play the approved unavailable message\nAnd the message must explain that no NewCo agents are currently available\nAnd the caller must be offered the option to leave a voicemail for a callback", "script": "Team busy (in hours, no agent free, or availability unknown):\nThe team looking after your case is busy helping other people right now. They know your case, and if you leave them a message, they'll call you back. Or an adviser can help you now.\nTo leave a message for your team, press 1. To speak to an adviser now, press 2."}, {"id": "FR2-03", "title": "NewCo agent is available during operating hours", "t": "Scenario: NewCo agent is available during operating hours\nGiven the current time is within the configured NewCo operating hours\nAnd at least one eligible NewCo agent is available\nWhen a customer calls the NewCo line\nThen the call must follow the normal NewCo routing process\nAnd the out-of-hours or unavailable message must not be played", "script": ""}, {"id": "FR2-04", "title": "NewCo availability cannot be determined", "t": "Scenario: NewCo availability cannot be determined\nGiven the current time is within the configured operating hours\nAnd the IVR cannot determine whether a NewCo agent is available\nWhen the customer reaches the availability check\nThen the IVR must play the approved unavailable message\nAnd the caller must be offered the option to leave a voicemail", "script": ""}]}, {"id": "FR2-F2", "t": "Avoid inappropriate redirection to the BAU contact centre", "story": "As a customer calling when the NewCo team is unavailable,\nI want to be given an appropriate follow-up option,\nso that I am not transferred to a team that cannot fully answer my case-specific query.", "sc": [{"id": "FR2-05", "title": "Default out-of-hours message is played", "t": "Scenario: Default out-of-hours message is played\nGiven the customer has called outside NewCo operating hours\nWhen the IVR plays the default out-of-hours message\nThen the message must not direct the customer to contact the BAU contact centre\nAnd the message must offer the customer the option to leave a voicemail", "script": ""}, {"id": "FR2-06", "title": "No-agent message is played", "t": "Scenario: No-agent message is played\nGiven the NewCo line is open\nAnd no NewCo agents are available\nWhen the IVR plays the unavailable message\nThen the message must not direct the customer to contact the BAU contact centre\nAnd the message must offer the customer the option to leave a voicemail", "script": ""}, {"id": "FR2-07", "title": "Customer chooses not to leave a voicemail", "t": "Scenario: Customer chooses not to leave a voicemail\nGiven the IVR has offered the customer the option to leave a voicemail\nWhen the customer declines or does not select the voicemail option\nThen the IVR must play the approved closing message\nAnd the closing message must explain how and when the customer can contact NewCo again\nAnd the call must end without being automatically transferred to the BAU contact centre", "script": ""}]}, {"id": "FR2-F3", "t": "Offer a voicemail callback option (Given the NewCo team is unavailable and the IVR has played the approved out-of-hours or unavailable message)", "story": "As a customer calling when a NewCo agent is unavailable,\nI want to leave a voicemail requesting a callback,\nso that the NewCo team can review my query and contact me.\ni.e. “We're currently experiencing high demand and waiting times are longer than usual. You can continue to hold, switch to webchat by receiving a link via text message, or leave a voicemail and we'll contact you back. Press 1 for a webchat link, press 2 to leave a voicemail, or stay on the line to continue waiting.”", "sc": [{"id": "FR2-08", "title": "Customer chooses to leave a voicemail", "t": "Scenario: Customer chooses to leave a voicemail\nGiven the IVR has offered the voicemail option\nWhen the customer selects the option to leave a voicemail\nThen the IVR must play the approved voicemail instructions\nAnd the IVR must allow the customer to record a message", "script": ""}, {"id": "FR2-09", "title": "Customer completes a voicemail recording", "t": "Scenario: Customer completes a voicemail recording\nGiven the customer is recording a voicemail\nWhen the customer completes and submits the recording\nThen the IVR must save the voicemail\nAnd the IVR must play a confirmation message\nAnd the confirmation must explain that the voicemail has been received for follow-up", "script": ""}, {"id": "FR2-10", "title": "Customer does not record a message", "t": "Scenario: Customer does not record a message\nGiven the customer has selected the voicemail option\nWhen no audible message is captured within the configured time limit\nThen the IVR must inform the customer that no message was recorded\nAnd the IVR must offer another recording attempt in line with the agreed retry rules", "script": ""}, {"id": "FR2-11", "title": "Customer reaches the maximum number of recording attempts", "t": "Scenario: Customer reaches the maximum number of recording attempts\nGiven the customer has not successfully recorded a voicemail\nAnd the maximum number of recording attempts has been reached\nWhen the final recording attempt ends\nThen the IVR must play the approved closing message\nAnd the call must end without creating an empty voicemail work item", "script": ""}, {"id": "FR2-12", "title": "Voicemail service is unavailable", "t": "Scenario: Voicemail service is unavailable\nGiven the NewCo team is unavailable\nAnd the voicemail service cannot accept a recording\nWhen the customer selects the voicemail option\nThen the IVR must play an approved service-unavailable message\nAnd the message must explain how and when the customer can contact NewCo again", "script": ""}]}, {"id": "FR2-F4", "t": "Deliver voicemail recordings to a dedicated NewCo mailbox", "story": "As a NewCo agent,\nI want customer voicemail recordings delivered to a dedicated NewCo mailbox,\nso that the team can access and manage callback requests from one controlled location.", "sc": [{"id": "FR2-13", "title": "Successfully deliver a voicemail", "t": "Scenario: Successfully deliver a voicemail\nGiven the customer has completed and submitted a voicemail\nWhen the IVR processes the recording\nThen the voicemail must be delivered as a playable voice clip\nAnd the voice clip must be delivered to the dedicated NewCo mailbox\nAnd the voicemail must be available only to authorised users", "script": ""}, {"id": "FR2-14", "title": "Provide information to support voicemail management", "t": "Scenario: Provide information to support voicemail management\nGiven a voicemail has been successfully delivered\nWhen the voicemail appears in the dedicated NewCo mailbox\nThen the work item must include the date and time it was received\nAnd it must include the originating telephone number where technically available and permitted\nAnd it must show that the item originated from the IVR voicemail service", "script": ""}, {"id": "FR2-15", "title": "Voicemail delivery fails", "t": "Scenario: Voicemail delivery fails\nGiven the customer has completed a voicemail recording\nWhen the recording cannot be delivered to the dedicated NewCo mailbox\nThen the delivery failure must be recorded\nAnd the appropriate support team must be alerted in accordance with the agreed support process\nAnd the recording must be retained for an agreed period to allow delivery to be retried", "script": ""}, {"id": "FR2-16", "title": "Voicemail delivery is retried", "t": "Scenario: Voicemail delivery is retried\nGiven a voicemail delivery attempt has failed\nAnd the recording remains available for retry\nWhen the configured retry process is triggered\nThen the system must attempt to deliver the recording again\nAnd the outcome of the retry must be recorded", "script": ""}, {"id": "FR2-17", "title": "Unauthorised user attempts to access the mailbox", "t": "Scenario: Unauthorised user attempts to access the mailbox\nGiven the dedicated NewCo mailbox contains customer voicemail recordings\nAnd a user does not have the required access permission\nWhen the user attempts to access the mailbox\nThen access must be denied\nAnd the attempted access must be managed in accordance with the applicable security policy", "script": ""}]}, {"id": "FR2-F5", "t": "Manage voicemail as a formal NewCo workstream", "story": "As a NewCo team manager,\nI want voicemail callback requests to be managed as a formal workstream,\nso that they can be prioritised, assigned and completed alongside web chat and casework.", "sc": [{"id": "FR2-18", "title": "New voicemail enters the workstream", "t": "Scenario: New voicemail enters the workstream\nGiven a NewCo customer voicemail has been delivered to the dedicated NewCo mailbox\nWhen the voicemail becomes available to the NewCo team\nThen it must be identifiable as a new callback work item\nAnd it must be available for triage and assignment", "script": ""}, {"id": "FR2-19", "title": "Agent takes ownership of a voicemail", "t": "Scenario: Agent takes ownership of a voicemail\nGiven a voicemail callback work item has not been assigned\nWhen an authorised Agent accepts the work item\nThen the work item must be marked as assigned\nAnd the responsible Agent must be identifiable\nAnd other Agents must be able to see that the item is being handled", "script": ""}, {"id": "FR2-20", "title": "Agent reviews the voicemail before calling the customer", "t": "Scenario: Agent reviews the voicemail before calling the customer\nGiven a voicemail work item has been assigned to an Agent\nWhen the Agent prepares to make the callback\nThen the Agent must be able to play the voice clip\nAnd the Agent must be able to review the customer's query before initiating the callback", "script": ""}, {"id": "FR2-21", "title": "Callback work item is completed", "t": "Scenario: Callback work item is completed\nGiven an Agent has reviewed the voicemail\nAnd the callback has been attempted or completed\nWhen the Agent updates the work item\nThen the callback outcome must be recorded\nAnd the date and time of the callback attempt must be recorded\nAnd the work item status must be updated", "script": ""}, {"id": "FR2-22", "title": "Voicemail has not been actioned within the agreed service level", "t": "Scenario: Voicemail has not been actioned within the agreed service level\nGiven a voicemail callback work item remains open\nAnd the agreed callback service level has been exceeded\nWhen the workstream is monitored\nThen the work item must be highlighted or escalated in accordance with the agreed operating process", "script": ""}]}]}, {"code": "FR3", "title": "Agent Availability & Demand Management (Storm/SBT)", "features": [{"id": "FR3-F1", "t": "Configure IVR demand management controls", "story": "As an authorised service administrator,\nI want to configure demand-management rules within Storm/SBT,\nso that call volumes can be managed when Agent availability is low or waiting times are high.", "sc": [{"id": "FR3-01", "title": "Configure a queue-time threshold", "t": "Scenario: Configure a queue-time threshold\nGiven the user is authorised to manage IVR routing settings\nWhen the user configures an agreed maximum queue-time threshold\nThen the threshold must be saved in Storm/SBT\nAnd the threshold must be available to the IVR routing process\nAnd the change must not require a software deployment", "script": ""}, {"id": "FR3-02", "title": "Configure an Agent-availability threshold", "t": "Scenario: Configure an Agent-availability threshold\nGiven the user is authorised to manage IVR routing settings\nWhen the user configures an agreed minimum number of available Agents\nThen the threshold must be saved in Storm/SBT\nAnd the threshold must be available to the IVR routing process\nAnd the change must not require a software deployment", "script": ""}, {"id": "FR3-03", "title": "Configure the response to a threshold breach", "t": "Scenario: Configure the response to a threshold breach\nGiven a queue-time or Agent-availability threshold has been configured\nWhen an authorised user assigns an agreed demand-management response\nThen the response must be saved against the relevant threshold\nAnd the response must be one of the supported options\nAnd the configuration must identify the IVR route or queue to which it applies", "script": ""}, {"id": "FR3-04", "title": "Change a configured threshold", "t": "Scenario: Change a configured threshold\nGiven a demand management threshold is active\nWhen an authorised user changes the threshold\nThen the revised threshold must be applied within the agreed implementation time\nAnd the previous configuration must be retained in the audit history", "script": ""}, {"id": "FR3-05", "title": "Unauthorised user attempts to change a threshold", "t": "Scenario: Unauthorised user attempts to change a threshold\nGiven the user does not have permission to manage IVR routing settings\nWhen the user attempts to change a demand-management threshold or response\nThen the change must be rejected", "script": ""}]}, {"id": "FR3-F2", "t": "Manage demand using the queue-time threshold (Given an agreed queue-time threshold has been configured in Storm/SBT and an approved demand-management response has been assigned to the threshold)", "story": "As an operational manager,\nI want the IVR to apply a configured response when expected queue time becomes too long,\nso that additional calls do not create unmanaged demand.", "sc": [{"id": "FR3-06", "title": "Queue time remains within the threshold", "t": "Scenario: Queue time remains within the threshold\nGiven the current queue time is equal to or below the configured threshold\nWhen a new call reaches the queue-time check\nThen the call must continue through the normal routing flow\nAnd the high-demand response must not be triggered", "script": ""}, {"id": "FR3-07", "title": "Queue time exceeds the threshold", "t": "Scenario: Queue time exceeds the threshold\nGiven the current queue time is above the configured threshold\nWhen a new call reaches the queue-time check\nThen the IVR must apply the configured demand-management response\nAnd the normal routing flow must only continue where permitted by that response", "script": ""}, {"id": "FR3-08", "title": "Queue time returns within the threshold", "t": "Scenario: Queue time returns within the threshold\nGiven the queue-time demand-management response is active\nAnd the current queue time returns to or below the configured threshold\nWhen a new call reaches the queue-time check\nThen the call must follow the normal routing flow\nAnd the threshold response must no longer be applied", "script": ""}, {"id": "FR3-09", "title": "Queue-time data is unavailable", "t": "Scenario: Queue-time data is unavailable\nGiven the IVR cannot obtain current queue-time information\nWhen a new call reaches the queue-time check\nThen the IVR must apply the agreed fail-safe routing behaviour\nAnd the customer must not be left in an incomplete routing journey\nAnd the failure must be recorded for investigation", "script": ""}]}, {"id": "FR3-F3", "t": "Apply the configured demand management response", "story": "As a customer calling during a period of high demand,\nI want to receive clear and consistent handling,\nso that I understand whether I will be connected, asked to wait, diverted or advised to call again.", "sc": [{"id": "FR3-10", "title": "Limit new calls", "t": "Scenario: Limit new calls\nGiven a demand-management threshold has been breached\nAnd \"limit new calls\" is the configured response\nWhen a new call reaches the affected route\nThen the IVR must restrict entry in accordance with the configured call limit\nAnd callers who are not admitted must hear the approved high-demand message", "script": ""}, {"id": "FR3-11", "title": "Divert new calls", "t": "Scenario: Divert new calls\nGiven a demand management threshold has been breached\nAnd \"divert calls\" is the configured response\nWhen a new call reaches the affected route\nThen the IVR must divert the call to the approved alternative destination\nAnd the customer must hear an appropriate message before the call is diverted", "script": ""}, {"id": "FR3-12", "title": "Hold new calls", "t": "Scenario: Hold new calls\nGiven a demand management threshold has been breached\nAnd \"hold calls\" is the configured response\nWhen a new call reaches the affected route\nThen the call must be held according to the agreed queue rules\nAnd the customer must hear the approved waiting message\nAnd the hold time must not exceed the configured maximum", "script": ""}, {"id": "FR3-13", "title": "Advise NewCo customers to try again later", "t": "Scenario: Advise NewCo customers to try again later\nGiven a demand management threshold has been breached\nAnd \"try again later\" is the configured response\nWhen a new call reaches the affected route\nThen the IVR must play the approved high-demand message\nAnd the message must clearly explain that the service is experiencing high demand\nAnd the message must tell the customer when or how to try again\nAnd the call must end according to the configured routing rules", "script": ""}, {"id": "FR3-14", "title": "Different messaging is configured", "t": "Scenario: Different messaging is configured\nGiven a demand management threshold has been breached\nAnd an alternative approved message is configured for that threshold\nWhen a new call reaches the affected route\nThen the IVR must play the message associated with that threshold\nAnd the IVR must apply the corresponding configured routing response", "script": ""}, {"id": "FR3-15", "title": "Both thresholds are breached", "t": "Scenario: Both thresholds are breached\nGiven the queue-time threshold has been breached\nAnd the Agent-availability threshold has been breached\nWhen a new call reaches the demand-management checks\nThen the IVR must apply the response defined by the agreed precedence rules\nAnd the customer must not receive conflicting messages or routing instructions", "script": ""}, {"id": "FR3-16", "title": "A configured response fails", "t": "Scenario: A configured response fails\nGiven a demand management threshold has been breached\nAnd the IVR cannot apply the configured response\nWhen the routing attempt fails\nThen the IVR must apply the agreed fail-safe response\nAnd the customer must receive an appropriate message\nAnd the failure must be recorded for investigation", "script": ""}]}, {"id": "FR3-F4", "t": "Provide demand management capability from day one", "story": "As the service owner,\nI want demand- management controls to be technically available from day one,\nso that thresholds and routing responses can be activated once agreed with Resourcing and SBT.", "sc": [{"id": "FR3-17", "title": "Day-one capability is available", "t": "Scenario: Day-one capability is available\nGiven the service is ready to begin live operation\nWhen the day one readiness assessment is completed\nThen Storm/SBT must support configuration of a queue-time threshold\nAnd Storm/SBT must support configuration of an Agent-availability threshold\nAnd the IVR must support the agreed call-limiting, diversion, holding or messaging responses\nAnd the capability must be tested before live operation", "script": ""}, {"id": "FR3-18", "title": "Business thresholds have not yet been agreed", "t": "Scenario: Business thresholds have not yet been agreed\nGiven the technical demand-management capability is available\nAnd Resourcing and SBT have not approved the operational thresholds\nWhen the service begins live operation\nThen no unapproved threshold must be activated\nAnd the normal routing flow must remain in place\nAnd authorised users must be able to configure the thresholds once they are approved", "script": ""}, {"id": "FR3-19", "title": "A configured demand management rule is activated", "t": "Scenario: A configured demand management rule is activated\nGiven an approved threshold and response have been configured\nWhen an authorised user activates the rule\nThen the IVR must apply the rule to new calls\nAnd calls already connected to an Agent must not be interrupted", "script": ""}, {"id": "FR3-20", "title": "A demand management rule is deactivated", "t": "Scenario: A demand management rule is deactivated\nGiven a demand management rule is active\nWhen an authorised user deactivates the rule\nThen new calls must return to the normal routing flow\nAnd the deactivation must be recorded in the audit history", "script": ""}]}]}, {"code": "FR3.1", "title": "SMS Cost and Benefit Assessment", "features": [{"id": "FR3.1-F1", "t": "Assess SMS costs before implementation", "story": "As the NewCo service owner,\nI want the costs of using SMS for demand management or channel shift to be assessed,\nso that an informed decision can be made before SMS is introduced", "sc": [{"id": "FR3.1-01", "title": "Complete the SMS cost assessment", "t": "Scenario: Complete the SMS cost assessment\nGiven SMS is being considered for demand management or channel shift\nWhen the cost assessment is completed\nThen it must include the cost per message\nAnd it must include any setup or implementation costs\nAnd it must include ongoing operating and support costs\nAnd it must include expected message volumes\nAnd it must calculate the estimated total cost for the assessment period", "script": ""}, {"id": "FR3.1-02", "title": "Consider different SMS-volume assumptions", "t": "Scenario: Consider different SMS-volume assumptions\nGiven estimated SMS volumes may vary\nWhen the assessment is produced\nThen it must include agreed low, expected and high-volume scenarios\nAnd it must show the estimated cost for each scenario", "script": ""}, {"id": "FR3.1-03", "title": "SMS costs are not fully known", "t": "Scenario: SMS costs are not fully known\nGiven one or more SMS cost components have not been confirmed\nWhen the assessment is reviewed\nThen the unknown costs and assumptions must be clearly identified\nAnd SMS must not be approved solely on an incomplete cost estimate", "script": ""}]}]}, {"code": "FR4", "title": "Web Chat Requirements", "features": [{"id": "FR4-F1", "t": "Use the existing medical web chat as the primary entry point", "story": "As a customer seeking support through web chat,\nI want to access NewCo support through the existing DVLA medical web chat,\nso that I have a consistent and trusted entry point.", "sc": [{"id": "FR4-01", "title": "Customer accesses web chat directly", "t": "Scenario: Customer accesses web chat directly\nGiven the customer needs support with a medical case\nWhen the customer selects the existing DVLA medical web chat link\nThen the customer must enter the existing medical web chat journey\nAnd the customer must not need a separate NewCo-specific URL", "script": "Connecting to a NewCo agent\nYou're being connected to the team looking after your case."}, {"id": "FR4-02", "title": "NewCo-eligible customer enters through the existing URL", "t": "Scenario: NewCo-eligible customer enters through the existing URL\nGiven the customer is eligible for the NewCo cohort\nWhen the customer enters through the existing medical web chat URL\nThen the web chat journey must assess the customer's NewCo eligibility\nAnd the customer must be capable of being routed to the NewCo Agent queue", "script": ""}, {"id": "FR4-03", "title": "BAU customer enters through the existing URL", "t": "Scenario: BAU customer enters through the existing URL\nGiven the customer is not eligible for the NewCo cohort\nWhen the customer enters through the existing medical web chat URL\nThen the customer must follow the appropriate BAU web chat route\nAnd the customer must not be incorrectly routed to NewCo", "script": ""}, {"id": "FR4-04", "title": "The existing URL supports the required branching", "t": "Scenario: The existing URL supports the required branching\nGiven the existing medical web chat URL can support NewCo eligibility checks and routing\nWhen the NewCo web chat journey is implemented\nThen a standalone NewCo web chat URL must not be introduced", "script": ""}, {"id": "FR4-05", "title": "The existing URL cannot support the required branching", "t": "Scenario: The existing URL cannot support the required branching\nGiven technical assessment confirms that the existing medical web chat URL cannot support the required branching\nWhen an alternative approach is proposed\nThen the decision must be documented and approved through the agreed governance process\nAnd existing DVLA and GDS branding requirements must be retained", "script": ""}]}, {"id": "FR4-F2", "t": "Direct controlled communications to the existing web chat journey", "story": "As a NewCo customer receiving an SMS or other controlled communication,\nI want the web chat link to take me to the correct existing journey,\nso that my eligibility can be assessed before I am routed.", "sc": [{"id": "FR4-06", "title": "NewCo Customer selects a web chat link in an IVR-triggered SMS", "t": "Scenario: NewCo Customer selects a web chat link in an IVR-triggered SMS\nGiven the NewCo customer has received an IVR-triggered SMS containing a web chat link\nWhen the customer selects the link\nThen the customer must be directed to the existing DVLA medical web chat URL\nAnd the customer must enter the NewCo branching journey", "script": ""}, {"id": "FR4-07", "title": "Communication link does not bypass eligibility checks", "t": "Scenario: Communication link does not bypass eligibility checks\nGiven a communication has been sent to a NewCo customer believed to be eligible\nWhen the customer enters web chat using the supplied link\nThen the customer must still provide their case reference number\nAnd the case reference number must be validated before the customer is routed to the NewCo team", "script": ""}]}, {"id": "FR4-F3", "t": "Capture and validate the case reference number", "story": "As a customer entering the medical web chat journey,\nI want to provide my case reference number,\nso that the service can identify whether my case is eligible for NewCo support.", "sc": [{"id": "FR4-08", "title": "Customer is asked for a case reference number", "t": "Scenario: Customer is asked for a case reference number\nGiven the NewCo customer has entered the web chat journey\nWhen the eligibility stage begins\nThen the web chat must request the customer's case reference number\nAnd the guidance must explain which reference number is required\nAnd the guidance must explain where the customer can find it\nAnd the case reference number must be treated as the unique routing identifier", "script": ""}, {"id": "FR4-09", "title": "Customer enters a correctly formatted reference number", "t": "Scenario: Customer enters a correctly formatted reference number\nGiven the customer has been asked for their case reference number\nWhen the customer enters a reference number in the required format\nThen the web chat must check it against the shared NewCo routing table", "script": ""}, {"id": "FR4-10", "title": "Customer enters an incorrectly formatted reference number", "t": "Scenario: Customer enters an incorrectly formatted reference number\nGiven the NewCo customer has been asked for their case reference number\nWhen the customer enters a reference number in an invalid format\nThen the web chat must explain that the reference number is not in the expected format\nAnd the customer must be offered another attempt in accordance with the agreed retry rules\nAnd the customer must not be routed to the NewCo team based on the invalid reference number", "script": ""}, {"id": "FR4-11", "title": "NewCo Customer does not provide a case reference number", "t": "Scenario: NewCo Customer does not provide a case reference number\nGiven the customer has been asked for their case reference number\nWhen the customer cannot or does not provide it\nThen the customer must not be automatically routed to NewCo\nAnd the customer must remain in or be directed to the appropriate BAU route", "script": ""}, {"id": "FR4-12", "title": "Maximum entry attempts are reached", "t": "Scenario: Maximum entry attempts are reached\nGiven the customer has reached the maximum permitted number of entry attempts\nAnd a validly formatted case reference number has not been captured\nWhen the web chat continues\nThen the customer must remain in or be directed to the appropriate BAU route", "script": ""}]}, {"id": "FR4-F4", "t": "Update and verify the shared routing table daily (Given an agreed person or team owns the daily routing-table update)", "story": "As the operational owner of the NewCo routing data,\nI want the shared routing table to be updated and checked daily,\nso that routing decisions are based on current and accurate information.", "sc": [{"id": "FR4-13", "title": "Daily update completes successfully", "t": "Scenario: Daily update completes successfully\nGiven the current NewCo cohort data is available\nWhen the scheduled daily update is run\nThen new eligible case references must be added\nAnd closed or ineligible case references must be removed or made inactive\nAnd current team ownership must be recorded\nAnd the process must confirm that the update completed successfully.", "script": ""}]}, {"id": "FR4-F5", "t": "Identify routing failures for operational review (Record web chat routing failures)", "story": "As an operational owner,\nI want failed web chat routing attempts to be identifiable,\nso that data issues and recurring routing problems can be investigated and corrected.", "sc": [{"id": "FR4-14", "title": "Record a routing failure", "t": "Scenario: Record a routing failure\nGiven a customer is using the medical web chat\nWhen routing fails because the case reference is \"<failure_reason>\"\nThen the failure must be recorded for operational review\nAnd the record must include the date and time\nAnd the failure category must be recorded as \"<failure_reason>\"\nAnd the outcome or fallback route must be recorded", "script": ""}, {"id": "FR4-15", "title": "Automatic routing fails despite an eligible record", "t": "Scenario: Automatic routing fails despite an eligible record\nGiven the case reference number matches an active record\nWhen the web chat cannot route the customer to the configured NewCo queue\nThen the failure must be recorded as an automatic routing failure\nAnd the intended NewCo queue must be identifiable\nAnd the agreed fallback or manual transfer route must be made available", "script": ""}, {"id": "FR4-16", "title": "Operational user reviews routing failures", "t": "Scenario: Operational user reviews routing failures\nGiven one or more web chat routing failures have been recorded\nWhen an authorised operational user reviews the failure information\nThen the user must be able to distinguish data validation failures from technical routing failures\nAnd the user must be able to identify recurring failure reasons\nAnd access to customer information must follow applicable security and data protection controls", "script": ""}]}, {"id": "FR4-F6", "t": "Display the NewCo cohort indicator in Dynamics", "story": "As a BAU Agent,\nI want to see a clear NewCo indicator on the Dynamics front screen,\nso that I can identify NewCo cases and transfer customers correctly when automatic routing fails.", "sc": [{"id": "FR4-17", "title": "Agent opens an NewCo case", "t": "Scenario: Agent opens an NewCo case\nGiven the case is recorded as active and eligible for NewCo\nWhen an authorised Agent opens the customer or case front screen in Dynamics\nThen a clear NewCo indicator must be displayed\nAnd the indicator must be visible without requiring the Agent to search through case notes\nAnd the owning NewCo team or queue must be shown where available", "script": ""}, {"id": "FR4-18", "title": "BAU agent receives a NewCo case", "t": "Scenario: BAU agent receives a NewCo case\nGiven automatic routing has failed\nAnd a BAU agent receives a NewCo customer's call or web chat\nWhen the Agent accesses the relevant Dynamics record\nThen the NewCo indicator must be visible to the BAU agent\nAnd the indicator must provide enough information to identify the correct transfer destination", "script": ""}, {"id": "FR4-19", "title": "NewCo eligibility ends", "t": "Scenario: NewCo eligibility ends\nGiven the case was previously eligible for NewCo\nAnd the case has been closed or made ineligible\nWhen the updated case information is available in Dynamics\nThen the case must no longer display an active NewCo indicator", "script": ""}, {"id": "FR4-20", "title": "Dynamics cannot retrieve current NewCo status", "t": "Scenario: Dynamics cannot retrieve current NewCo status\nGiven the Agent has opened the customer or case front screen\nWhen current NewCo eligibility cannot be retrieved\nThen Dynamics must not present an unconfirmed status as current\nAnd the Agent must be able to follow the agreed fallback process", "script": ""}]}, {"id": "FR4-F7", "t": "Manually transfer an NewCo web customer contact", "story": "As a BAU agent who receives a NewCo eligible customer,\nI want to transfer the contact to the correct NewCo team,\nso that the customer reaches the appropriate NewCo agent when automatic routing has failed.", "sc": [{"id": "FR4-21", "title": "BAU Agent initiates a manual transfer", "t": "Scenario: BAU Agent initiates a manual transfer\nWhen the BAU Agent selects the approved NEWCO transfer destination\nThen the chat must be transferred to the correct NewCo team or queue\nAnd the transfer outcome must be visible to the BAU Agent", "script": ""}, {"id": "FR4-22", "title": "Manual transfer succeeds", "t": "Scenario: Manual transfer succeeds\nGiven the BAU Agent has initiated a manual transfer\nWhen the NEWCO team accepts the chat\nThen the NEWCO Agent must receive the active chat\nAnd the existing chat transcript must be retained\nAnd customer information already captured must be available to the NEWCO Agent\nAnd the customer must not be asked to repeat information that has already been captured and remains valid", "script": ""}, {"id": "FR4-23", "title": "Manual transfer is waiting to be accepted", "t": "Scenario: Manual transfer is waiting to be accepted\nGiven the BAU Agent has initiated a manual transfer\nAnd the NEWCO team has not yet accepted the chat\nWhen the transfer remains pending\nThen the customer must receive appropriate waiting information\nAnd the chat must not be disconnected solely because the transfer is pending\nAnd the transfer must follow the agreed timeout rules", "script": ""}, {"id": "FR4-24", "title": "Manual transfer fails", "t": "Scenario: Manual transfer fails\nGiven the BAU Agent has initiated a manual transfer\nWhen the transfer cannot be completed\nThen the BAU Agent must be informed that the transfer failed\nAnd the chat transcript and captured customer information must remain available\nAnd the Agent must be able to follow the agreed fallback process\nAnd the failure must be recorded for operational review", "script": ""}, {"id": "FR4-25", "title": "NewCo team or queue is unavailable", "t": "Scenario: NewCo team or queue is unavailable\nGiven the customer is confirmed as NewCo eligible \nAnd the correct NewCo queue is unavailable\nWhen the BAU Agent attempts to transfer the chat\nThen the customer must not be transferred to an incorrect queue\nAnd the BAU Agent must follow the agreed unavailable team process", "script": ""}]}, {"id": "FR4-F8", "t": "Protect customer information during web chat routing", "story": "As a NewCo customer,\nI want my personal information and chat transcript to remain secure during routing and transfer,\nso that my information is only available to authorised agents handling my query.", "sc": [{"id": "FR4-26", "title": "Customer information is transferred to an agent", "t": "Scenario: Customer information is transferred to an agent\nGiven the customer has entered personal and case information\nWhen the chat is routed or transferred to an agent\nThen the information must be passed through an approved secure mechanism\nAnd it must only be available to authorised users", "script": ""}, {"id": "FR4-27", "title": "Chat is transferred between BAU and NewCo", "t": "Scenario: Chat is transferred between BAU and NewCo\nGiven a BAU agent has received an NewCo eligible chat\nWhen the chat is transferred to an NewCo agent\nThen only information relevant to handling the contact must be transferred\nAnd the transcript must remain linked to the correct chat session and customer case", "script": ""}, {"id": "FR4-28", "title": "Chat session ends before handover", "t": "Scenario: Chat session ends before handover\nGiven the customer has entered mandatory personal information\nWhen the chat session ends before agent handover \nThen the captured information must be retained or deleted in accordance with the agreed retention policy\nAnd it must not be accessible through another customer's chat session", "script": ""}]}]}, {"code": "FR5", "title": "Shared Routing Table Data Management", "features": [{"id": "FR5-F1", "t": "Assess the feasibility of automated routing table updates", "story": "As the NewCo service owner,\nI want Midas or an equivalent reporting function assessed for routing-table automation,\nso that the most reliable and proportionate update method can be selected.", "sc": [{"id": "FR5-01", "title": "Assess Midas as the source of routing data", "t": "Scenario: Assess Midas as the source of routing data\nGiven the routing table requires daily NewCo eligibility data\nWhen the technical assessment of Midas is completed\nThen the assessment must confirm whether Midas can identify eligible case reference numbers\nAnd Midas can identify the owning NewCo team or queue\nAnd Midas can produce the data at the required frequency\nAnd its output can be provided in a format suitable for updating the routing table", "script": ""}, {"id": "FR5-02", "title": "Midas can support the required automation", "t": "Scenario: Midas can support the required automation\nGiven the assessment confirms that Midas can meet the agreed requirements\nWhen the automation approach is approved\nThen Midas must be used to produce or trigger the routing-data extract\nAnd the extract must be made available to the agreed update mechanism", "script": ""}, {"id": "FR5-03", "title": "Midas cannot support all requirements", "t": "Scenario: Midas cannot support all requirements\nGiven the assessment identifies requirements that Midas cannot meet\nWhen the assessment is concluded\nThen the limitations must be documented\nAnd an equivalent reporting function or controlled alternative must be assessed\nAnd the selected approach must be approved through the agreed governance process", "script": ""}, {"id": "FR5-04", "title": "Full automation is not technically feasible", "t": "Scenario: Full automation is not technically feasible\nGiven neither Midas nor an equivalent function can fully automate the update\nWhen an interim update process is designed\nThen the process must include controlled manual steps\nAnd responsibilities for each manual step must be assigned\nAnd validation and completion checks must be included\nAnd the residual operational risks must be documented", "script": ""}]}, {"id": "FR5-F2", "t": "Produce the automated routing data extract", "story": "As the NewCo team responsible for routing data,\nI want Midas or the agreed reporting function to produce a valid extract of NewCo cases,\nso that the shared routing table can be updated accurately.", "sc": [{"id": "FR5-05", "title": "Produce the scheduled extract", "t": "Scenario: Produce the scheduled extract\nGiven the approved reporting function is available\nAnd the daily extract is scheduled\nWhen the scheduled extraction time is reached\nThen the extract must identify all cases eligible for NewCo routing\nAnd it must include the eligible case reference number\nAnd it must include the owning NewCo team or destination queue where required\nAnd it must be produced in the agreed format", "script": ""}, {"id": "FR5-06", "title": "Extract includes a newly eligible NewCo case", "t": "Scenario: Extract includes a newly eligible NewCo case\nGiven a case has entered the NewCo cohort before the agreed data cut-off\nWhen the next daily extract is produced\nThen the case reference number must be included\nAnd the current owning team or destination queue must be included where required", "script": ""}, {"id": "FR5-07", "title": "Extract reflects a case leaving the NewCo cohort", "t": "Scenario: Extract reflects a case leaving the NewCo cohort\nGiven a case has closed or left the NewCo cohort\nAnd the agreed retention period has expired\nWhen the next daily extract is produced\nThen the case reference number must be identified for removal or omitted in accordance with the agreed update method", "script": ""}]}, {"id": "FR5-F3", "t": "Apply routing data to routing table", "story": "As the NewCo Service owner, I want Telecoms/agreed mechanism to apply the daily routing data extract,\nso that IVR and web chat use the same current NewCo routing information", "sc": [{"id": "FR5-08", "title": "Daily Update", "t": "Scenario: Daily Update\nGiven a valid daily routing data extract is available\nAnd the agreed update mechanism can access the shared routing table\nWhen the update process is run\nThen eligible reference number additions must be applied\nAnd the NewCo team/queue ownership changes must be applied\nAnd the updated data must be available to IVR and web chat", "script": ""}]}, {"id": "FR5-F4", "t": "Add eligible NewCo cases to routing table", "story": "As the NewCo Service owner,\nI want eligible case references added to the routing table,\nso that NewCo customers entering the NewCo cohort are routed to the correct team", "sc": [{"id": "FR5-09", "title": "Add a newly eligible case", "t": "Scenario: Add a newly eligible case\nGiven a case has entered the NewCo cohort\nAnd the case reference number has passed validation\nWhen the next daily update completes\nThen the case reference number must be active in the shared routing table\nAnd it must be available to both IVR and web chat\nAnd the correct owning team or destination queue must be recorded where required", "script": ""}, {"id": "FR5-10", "title": "Attempt to add an existing active reference number", "t": "Scenario: Attempt to add an existing active reference number\nGiven the case reference number already has an active routing record\nWhen the same reference number is included as a new addition\nThen a duplicate active record must not be created\nAnd any valid ownership or eligibility change must be processed according to the agreed update rules", "script": ""}]}, {"id": "FR5-F5", "t": "Remove cases leaving the NewCo cohort", "story": "As the NewCo Service owner,\nI want case references removed after the agreed retention period,\nso that closed or ineligible cases are not incorrectly routed to the NewCo team", "sc": [{"id": "FR5-11", "title": "Closed case reaches the end of its retention period.", "t": "Scenario: Closed case reaches the end of its retention period.\nGiven a NewCo case has closed \nAnd the agreed retention period has expired\nWhen the next daily update is complete\nThen the reference number must be removed or made inactive for the NewCo routing\nAnd IVR and web chat must no longer route the case to NewCo", "script": ""}]}]}, {"code": "FR6", "title": "CSAT Requirements for the NewCo Queue", "features": [{"id": "FR6-F1", "t": "Provide a separate CSAT survey for NewCo customer\n(CSAT Questions can be found here: CSAT Questions refresh)", "story": "As an NewCo service owner,\nI want customers handled through the NewCo queue to receive a separate CSAT survey,\nso that NewCo customer outcomes can be measured independently from BAU performance.", "sc": [{"id": "FR6-01", "title": "Customer completes a contact through the NewCo queue", "t": "Scenario: Customer completes a contact through the NewCo queue\nGiven the customer's call has been handled through the NewCo queue\nAnd the call reaches the agreed survey trigger point\nWhen the customer is invited to complete a CSAT survey\nThen the customer must be presented with the NewCo CSAT survey\nAnd the response must be identified as an NewCo response\nAnd the response must not be recorded as a BAU survey response", "script": ""}, {"id": "FR6-02", "title": "Customer declines the NEWCO survey", "t": "Scenario: Customer declines the NEWCO survey\nGiven an NEWCO customer has been invited to complete the survey\nWhen the customer declines or exits without responding\nThen the interaction must not be recorded

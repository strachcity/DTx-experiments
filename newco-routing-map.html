when the team is closed", "t": "Scenario: Customer asks for a callback when the team is closed\nGiven the customer’s reference matches an active NewCo cohort record\nAnd the owning team is outside its operating hours\nWhen the customer asks for a callback\nThen the customer must be offered the team-closed options in FR2-01", "script": "", "st": "new"}]}]}];

const PROPOSED = "Suggested";

const SCRIPTS = {
  ref_prompt:{n:"Asking for the reference",src:"sug",note:"Keypad entry is new (FR1-NF3): the BAU phone line takes the reference by speech only today.",t:"Please say or enter the 9 digits of our reference number. It's at the top of every letter we send you, next to \u201cOur reference\u201d. You don't need to include the letters MED. If you don't have it, stay on the line."},
  ref_format:{n:"Reference in the wrong format",src:"sug",t:"Sorry, we need the 9 digits next to \u201cOur reference\u201d at the top of your letter. Please try again."},
  fn_connect:{n:"Connecting to a NewCo agent",src:"req",req:"FR1-08",t:"Thank you. We’re putting you through to an adviser."},
  connect_team:{n:"Connecting to the team",src:"sug",t:"Thank you. We're putting you through to the team looking after your case."},
  queue_msg:{n:"Waiting in the NewCo queue",src:"sug",t:"You're in the queue for the team looking after your case. [Estimated wait.]"},
  queue_cb:{n:"Callback offer in the NewCo queue",src:"sug",t:"You're waiting longer than usual. We can call you back when you reach the front of the queue, so you don't have to hold. You'll keep your place. To be called back, press 1. Or stay on the line."},
  callback_ok:{n:"Callback confirmed",src:"sug",t:"We'll keep your place in the queue and call you back when you reach the front, usually soon. Please keep your phone nearby. If you miss the call, we'll try to leave you a voicemail, and you'll need to call us again."},
  team_closed:{n:"Team closed, BAU open",src:"req",req:"FR2-01",note:"Working answer for [days and hours]: Monday to Friday, 8am to 4pm (subject to approval).",t:"The team looking after your case is closed at the moment. They’re open [days and hours]. You can leave your number and they’ll call you back, most likely on the next working day. Or you can speak to another adviser now. They’re not part of your team, but they can help with most things.\nTo leave your number for your team, press 1. To speak to another adviser now, press 2."},
  closing:{n:"Closing message",src:"sug",t:"Thank you for calling. The team looking after your case is open Monday to Friday, 8am to 4pm. Please call back then, and have our reference number ready. Goodbye.",note:"Hours are provisional."},
  to_adviser:{n:"Putting the caller through to another adviser",src:"sug",t:"We’re putting you through to another adviser. They’re not part of the team looking after your case, but they can help with most things."},
  busy_msg:{n:"Team busy, no callback available: leave a message for the team",src:"sug",t:"The team looking after your case is busy helping other people right now. You can leave your number and they’ll call you back, most likely on the next working day. You’ll leave the queue if you do.\nTo leave your number for your team, press 1. Or stay on the line to keep your place."},
  cb_req_rb:{n:"Confirming the number for a message for the team",src:"sug",t:"We’ll pass the number ending [last 3 digits] to the team looking after your case, so they can call you back. If that’s right, press 1. To give a different number, press 2."},
  cb_req_enter:{n:"Entering a number for a message for the team",src:"sug",t:"Please enter the number we should call you back on, then press hash.",note:"Keypad entry is new (FR1-NF3)."},
  cb_req_ok:{n:"Message sent",src:"sug",t:"Thank you. We’ve passed your number to the team looking after your case. They’ll most likely call you back on the next working day. Goodbye."},

  {id:"d_welsh2",cat:"decided",t:"Callers say “Welsh” out loud, or press a key",d:"Saying it is how it works today. Pressing a key is new, for accessibility (FR1-N11). Callers who don't choose Welsh go straight on to say what the call is about.",n:["phone:p_welsh"],r:["FR8-05","FR8-06","FR1-N11"]},

  {id:"d_cbwhen",cat:"decided",t:"Callbacks are offered while the wait is long",d:"The caller keeps their place and is called back when they reach the front, usually soon. When the wait is short there are no options and the phone just rings. A message for the team is different: the team most likely calls back on the next working day.",n:["phone:p_cbavail","phone:p_qwait"],r:["FR8-N5","FR8-N2"]},

  {id:"d_dmcb",cat:"decided",t:"Callbacks are offered only when there's resource",d:"The developers confirmed on 28 September that demand management runs before callbacks. Without enough resource, the caller hears the team-busy message and can ask for a message for the team or keep waiting. They aren't sent to BAU.",n:["phone:p_cbres","phone:p_busy"],r:["FR8-N2","FR8-N4"]},

  {id:"d_fr2",cat:"decided",t:"FR2 covers the team being closed, and messages for the team",d:"FR8 covers triage and the queue. The out-of-hours options in FR8-32 to FR8-34 are merged into FR2, and the rules against offering BAU are removed.",n:["phone:p_tc"],r:["FR2-01","FR2-12"]},

const CH = {phone:PHONE, chat:CHAT};
for (const c of Object.values(CH)){
  c.byId={}; c.laneOf={}; c.E=[];
  c.lanes.forEach((ln,li)=>{
    ln.n=li+1;
    ln.nodes.forEach(n=>{ c.byId[n.id]=n; c.laneOf[n.id]=ln; });
    /* Turn every answer into its own box: question -> answer -> next step */
    const edges=[];
    ln.edges.forEach((e,i)=>{
      const from=c.byId[e[0]];
      if(from.type==="q" && e[2]){
        const a={id:`${e[0]}~${i}`,type:"a",l:e[2],q:e[0],k:from.k};
        ln.nodes.push(a); c.byId[a.id]=a; c.laneOf[a.id]=ln;
        edges.push([e[0],a.id]); edges.push([a.id,e[1]]);
      } else edges.push(e);
    });
    ln.edges=edges;
    ln.edges.forEach((e,i)=>c.E.push({id:ln.id+"-"+i,lane:ln.id,from:e[0],to:e[1],l:e[2]||""}));
  });
  Object.values(c.byId).forEach(n=>{ if(n.type==="q") n.answers=c.E.filter(e=>e.from===n.id).map(e=>c.byId[e.to]); });
}

const state = {};
function resetState(){
  state.view="map"; state.ch="phone"; state.sel=null; state.tab="step";
  state.choice={phone:{},chat:{}}; state.start={phone:PHONE.start,chat:CHAT.start};

/* ====================================================================
   Helpers
   ==================================================================== */
const $=(s,r=document)=>r.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function said(t){ return esc(t).replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>'); }
function tag(t,c){ return `<strong class="govuk-tag ${c}">${esc(t)}</strong>`; }
function outs(c,id){ return c.E.filter(e=>e.from===id); }
function pick(c,id,seen){
  const q=c.byId[id], chosen=q.answers.find(a=>a.id===state.choice[c.key][id]);
  if(chosen) return chosen;
  /* A question can default to a different answer when an earlier step is on the route */
  if(q.seen && seen && seen.has(q.seen[0])){ const a=q.answers.find(x=>x.l===q.seen[1]); if(a) return a; }
  return q.answers.find(a=>a.l===q.dflt)||q.answers[0];
}
function followed(c,id){ const r=state.route, i=r?r.nodes.indexOf(id):-1; return i>=0&&r.nodes[i+1]?c.byId[r.nodes[i+1]]:pick(c,id); }

function route(c){
  const nodes=[], edges=[]; let at=state.start[c.key], guard=80;
  while(at && guard--){
    nodes.push(at);
    const n=c.byId[at];
    if(n.type==="go"){ at=n.to; continue; }
    const o=outs(c,at); if(!o.length) break;
    const e=n.type==="q"?o.find(x=>x.to===pick(c,at,new Set(nodes)).id):o[0];
    edges.push(e); at=e.to;
  }
  return {nodes,edges};
}

/* ====================================================================
   Drawing one lane (dagre, left to right)
   ==================================================================== */
const NS="http://www.w3.org/2000/svg";
function el(tag,a,p){ const e=document.createElementNS(NS,tag); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; }
function wrap(text,max){ const w=text.split(" "),L=[]; let s=""; w.forEach(x=>{ if((s+" "+x).trim().length>max&&s){L.push(s);s=x;} else s=(s+" "+x).trim(); }); if(s)L.push(s); return L; }
function size(n){
  if(n.type==="q"){ n.lines=wrap(n.l,20); return {w:210,h:Math.max(54,n.lines.length*18+18+(n.k==="prop"?14:0))}; }
  if(n.type==="end"){ n.lines=wrap(n.l,22); return {w:210,h:Math.max(40,n.lines.length*18+14)}; }
  if(n.type==="go"){ n.lines=wrap(n.l,22); return {w:200,h:n.lines.length*18+18}; }
  if(n.type==="a"){ n.lines=wrap(n.l,18); return {w:150,h:n.lines.length*18+16}; }
  n.lines=wrap(n.l,22); return {w:190,h:n.lines.length*18+22+(n.k==="prop"?14:0)};
}
function drawGraph(c,key,nodes,edges,label,clusters,tight){
  const g=new dagre.graphlib.Graph({multigraph:true,compound:!!clusters});
  g.setGraph({rankdir:"LR",nodesep:tight?14:20,ranksep:tight?28:46,marginx:24,marginy:22});
  g.setDefaultEdgeLabel(()=>({}));
  if(clusters) clusters.forEach(cl=>g.setNode("cl-"+cl.id,{}));
  nodes.forEach(n=>{ const s=size(n); g.setNode(n.id,{width:s.w,height:s.h}); if(clusters) g.setParent(n.id,"cl-"+c.laneOf[n.id].id); });
  edges.forEach(e=>g.setEdge(e.from,e.to,{},e.id));
  dagre.layout(g);
  const W=Math.ceil(g.graph().width), H=Math.ceil(g.graph().height);
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"group","aria-label":label});
  svg.dataset.w=W; svg.dataset.h=H;
  const defs=el("defs",{},svg);
  [["off","#8e9296"],["on","#1d70b8"]].forEach(([k,col])=>{ const m=el("marker",{id:`${key}-${k}`,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs); el("path",{d:"M0,0 L10,5 L0,10 z",fill:col},m); });
  if(clusters){
    const cg=el("g",{},svg);
    clusters.forEach(cl=>{ const p=g.node("cl-"+cl.id); if(!p||!p.width) return; const x=p.x-p.width/2-10, y=p.y-p.height/2-36, w=p.width+20, h=p.height+46;
      el("rect",{class:"cluster",x,y,width:w,height:h},cg);
      el("rect",{class:"clusterhead",x,y,width:w,height:28},cg);
      const tx=el("text",{class:"clustertext",x:x+10,y:y+19},cg); tx.textContent=`Lane ${cl.n}: ${cl.t}`; });
  }
  const edgesIn=edges.map(e=>[e.from,e.to,"",e.id]);
  const eg=el("g",{},svg), ng=el("g",{},svg);
  svg._pos={}; svg._edges=[]; svg._box={x:0,y:0,w:W,h:H};
  edgesIn.forEach(e=>{
    const ed=g.edge({v:e[0],w:e[1],name:e[3]}), p=ed.points;
    const gr=el("g",{class:"edge","data-e":e[3],"data-m":key},eg);
    const path=el("path",{d:"M"+p.map(q=>q.x+","+q.y).join(" L"),"marker-end":`url(#${key}-off)`},gr);
    svg._edges.push({from:e[0],to:e[1],path});
    if(e[2]){ const tw=e[2].length*6.8+10; el("rect",{x:ed.x-tw/2,y:ed.y-10,width:tw,height:20},gr); const t=el("text",{x:ed.x,y:ed.y+5,"text-anchor":"middle"},gr); t.textContent=e[2]; }
  });
  nodes.forEach(n=>{
    const p=g.node(n.id), x=p.x-p.width/2, y=p.y-p.height/2;
    svg._pos[n.id]={x:p.x,y:p.y,x0:p.x,y0:p.y,w:p.width,h:p.height};
    const gr=el("g",{class:`node ${n.k||""} t-${n.type}`,"data-id":n.id,tabindex:"0",role:"button"},ng);
    const kindWord=n.type==="go"?"Link to another lane":(KIND[n.k]||{}).t;
    gr.setAttribute("aria-label",n.type==="a"?`Answer to “${c.byId[n.q].l}”: ${n.l}. Select to follow it.`:`${n.type==="q"?"Question: ":""}${n.l}. ${kindWord}.`);
    if(n.type==="q"){
      const cx=x+20, cy=p.y;
      el("rect",{class:"ringy",x:x-6,y:y-6,width:p.width+12,height:p.height+12},gr);
      el("rect",{class:"ring",x:x-3,y:y-3,width:p.width+6,height:p.height+6},gr);
      el("rect",{x,y,width:p.width,height:p.height,fill:"transparent"},gr);
      el("path",{class:"diamond",d:`M${cx},${cy-16} L${cx+16},${cy} L${cx},${cy+16} L${cx-16},${cy} Z`},gr);
      let ty=p.y-(n.lines.length*18)/2+13;
      if(n.k==="prop"){ const tg=el("text",{class:"tag",x:x+44,y:ty-6},gr); tg.textContent="SUGGESTED"; ty+=8; }
      n.lines.forEach((ln2,i)=>{ const t=el("text",{class:"qtext",x:x+44,y:ty+i*18},gr); t.textContent=ln2; });
    } else if(n.type==="end"){
      el("rect",{class:"ringy",x:x-6,y:y-6,width:p.width+12,height:p.height+12},gr);
      el("rect",{class:"ring",x:x-3,y:y-3,width:p.width+6,height:p.height+6},gr);
      el("rect",{x,y,width:p.width,height:p.height,fill:"transparent"},gr);
      el("circle",{class:"dot",cx:x+14,cy:p.y,r:10},gr);
      const top=p.y-(n.lines.length*18)/2+13;
      n.lines.forEach((l2,i)=>{ const t=el("text",{x:x+34,y:top+i*18},gr); t.textContent=l2; });
    } else if(n.type==="a"){
      el("rect",{class:"ringy",x:x-6,y:y-6,width:p.width+12,height:p.height+12,rx:14},gr);
      el("rect",{class:"ans",x,y,width:p.width,height:p.height,rx:12},gr);
      n.lines.forEach((l2,i)=>{ const t=el("text",{class:"anstext",x:p.x,y:y+21+i*18,"text-anchor":"middle"},gr); t.textContent=l2; });
    } else if(n.type==="go"){
      el("rect",{class:"ringy",x:x-6,y:y-6,width:p.width+12,height:p.height+12},gr);
      el("rect",{class:"goto",x,y,width:p.width,height:p.height},gr);
      n.lines.forEach((l2,i)=>{ const t=el("text",{class:"gototext",x:p.x,y:y+22+i*18,"text-anchor":"middle"},gr); t.textContent=l2; });
    } else {
      el("rect",{class:"ringy",x:x-6,y:y-6,width:p.width+12,height:p.height+12},gr);
      el("rect",{class:"ring",x:x-3,y:y-3,width:p.width+6,height:p.height+6},gr);
      el("rect",{class:"box",x,y,width:p.width,height:p.height},gr);
      let ty=y+22;
      if(n.k==="prop"){ const tg=el("text",{class:"tag",x:p.x,y:y+17,"text-anchor":"middle"},gr); tg.textContent="SUGGESTED"; ty+=14; }
      n.lines.forEach((l2,i)=>{ const t=el("text",{x:p.x,y:ty+i*18,"text-anchor":"middle"},gr); t.textContent=l2; });
    }
    const open=(OI_BY_NODE[c.key+":"+n.id]||[]).filter(o=>o.cat!=="decided").length;
    if(open){ el("circle",{class:"badge",cx:x+p.width-2,cy:y+2,r:10},gr); const bt=el("text",{class:"badgetxt",x:x+p.width-2,y:y+6,"text-anchor":"middle"},gr); bt.textContent=open; gr.setAttribute("aria-label",gr.getAttribute("aria-label")+` ${open} open question${open>1?"s":""}.`); }
    gr.addEventListener("click",()=>{ if(gr._dragged){ gr._dragged=false; return; } onNode(n); });
    enableDrag(svg,gr,n.id);
    gr.addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); onNode(n); } });
  });
  return svg;
}
/* ---------- dragging boxes. Layout resets when the page reloads. ---------- */
function svgPoint(svg,ev){ return new DOMPoint(ev.clientX,ev.clientY).matrixTransform(svg.getScreenCTM().inverse()); }
function enableDrag(svg,gr,id){
  let s=null;
  gr.addEventListener("pointerdown",ev=>{
    if(ev.button!==0) return;
    const pt=svgPoint(svg,ev), p=svg._pos[id];
    s={x:pt.x,y:pt.y,ox:p.x,oy:p.y,moved:false,pid:ev.pointerId};
  });
  gr.addEventListener("pointermove",ev=>{
    if(!s) return;
    const pt=svgPoint(svg,ev), dx=pt.x-s.x, dy=pt.y-s.y;
    if(!s.moved){ if(Math.hypot(dx,dy)<5) return; s.moved=true; gr.setPointerCapture(s.pid); gr.classList.add("dragging"); }
    const p=svg._pos[id]; p.x=s.ox+dx; p.y=s.oy+dy;
    gr.setAttribute("transform",`translate(${p.x-p.x0},${p.y-p.y0})`);
    svg._edges.forEach(e=>{ if(e.from===id||e.to===id) e.path.setAttribute("d",straight(svg._pos[e.from],svg._pos[e.to])); });
  });
  const end=()=>{ if(s&&s.moved){ gr._dragged=true; gr.classList.remove("dragging"); growBounds(svg); } s=null; };
  gr.addEventListener("pointerup",end); gr.addEventListener("pointercancel",end);
}
/* A straight connector from the edge of one box to the edge of the other */
function edgePoint(p,q){
  const dx=q.x-p.x, dy=q.y-p.y; if(!dx&&!dy) return {x:p.x,y:p.y};
  const k=Math.min((p.w/2)/Math.abs(dx||1e-9),(p.h/2)/Math.abs(dy||1e-9));
  return {x:p.x+dx*k,y:p.y+dy*k};
}
function straight(a,b){ const s=edgePoint(a,b), e=edgePoint(b,a); return `M${s.x},${s.y} L${e.x},${e.y}`; }
/* Let the map grow if a box is dragged past its edge */
function growBounds(svg){
  let x0=svg._box.x, y0=svg._box.y, x1=x0+svg._box.w, y1=y0+svg._box.h;
  Object.values(svg._pos).forEach(p=>{ x0=Math.min(x0,p.x-p.w/2-24); y0=Math.min(y0,p.y-p.h/2-24); x1=Math.max(x1,p.x+p.w/2+24); y1=Math.max(y1,p.y+p.h/2+24); });
  svg._box={x:x0,y:y0,w:x1-x0,h:y1-y0};
  svg.setAttribute("viewBox",`${x0} ${y0} ${x1-x0} ${y1-y0}`);
  svg.dataset.w=x1-x0; svg.dataset.h=y1-y0;
  applyZoom();
}
function drawLane(c,ln){
  return drawGraph(c,ln.id,ln.nodes,c.E.filter(e=>e.lane===ln.id),`Lane ${ln.n}: ${ln.t}`);
}
function drawWhole(c){
  /* One graph for the whole channel. "Go to lane" links become the real
     connections they stand for. */
  const nodes=Object.values(c.byId).filter(n=>n.type!=="go");
  const edges=c.E.filter(e=>c.byId[e.from].type!=="go").map(e=>{ const to=c.byId[e.to]; return {...e,to:to.type==="go"?to.to:e.to}; });
  return drawGraph(c,"whole-"+c.key,nodes,edges,`${c.name}: the whole flow`,null,true);
}
const LANE_SVG={}, WHOLE_SVG={};
function onNode(n){
  const c=CH[state.ch];
  if(n.type==="go"){ const t=c.byId[n.to]; select(t.id); scrollToNode(t.id); return; }
  if(n.type==="a"){ state.choice[c.key][n.q]=n.id; select(n.q,true); return; }
  select(n.id);
}

function applyZoom(){
  const c=CH[state.ch];
  const set=(s,z)=>{ s.setAttribute("width",Math.round(s.dataset.w*z)); s.setAttribute("height",Math.round(s.dataset.h*z)); };

  c.lanes.forEach(l=>set(LANE_SVG[l.id],state.zoom[c.key]));
}
function scrollToNode(id){

}
function refresh(){
  const c=CH[state.ch], r=route(c); state.route=r;

  document.querySelectorAll(".edge").forEach(g=>{ const lit=eon.has(g.dataset.e); g.classList.toggle("on",lit); g.querySelector("path").setAttribute("marker-end",`url(#${g.dataset.m}-${lit?"on":"off"})`); if(lit) g.parentNode.appendChild(g); });

}

  $("#canvas").innerHTML=`<div class="steplist"><p class="govuk-body-s">Every step, lane by lane. Steps on the route shown have a blue line.</p>${c.lanes.map(ln=>`<h2>Lane ${ln.n}: ${esc(ln.t)}</h2><ol>${ln.nodes.filter(n=>n.type!=="a").map(n=>{
    const o=n.type==="q"?n.answers.map(a=>({l:a.l,to:outs(c,a.id)[0].to,a})):outs(c,n.id);
    return `<li class="${on.has(n.id)?"on":""}"><button type="button" class="linkbtn" data-sel="${n.id}">${n.type==="q"?"Question: ":""}${esc(n.l)}</button> ${n.type==="go"?"":tag(KIND[n.k].t,KIND[n.k].c)}
      ${o.length?`<ul class="next">${o.map(e=>`<li>${e.a?`<button type="button" class="linkbtn" data-sel="${e.a.id}">${esc(e.l)}</button>${followed(c,n.id)===e.a?" (followed)":""}, then: `:"Then: "}${esc(c.byId[e.to].l)}</li>`).join("")}</ul>`:""}</li>`;}).join("")}</ol>`).join("")}</div>`;
  document.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>onNode(c.byId[b.dataset.sel]));
}
function select(id,keepFocus){
  state.sel=id; state.tab="step";
  history.replaceState(null,"",`#/map/${state.ch}/${id}`);
  const f=keepFocus&&document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.id;
  refresh(); $("#sidebody").scrollTop=0;
  if(f){ const g=document.querySelector(`.node[data-id="${f}"]`); if(g) g.focus({preventScroll:true}); }
}

/* ---------- sidebar ---------- */
function scriptHTML(k){
  const s=SCRIPTS[k]; if(!s) return "";
  const src=s.src==="req"?tag(`From the requirements, ${s.req}`,"govuk-tag--blue"):tag("Draft script","govuk-tag--magenta");
  return `<div class="script ${s.src==="req"?"":"prop"}"><p class="who">${esc(s.who?`${s.who} says`:s.form?"On screen":"Caller hears")} ${src}</p><p class="said">${said(s.t)}</p>${s.b?`<div class="btns">${s.b.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}${s.note?`<p class="note">${esc(s.note)}</p>`:""}</div>`;
}
function origText(s){ return `${esc(s.was)}${s.was_script?`\n\nScript: ${esc(s.was_script)}`:""}`; }
function reqHTML(id,withLinks){
  const s=SC[id]; if(!s) return "";
  const S=STATUS[s.st]; let body="";
  if(s.st==="merged"||s.st==="removed"){
    body=`<div class="part"><p class="why" style="margin:0">${esc(s.why)}${s.into?` <a href="#/reqs/${s.into}">Read ${s.into}</a>.`:""}</p></div>`;
  } else {
    body=`<div class="part"><p class="g">${esc(s.t)}</p>${s.script?`<p class="g" style="margin-top:8px"><strong>Script:</strong> ${said(s.script)}</p>`:""}${s.st==="new"&&s.why?`<p class="why"><strong>Why:</strong> ${esc(s.why)}</p>`:""}${noteHTML(s)}${tbcHTML(s)}</div>`;
    if(s.st==="changed") body+=`<div class="part orig"><details><summary>${WAS}</summary><p class="why"><strong>What changed:</strong> ${esc(s.why)}</p><p class="g" style="margin-top:6px">${origText(s)}</p></details></div>`;
  }
  const tg=(s.st==="new"||s.st==="merged"||s.st==="removed")?tag(s.into?`Merged into ${s.into}`:S.t,S.c):"";
  return `<div class="req"><div class="head"><span class="id">${id}</span><strong>${esc(s.title)}</strong>${tg}</div>${body}${withLinks?`<div class="part"><a href="#/reqs/${id}">Open in the requirements page</a></div>`:""}</div>`;
}
function renderSide(){
  const body=$("#sidebody"); if(!body) return;
  $("#t-step").setAttribute("aria-selected",state.tab==="step"); $("#t-route").setAttribute("aria-selected",state.tab==="route");
  const c=CH[state.ch];
  if(state.tab==="route"){ body.innerHTML=routeHTML(c); return; }
  const n=state.sel&&c.byId[state.sel];
  if(!n){
    body.innerHTML=`<h2>How to use this map</h2>
      <p>The map reads left to right. “Whole flow” shows everything at once. “Separate flows” splits it into lanes, like the Mural.</p>
      <ul class="govuk-list govuk-list--bullet"><li>Select any step to read its script and requirements here.</li><li>Every answer to a question is a white box. Select one to follow it: the route turns blue.</li><li>Drag any box to move it. Moved boxes connect with straight lines. “Reset layout”, or reloading the page, puts everything back.</li></ul>
      <p>Grey steps are BAU as it is today. Blue steps are NewCo, from the consolidated requirements.</p>
      <p>The requirements shown are the consolidated version. Where it changes the version of 28 September, the original wording is shown too, with the reason.</p>`;
    return;
  }
  if(n.type==="a"){ state.sel=n.q; return renderSide(); }
  const ln=c.laneOf[n.id], on=state.route.nodes.includes(n.id), K=KIND[n.k];
  const ois=OI_BY_NODE[c.key+":"+n.id]||[];
  let q="";
  if(n.type==="q"){
    const cur=followed(c,n.id);
    q=`<h3>Answers</h3><p class="govuk-body-s">Select an answer here or on the map to follow it.</p><ul class="govuk-list answers">${n.answers.map(a=>{ const nx=c.byId[outs(c,a.id)[0].to]; return `<li><button type="button" class="linkbtn" data-ans="${a.id}" aria-pressed="${a===cur}">${esc(a.l)}</button>${a===cur?` ${tag("Followed","govuk-tag--blue")}`:""}<br><span class="govuk-hint" style="margin:0">Then: ${esc(nx.l)}</span></li>`; }).join("")}</ul>`;
  }
  const scripts=(n.sc||[]).map(scriptHTML).join("")+(n.asis?`<div class="script asis"><p class="who">As-is script ${tag("Not captured yet","govuk-tag--grey")}</p><p class="said">The wording customers hear or see today isn't captured here yet.</p></div>`:"");
  const reqs=(n.r||[]).map(id=>reqHTML(id,true)).join("");
  body.innerHTML=`<span class="govuk-caption">Lane ${ln.n}: ${esc(ln.t)}</span>
    <h2>${n.type==="q"?"Question: ":""}${esc(n.l)}</h2>
    <p>${tag(K.t,K.c)} <span class="govuk-body-s">${esc(K.long)}</span></p>
    ${n.d?`<p>${esc(n.d)}</p>`:""}
    ${!on?`<p class="govuk-body-s" style="color:var(--dark-grey)">Not on the route shown.</p>`:""}
    ${q}
    ${scripts?`<h3>Script</h3>${scripts}`:""}
    ${reqs?`<h3>Requirements</h3>${reqs}`:""}
    ${(RISK_BY_NODE[c.key+":"+n.id]||[]).length?`<h3>Risks</h3><ul class="govuk-list">${RISK_BY_NODE[c.key+":"+n.id].map(k=>`<li>${tag(k.rating,RATING[k.rating])} <a href="#/risks/${k.id}">${k.id}: ${esc(k.t)}</a></li>`).join("")}</ul>`:""}
    ${ois.length?`<h3>Decisions and questions</h3><ul class="govuk-list">${ois.map(o=>`<li>${tag(OICAT[o.cat].h,o.cat==="decided"?"govuk-tag--green":o.cat==="team"?"govuk-tag--yellow":"govuk-tag--grey")} <a href="#/open/${o.id}">${esc(o.t)}</a></li>`).join("")}</ul>`:""}`;
  body.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{ state.choice[c.key][n.id]=b.dataset.ans; refresh(); const k=body.querySelector(`[data-ans="${b.dataset.ans}"]`); if(k) k.focus(); });
}
function routeHTML(c){
  const r=state.route, lines=[];
  r.nodes.forEach((id,i)=>{
    const n=c.byId[id];
    if(n.type==="a") return;
    if(n.type==="go"){ lines.push(`<li><span class="does">${esc(n.l)}</span></li>`); return; }
    if(n.type==="q"){ const a=c.byId[r.nodes[i+1]]; lines.push(`<li><span class="does">${esc(n.l)}${n.asis?" (as-is script not captured)":""}</span> <strong>${a?esc(a.l):""}</strong></li>`); return; }
    const ks=n.hear||n.sc||[];
    ks.forEach(k=>{ const s=SCRIPTS[k]; lines.push(`<li><span class="who">${esc(s.form?"On screen":(s.who||c.sys))}</span>${said(s.t)}</li>`); });
    if(!ks.length) lines.push(`<li><span class="does">${esc(n.l)}${n.asis?" (as-is script not captured)":""}</span></li>`);
  });
  return `<h2>The route shown</h2><p class="govuk-body-s">What the ${c.key==="phone"?"caller hears and chooses":"customer sees and chooses"}, in order. Change it by selecting a different answer on the map.</p><ol class="transcript">${lines.join("")}</ol>`;
}

/* ====================================================================
   Requirements page
   ==================================================================== */
function onMap(id){
  const st=STEPS_BY_SC[id]; if(!st) return `<p class="onmap">Not a step on the map.</p>`;
  return `<p class="onmap">On the map: ${st.map(([ch,nid])=>`<a href="#/map/${ch}/${nid}">${CH[ch].name}, ${esc(CH[ch].byId[nid].l)}</a>`).join("; ")}</p>`;
}
function wasBlock(why,origHTML){
  return `<details class="govuk-details was"><summary class="govuk-details__summary">${WAS}</summary><div class="govuk-details__text"><p class="why" style="margin-top:0"><strong>What changed:</strong> ${esc(why)}</p><div class="col orig"><span class="lab">${ORIG}</span>${origHTML}</div></div></details>`;
}
function scenPage(s){
  const S=STATUS[s.st], head=`<span class="id">${s.id}</span> ${esc(s.title)}`;
  if(s.st==="merged"||s.st==="removed") return `<div class="scen" id="sc-${s.id}" data-st="${s.st}"><h4>${head} ${tag(s.into?`Merged into ${s.into}`:S.t,S.c)}</h4><p class="why" style="margin:0">${esc(s.why)}${s.into?` <a href="#/reqs/${s.into}">Read ${s.into}</a>.`:""}</p>${wasBlock(s.why,`<p class="g">${origText(s)}</p>`)}</div>`;
  const body=`<div class="col now"><p class="g">${esc(s.t)}</p>${s.script?`<p class="g" style="margin-top:8px"><strong>Script:</strong> ${said(s.script)}</p>`:""}${s.st==="new"&&s.why?`<p class="why"><strong>Why:</strong> ${esc(s.why)}</p>`:""}${noteHTML(s)}${tbcHTML(s)}</div>`;
  return `<div class="scen" id="sc-${s.id}" data-st="${s.st}"><h4>${head}${s.st==="new"?` ${tag(S.t,S.c)}`:""}</h4><div class="pair one">${body}</div>${s.st==="changed"?wasBlock(s.why,`<p class="g">${origText(s)}</p>`):""}${onMap(s.id)}</div>`;
}
function featHead(f){
  const title=f.t?esc(f.t):`<span style="color:var(--dark-grey);font-weight:400">No feature title</span>`;
  if(f.st==="removed") return `<h3>${esc(f.t)} ${tag("Removed","govuk-tag--red")}</h3><p class="why fnote">${esc(f.why)}</p>`;
  if(f.st==="new") return `<h3>${title} ${tag("New","govuk-tag--green")}</h3><p class="story">${esc(f.story)}</p><p class="why fnote"><strong>Why:</strong> ${esc(f.why)}</p>`;
  if(f.st==="changed") return `<h3>${title}</h3><p class="story" style="margin-bottom:5px">${esc(f.story)}</p>${wasBlock(f.why,`${f.was_t!==f.t?`<p class="g"><strong>${f.was_t?esc(f.was_t):"No feature title"}</strong></p>`:""}<p class="g">${esc(f.was_story)}</p>`)}`;
  return `<h3>${title}</h3><p class="story">${esc(f.story)}</p>${f.note?`<p class="why fnote"><strong>Note:</strong> ${esc(f.note)}</p>`:""}`;
}
function renderReqs(){
  document.body.classList.remove("is-map");
  const secs=REQS.map(fr=>`<section class="frsec" id="fr-${fr.code}" aria-labelledby="h-${fr.code}"><h2 id="h-${fr.code}" tabindex="-1">${fr.code}: ${esc(fr.title)}</h2>
    ${fr.why?`<p class="why fnote">${esc(fr.why)} It was called “${esc(fr.was_title)}”.</p>`:""}
    ${fr.features.map(f=>`<div class="feature">${featHead(f)}${f.sc.map(scenPage).join("")}</div>`).join("")}</section>`).join("");
  $("#main").outerHTML=`<main id="main" class="doc" tabindex="-1">
    <h1>Requirements</h1>
    <p class="govuk-body-l lede">The requirements for NewCo routing on the phone line and web chat, for day 1.</p>
    <div class="govuk-inset-text">This version is for the technology team. It brings together the requirements as updated on 28 September 2026 and the points agreed in the reviews on 26 and 28 September. Anything new is marked ${tag("New","govuk-tag--green")}. Where a scenario has changed, the earlier wording is under “${WAS}”.</div>
    ${CONTACT_HTML}
    <h2 class="govuk-heading-m">Contents</h2>
    <ul class="toc">${REQS.map(fr=>`<li><a href="#/reqs/fr-${fr.code}">${fr.code}: ${esc(fr.title)}</a></li>`).join("")}</ul>
    ${secs}</main>`;
  const t=state.target;
  if(t){ const node=t.startsWith("fr-")?document.getElementById(t):document.getElementById("sc-"+t); if(node){ node.scrollIntoView({block:"start"}); node.classList.add("flash"); setTimeout(()=>node.classList.remove("flash"),2500); const h=node.querySelector("h2,h4"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } } }
  else window.scrollTo(0,0);
}
const CONTACT_HTML = `<p>Contact: <a class="govuk-link" href="mailto:jack.strachan@dsit.gov.uk">jack.strachan@dsit.gov.uk</a></p>`;
/* ====================================================================
   Decisions and questions page
   ==================================================================== */
function renderOpen(target){
  document.body.classList.remove("is-map");
  const grp=cat=>`<h2 class="govuk-heading-l">${OICAT[cat].h}</h2><p>${esc(OICAT[cat].p)}</p><ul class="oi-list">${OI.filter(o=>o.cat===cat).map(o=>`<li id="oi-${o.id}" tabindex="-1"><h3>${esc(o.t)}</h3><p>${esc(o.d)}</p>${o.who?`<p class="meta">Who: ${esc(o.who)}</p>`:""}${(o.n||[]).length?`<p class="meta">On the map: ${o.n.map(k=>{const [ch,id]=k.split(":");return `<a href="#/map/${ch}/${id}">${CH[ch].name}, ${esc(CH[ch].byId[id].l)}</a>`;}).join("; ")}</p>`:""}${(o.r||[]).length?`<p class="meta">Requirements: ${o.r.map(id=>`<a href="#/reqs/${id}">${id}</a>`).join(", ")}</p>`:""}</li>`).join("")}</ul>`;
  $("#main").outerHTML=`<main id="main" class="doc" tabindex="-1"><h1>Decisions and questions</h1><p class="govuk-body-l lede">From the reviews on 26 and 28 September 2026. “Decided” items are written into the requirements. The rest are open.</p><p>Contact: <a class="govuk-link" href="mailto:jack.strachan@dsit.gov.uk">jack.strachan@dsit.gov.uk</a></p>${grp("team")}${grp("confirm")}${grp("decided")}</main>`;
  if(target){ const t=document.getElementById("oi-"+target); if(t){ t.scrollIntoView({block:"start"}); t.focus({preventScroll:true}); } } else window.scrollTo(0,0);
}

/* ====================================================================
   Risks page
   ==================================================================== */
function renderRisks(target){
  document.body.classList.remove("is-map");
  const row=(k,v)=>`<div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">${k}</dt><dd class="govuk-summary-list__value">${v}</dd></div>`;
  const items=RISKS.map(k=>`<li id="risk-${k.id}" tabindex="-1"><h3><span class="id">${k.id}</span> ${esc(k.t)} ${tag(k.rating,RATING[k.rating])}</h3>
    <dl class="govuk-summary-list">${row("What could happen",esc(k.d))}${row("Impact",esc(k.impact))}${row("Mitigation",esc(k.mit))}${row("Owner",esc(k.owner))}${row("Status","Open")}
    ${k.pri?row("Priority by feature",esc(k.pri)):""}
    ${(k.n||[]).length?row("On the map",k.n.map(x=>{const [ch,id]=x.split(":");return `<a href="#/map/${ch}/${id}">${CH[ch].name}, ${esc(CH[ch].byId[id].l)}</a>`;}).join("<br>")):""}
    ${(k.r||[]).length?row("Requirements",k.r.map(id=>`<a href="#/reqs/${id}">${id}</a>`).join(", ")):""}</dl></li>`).join("");
  $("#main").outerHTML=`<main id="main" class="doc" tabindex="-1"><h1>Risks for NewCo</h1><p class="govuk-body-l lede">Risks to introducing NewCo routing on the phone line and web chat. Started 28 September 2026. Ratings are an initial view.</p><p>Contact: <a class="govuk-link" href="mailto:jack.strachan@dsit.gov.uk">jack.strachan@dsit.gov.uk</a></p><p>${RISKS.filter(k=>k.rating==="High").length} high, ${RISKS.filter(k=>k.rating==="Medium").length} medium and ${RISKS.filter(k=>k.rating==="Low").length} low.</p><ul class="risk-list">${items}</ul></main>`;
  if(target){ const t=document.getElementById("risk-"+target); if(t){ t.scrollIntoView({block:"start"}); t.focus({preventScroll:true}); } } else window.scrollTo(0,0);
}

/* ====================================================================
   Hash router
   ==================================================================== */
function go(h){ if(location.hash===h) router(); else location.hash=h; }
function router(){
  const parts=(location.hash||"#/map/phone").replace(/^#\/?/,"").split("/");
  const view=["reqs","open","risks"].includes(parts[0])?parts[0]:"map";
  document.querySelectorAll(".service-nav__link").forEach(a=>{ if(a.dataset.view===view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(view==="reqs"){ state.view=view; state.target=parts[1]||null; renderReqs(); document.title="Requirements – NewCo routing map"; return; }
  if(view==="risks"){ state.view=view; renderRisks(parts[1]); document.title="Risks for NewCo \u2013 NewCo routing map"; return; }
  if(view==="open"){ state.view=view; renderOpen(parts[1]); document.title="Decisions and questions – NewCo routing map"; return; }
  state.view="map";
  const ch=parts[1]==="chat"?"chat":"phone";
  if(ch!==state.ch){ state.ch=ch; state.sel=null; }
  state.sel=parts[2]&&CH[ch].byId[parts[2]]?parts[2]:null;
  if(state.sel) state.tab="step";
  document.title=`${CH[ch].name} – NewCo routing map`;
  renderMap();
  if(state.sel) requestAnimationFrame(()=>scrollToNode(state.sel));
}
window.addEventListener("hashchange",router);
router();
})();
</script>
</body>
</html>

 a new call reaches the queue-time check\nThen the call must continue through the normal routing flow\nAnd the high-demand response must not be triggered", "script": "", "st": "same"}, {"id": "FR3-07", "title": "Queue time exceeds the threshold", "t": "Scenario: Queue time exceeds the threshold\nGiven the current queue time is above the configured threshold\nWhen a new call reaches the queue-time check\nThen the IVR must apply the configured demand-management response\nAnd the normal routing flow must only continue where permitted by that response", "script": "", "st": "same"}, {"id": "FR3-08", "title": "Queue time returns within the threshold", "t": "Scenario: Queue time returns within the threshold\nGiven the queue-time demand-management response is active\nAnd the current queue time returns to or below the configured threshold\nWhen a new call reaches the queue-time check\nThen the call must follow the normal routing flow\nAnd the threshold response must no longer be applied", "script": "", "st": "same"}, {"id": "FR3-09", "title": "Queue-time data is unavailable", "t": "Scenario: Queue-time data is unavailable\nGiven the IVR cannot obtain current queue-time information\nWhen a new call reaches the queue-time check\nThen the IVR must apply the agreed fail-safe routing behaviour\nAnd the customer must not be left in an incomplete routing journey\nAnd the failure must be recorded for investigation", "script": "", "st": "same"}], "st": "same"}, {"id": "FR3-F3", "t": "Apply the configured demand management response", "story": "As a customer calling during a period of high demand,\nI want to receive clear and consistent handling,\nso that I understand whether I will be connected, asked to wait, diverted or advised to call again.", "sc": [{"id": "FR3-10", "title": "Limit new calls", "t": "Scenario: Limit new calls\nGiven a demand-management threshold has been breached\nAnd \"limit new calls\" is the configured response\nWhen a new call reaches the affected route\nThen the IVR must restrict entry in accordance with the configured call limit\nAnd callers who are not admitted must hear the approved high-demand message", "script": "", "st": "same"}, {"id": "FR3-11", "title": "Divert new calls", "t": "Scenario: Divert new calls\nGiven a demand management threshold has been breached\nAnd \"divert calls\" is the configured response\nWhen a new call reaches the affected route\nThen the IVR must divert the call to the approved alternative destination\nAnd the customer must hear an appropriate message before the call is diverted", "script": "", "st": "same"}, {"id": "FR3-12", "title": "Hold new calls", "t": "Scenario: Hold new calls\nGiven a demand management threshold has been breached\nAnd \"hold calls\" is the configured response\nWhen a new call reaches the affected route\nThen the call must be held according to the agreed queue rules\nAnd the customer must hear the approved waiting message\nAnd the hold time must not exceed the configured maximum", "script": "", "st": "same"}, {"id": "FR3-13", "title": "Advise NewCo customers to try again later", "t": "Scenario: Advise NewCo customers to try again later\nGiven a demand management threshold has been breached\nAnd \"try again later\" is the configured response\nWhen a new call reaches the affected route\nThen the IVR must play the approved high-demand message\nAnd the message must clearly explain that the service is experiencing high demand\nAnd the message must tell the customer when or how to try again\nAnd the call must end according to the configured routing rules", "script": "", "st": "same"}, {"id": "FR3-14", "title": "Different messaging is configured", "t": "Scenario: Different messaging is configured\nGiven a demand management threshold has been breached\nAnd an alternative approved message is configured for that threshold\nWhen a new call reaches the affected route\nThen the IVR must play the message associated with that threshold\nAnd the IVR must apply the corresponding configured routing response", "script": "", "st": "same"}, {"id": "FR3-15", "title": "Both thresholds are breached", "t": "Scenario: Both thresholds are breached\nGiven the queue-time threshold has been breached\nAnd the Agent-availability threshold has been breached\nWhen a new call reaches the demand-management checks\nThen the IVR must apply the response defined by the agreed precedence rules\nAnd the customer must not receive conflicting messages or routing instructions", "script": "", "st": "same"}, {"id": "FR3-16", "title": "A configured response fails", "t": "Scenario: A configured response fails\nGiven a demand management threshold has been breached\nAnd the IVR cannot apply the configured response\nWhen the routing attempt fails\nThen the IVR must apply the agreed fail-safe response\nAnd the customer must receive an appropriate message\nAnd the failure must be recorded for investigation", "script": "", "st": "same"}, {"id": "FR3-N1", "title": "A NewCo customer is waiting in the NewCo queue", "t": "Scenario: A NewCo customer is waiting in the NewCo queue\nGiven a demand-management threshold has been breached\nAnd the customer is waiting in the NewCo queue for their team\nWhen the configured response is applied\nThen the customer must not be cut off, diverted or told to try again later\nAnd the NewCo queue options in FR8-N2 and FR8-N4 must apply instead", "script": "", "st": "new", "why": "These responses are for the BAU queue. A cohort caller waiting for their team is offered a callback, or the chance to leave a message for the team, when the wait is long."}], "st": "same"}, {"id": "FR3-F4", "t": "Provide demand management capability from day one", "story": "As the service owner,\nI want demand- management controls to be technically available from day one,\nso that thresholds and routing responses can be activated once agreed with Resourcing and SBT.", "sc": [{"id": "FR3-17", "title": "Day-one capability is available", "t": "Scenario: Day-one capability is available\nGiven the service is ready to begin live operation\nWhen the day one readiness assessment is completed\nThen Storm/SBT must support configuration of a queue-time threshold\nAnd Storm/SBT must support configuration of an Agent-availability threshold\nAnd the IVR must support the agreed call-limiting, diversion, holding or messaging responses\nAnd the capability must be tested before live operation", "script": "", "st": "same"}, {"id": "FR3-18", "title": "Business thresholds have not yet been agreed", "t": "Scenario: Business thresholds have not yet been agreed\nGiven the technical demand-management capability is available\nAnd Resourcing and SBT have not approved the operational thresholds\nWhen the service begins live operation\nThen no unapproved threshold must be activated\nAnd the normal routing flow must remain in place\nAnd authorised users must be able to configure the thresholds once they are approved", "script": "", "st": "same"}, {"id": "FR3-19", "title": "A configured demand management rule is activated", "t": "Scenario: A configured demand management rule is activated\nGiven an approved threshold and response have been configured\nWhen an authorised user activates the rule\nThen the IVR must apply the rule to new calls\nAnd calls already connected to an Agent must not be interrupted", "script": "", "st": "same"}, {"id": "FR3-20", "title": "A demand management rule is deactivated", "t": "Scenario: A demand management rule is deactivated\nGiven a demand management rule is active\nWhen an authorised user deactivates the rule\nThen new calls must return to the normal routing flow\nAnd the deactivation must be recorded in the audit history", "script": "", "st": "same"}], "st": "same"}]}, {"code": "FR3.1", "title": "SMS Cost and Benefit Assessment", "features": [{"id": "FR3.1-F1", "t": "Assess SMS costs before implementation", "story": "As the NewCo service owner,\nI want the costs of using SMS for demand management or channel shift to be assessed,\nso that an informed decision can be made before SMS is introduced", "sc": [{"id": "FR3.1-01", "title": "Complete the SMS cost assessment", "t": "Scenario: Complete the SMS cost assessment\nGiven SMS is being considered for demand management or channel shift\nWhen the cost assessment is completed\nThen it must include the cost per message\nAnd it must include any setup or implementation costs\nAnd it must include ongoing operating and support costs\nAnd it must include expected message volumes\nAnd it must calculate the estimated total cost for the assessment period", "script": "", "st": "same"}, {"id": "FR3.1-02", "title": "Consider different SMS-volume assumptions", "t": "Scenario: Consider different SMS-volume assumptions\nGiven estimated SMS volumes may vary\nWhen the assessment is produced\nThen it must include agreed low, expected and high-volume scenarios\nAnd it must show the estimated cost for each scenario", "script": "", "st": "same"}, {"id": "FR3.1-03", "title": "SMS costs are not fully known", "t": "Scenario: SMS costs are not fully known\nGiven one or more SMS cost components have not been confirmed\nWhen the assessment is reviewed\nThen the unknown costs and assumptions must be clearly identified\nAnd SMS must not be approved solely on an incomplete cost estimate", "script": "", "st": "same"}], "st": "same"}]}, {"code": "FR4", "title": "Web Chat Requirements", "features": [{"id": "FR4-F1", "t": "Use the existing medical web chat as the primary entry point", "story": "As a customer seeking support through web chat,\nI want to access NewCo support through the existing DVLA medical web chat,\nso that I have a consistent and trusted entry point.", "sc": [{"id": "FR4-01", "title": "Customer accesses web chat directly", "t": "Scenario: Customer accesses web chat directly\nGiven the customer needs support with a medical case\nWhen the customer selects the existing DVLA medical web chat link\nThen the customer must enter the existing medical web chat journey\nAnd the customer must not need a separate NewCo-specific URL", "script": "Connecting to a NewCo agent\nYou're being connected to the team looking after your case.", "st": "same"}, {"id": "FR4-02", "title": "NewCo-eligible customer enters through the existing URL", "t": "Scenario: NewCo-eligible customer enters through the existing URL\nGiven the customer is eligible for the NewCo cohort\nWhen the customer enters through the existing medical web chat URL\nThen the web chat journey must assess the customer's NewCo eligibility\nAnd the customer must be capable of being routed to the NewCo Agent queue", "script": "", "st": "same"}, {"id": "FR4-03", "title": "BAU customer enters through the existing URL", "t": "Scenario: BAU customer enters through the existing URL\nGiven the customer is not eligible for the NewCo cohort\nWhen the customer enters through the existing medical web chat URL\nThen the customer must follow the appropriate BAU web chat route\nAnd the customer must not be incorrectly routed to NewCo", "script": "", "st": "same"}, {"id": "FR4-04", "title": "The existing URL supports the required branching", "t": "Scenario: The existing URL supports the required branching\nGiven the existing medical web chat URL can support NewCo eligibility checks and routing\nWhen the NewCo web chat journey is implemented\nThen a standalone NewCo web chat URL must not be introduced", "script": "", "st": "same"}, {"id": "FR4-05", "title": "The existing URL cannot support the required branching", "t": "Scenario: The existing URL cannot support the required branching\nGiven technical assessment confirms that the existing medical web chat URL cannot support the required branching\nWhen an alternative approach is proposed\nThen the decision must be documented and approved through the agreed governance process\nAnd existing DVLA and GDS branding requirements must be retained", "script": "", "st": "same"}, {"id": "FR4-N1", "title": "NewCo customer starts a chat while the team is closed", "t": "Scenario: NewCo customer starts a chat while the team is closed\nGiven the customer’s reference matches an active NewCo cohort record\nAnd the owning NewCo team is outside its operating hours\nWhen the web chat routes the customer\nThen the customer must be told the team is closed and when it is open\nAnd the customer must be told they are being connected to another adviser who is not part of their team\nAnd the chat must follow the BAU web chat route", "script": "", "st": "new", "why": "From the Mural. Without saying so, a customer told their team is closed would not understand who they are then talking to."}], "st": "same"}, {"id": "FR4-F2", "t": "Direct controlled communications to the existing web chat journey", "story": "As a NewCo customer receiving an SMS or other controlled communication,\nI want the web chat link to take me to the correct existing journey,\nso that my eligibility can be assessed before I am routed.", "sc": [{"id": "FR4-06", "title": "NewCo customer selects a web chat link in an IVR-triggered SMS", "t": "Scenario: NewCo customer selects a web chat link in an IVR-triggered SMS\nGiven the NewCo customer has received an IVR-triggered SMS containing a web chat link\nWhen the customer selects the link\nThen the customer must be directed to the existing DVLA medical web chat URL\nAnd the customer must enter the NewCo branching journey", "script": "", "st": "tidied", "was": "Scenario: NewCo Customer selects a web chat link in an IVR-triggered SMS\nGiven the NewCo customer has received an IVR-triggered SMS containing a web chat link\nWhen the customer selects the link\nThen the customer must be directed to the existing DVLA medical web chat URL\nAnd the customer must enter the NewCo branching journey", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR4-07", "title": "Communication link does not bypass eligibility checks", "t": "Scenario: Communication link does not bypass eligibility checks\nGiven a communication has been sent to a NewCo customer believed to be eligible\nWhen the customer enters web chat using the supplied link\nThen the customer must still provide their case reference number\nAnd the case reference number must be validated before the customer is routed to the NewCo team", "script": "", "st": "same"}], "st": "same", "note": "Kept for later. On day 1 the phone line encourages web chat but does not send a link (FR8-02)."}, {"id": "FR4-F3", "t": "Capture and validate the case reference number", "story": "As a customer entering the medical web chat journey,\nI want to provide my case reference number,\nso that the service can identify whether my case is eligible for NewCo support.", "sc": [{"id": "FR4-08", "title": "Customer is asked for a case reference number", "t": "Scenario: Customer is asked for a case reference number\nGiven the NewCo customer has entered the web chat journey\nWhen the eligibility stage begins\nThen the web chat must request the customer’s case reference number\nAnd the guidance must explain that it is the 9 digits next to “Our reference” at the top of every letter\nAnd the case reference number must be treated as the unique routing identifier", "script": "", "st": "changed", "was": "Scenario: Customer is asked for a case reference number\nGiven the NewCo customer has entered the web chat journey\nWhen the eligibility stage begins\nThen the web chat must request the customer's case reference number\nAnd the guidance must explain which reference number is required\nAnd the guidance must explain where the customer can find it\nAnd the case reference number must be treated as the unique routing identifier", "was_script": "", "why": "Uses the label on the letters, “Our reference”, the same as the phone line (FR1-17)."}, {"id": "FR4-09", "title": "Customer enters a correctly formatted reference number", "t": "Scenario: Customer enters a correctly formatted reference number\nGiven the customer has been asked for their case reference number\nWhen the customer enters a reference number in the required format\nThen the web chat must check it against the shared NewCo routing table", "script": "", "st": "same"}, {"id": "FR4-10", "title": "Customer enters an incorrectly formatted reference number", "t": "Scenario: Customer enters an incorrectly formatted reference number\nGiven the NewCo customer has been asked for their case reference number\nWhen the customer enters a reference number in an invalid format\nThen the web chat must explain that the reference number is not in the expected format\nAnd the customer must be offered another attempt in accordance with the agreed retry rules\nAnd the customer must not be routed to the NewCo team based on the invalid reference number", "script": "", "st": "same"}, {"id": "FR4-11", "title": "NewCo customer does not provide a case reference number", "t": "Scenario: NewCo customer does not provide a case reference number\nGiven the customer has been asked for their case reference number\nWhen the customer cannot or does not provide it\nThen the customer must not be automatically routed to NewCo\nAnd the customer must remain in or be directed to the appropriate BAU route", "script": "", "st": "tidied", "was": "Scenario: NewCo Customer does not provide a case reference number\nGiven the customer has been asked for their case reference number\nWhen the customer cannot or does not provide it\nThen the customer must not be automatically routed to NewCo\nAnd the customer must remain in or be directed to the appropriate BAU route", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR4-12", "title": "Maximum entry attempts are reached", "t": "Scenario: Maximum entry attempts are reached\nGiven the customer has reached the maximum permitted number of entry attempts\nAnd a validly formatted case reference number has not been captured\nWhen the web chat continues\nThen the customer must remain in or be directed to the appropriate BAU route", "script": "", "st": "same"}], "st": "same"}, {"id": "FR4-F4", "t": "Update and verify the shared routing table daily (Given an agreed person or team owns the daily routing-table update)", "story": "As the operational owner of the NewCo routing data,\nI want the shared routing table to be updated and checked daily,\nso that routing decisions are based on current and accurate information.", "sc": [{"id": "FR4-13", "title": "Daily update completes successfully", "t": "Scenario: Daily update completes successfully\nGiven the current NewCo cohort data is available\nWhen the scheduled daily update is run\nThen new eligible case references must be added\nAnd closed or ineligible case references must be removed or made inactive\nAnd current team ownership must be recorded\nAnd the process must confirm that the update completed successfully.", "script": "", "st": "same"}], "st": "same"}, {"id": "FR4-F5", "t": "Identify routing failures for operational review (Record web chat routing failures)", "story": "As an operational owner,\nI want failed web chat routing attempts to be identifiable,\nso that data issues and recurring routing problems can be investigated and corrected.", "sc": [{"id": "FR4-14", "title": "Record a routing failure", "t": "Scenario: Record a routing failure\nGiven a customer is using the medical web chat\nWhen routing fails because the case reference is \"<failure_reason>\"\nThen the failure must be recorded for operational review\nAnd the record must include the date and time\nAnd the failure category must be recorded as \"<failure_reason>\"\nAnd the outcome or fallback route must be recorded", "script": "", "st": "same"}, {"id": "FR4-15", "title": "Automatic routing fails despite an eligible record", "t": "Scenario: Automatic routing fails despite an eligible record\nGiven the case reference number matches an active record\nWhen the web chat cannot route the customer to the configured NewCo queue\nThen the failure must be recorded as an automatic routing failure\nAnd the intended NewCo queue must be identifiable\nAnd the agreed fallback or manual transfer route must be made available", "script": "", "st": "same"}, {"id": "FR4-16", "title": "Operational user reviews routing failures", "t": "Scenario: Operational user reviews routing failures\nGiven one or more web chat routing failures have been recorded\nWhen an authorised operational user reviews the failure information\nThen the user must be able to distinguish data validation failures from technical routing failures\nAnd the user must be able to identify recurring failure reasons\nAnd access to customer information must follow applicable security and data protection controls", "script": "", "st": "same"}], "st": "same"}, {"id": "FR4-F6", "t": "Display the NewCo cohort indicator in Dynamics", "story": "As a BAU Agent,\nI want to see a clear NewCo indicator on the Dynamics front screen,\nso that I can identify NewCo cases and transfer customers correctly when automatic routing fails.", "sc": [{"id": "FR4-17", "title": "Agent opens a NewCo case", "t": "Scenario: Agent opens a NewCo case\nGiven the case is recorded as active and eligible for NewCo\nWhen an authorised Agent opens the customer or case front screen in Dynamics\nThen a clear NewCo indicator must be displayed\nAnd the indicator must be visible without requiring the Agent to search through case notes\nAnd the owning NewCo team or queue must be shown where available", "script": "", "st": "tidied", "was": "Scenario: Agent opens an NewCo case\nGiven the case is recorded as active and eligible for NewCo\nWhen an authorised Agent opens the customer or case front screen in Dynamics\nThen a clear NewCo indicator must be displayed\nAnd the indicator must be visible without requiring the Agent to search through case notes\nAnd the owning NewCo team or queue must be shown where available", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR4-18", "title": "BAU agent receives a NewCo case", "t": "Scenario: BAU agent receives a NewCo case\nGiven automatic routing has failed\nAnd a BAU agent receives a NewCo customer's call or web chat\nWhen the Agent accesses the relevant Dynamics record\nThen the NewCo indicator must be visible to the BAU agent\nAnd the indicator must provide enough information to identify the correct transfer destination", "script": "", "st": "same"}, {"id": "FR4-19", "title": "NewCo eligibility ends", "t": "Scenario: NewCo eligibility ends\nGiven the case was previously eligible for NewCo\nAnd the case has been closed or made ineligible\nWhen the updated case information is available in Dynamics\nThen the case must no longer display an active NewCo indicator", "script": "", "st": "same"}, {"id": "FR4-20", "title": "Dynamics cannot retrieve current NewCo status", "t": "Scenario: Dynamics cannot retrieve current NewCo status\nGiven the Agent has opened the customer or case front screen\nWhen current NewCo eligibility cannot be retrieved\nThen Dynamics must not present an unconfirmed status as current\nAnd the Agent must be able to follow the agreed fallback process", "script": "", "st": "same"}], "st": "same"}, {"id": "FR4-F7", "t": "Manually transfer a NewCo web customer contact (Given the owning NewCo team is within its operating hours)", "story": "As a BAU agent who receives a NewCo eligible customer,\nI want to transfer the contact to the correct NewCo team,\nso that the customer reaches the appropriate NewCo agent when automatic routing has failed.", "sc": [{"id": "FR4-21", "title": "BAU agent initiates a manual transfer", "t": "Scenario: BAU agent initiates a manual transfer\nGiven the owning NewCo team is within its operating hours\nWhen the BAU agent selects the approved NewCo transfer destination\nThen the chat must be transferred to the correct NewCo team or queue\nAnd the transfer outcome must be visible to the BAU agent", "script": "", "st": "changed", "was": "Scenario: BAU Agent initiates a manual transfer\nWhen the BAU Agent selects the approved NEWCO transfer destination\nThen the chat must be transferred to the correct NewCo team or queue\nAnd the transfer outcome must be visible to the BAU Agent", "was_script": "", "why": "Adds the missing Given: only while the team is open."}, {"id": "FR4-22", "title": "Manual transfer succeeds", "t": "Scenario: Manual transfer succeeds\nGiven the BAU Agent has initiated a manual transfer\nWhen the NewCo team accepts the chat\nThen the NewCo Agent must receive the active chat\nAnd the existing chat transcript must be retained\nAnd customer information already captured must be available to the NewCo Agent\nAnd the customer must not be asked to repeat information that has already been captured and remains valid", "script": "", "st": "tidied", "was": "Scenario: Manual transfer succeeds\nGiven the BAU Agent has initiated a manual transfer\nWhen the NEWCO team accepts the chat\nThen the NEWCO Agent must receive the active chat\nAnd the existing chat transcript must be retained\nAnd customer information already captured must be available to the NEWCO Agent\nAnd the customer must not be asked to repeat information that has already been captured and remains valid", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR4-23", "title": "Manual transfer is waiting to be accepted", "t": "Scenario: Manual transfer is waiting to be accepted\nGiven the BAU Agent has initiated a manual transfer\nAnd the NewCo team has not yet accepted the chat\nWhen the transfer remains pending\nThen the customer must receive appropriate waiting information\nAnd the chat must not be disconnected solely because the transfer is pending\nAnd the transfer must follow the agreed timeout rules", "script": "", "st": "tidied", "was": "Scenario: Manual transfer is waiting to be accepted\nGiven the BAU Agent has initiated a manual transfer\nAnd the NEWCO team has not yet accepted the chat\nWhen the transfer remains pending\nThen the customer must receive appropriate waiting information\nAnd the chat must not be disconnected solely because the transfer is pending\nAnd the transfer must follow the agreed timeout rules", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR4-24", "title": "Manual transfer fails", "t": "Scenario: Manual transfer fails\nGiven the BAU Agent has initiated a manual transfer\nWhen the transfer cannot be completed\nThen the BAU Agent must be informed that the transfer failed\nAnd the chat transcript and captured customer information must remain available\nAnd the Agent must be able to follow the agreed fallback process\nAnd the failure must be recorded for operational review", "script": "", "st": "same"}, {"id": "FR4-25", "title": "NewCo team or queue is unavailable", "t": "Scenario: NewCo team or queue is unavailable\nGiven the customer is confirmed as NewCo eligible \nAnd the correct NewCo queue is unavailable\nWhen the BAU Agent attempts to transfer the chat\nThen the customer must not be transferred to an incorrect queue\nAnd the BAU Agent must follow the agreed unavailable team process", "script": "", "st": "same"}], "st": "changed", "why": "Transfers happen only while the team is open (decided 26 September). Phone calls have the same transfer in FR1-NF1.", "was_t": "Manually transfer an NewCo web customer contact", "was_story": "As a BAU agent who receives a NewCo eligible customer,\nI want to transfer the contact to the correct NewCo team,\nso that the customer reaches the appropriate NewCo agent when automatic routing has failed."}, {"id": "FR4-F8", "t": "Protect customer information during web chat routing", "story": "As a NewCo customer,\nI want my personal information and chat transcript to remain secure during routing and transfer,\nso that my information is only available to authorised agents handling my query.", "sc": [{"id": "FR4-26", "title": "Customer information is transferred to an agent", "t": "Scenario: Customer information is transferred to an agent\nGiven the customer has entered personal and case information\nWhen the chat is routed or transferred to an agent\nThen the information must be passed through an approved secure mechanism\nAnd it must only be available to authorised users", "script": "", "st": "same"}, {"id": "FR4-27", "title": "Chat is transferred between BAU and NewCo", "t": "Scenario: Chat is transferred between BAU and NewCo\nGiven a BAU agent has received a NewCo eligible chat\nWhen the chat is transferred to a NewCo agent\nThen only information relevant to handling the contact must be transferred\nAnd the transcript must remain linked to the correct chat session and customer case", "script": "", "st": "tidied", "was": "Scenario: Chat is transferred between BAU and NewCo\nGiven a BAU agent has received an NewCo eligible chat\nWhen the chat is transferred to an NewCo agent\nThen only information relevant to handling the contact must be transferred\nAnd the transcript must remain linked to the correct chat session and customer case", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR4-28", "title": "Chat session ends before handover", "t": "Scenario: Chat session ends before handover\nGiven the customer has entered mandatory personal information\nWhen the chat session ends before agent handover \nThen the captured information must be retained or deleted in accordance with the agreed retention policy\nAnd it must not be accessible through another customer's chat session", "script": "", "st": "same"}], "st": "same"}]}, {"code": "FR5", "title": "Shared Routing Table Data Management", "features": [{"id": "FR5-F1", "t": "Assess the feasibility of automated routing table updates", "story": "As the NewCo service owner,\nI want Midas or an equivalent reporting function assessed for routing-table automation,\nso that the most reliable and proportionate update method can be selected.", "sc": [{"id": "FR5-01", "title": "Assess Midas as the source of routing data", "t": "Scenario: Assess Midas as the source of routing data\nGiven the routing table requires daily NewCo eligibility data\nWhen the technical assessment of Midas is completed\nThen the assessment must confirm whether Midas can identify eligible case reference numbers\nAnd Midas can identify the owning NewCo team or queue\nAnd Midas can produce the data at the required frequency\nAnd its output can be provided in a format suitable for updating the routing table", "script": "", "st": "same"}, {"id": "FR5-02", "title": "Midas can support the required automation", "t": "Scenario: Midas can support the required automation\nGiven the assessment confirms that Midas can meet the agreed requirements\nWhen the automation approach is approved\nThen Midas must be used to produce or trigger the routing-data extract\nAnd the extract must be made available to the agreed update mechanism", "script": "", "st": "same"}, {"id": "FR5-03", "title": "Midas cannot support all requirements", "t": "Scenario: Midas cannot support all requirements\nGiven the assessment identifies requirements that Midas cannot meet\nWhen the assessment is concluded\nThen the limitations must be documented\nAnd an equivalent reporting function or controlled alternative must be assessed\nAnd the selected approach must be approved through the agreed governance process", "script": "", "st": "same"}, {"id": "FR5-04", "title": "Full automation is not technically feasible", "t": "Scenario: Full automation is not technically feasible\nGiven neither Midas nor an equivalent function can fully automate the update\nWhen an interim update process is designed\nThen the process must include controlled manual steps\nAnd responsibilities for each manual step must be assigned\nAnd validation and completion checks must be included\nAnd the residual operational risks must be documented", "script": "", "st": "same"}], "st": "same"}, {"id": "FR5-F2", "t": "Produce the automated routing data extract", "story": "As the NewCo team responsible for routing data,\nI want Midas or the agreed reporting function to produce a valid extract of NewCo cases,\nso that the shared routing table can be updated accurately.", "sc": [{"id": "FR5-05", "title": "Produce the scheduled extract", "t": "Scenario: Produce the scheduled extract\nGiven the approved reporting function is available\nAnd the daily extract is scheduled\nWhen the scheduled extraction time is reached\nThen the extract must identify all cases eligible for NewCo routing\nAnd it must include the eligible case reference number\nAnd it must include the owning NewCo team or destination queue where required\nAnd it must be produced in the agreed format", "script": "", "st": "same"}, {"id": "FR5-06", "title": "Extract includes a newly eligible NewCo case", "t": "Scenario: Extract includes a newly eligible NewCo case\nGiven a case has entered the NewCo cohort before the agreed data cut-off\nWhen the next daily extract is produced\nThen the case reference number must be included\nAnd the current owning team or destination queue must be included where required", "script": "", "st": "same"}, {"id": "FR5-07", "title": "Extract reflects a case leaving the NewCo cohort", "t": "Scenario: Extract reflects a case leaving the NewCo cohort\nGiven a case has closed or left the NewCo cohort\nAnd the agreed retention period has expired\nWhen the next daily extract is produced\nThen the case reference number must be identified for removal or omitted in accordance with the agreed update method", "script": "", "st": "same"}], "st": "same"}, {"id": "FR5-F3", "t": "Apply routing data to routing table", "story": "As the NewCo Service owner, I want Telecoms/agreed mechanism to apply the daily routing data extract,\nso that IVR and web chat use the same current NewCo routing information", "sc": [{"id": "FR5-08", "title": "Daily Update", "t": "Scenario: Daily Update\nGiven a valid daily routing data extract is available\nAnd the agreed update mechanism can access the shared routing table\nWhen the update process is run\nThen eligible reference number additions must be applied\nAnd the NewCo team/queue ownership changes must be applied\nAnd the updated data must be available to IVR and web chat", "script": "", "st": "same"}], "st": "same"}, {"id": "FR5-F4", "t": "Add eligible NewCo cases to routing table", "story": "As the NewCo Service owner,\nI want eligible case references added to the routing table,\nso that NewCo customers entering the NewCo cohort are routed to the correct team", "sc": [{"id": "FR5-09", "title": "Add a newly eligible case", "t": "Scenario: Add a newly eligible case\nGiven a case has entered the NewCo cohort\nAnd the case reference number has passed validation\nWhen the next daily update completes\nThen the case reference number must be active in the shared routing table\nAnd it must be available to both IVR and web chat\nAnd the correct owning team or destination queue must be recorded where required", "script": "", "st": "same"}, {"id": "FR5-10", "title": "Attempt to add an existing active reference number", "t": "Scenario: Attempt to add an existing active reference number\nGiven the case reference number already has an active routing record\nWhen the same reference number is included as a new addition\nThen a duplicate active record must not be created\nAnd any valid ownership or eligibility change must be processed according to the agreed update rules", "script": "", "st": "same"}], "st": "same"}, {"id": "FR5-F5", "t": "Remove cases leaving the NewCo cohort", "story": "As the NewCo Service owner,\nI want case references removed after the agreed retention period,\nso that closed or ineligible cases are not incorrectly routed to the NewCo team", "sc": [{"id": "FR5-11", "title": "Closed case reaches the end of its retention period.", "t": "Scenario: Closed case reaches the end of its retention period.\nGiven a NewCo case has closed \nAnd the agreed retention period has expired\nWhen the next daily update is complete\nThen the reference number must be removed or made inactive for the NewCo routing\nAnd IVR and web chat must no longer route the case to NewCo", "script": "", "st": "same"}], "st": "same"}]}, {"code": "FR6", "title": "CSAT Requirements for the NewCo Queue", "features": [{"id": "FR6-F1", "t": "Provide a separate CSAT survey for NewCo customer\n(CSAT Questions can be found here: https://gds-digital-transformation.atlassian.net/wiki/spaces/ACE/pages/185205011/CSAT+Questions+refresh)", "story": "As a NewCo service owner,\nI want customers handled through the NewCo queue to receive a separate CSAT survey,\nso that NewCo customer outcomes can be measured independently from BAU performance.", "sc": [{"id": "FR6-01", "title": "Customer completes a contact through the NewCo queue", "t": "Scenario: Customer completes a contact through the NewCo queue\nGiven the customer's call has been handled through the NewCo queue\nAnd the call reaches the agreed survey trigger point\nWhen the customer is invited to complete a CSAT survey\nThen the customer must be presented with the NewCo CSAT survey\nAnd the response must be identified as a NewCo response\nAnd the response must not be recorded as a BAU survey response", "script": "", "st": "tidied", "was": "Scenario: Customer completes a contact through the NewCo queue\nGiven the customer's call has been handled through the NewCo queue\nAnd the call reaches the agreed survey trigger point\nWhen the customer is invited to complete a CSAT survey\nThen the customer must be presented with the NewCo CSAT survey\nAnd the response must be identified as an NewCo response\nAnd the response must not be recorded as a BAU survey response", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR6-02", "title": "Customer declines the NewCo survey", "t": "Scenario: Customer declines the NewCo survey\nGiven a NewCo customer has been invited to complete the survey\nWhen the customer declines or exits without responding\nThen the interaction must not be recorded as a completed survey\nAnd the invitation or non-completion outcome must be captured where technically available", "script": "", "st": "tidied", "was": "Scenario: Customer declines the NEWCO survey\nGiven an NEWCO customer has been invited to complete the survey\nWhen the customer declines or exits without responding\nThen the interaction must not be recorded as a completed survey\nAnd the invitation or non-completion outcome must be captured where technically available", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR6-03", "title": "NewCo customer completes only part of the survey", "t": "Scenario: NewCo customer completes only part of the survey\nGiven a NewCo customer has started the survey\nWhen the customer exits before answering all questions\nThen each valid response already submitted must be retained according to the agreed survey rules\nAnd the survey must be identifiable as partially completed", "script": "", "st": "tidied", "was": "Scenario: NEWCO customer completes only part of the survey\nGiven an NEWCO customer has started the survey\nWhen the customer exits before answering all questions\nThen each valid response already submitted must be retained according to the agreed survey rules\nAnd the survey must be identifiable as partially completed", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}], "st": "tidied", "was_t": "Provide a separate CSAT survey for NewCo customer\n(CSAT Questions can be found here: https://gds-digital-transformation.atlassian.net/wiki/spaces/ACE/pages/185205011/CSAT+Questions+refresh)", "was_story": "As an NewCo service owner,\nI want customers handled through the NewCo queue to receive a separate CSAT survey,\nso that NewCo customer outcomes can be measured independently from BAU performance."}, {"id": "FR6-F2", "t": "Configure the NewCo CSAT journey", "story": "As the Telecoms team,\nI want the approved NewCo survey questions and response scales configured in the telephony journey,\nso that eligible NewCo customers can provide feedback after their call.", "sc": [{"id": "FR6-04", "title": "Configure the NewCo survey", "t": "Scenario: Configure the NewCo survey \nGiven the NewCo team has supplied the approved survey questions And the approved response scales\nWhen Telecoms configures the NewCo CSAT journey\nThen the survey must contain the approved NewCo questions\nAnd the questions must appear in the approved order\nAnd each question must use the approved response scale\nAnd the shared benchmark question must match the BAU version", "script": "", "st": "same"}, {"id": "FR6-05", "title": "NewCo survey configuration is tested", "t": "Scenario: NewCo survey configuration is tested\nGiven Telecoms has configured the NewCo CSAT journey\nWhen testing is completed\nThen each question must play or display correctly\nAnd each response option must be captured correctly\nAnd the response must be assigned to the correct MI counter\nAnd NewCo responses must remain separate from BAU responses", "script": "", "st": "same"}], "st": "same"}, {"id": "FR6-F3", "t": "Configure NewCo CSAT MI counters", "story": "As a data analyst,\nI want dedicated MI counters for the NewCo survey,\nso that response volumes and outcomes can be reported separately and accurately.", "sc": [{"id": "FR6-06", "title": "Configure separate NewCo counters", "t": "Scenario: Configure separate NewCo counters\nGiven the final NewCo questions and response scales have been approved\nWhen Telecoms configures the MI counters\nThen each NewCo survey question must have an associated response counter\nAnd NewCo counters must be distinguishable from BAU counters\nAnd incomplete, invalid or unanswered responses must be identifiable where technically possible", "script": "", "st": "same"}, {"id": "FR6-07", "title": "Reconcile survey responses and counters", "t": "Scenario: Reconcile survey responses and counters\nGiven NewCo CSAT responses have been collected\nWhen the reporting data is reconciled\nThen the number of recorded responses must align with the relevant MI counters\nAnd any discrepancy must be identifiable for investigation", "script": "", "st": "same"}], "st": "same"}, {"id": "FR6-NF1", "t": "Record the routing outcome of every NewCo contact", "story": "As the NewCo service owner,\nI want to know how every NewCo customer’s contact was routed,\nso that I can see whether the routing works and whether it sends anyone to the wrong place.", "st": "new", "why": "Agreed on 26 September, and asked for by the reporting group on 28 September. CSAT only reaches contacts the NewCo queue handled, so it can’t show this on its own.", "sc": [{"id": "FR6-N1", "title": "Record the routing outcome", "t": "Scenario: Record the routing outcome\nGiven a call or web chat has been identified as a NewCo contact\nWhen the contact ends\nThen the outcome must be recorded: NewCo agent, NewCo callback, message for the team, BAU adviser by choice, transferred from BAU, handled by BAU, or abandoned in the NewCo queue\nAnd the menu option chosen must be recorded: existing application or new condition", "script": "", "st": "new"}, {"id": "FR6-N2", "title": "Spot contacts that reached BAU by mistake", "t": "Scenario: Spot contacts that reached BAU by mistake\nGiven a BAU agent has handled a contact about a case with the NewCo indicator\nWhen the contact ends\nThen it must be recorded as a NewCo contact handled by BAU\nAnd the reason must be recorded: no reference given, reference not recognised, team closed, routing table not yet updated, or technical failure", "script": "", "st": "new"}]}]}, {"code": "FR7", "title": "Training & Communications - Case Reference Emphasis", "features": [{"id": "FR7-F1", "t": "Include case reference guidance in Agent training", "story": "As a NewCo agent,\nI want clear training on when and how to provide the case reference number,\nso that customers can use it to access the correct IVR route during future calls", "sc": [{"id": "FR7-01", "title": "Agent completes first-notification training", "t": "Scenario: Agent completes first-notification training\nGiven an Agent will handle first-notification calls\nWhen the Agent completes the required training\nThen the training must explain why the case reference number is required for IVR routing\nAnd it must instruct the Agent to give the customer their case reference number\nAnd it must instruct the Agent to ask the customer to keep the reference number for future contact\nAnd it must instruct the Agent to have the customer use the number when calling NewCo Team", "script": "", "st": "same"}], "st": "same"}, {"id": "FR7-F2", "t": "Give NewCo customers their reference number during first notification", "story": "As a NewCo customer making a first notification,\nI want to be given my case reference number and understand how to use it,\nso that future calls can be routed to the correct team.", "sc": [{"id": "FR7-02", "title": "Case reference number is available", "t": "Scenario: Case reference number is available\nGiven the customer is completing a first-notification call\nAnd a case reference number is available\nWhen the Agent reaches the end of the relevant notification process\nThen the Agent must provide the customer with the case reference number\nAnd tell the customer to keep it for future contact\nAnd tell the customer to have it ready whenever they call DVLA\nAnd explain that providing it will help the system route the call correctly\nAnd explain that from the next working day, it will put them through to the team looking after their case", "script": "", "st": "changed", "was": "Scenario: Case reference number is available\nGiven the customer is completing a first-notification call\nAnd a case reference number is available\nWhen the Agent reaches the end of the relevant notification process\nThen the Agent must provide the customer with the case reference number\nAnd tell the customer to keep it for future contact\nAnd tell the customer to have it ready whenever they call DVLA\nAnd explain that providing it will help the system route the call correctly", "was_script": "", "why": "The routing table updates once a day, so a reference given today routes to BAU until the next update."}], "st": "same"}, {"id": "FR7-F3", "t": "Display the case reference number clearly in letters", "story": "As a NewCo customer receiving a letter about my NewCo Cohort case,\nI want my case reference number to be clearly displayed,\nso that I can find and use it when I contact NewCo team.", "sc": [{"id": "FR7-03", "title": "Generate a standard letter for a NewCo customer", "t": "Scenario: Generate a standard letter for a NewCo customer\nGiven an approved standard letter is being produced for a NewCo case\nWhen the letter is generated\nThen the correct case reference number must be displayed\nAnd it must appear in a clear and prominent location\nAnd it must be labelled “Our reference”, as letters are today", "script": "", "st": "changed", "was": "Scenario: Generate a standard letter for an NewCo customer\nGiven an approved standard letter is being produced for an NewCo case\nWhen the letter is generated\nThen the correct case reference number must be displayed\nAnd it must appear in a clear and prominent location\nAnd it must be labelled as the customer's case reference number", "was_script": "", "why": "Letters already label it “Our reference”, and the phone line and web chat now ask for it by that name."}], "st": "same"}, {"id": "FR7-F4", "t": "Display the case reference number in standard emails", "story": "As a NewCo customer receiving an email about my DM case,\nI want my case reference number to be clearly displayed,\nso that I can easily use it when I call the NewCo team", "sc": [{"id": "FR7-04", "title": "Generate a standard email for a NewCo customer", "t": "Scenario: Generate a standard email for a NewCo customer\nGiven an approved standard email is being produced for a NewCo case\nWhen the email is generated\nThen the correct case reference number must be displayed prominently\nAnd it must be labelled “Our reference”, the same as letters", "script": "", "st": "changed", "was": "Scenario: Generate a standard email for an NewCo customer\nGiven an approved standard email is being produced for an NewCo case\nWhen the email is generated\nThen the correct case reference number must be displayed prominently\nAnd it must be labelled as the customer's case reference number", "was_script": "", "why": "One label everywhere, as FR7-05 asks."}], "st": "same"}, {"id": "FR7-F5", "t": "Maintain consistent customer guidance", "story": "As the NewCo service owner,\nI want training, scripts, letters and emails to use consistent case-reference guidance,\nso that customers receive the same instruction across all contact points.", "sc": [{"id": "FR7-05", "title": "Review case-reference messaging", "t": "Scenario: Review case-reference messaging\nGiven approved case-reference wording has been agreed\nWhen the communication type is reviewed\nThen it must explain that the customer should have their case reference number ready when calling DVLA\nAnd it must explain that quoting the number will help route the call correctly", "script": "", "st": "same"}], "st": "same"}]}, {"code": "FR8", "title": "Existing Application Telephony Triage, Deflection and Queue Management", "features": [{"id": "FR8-F1", "t": "Inform callers about waiting times and web chat", "story": "As a customer contacting Drivers’ Medical by telephone,\nI want to understand the expected waiting time and available digital options,\nso that I can choose the quickest suitable way to get help.", "sc": [{"id": "FR8-01", "title": "Customer enters the telephone journey", "t": "Scenario: Customer enters the telephone journey\nGiven the customer has called the Drivers' Medical telephone service\nWhen the call connects to the IVR\nThen the customer must be informed that telephone waiting times may be longer\nAnd the customer must be told that web chat may provide a faster response\nAnd the message must be played before the customer enters the main queue\nAnd the message must tell the customer where to find web chat", "script": "", "st": "changed", "was": "Scenario: Customer enters the telephone journey\nGiven the customer has called the Drivers' Medical telephone service\nWhen the call connects to the IVR\nThen the customer must be informed that telephone waiting times may be longer\nAnd the customer must be told that web chat may provide a faster response\nAnd the message must be played before the customer enters the main queue", "was_script": "", "why": "As today: one of the first things the phone line says is that web chat is quicker, and where to find it."}, {"id": "FR8-02", "title": "Web chat is available", "t": "Scenario: Web chat is available\nGiven web chat is currently available\nWhen the waiting time and web chat message plays\nThen the customer must be encouraged to use web chat because it is quicker\nAnd the customer must be told where to find web chat\nAnd the customer must not be asked to choose between web chat and the phone", "script": "", "st": "changed", "was": "Scenario: Web chat is available\nGiven the customer has been informed about web chat\nAnd web chat is currently available\nWhen the customer has waited for over 2 min\nAnd the customer chooses to use web chat\nThen the system must offer the approved method for accessing web chat", "was_script": "", "why": "As today, callers are encouraged to use web chat and told where to find it. They are not asked to choose, and no link is sent at this point. The “waited for over 2 min” condition is removed: the message plays at the start of the call."}, {"id": "FR8-03", "title": "Web chat is unavailable", "t": "Scenario: Web chat is unavailable\nGiven web chat is unavailable\nWhen the customer enters the telephone journey\nThen the system must not describe web chat as immediately available\nAnd the customer must be allowed to continue through the telephone journey", "script": "", "st": "same"}, {"id": "FR8-04", "title": "Customer continues by telephone", "t": "Scenario: Customer continues by telephone\nGiven the customer has heard the waiting time and web chat message\nWhen the message ends\nThen the customer must continue to the language and contact reason questions", "script": "", "st": "changed", "was": "Scenario: Customer chooses to continue by telephone\nGiven the customer has heard the waiting time and web chat message\nWhen the customer does not select the web chat option\nThen the customer must continue to the language and contact reason questions", "was_script": "", "why": "There is no web chat option to select (FR8-02). Callers who stay on the line carry on."}], "st": "same"}, {"id": "FR8-F2", "t": "Route Welsh language callers on Day One", "story": "As a Welsh-speaking customer,\nI want to be directed to a service capable of supporting me in Welsh,\nso that I can receive an appropriate service even though NewCo does not support the Welsh journey on Day One.", "sc": [{"id": "FR8-05", "title": "Customer selects the Welsh-language journey", "t": "Scenario: Customer selects the Welsh-language journey\nGiven NewCo does not support Welsh-language calls on Day One\nWhen the customer says “Welsh”, or presses the agreed key (FR1-N11)\nThen the call must not be routed to NewCo\nAnd the customer must be routed to the approved Welsh-language BAU journey\nAnd the customer must not be required to complete the NewCo qualification questions", "script": "", "st": "changed", "was": "Scenario: Customer selects the Welsh-language journey\nGiven NewCo does not support Welsh-language calls on Day One\nWhen the customer selects the Welsh-language option\nThen the call must not be routed to NewCo\nAnd the customer must be routed to the approved Welsh-language BAU journey\nAnd the customer must not be required to complete the NewCo qualification questions", "was_script": "", "why": "As today, callers say “Welsh” out loud. Pressing a key instead is new (FR1-N11)."}, {"id": "FR8-06", "title": "Customer does not select the Welsh-language journey", "t": "Scenario: Customer does not select the Welsh-language journey\nGiven the customer has entered the language selection stage\nWhen the customer does not say “Welsh” and goes on to say what the call is about\nThen the customer must proceed to the NewCo contact-reason qualification stage", "script": "", "st": "changed", "was": "Scenario: Customer does not select the Welsh-language journey\nGiven the customer has entered the language selection stage\nWhen the customer continues in English\nThen the customer must proceed to the NewCo contact-reason qualification stage", "was_script": "", "why": "As today, callers who don’t say “Welsh” go straight on to say what the call is about."}, {"id": "FR8-07", "title": "Welsh-language destination is unavailable", "t": "Scenario: Welsh-language destination is unavailable\nGiven the customer has selected the Welsh-language journey\nAnd the approved Welsh-language destination is unavailable\nWhen the system attempts to transfer the call\nThen the customer must hear an approved service-unavailable message\nAnd the customer must be given the agreed alternative contact instructions\nAnd the call must not be routed to an English-only NewCo agent without the customer's agreement", "script": "", "st": "same"}], "st": "same"}, {"id": "FR8-F3", "t": "Capture the customer’s reason for calling", "story": "As a customer contacting Drivers’ Medical,\nI want to state the reason for my call using speech or keypad input,\nso that I can be directed to the appropriate service.", "sc": [{"id": "FR8-08", "title": "Customer says they are calling about an existing application", "t": "Scenario: Customer says they are calling about an existing application\nGiven the customer has reached the contact reason question\nWhen the customer says a recognised phrase relating to an existing application\nThen the system must classify the contact as an existing-application enquiry\nAnd the customer must proceed to the licence type question", "script": "", "st": "same"}, {"id": "FR8-09", "title": "Customer selects an existing application using the keypad", "t": "Scenario: Customer selects an existing application using the keypad\nGiven the customer has reached the contact reason question\nWhen the customer presses 1\nThen the system must classify the contact as an existing-application enquiry\nAnd the customer must proceed to the licence-type question", "script": "", "st": "same", "note": "Answering on the keypad is new: the BAU phone line works by speech only today (FR1-NF3)."}, {"id": "FR8-10", "title": "Customer says they want to report a new medical condition", "t": "Scenario: Customer says they want to report a new medical condition\nGiven the customer has reached the contact reason question\nWhen the customer says a recognised phrase relating to a new condition\nThen the system must classify the contact as a new condition notification\nAnd the customer must be routed to the approved new condition journey", "script": "", "st": "same"}, {"id": "FR8-11", "title": "Customer selects a new condition using the keypad", "t": "Scenario: Customer selects a new condition using the keypad\nGiven the customer has reached the contact reason question\nWhen the customer presses 2\nThen the system must classify the contact as a new condition notification\nAnd the customer must be routed to the approved new condition journey", "script": "", "st": "same", "note": "Answering on the keypad is new: the BAU phone line works by speech only today (FR1-NF3)."}, {"id": "FR8-12", "title": "Speech is not recognised", "t": "Scenario: Speech is not recognised\nGiven the customer has been asked to describe the reason for the call\nWhen the system cannot recognise the customer's response\nThen the system must repeat the available options\nAnd the customer must be allowed to respond using the keypad", "script": "", "st": "same", "note": "Answering on the keypad is new: the BAU phone line works by speech only today (FR1-NF3)."}, {"id": "FR8-13", "title": "No valid response is received", "t": "Scenario: No valid response is received\nGiven the system has made the agreed number of attempts\nWhen the customer does not provide a recognised speech or keypad response\nThen the call must continue through the standard BAU route\nAnd the call must not be incorrectly classified as NewCo eligible", "script": "", "st": "changed", "was": "Scenario: No valid response is received\nGiven the system has made the agreed number of attempts\nWhen the customer does not provide a recognised speech or keypad response\nThen the customer must follow the agreed fallback route\nAnd the call must not be incorrectly classified as NewCo eligible", "was_script": "", "why": "Names the fallback route, the same as every other fallback in FR1."}], "st": "same"}, {"id": "FR8-F4", "t": "Identify the licence type for an existing application", "story": "As the NewCo service,\nI want to identify the licence type associated with an existing application,\nso that only customers within the Day One NewCo scope enter the NewCo journey.", "sc": [{"id": "FR8-14", "title": "Customer has a lorry or bus application", "t": "Scenario: Customer has a lorry or bus application\nGiven the contact has been classified as an existing-application enquiry\nWhen the customer identifies the application as a lorry or bus licence\nThen the application must be classified as outside the NewCo Day One scope\nAnd the call must be routed to the approved BAU journey\nAnd the customer must not enter the NewCo queue", "script": "", "st": "changed", "was": "Scenario: Customer has a lorry or bus application\nWhen the customer identifies the application as licence type\nThen the application must be classified as outside the NewCo Day One scope\nAnd the call must be routed to the approved BAU journey\nAnd the customer must not enter the NewCo queue", "was_script": "", "why": "“Identifies the application as licence type” was missing words. Adds the Given."}, {"id": "FR8-15", "title": "Customer has another type of vehicle application", "t": "Scenario: Customer has another type of vehicle application\nGiven the contact has been classified as an existing-application enquiry\nWhen the customer identifies the application as another supported vehicle type\nThen the application must be classified as potentially eligible for NewCo\nAnd the customer must proceed to the NewCo telephony information stage", "script": "", "st": "changed", "was": "Scenario: Customer has another type of vehicle application\nWhen the customer identifies the application as another supported vehicle type\nThen the application must be classified as potentially eligible for NewCo\nAnd the customer must proceed to the NewCo telephony information stage", "was_script": "", "why": "Adds the Given, to match FR8-14."}, {"id": "FR8-16", "title": "Qualified customer reaches the information message", "t": "Scenario: Qualified customer reaches the information message\nGiven the customer has passed the NewCo qualification questions\nWhen the telephony-information message is played\nThen the customer must be told that an adviser may be unable to provide further information where no case update is available\nAnd the wording must be clear and approved\nAnd the message must not suggest that the customer's case has been reviewed when it has not", "script": "", "st": "tidied", "was": "Scenario: Qualified customer reaches the information message\nGiven the customer has passed the NewCo qualification questions\nWhen the telephony-information message is played\nThen the customer must be told that an advisor may be unable to provide further information where no case update is available\nAnd the wording must be clear and approved\nAnd the message must not suggest that the customer's case has been reviewed when it has not", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR8-17", "title": "Customer continues after hearing the message", "t": "Scenario: Customer continues after hearing the message\nGiven the customer has heard the application-update message\nWhen the customer chooses to continue\nThen the customer must be presented with the available self-service, callback and queue options", "script": "", "st": "same"}], "st": "changed", "why": "The feature had no title.", "was_t": "", "was_story": "As the NewCo service,\nI want to identify the licence type associated with an existing application,\nso that only customers within the Day One NewCo scope enter the NewCo journey."}, {"id": "FR8-F5", "t": "Offer an SMS link to an online service", "story": "As a customer waiting for an application update,\nI want to receive a link to the relevant online service,\nso that I may be able to get help without waiting on the telephone.", "sc": [{"id": "FR8-18", "title": "Customer requests the SMS link", "t": "Scenario: Customer requests the SMS link\nGiven the customer is eligible to receive the online-service link\nWhen the customer selects the SMS option\nThen the system must obtain or confirm the customer's mobile telephone number\nAnd send an SMS containing the approved link\nAnd confirm whether the SMS request was successful\nAnd end the call after the confirmation message", "script": "", "st": "same"}], "st": "same"}, {"id": "FR8-F6", "t": "Provide queue and privacy information", "story": "As a customer entering the telephone queue,\nI want to understand how the call and my information will be handled,\nso that I can make an informed choice about continuing.", "sc": [{"id": "FR8-19", "title": "Customer chooses a telephone service option", "t": "Scenario: Customer chooses a telephone service option\nGiven the customer is about to join a queue or request a callback\nWhen the standard information message is played\nThen the customer must hear the approved privacy information\nAnd any applicable call recording information\nAnd relevant queue or waiting-time information\nAnd any required information about the use of their personal data", "script": "", "st": "same"}], "st": "same"}, {"id": "FR8-F7", "t": "The callback service", "story": "As a customer,\nI want to be offered only the contact options that are currently available,\nso that I do not request a callback that cannot be provided.", "sc": [{"id": "FR8-20", "title": "Customer calls while callbacks are available", "t": "Scenario: Customer calls while callbacks are available\nGiven the current date and time fall within the configured callback operating period\nWhen the customer reaches the contact-options menu\nThen the callback option must be offered\nAnd the customer must also be offered the available queue and digital options", "script": "", "st": "same"}, {"id": "FR8-21", "title": "Customer calls outside callback operating hours", "t": "Scenario: Customer calls outside callback operating hours\nGiven the current date or time falls outside the configured callback operating period\nWhen the customer reaches the contact-options menu\nThen the callback option must not be offered as available\nAnd the customer must hear the approved out-of-hours information\nAnd the customer must be offered the applicable alternative options", "script": "", "st": "same"}, {"id": "FR8-22", "title": "Callback capacity has been reached", "t": "Scenario: Callback capacity has been reached\nGiven the customer is calling within the configured operating period\nAnd the callback service has reached its agreed capacity\nWhen the contact-options menu is presented\nThen the callback option must be treated as unavailable\nAnd the customer must be offered the remaining available options", "script": "", "st": "same"}, {"id": "FR8-23", "title": "Operating hours are changed", "t": "Scenario: Operating hours are changed\nGiven authorised operating hours have been updated\nWhen the revised configuration becomes effective\nThen the time of day function must apply the new hours\nAnd the change must not require redesign of the core IVR journey", "script": "", "st": "same"}, {"id": "FR8-N5", "title": "Callbacks are offered while the wait is long", "t": "Scenario: Callbacks are offered while the wait is long\nGiven the estimated wait is over the threshold set by demand management\nAnd demand management shows there is enough resource for a callback\nWhen the customer reaches the contact-options menu\nThen the callback option must be offered\nAnd when the estimated wait is short, no options must be offered and the call must go straight to the queue", "script": "", "st": "new", "why": "Clarifies when callbacks are available. As today, a caller who rings when the queue is short hears no callback or web chat options: the phone just rings."}], "st": "same"}, {"id": "FR8-F8", "t": "Capture a case reference before joining the queue", "story": "As a customer who wants to speak to an adviser,\nI want to provide my case reference number,\nso that the system can identify my case and route me to the appropriate queue.", "sc": [{"id": "FR8-24", "title": "Customer provides a valid NewCo case reference", "t": "Scenario: Customer provides a valid NewCo case reference\nGiven the customer has chosen to remain on the telephone\nWhen the customer says a valid case reference number\nAnd the number matches an eligible record in the approved routing data\nThen the customer must be added to the appropriate NewCo queue\nAnd the captured reference must be associated with the contact where technically possible", "script": "", "st": "same"}, {"id": "FR8-25", "title": "Customer provides a valid non-NewCo case reference", "t": "Scenario: Customer provides a valid non-NewCo case reference\nGiven the customer has chosen to remain on the telephone\nWhen the customer provides a valid reference number\nAnd the number does not identify an eligible NewCo case\nThen the customer must follow the approved BAU route\nAnd the customer must not be added to the NewCo queue", "script": "", "st": "changed", "was": "Scenario: Customer provides a valid non-NewCo case reference\nGiven the customer has chosen to remain on the telephone\nWhen the customer provides a valid reference number\nAnd the number does not identify an eligible NewCo case\nThen the customer must follow the approved BAU routeAnd the customer must not be added to the NewCo queue", "was_script": "", "why": "Typo: a missing line break."}, {"id": "FR8-26", "title": "Customer does not have a reference number", "t": "Scenario: Customer does not have a reference number\nGiven the customer wants to remain on the telephone\nWhen the customer indicates that they do not have a case reference number\nThen the system must provide guidance on where the number can be found\nAnd offer the agreed BAU or assisted-service fallback route", "script": "", "st": "same"}], "st": "tidied", "was_t": "Capture a case reference before joining the queue", "was_story": "As a customer who wants to speak to an advisor,\nI want to provide my case reference number,\nso that the system can identify my case and route me to the appropriate queue."}, {"id": "FR8-F9", "t": "Request a callback", "story": "As a customer who does not want to wait on the telephone,\nI want to request a callback,\nso that I can end the call without losing my opportunity to speak to an adviser.", "sc": [{"id": "FR8-27", "title": "Customer selects the callback option", "t": "Scenario: Customer selects the callback option\nGiven the callback service is available\nAnd the customer has reached the contact options menu\nWhen the customer presses 1\nThen the system must start the callback-capture journey\nAnd ask for the required telephone and case-reference details", "script": "", "st": "same"}, {"id": "FR8-28", "title": "Customer completes the callback request", "t": "Scenario: Customer completes the callback request\nGiven the system has captured and validated the required callback information\nWhen the customer confirms the details\nThen the callback request must be created\nAnd the customer must hear confirmation that the request has been received\nAnd the call must end after the confirmation message\nAnd the confirmation must say that the customer keeps their place in the queue and will be called back when they reach the front", "script": "", "st": "changed", "was": "Scenario: Customer completes the callback request\nGiven the system has captured and validated the required callback information\nWhen the customer confirms the details\nThen the callback request must be created\nAnd the customer must hear confirmation that the request has been received\nAnd the call must end after the confirmation message", "was_script": "", "why": "Makes clear how a callback differs from a message for the team: the customer keeps their place and is called back soon, not the next working day."}], "st": "tidied", "was_t": "Request a callback", "was_story": "As a customer who does not want to wait on the telephone,\nI want to request a callback,\nso that I can end the call without losing my opportunity to speak to an advisor."}, {"id": "FR8-F10", "t": "Capture and validate callback contact details", "story": "As a customer who has asked for a callback,\nI want my confirmed telephone number and case reference recorded,\nso that I am called back on the right number and put through to the team looking after my case.", "sc": [{"id": "FR8-29", "title": "Capture the callback telephone number", "t": "Scenario: Capture the callback telephone number\nGiven the customer has requested a callback\nWhen the system captures a telephone number\nThen the number must be checked against the agreed format rules\nAnd it must be read back or otherwise presented to the customer for confirmation", "script": "", "st": "same"}, {"id": "FR8-30", "title": "Capture the case reference number", "t": "Scenario: Capture the case reference number\nGiven the customer's telephone number has been confirmed\nWhen the customer provides a case reference number\nThen the reference must be checked against the approved routing data\nAnd the validation result must be used to determine the callback destination", "script": "", "st": "same"}, {"id": "FR8-31", "title": "Customer provides invalid details", "t": "Scenario: Customer provides invalid details\nGiven the customer has entered a telephone number or case reference\nWhen the information fails validation\nThen the system must explain which information needs to be entered again\nAnd allow the agreed number of retry attempts", "script": "", "st": "same"}], "st": "changed", "why": "Callbacks are automatic: the caller keeps their place in the queue and the phone line calls them back when it’s their turn. The team calls back voicemails, not callbacks.", "was_t": "Capture and validate callback contact details", "was_story": "As a NewCo agent,\nI want the customer’s confirmed telephone number and case reference recorded,\nso that I can contact the correct customer and access the relevant case."}, {"id": "FR8-F11", "t": "Provide out of hours NewCo options", "story": "As a customer calling when the NewCo team is closed,\nI want clear alternative contact options,\nso that I can leave a message or continue to BAU where appropriate.", "sc": [{"id": "FR8-32", "title": "Present the out of hours menu", "t": "Scenario: Present the out of hours menu\nGiven the customer has qualified for the NewCo journey\nAnd the NewCo team is outside its configured operating hours\nWhen the customer reaches the NewCo availability check\nThen the customer must be informed that the NewCo team is closed\nAnd the customer must be offered the option to press 1 to leave a message\nAnd the customer must be offered the option to press 2 to return to the BAU queue", "script": "", "st": "merged", "was": "Scenario: Present the out of hours menu\nGiven the customer has qualified for the NewCo journey\nAnd the NewCo team is outside its configured operating hours\nWhen the customer reaches the NewCo availability check\nThen the customer must be informed that the NewCo team is closed\nAnd the customer must be offered the option to press 1 to leave a message\nAnd the customer must be offered the option to press 2 to return to the BAU queue", "was_script": "", "why": "Merged into FR2-01.", "into": "FR2-01"}, {"id": "FR8-33", "title": "Customer chooses to leave a message", "t": "Scenario: Customer chooses to leave a message\nWhen the customer presses 1\nThen the customer must enter the approved voicemail journey\nAnd the system must explain what information should be included\nAnd the message must be delivered to the approved NewCo mailbox or work queue", "script": "", "st": "merged", "was": "Scenario: Customer chooses to leave a message\nWhen the customer presses 1\nThen the customer must enter the approved voicemail journey\nAnd the system must explain what information should be included\nAnd the message must be delivered to the approved NewCo mailbox or work queue", "was_script": "", "why": "Merged into FR2-08. Delivery to the mailbox is covered by FR2-13 to FR2-17.", "into": "FR2-08"}, {"id": "FR8-34", "title": "Voicemail service is unavailable", "t": "Scenario: Voicemail service is unavailable\nGiven the customer has selected the option to leave a message\nWhen the voicemail service cannot accept the message\nThen the customer must be informed\nAnd the customer must be offered the BAU route or approved alternative instructions\nAnd the service failure must be recorded", "script": "", "st": "merged", "was": "Scenario: Voicemail service is unavailable\nGiven the customer has selected the option to leave a message\nWhen the voicemail service cannot accept the message\nThen the customer must be informed\nAnd the customer must be offered the BAU route or approved alternative instructions\nAnd the service failure must be recorded", "was_script": "", "why": "Merged into FR2-12.", "into": "FR2-12"}], "st": "removed", "why": "Moved into FR2, which now covers the team being closed and voicemail."}, {"id": "FR8-NF2", "t": "Leave a voicemail when a callback isn’t answered", "story": "As a NewCo agent calling a customer back,\nI want to leave them a voicemail if they don’t answer,\nso that they know DVLA tried to reach them and how to get back in touch.", "st": "new", "why": "BAU advisers do this today when an automatic callback isn’t answered. NewCo agents need to do the same, for automatic callbacks and when calling back a message for the team.", "sc": [{"id": "FR8-N6", "title": "The customer doesn’t answer a callback", "t": "Scenario: The customer doesn’t answer a callback\nGiven a NewCo agent is calling a customer back, from the queue or from a message for the team\nAnd the customer doesn’t answer\nWhen the call goes to the customer’s voicemail\nThen the agent must be able to leave a message\nAnd the message must give the agent’s first name, say they are calling from DVLA and ask the customer to call back\nAnd the message must not include any details of the customer’s case", "script": "", "st": "new"}, {"id": "FR8-N7", "title": "Record the missed callback", "t": "Scenario: Record the missed callback\nGiven the customer didn’t answer the callback\nWhen the agent finishes the attempt\nThen the attempt, and whether a voicemail was left, must be recorded on the case", "script": "", "st": "new"}]}, {"id": "FR8-NF1", "t": "Offer a callback in the NewCo queue", "story": "As a NewCo customer waiting for my team,\nI want to ask them to call me back,\nso that I don’t have to stay on hold.", "st": "new", "why": "Agreed on 26 September. The developers confirmed on 28 September that demand management runs before callbacks, so a callback is only offered when there is enough resource. FR8 covers callbacks from the options menu, before the reference is known. This covers the offer once the caller is in the NewCo queue, as the callback lane in the Mural shows.", "sc": [{"id": "FR8-N1", "title": "Customer asks for a callback while the team is open", "t": "Scenario: Customer asks for a callback while the team is open\nGiven the customer’s reference matches an active NewCo cohort record\nAnd the owning team is within its operating hours\nWhen the customer asks for a callback\nThen the callback must keep the customer’s place in the NewCo queue\nAnd the customer must be called back automatically when it’s their turn\nAnd the case reference must not be asked for again if it was given earlier in the call", "script": "", "st": "new"}, {"id": "FR8-N2", "title": "Offer a callback when the NewCo queue is long", "t": "Scenario: Offer a callback when the NewCo queue is long\nGiven the caller has joined the NewCo queue\nAnd the estimated wait is over the threshold set by demand management\nAnd demand management shows there is enough resource for a callback\nWhen the caller joins the queue\nThen the caller must be offered a callback\nAnd the offer must make clear that they keep their place in the queue and are called back when it is their turn\nAnd the case reference must not be asked for again", "script": "", "st": "new"}, {"id": "FR8-N4", "title": "The NewCo queue is long and no callback is available", "t": "Scenario: The NewCo queue is long and no callback is available\nGiven the caller has joined the NewCo queue\nAnd the estimated wait is over the threshold set by demand management\nAnd there is not enough resource for a callback\nWhen the caller joins the queue\nThen the IVR must play the approved team-busy message\nAnd the caller must be offered the option to press 1 to leave a message for the team (FR2-F3)\nAnd the message must make clear that leaving a message takes them out of the queue, and roughly when the team will call back\nAnd the caller must be able to stay on the line and keep their place\nAnd the caller must not be sent to BAU", "script": "", "st": "new"}, {"id": "FR8-N3", "title": "Customer asks for a callback

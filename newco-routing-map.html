<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>NewCo routing map</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

/* --- govuk-* layer: copied from components.html, the single authority
       for this repo. Palette is the govuk-frontend 6.0.0 rebrand. --- */
:root{--black:#0b0c0c;--white:#fff;--blue:#1d70b8;--link:#1a65a6;--link-hover:#0f385c;--dark-blue:#0f385c;--green:#0f7a52;--green-hover:#0b5c3e;--green-shade:#083d29;--yellow:#fd0;--light-yellow:#fff7bf;--light-grey:#f4f8fb;--mid-grey:#cecece;--dark-grey:#484949;--red:#ca3535;--red-shade:#651b1b;--purple:#54319f;--focus:#fd0;--focus-text:#0b0c0c}
*,*::before,*::after{box-sizing:border-box}
body{font-family:"GDS Transport","Inter",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--black);background:var(--white);margin:0;padding:0;line-height:1.5;font-size:19px}
.govuk-header{background:var(--blue);color:var(--white);padding:10px 0}
.govuk-header__container{max-width:960px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:10px}
.govuk-header__homepage-link{display:inline-flex;align-items:center;color:var(--white);text-decoration:none}
.govuk-header__logotype{height:30px;width:162px;fill:currentcolor}
.service-nav{border-bottom:1px solid var(--mid-grey);background:var(--white);padding:12px 0}
.service-nav__wrapper{max-width:960px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.service-nav__name{font-weight:700;font-size:19px;color:var(--black);text-decoration:none}
.govuk-phase-banner{border-bottom:1px solid var(--mid-grey);padding:10px 0}
.govuk-phase-banner__wrapper{max-width:960px;margin:0 auto;padding:0 15px;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.govuk-phase-banner__tag{display:inline-block;background:var(--blue);color:var(--white);font-weight:700;font-size:14px;padding:2px 8px;text-transform:uppercase;letter-spacing:1px}
.govuk-width-container{max-width:960px;margin:0 auto;padding:0 15px}
.govuk-main-wrapper{padding:30px 0 60px}
.govuk-skip-link{position:absolute;left:-9999px;top:0;background:var(--yellow);color:var(--black);padding:10px 15px;font-weight:700;z-index:10}
.govuk-skip-link:focus{left:0}
h1,.govuk-heading-xl{font-size:48px;line-height:1.04;font-weight:700;margin:0 0 30px}
h2,.govuk-heading-l{font-size:36px;line-height:1.11;font-weight:700;margin:30px 0 20px}
h3,.govuk-heading-m{font-size:24px;line-height:1.25;font-weight:700;margin:20px 0 15px}
h4,.govuk-heading-s{font-size:19px;line-height:1.3;font-weight:700;margin:15px 0 10px}
p,.govuk-body{font-size:19px;margin:0 0 20px}
.govuk-body-s{font-size:16px}
.govuk-body-l{font-size:24px;line-height:1.25;margin:0 0 20px}
.govuk-caption{font-size:24px;color:var(--dark-grey);display:block;margin-bottom:5px}
a{color:var(--link)}a:hover{color:var(--link-hover)}
a:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--focus-text);text-decoration:none}
.govuk-list{margin:0 0 20px;padding:0;list-style:none}
.govuk-list>li{margin-bottom:5px}
.govuk-list--bullet{list-style:disc;padding-left:20px}
.govuk-visually-hidden{position:absolute!important;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);border:0;white-space:nowrap}
hr.govuk-section-break{border:none;border-bottom:1px solid var(--mid-grey);margin:30px 0}
.govuk-button{display:inline-block;padding:8px 20px;font-size:19px;font-weight:700;color:var(--white);background:var(--green);border:none;border-radius:0;border-bottom:2px solid var(--green-shade);cursor:pointer;text-decoration:none;line-height:1.2;-webkit-appearance:none;font-family:inherit}
.govuk-button:focus{outline:3px solid var(--focus);outline-offset:0}
.govuk-button--secondary{background:#f3f3f3;color:var(--black);border-bottom-color:#858686}
.govuk-button--secondary:hover{background:#dbdad9;color:var(--black)}
.govuk-form-group{margin-bottom:30px}
.govuk-fieldset{border:0;margin:0;padding:0}
.govuk-fieldset__legend{font-weight:700;font-size:19px;margin-bottom:10px;display:block}
.govuk-radios__item{display:flex;align-items:flex-start;margin-bottom:15px;gap:12px}
.govuk-radios__input{width:44px;height:44px;min-width:44px;margin:0;cursor:pointer;accent-color:var(--black)}
.govuk-radios__label{font-size:19px;padding-top:10px;cursor:pointer}
.govuk-label{display:block;font-weight:700;margin-bottom:5px}
.govuk-hint{font-size:16px;color:var(--dark-grey);margin-bottom:10px;display:block}
.govuk-select{font-family:inherit;font-size:19px;padding:5px 10px;border:2px solid var(--black);max-width:400px;background:var(--white)}
.govuk-select:focus{outline:3px solid var(--focus);outline-offset:0}
.govuk-summary-list{border-top:1px solid var(--mid-grey);margin:0 0 30px}
.govuk-summary-list__row{display:flex;border-bottom:1px solid var(--mid-grey);padding:12px 0;gap:15px}
.govuk-summary-list__key{flex:0 0 32%;font-weight:700}
.govuk-summary-list__value{flex:1}
@media(max-width:640px){.govuk-summary-list__row{flex-direction:column;gap:4px}.govuk-summary-list__key{flex:auto}}
.govuk-tag{display:inline-block;font-size:19px;line-height:1.32;font-weight:700;padding:2px 8px 3px;border-radius:1px;max-width:160px;overflow-wrap:break-word;color:#0f385c;background:#d2e2f1}
.govuk-tag--blue{color:#0f385c;background:#d2e2f1}
.govuk-tag--green{color:#083d29;background:#cfe4dc}
.govuk-tag--red{color:#651b1b;background:#f4d7d7}
.govuk-tag--magenta{color:#651b3e;background:#f4d7e5}
.govuk-tag--yellow{color:#7a3c1c;background:#ffee80}
.govuk-tag--grey{color:#0b0c0c;background:#cecece}
.govuk-inset-text{border-left:10px solid var(--mid-grey);padding:15px 20px;margin:0 0 30px}
.govuk-details{margin-bottom:30px;display:block}
.govuk-details__summary{color:var(--link);cursor:pointer;text-decoration:underline;font-size:19px;margin-bottom:5px}
.govuk-details__summary:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--focus-text);text-decoration:none}
.govuk-details__text{border-left:5px solid var(--mid-grey);padding:15px 20px;font-size:19px}
.govuk-footer{background:var(--light-grey);border-top:10px solid var(--blue);padding:30px 0;margin-top:60px}
.govuk-footer__wrapper{max-width:960px;margin:0 auto;padding:0 15px}
.govuk-footer__meta-item{font-size:16px;color:var(--dark-grey)}

/* Desktop only: this map is a workshop tool and is not built for phones.

   --- This prototype only. Everything below is specific to the routing
       map and does not belong in components.html. --- */
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:0}
.govuk-header{padding:8px 0}
.service-nav{padding:0}
.service-nav__wrapper,.govuk-phase-banner__wrapper,.govuk-header__container{max-width:none;padding:0 20px}
.service-nav__name{padding:12px 0;margin-right:10px}
.service-nav__list{display:flex;gap:0 25px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.service-nav__link{display:block;padding:12px 0 9px;font-size:16px;color:var(--link);border-bottom:4px solid transparent}
.service-nav__link[aria-current="page"]{color:var(--black);font-weight:700;border-bottom-color:var(--blue);text-decoration:none}
.govuk-phase-banner{padding:6px 0}
.govuk-phase-banner__wrapper{font-size:16px}

.app{display:flex;flex-direction:column;min-height:100vh}
body.is-map .app{height:100vh;height:100dvh;min-height:0}
main.map{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 460px}
@media (max-width:1399px){ main.map{grid-template-columns:minmax(0,1fr) 400px} }

/* map column */
.mapcol{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--mid-grey)}
.toolbar{display:flex;flex-wrap:nowrap;gap:16px;align-items:flex-end;padding:12px 20px;border-bottom:1px solid var(--mid-grey)}
.chan{display:flex;gap:0;margin:0;padding:0;list-style:none;border-bottom:0}
.chan button{font:inherit;font-size:16px;font-weight:700;padding:8px 13px;white-space:nowrap;background:#f3f3f3;border:1px solid var(--mid-grey);cursor:pointer;color:var(--link)}
.chan button[aria-pressed="true"]{background:var(--white);color:var(--black);border-color:var(--black);box-shadow:inset 0 -4px 0 var(--blue)}
.toolbar .govuk-label{font-size:16px;margin:0 0 4px}
.toolbar .govuk-select{font-size:16px;padding:4px 8px}
.toolbar .links{display:flex;gap:12px;font-size:15px;margin-left:auto;align-items:center;padding-bottom:6px;white-space:nowrap}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--link-hover)}
.linkbtn:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--focus-text);text-decoration:none}
.zoom{display:inline-flex;gap:4px;align-items:center;margin-left:4px}
.zoom .govuk-button{font-size:16px;padding:4px 10px;margin:0}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--dark-grey);padding:8px 20px;border-top:1px solid var(--mid-grey)}
.key span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:20px;height:13px;border:2px solid}
.sw.today{background:#f3f3f3;border-color:#858686}
.sw.req{background:#d2e2f1;border-color:var(--blue)}
.sw.prop{background:#f4d7e5;border-color:#651b3e;border-style:dashed}
.sw.ans{background:var(--white);border:1.5px solid var(--black);border-radius:6px}
.sw.route{height:0;border:0;border-top:4px solid var(--blue);width:26px}
.diam{width:12px;height:12px;background:var(--black);transform:rotate(45deg);display:inline-block;margin:0 3px}
.enddot{width:13px;height:13px;border-radius:50%;background:var(--black);display:inline-block}
.canvas{flex:1;min-height:0;overflow:auto;background:var(--white)}
.lanes{display:flex;flex-direction:column;align-items:flex-start;gap:32px;padding:40px 40px 60px;width:max-content;margin:0 auto}
.lane{background:var(--light-grey);border:1px solid #dfe5eb}
.lane h2{margin:0;background:#505a5f;color:var(--white);font-size:16px;line-height:1.3;padding:8px 14px;scroll-margin-top:20px}
.lane h2 .n{font-weight:400;opacity:.85;margin-right:6px}
.lanestart{font:inherit;font-size:14px;font-weight:400;margin-left:12px;background:none;border:0;color:var(--white);text-decoration:underline;cursor:pointer;padding:0}
.lanestart:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--black)}
.lane svg{display:block}
.whole{padding:30px 40px 60px;width:max-content;margin:0 auto;min-height:100%;display:flex;align-items:center}
.whole svg{display:block;overflow:visible}
.cluster{fill:var(--light-grey);stroke:#dfe5eb}
.clusterhead{fill:#505a5f}
.clustertext{font:700 15px "GDS Transport","Inter",Arial,sans-serif;fill:var(--white)}

/* svg */
.edge path{fill:none;stroke:#8e9296;stroke-width:1.5}
.edge text{font:13px "GDS Transport","Inter",Arial,sans-serif;fill:var(--dark-grey)}
.edge rect{fill:var(--light-grey)}
.edge.on path{stroke:var(--blue);stroke-width:4}
.edge.on text{fill:var(--black);font-weight:700}
.node{cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.node.dragging .box,.node.dragging .ans{filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.node text{font:14px "GDS Transport","Inter",Arial,sans-serif;fill:var(--black)}
.node .box{stroke-width:2}
.node.today .box{fill:#f3f3f3;stroke:#858686}
.node.req .box{fill:#d2e2f1;stroke:var(--blue)}
.node.prop .box{fill:#f4d7e5;stroke:#651b3e;stroke-dasharray:6 3}
.node .tag{font-size:11px;font-weight:700;fill:#651b3e;letter-spacing:.06em}
.node .diamond{fill:var(--black)}
.node .qtext{font-weight:700}
.node .dot{fill:var(--black)}
.node .goto{fill:var(--white);stroke:var(--blue);stroke-width:2}
.node .gototext{fill:var(--link);text-decoration:underline}
.node .ans{fill:var(--white);stroke:var(--black);stroke-width:1.5}
.node .anstext{font-size:13.5px}
.node.on .ans{fill:#1d70b8;stroke:#1d70b8;stroke-width:3}
.node.on .anstext{fill:var(--white);font-weight:700}
.node.on .box{stroke:var(--blue);stroke-width:4;stroke-dasharray:none}
.node.on .diamond,.node.on .dot{fill:var(--blue)}
.node.on .goto{stroke-width:4}
.node .ring,.node .ringy{fill:none;stroke:none}
.node.sel .ring{stroke:var(--black);stroke-width:3}
.node.sel .ringy{stroke:var(--focus);stroke-width:7}
.node:focus{outline:none}
.node:focus-visible .ringy{stroke:var(--focus);stroke-width:7}
.node:focus-visible .ring{stroke:var(--black);stroke-width:3}
.node .badge{fill:var(--red)}
.node .badgetxt{font-size:11px;font-weight:700;fill:var(--white)}

/* list view */
.steplist{padding:20px 30px 60px;max-width:760px}
.steplist h2{font-size:24px;margin:30px 0 10px}
.steplist ol{list-style:none;margin:0;padding:0}
.steplist li{border-top:1px solid var(--mid-grey);padding:10px 0;font-size:16px}
.steplist li.on{border-left:5px solid var(--blue);padding-left:12px}
.steplist .next{margin:4px 0 0;padding:0;list-style:none}
.steplist .next li{border:0;padding:0}

/* sidebar */
.side{display:flex;flex-direction:column;min-height:0;background:var(--white)}
.tabs{display:flex;border-bottom:1px solid var(--mid-grey);padding:0 20px;gap:4px}
.tabs button{font:inherit;font-size:16px;font-weight:700;background:#f3f3f3;border:1px solid var(--mid-grey);border-bottom:0;padding:8px 14px;margin-top:10px;cursor:pointer;color:var(--link)}
.tabs button[aria-selected="true"]{background:var(--white);color:var(--black);margin-bottom:-1px;padding-bottom:9px}
.sidebody{overflow:auto;padding:20px 20px 40px;font-size:16px;flex:1}
.sidebody p,.sidebody li{font-size:16px}
.sidebody p{margin:0 0 15px}
.sidebody h2{font-size:24px;line-height:1.25;margin:0 0 10px}
.sidebody h3{font-size:19px;margin:25px 0 10px;padding-top:15px;border-top:1px solid var(--mid-grey)}
.sidebody .govuk-caption{font-size:16px}
.sidebody .govuk-tag{font-size:14px}
.sidebody .govuk-radios__label{font-size:16px}
.sidebody .govuk-radios__input{width:32px;height:32px;min-width:32px}
.sidebody .govuk-radios__label{padding-top:5px}
.sidebody .govuk-radios__item{margin-bottom:8px}
.script{border-left:5px solid var(--blue);background:var(--light-grey);padding:12px 15px;margin:0 0 15px}
.script.prop{border-left:5px dashed #651b3e;background:#fbeff5}
.script.asis{border-left:5px solid #858686;background:#f3f3f3}
.script.asis .said{font-size:16px;color:var(--dark-grey)}
.script .who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700;margin:0 0 6px;font-size:16px}
.script .said{margin:0;font-size:17px;white-space:pre-line}
.ph{background:var(--light-yellow);border-bottom:2px solid var(--yellow);padding:0 2px}
.script .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.script .btns span{border:2px solid var(--black);padding:1px 8px;font-size:15px}
.script .note{font-size:15px;color:var(--dark-grey);margin:8px 0 0}
.req{border:1px solid var(--mid-grey);margin:0 0 15px}
.req > .head{padding:10px 12px;background:#f3f3f3;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.req > .head strong{font-size:16px}
.req .id{font-size:14px;color:var(--dark-grey);font-weight:700}
.req .part{padding:10px 12px}
.req .part + .part{border-top:1px solid var(--mid-grey)}
.req .part.prop{background:#fbeff5;border-left:5px dashed #651b3e}
.req .lab{display:block;font-size:14px;font-weight:700;margin:0 0 4px}
.req .g{white-space:pre-line;margin:0;font-size:15px;overflow-wrap:anywhere}
.req .why{margin:8px 0 0;font-size:15px}
.answers li{margin-bottom:12px}
.answers .linkbtn{font-size:16px}
.answers .linkbtn[aria-pressed="true"]{font-weight:700}
.transcript{list-style:none;margin:0;padding:0}
.transcript li{padding:10px 0;border-top:1px solid var(--mid-grey);white-space:pre-line}
.transcript li:first-child{border-top:0}
.transcript .who{display:block;font-size:14px;font-weight:700;color:var(--dark-grey)}
.transcript .caller{font-weight:700}
.transcript .does{color:var(--dark-grey)}

/* document pages */
.doc{max-width:1100px;margin:0 auto;padding:30px 20px 60px}
.doc h1{font-size:48px}
.lede{max-width:40em}
.filter{margin:0 0 30px}
.filter .govuk-radios__item{margin-bottom:6px}
.filter .govuk-radios__input{width:32px;height:32px;min-width:32px}
.filter .govuk-radios__label{padding-top:4px;font-size:19px}
.toc{columns:2 280px;margin:0 0 40px;padding:0;list-style:none}
.toc li{margin:0 0 6px;break-inside:avoid}
.frsec{margin:0 0 50px}
.frsec > h2{border-bottom:2px solid var(--black);padding-bottom:8px;scroll-margin-top:20px}
.feature{margin:0 0 35px}
.feature > h3{margin:0 0 8px}
.story{white-space:pre-line;color:var(--dark-grey);font-size:16px;margin:0 0 15px}
.scen{border-top:1px solid var(--mid-grey);padding:15px 0;scroll-margin-top:20px}
.scen.flash{outline:3px solid var(--focus);outline-offset:6px}
.scen h4{margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.scen h4 .id{font-size:16px;color:var(--dark-grey)}
.scen h4 .govuk-tag{font-size:14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pair.one{grid-template-columns:1fr}
.col{padding:10px 15px;font-size:16px}
.col.asw{border-left:5px solid var(--mid-grey)}
.col.prop{border-left:5px dashed #651b3e;background:#fbeff5}
.col.orig{border-left:5px solid var(--mid-grey);background:#f3f3f3;color:var(--dark-grey)}
.col.now{border-left:5px solid var(--blue)}
.req .part.orig{background:#f3f3f3;color:var(--dark-grey)}
.req details summary{font-size:15px}
.changes{margin:0 0 40px}
.changes h3{margin:20px 0 8px}
.changes li{margin:0 0 6px}
.feature > .fnote{margin:0 0 15px}
.tbc{border-left:5px solid #ffdd00;background:#fff7bf;padding:8px 12px;margin:10px 0 0;font-size:16px}
.scen .was{margin:10px 0 0}
.scen .was .col{margin-top:8px}
.col .lab{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.col .g{white-space:pre-line;margin:0;font-size:16px;overflow-wrap:anywhere}
.col .why{margin:10px 0 0;font-size:16px}
.onmap{font-size:16px;margin:10px 0 0}
details.unch summary{font-size:16px}
.risk-list{list-style:none;margin:0;padding:0}
.risk-list > li{border-top:2px solid var(--black);padding:20px 0 0;margin:0 0 30px;scroll-margin-top:20px}
.risk-list h3{margin:0 0 15px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.risk-list h3 .id{color:var(--dark-grey);font-size:19px}
.risk-list h3 .govuk-tag{font-size:16px}
.risk-list .govuk-summary-list{font-size:16px;margin:0}
.risk-list .govuk-summary-list__key{flex:0 0 22%}
.tiers{margin:0}
.tiers dt{font-weight:700;margin:0}
.tiers dd{margin:0 0 10px}
.oi-list{list-style:none;margin:0 0 40px;padding:0;border-top:1px solid var(--mid-grey)}
.oi-list li{padding:15px 0;border-bottom:1px solid var(--mid-grey);scroll-margin-top:20px}
.oi-list h3{font-size:19px;margin:0 0 6px}
.oi-list p{font-size:16px;margin:0 0 6px}
.oi-list .meta{font-size:16px;color:var(--dark-grey)}
</style>
</head>
<body>
<a class="govuk-skip-link" href="#main">Skip to main content</a>

<script>
(function(){
"use strict";

/* Requirements as written: parsed word for word from the Confluence
   export "User Stories for IVR Day 1 Readiness" (26 September 2026). */
const REQS = [{"code": "FR1", "title": "IVR Call Routing and Cohort Identification", "features": [{"id": "FR1-F1", "t": "Retain the existing IVR routing", "story": "As a NewCo customer calling the NewCo DM Line,\nI want to continue through the existing IVR journey,\nso that I can access the appropriate service without disruption from the introduction of NewCo routing.", "sc": [{"id": "FR1-01", "title": "Customer enters the IVR", "t": "Scenario: Customer enters the IVR\nGiven the customer has called the existing IVR telephone number\nWhen the call is connected to the IVR\nThen the customer must enter the existing IVR routing flow\nAnd the existing IVR options must remain available", "script": "", "st": "same"}, {"id": "FR1-02", "title": "Customer is not eligible for NewCo routing", "t": "Scenario: Customer is not eligible for NewCo routing\nGiven the customer is progressing through the existing IVR routing flow\nAnd the customer is not identified as eligible for the NewCo cohort\nWhen the IVR determines the route for the call\nThen the call must continue through the standard BAU route", "script": "", "st": "same"}], "st": "same"}, {"id": "FR1-F2", "t": "Identify eligible customers using a shared routing table (Given the IVR and web chat use the same shared cohort routing table)", "story": "As a customer with an eligible case,\nI want the IVR to identify my case using my reference number,\nso that my call can be routed to the appropriate NewCo team.", "sc": [{"id": "FR1-03", "title": "Customer provides a reference number that matches an eligible NewCo record", "t": "Scenario: Customer provides a reference number that matches an eligible NewCo record\nGiven the customer has been prompted to provide their case reference number\nAnd the customer's case reference number is recorded in the shared routing table\nAnd the record is active and eligible for NewCo routing\nWhen the IVR validates the case reference number\nThen the IVR must identify the customer as belonging to the NewCo cohort\nAnd the call must branch from the existing IVR route to the route specified for that record", "script": "", "st": "same"}, {"id": "FR1-04", "title": "Customer provides a reference number that does not match an eligible record", "t": "Scenario: Customer provides a reference number that does not match an eligible record\nGiven the customer has provided a case reference number\nAnd the case reference number is not recorded as an active eligible record in the shared routing table\nWhen the IVR validates the case reference number\nThen the call must continue through the standard BAU route", "script": "", "st": "same"}, {"id": "FR1-05", "title": "Customer cannot provide a reference number", "t": "Scenario: Customer cannot provide a reference number\nGiven the customer has been prompted to provide their case reference number\nWhen the customer cannot provide the required reference number\nThen the call must continue through the standard BAU route", "script": "", "st": "same"}, {"id": "FR1-06", "title": "Customer provides an invalidly formatted reference number", "t": "Scenario: Customer provides an invalidly formatted reference number\nGiven the customer has been prompted to provide their case reference number\nWhen the customer provides a reference number in an invalid format\nThen the IVR must not route the customer to the NewCo cohort\nAnd the call must continue through the standard BAU route", "script": "", "st": "same"}, {"id": "FR1-07", "title": "The reference number cannot be validated", "t": "Scenario: The reference number cannot be validated\nGiven the customer has provided a case reference number\nWhen the IVR is unable to validate the reference number against the shared routing table\nThen the call must continue through the standard BAU route\nAnd the customer must not be left in an incomplete routing journey", "script": "", "st": "same"}], "st": "same"}, {"id": "FR1-F3", "t": "Route first-notification calls using the Super Cell approach (Given the call has been identified as a first-notification call, the licence is not for a lorry or bus, first-notification routing to NewCo is switched on, and NewCo agents are configured as an availability based routing option)", "story": "As a NewCo customer making a first-notification call,\nI want my call to be offered to an available NewCo agent,\nso that I can receive support promptly without being in an additional queue.", "sc": [{"id": "FR1-08", "title": "A NewCo agent is available", "t": "Scenario: A NewCo agent is available\nGiven at least one eligible NewCo agent is available at the point of routing\nWhen the IVR routes the first-notification call\nThen the call must be sent to an available NewCo agent\nAnd no separate NewCo agent queue must be created or used", "script": "Connecting to a NewCo agent: Thank you. We’re putting you through to an adviser.", "st": "changed", "was": "Scenario: A NewCo agent is available\nGiven at least one eligible NewCo agent is available at the point of routing\nWhen the IVR routes the first-notification call\nThen the call must be sent to an available NewCo agent\nAnd no separate NewCo agent queue must be created or used", "was_script": "Connecting to a NewCo agent: Thank you. We're putting you through to the team looking after your case.", "why": "The connecting line said “the team looking after your case”, but a first-notification caller has no case yet."}, {"id": "FR1-09", "title": "No NewCo agent is available", "t": "Scenario: No NewCo agent is available\nGiven no eligible NewCo agent is available at the point of routing\nWhen the IVR routes the first-notification call\nThen the call must immediately fall back to the standard BAU queue\nAnd the NewCo customer must not wait for a NewCo agent to become available", "script": "", "st": "same"}, {"id": "FR1-10", "title": "NewCo agent availability cannot be confirmed", "t": "Scenario: NewCo agent availability cannot be confirmed\nGiven the IVR cannot determine whether a NewCo agent is available\nWhen the call reaches the routing decision\nThen the call must immediately fall back to the standard BAU queue", "script": "", "st": "same"}, {"id": "FR1-11", "title": "A NewCo agent becomes unavailable during routing", "t": "Scenario: A NewCo agent becomes unavailable during routing\nGiven a NewCo agent appears to be available\nAnd the NewCo agent becomes unavailable before the call is connected\nWhen the IVR completes the routing attempt\nThen the call must fall back to the standard BAU queue\nAnd the NewCo customer must not be in a NewCo only queue", "script": "", "st": "same"}, {"id": "FR1-12", "title": "NewCo customer is not held in a universal-agent-only queue", "t": "Scenario: NewCo customer is not held in a universal-agent-only queue\nGiven no NewCo agent is currently available\nWhen the first-notification call reaches the Super Cell routing decision\nThen the call must not be in a queue that exists solely for NewCo agents\nAnd the call must follow the standard BAU queue route", "script": "", "st": "tidied", "was": "Scenario: NewCo Customer is not held in a universal-agent-only queue\nGiven no NewCo agent is currently available\nWhen the first-notification call reaches the Super Cell routing decision\nThen the call must not be in a queue that exists solely for NewCo agents\nAnd the call must follow the standard BAU queue route", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR1-N1", "title": "The first notification is for a lorry or bus licence", "t": "Scenario: The first notification is for a lorry or bus licence\nGiven the call has been identified as a first-notification call\nAnd the customer has said the licence is for a lorry or bus\nWhen the IVR routes the call\nThen the call must follow the standard BAU route\nAnd the call must not be offered to a NewCo agent", "script": "", "st": "new", "why": "NewCo does not handle lorry and bus licences. FR8-14 already says this for existing applications."}, {"id": "FR1-N2", "title": "First-notification routing is switched off", "t": "Scenario: First-notification routing is switched off\nGiven an authorised user has switched first-notification routing to NewCo off\nWhen the IVR routes a first-notification call\nThen the call must follow the standard BAU route\nAnd switching on or off must not require a software deployment\nAnd each change must be recorded in the audit history", "script": "", "st": "new", "why": "Lets the team control how fast the cohort grows."}], "st": "changed", "why": "Lorry and bus stay with BAU, as FR8 already sets out for existing applications. The switch lets the team control how fast the cohort grows.", "was_t": "Route first-notification calls using the Super Cell approach (Given the call has been identified as a first-notification call and NewCo agents are configured as an availability based routing option)", "was_story": "As a NewCo customer making a first-notification call,\nI want my call to be offered to an available NewCo agent,\nso that I can receive support promptly without being in an additional queue."}, {"id": "FR1-F4", "t": "Route customers with existing cases", "story": "As a NewCo customer with an existing case,\nI want to provide my case reference number,\nso that the IVR can route me to the team responsible for my case.", "sc": [{"id": "FR1-13", "title": "Existing-case NewCo customer provides a matching case reference number", "t": "Scenario: Existing-case NewCo customer provides a matching case reference number\nGiven the NewCo customer has indicated that they have an existing case\nAnd the NewCo customer has provided their case reference number\nAnd the case reference number matches an active NewCo cohort record\nWhen the IVR checks the identifier against the cohort routing data\nThen the call must be routed to the NewCo team or route stored against that record", "script": "", "st": "same"}, {"id": "FR1-14", "title": "Existing-case NewCo customer provides another agreed identifier", "t": "Scenario: Existing-case NewCo customer provides another agreed identifier\nGiven the NewCo customer has indicated that they have an existing case\nAnd the NewCo customer provides an agreed alternative identifier\nAnd the identifier matches an active NewCo cohort record\nWhen the IVR checks the identifier against the cohort routing data\nThen the call must be routed to the NewCo team or route stored against that record", "script": "", "st": "removed", "was": "Scenario: Existing-case NewCo customer provides another agreed identifier\nGiven the NewCo customer has indicated that they have an existing case\nAnd the NewCo customer provides an agreed alternative identifier\nAnd the identifier matches an active NewCo cohort record\nWhen the IVR checks the identifier against the cohort routing data\nThen the call must be routed to the NewCo team or route stored against that record", "was_script": "", "why": "There is no alternative identifier on the phone line. Name, address and date of birth are checked by an adviser through ID&V, which the IVR can’t do. A caller without the reference goes to BAU, where the adviser can find the case and transfer them while the team is open (FR1-N3)."}, {"id": "FR1-15", "title": "Existing-case reference number does not match", "t": "Scenario: Existing-case reference number does not match\nGiven the NewCo customer has indicated that they have an existing case\nAnd the NewCo customer has provided a case reference number\nAnd the reference number does not match an active NewCo cohort record\nWhen the IVR completes the reference number check\nThen the call must continue through the standard BAU route", "script": "", "st": "changed", "was": "Scenario: Existing-case identifier does not match\nGiven the NewCo customer has indicated that they have an existing case\nAnd the NewCo customer has provided a case reference number or agreed identifier\nAnd the identifier does not match an active NewCo cohort record\nWhen the IVR completes the identifier check\nThen the call must continue through the standard BAU route", "was_script": "", "why": "No alternative identifier (see FR1-14)."}, {"id": "FR1-16", "title": "Existing-case reference number cannot be validated", "t": "Scenario: Existing-case reference number cannot be validated\nGiven the NewCo customer has provided a case reference number\nWhen the NewCo cohort routing data cannot be accessed or the reference number cannot be validated\nThen the call must continue through the standard BAU route", "script": "", "st": "changed", "was": "Scenario: Existing-case identifier cannot be validated\nGiven the NewCo customer has provided a case reference number or agreed identifier\nWhen the NewCo cohort routing data cannot be accessed or the identifier cannot be validated\nThen the call must continue through the standard BAU route", "was_script": "", "why": "No alternative identifier (see FR1-14)."}], "st": "changed", "why": "There is no alternative identifier on the phone line (decided 26 September).", "was_t": "Route customers with existing cases", "was_story": "As a NewCo customer with an existing case,\nI want to provide my case reference number or another agreed identifier,\nso that the IVR can route me to the team responsible for my case."}, {"id": "FR1-NF1", "t": "Transfer a NewCo caller from BAU to the team", "story": "As a BAU adviser speaking to a NewCo customer,\nI want to transfer the call to the team looking after their case,\nso that the customer reaches the right team when automatic routing hasn’t sent them there.", "st": "new", "why": "FR4-F7 gives web chat this transfer. Phone callers without their reference reach BAU, so they need it too. Transfers happen only while the team is open (decided 26 September).", "sc": [{"id": "FR1-N3", "title": "BAU adviser transfers a NewCo caller while the team is open", "t": "Scenario: BAU adviser transfers a NewCo caller while the team is open\nGiven a BAU adviser is speaking to a customer whose case shows the NewCo indicator (FR4-F6)\nAnd the owning NewCo team is within its operating hours\nWhen the adviser selects the approved NewCo transfer destination\nThen the call must join the NewCo queue for that team\nAnd the customer must not be asked again for information already captured", "script": "", "st": "new"}, {"id": "FR1-N4", "title": "The team is closed", "t": "Scenario: The team is closed\nGiven a BAU adviser is speaking to a customer whose case shows the NewCo indicator\nAnd the owning NewCo team is outside its operating hours\nWhen the adviser handles the call\nThen the call must not be transferred\nAnd the adviser must help the customer as they would today\nAnd the contact must be logged on the case so the team can follow up", "script": "", "st": "new"}]}, {"id": "FR1-NF2", "t": "Ask for each piece of information once", "story": "As a customer calling about my case,\nI want to give each piece of information only once in a call,\nso that I don’t have to repeat myself to the phone line, the adviser or the team.", "st": "new", "why": "A general principle for the phone line. Information given once is passed on wherever possible, the same as FR4-22 already requires for web chat.", "sc": [{"id": "FR1-N7", "title": "The customer has given their reference in the IVR", "t": "Scenario: The customer has given their reference in the IVR\nGiven the customer has given a valid case reference number earlier in the call\nWhen the call reaches a NewCo agent, a callback, a message for the team or a transfer\nThen the reference must be passed on with the call where technically possible\nAnd the customer must not be asked for it again by the IVR", "script": "", "st": "new"}, {"id": "FR1-N8", "title": "The phone line needs a number to call back on", "t": "Scenario: The phone line needs a number to call back on\nGiven the customer’s number is shown on the call\nWhen the IVR needs a number to call the customer back\nThen the number must be captured automatically\nAnd the customer must only be asked to enter a number if theirs is withheld or they want to use a different one", "script": "", "st": "new"}, {"id": "FR1-N9", "title": "A call is transferred between BAU and NewCo", "t": "Scenario: A call is transferred between BAU and NewCo\nGiven information has already been captured in the call\nWhen the call is transferred between a BAU adviser and the NewCo team\nThen the captured information must go with the call where technically possible\nAnd the customer must not be asked to repeat information that remains valid", "script": "", "st": "new"}]}, {"id": "FR1-NF3", "t": "Use the keypad as well as speech (new: not in the BAU phone line today)", "story": "As a customer using the phone line,\nI want to answer on the keypad as well as by speaking,\nso that I can give them accurately, even if saying them is hard for me.", "st": "new", "why": "A new capability, for accessibility and to meet the Service Standard. The BAU phone line works by speech only today: callers say “Welsh”, say what the call is about and say their reference. A 9-digit number suits the keypad, some customers’ conditions affect their speech, and callers with a withheld number need to enter one.", "sc": [{"id": "FR1-N5", "title": "Enter the reference on the keypad", "t": "Scenario: Enter the reference on the keypad\nGiven the IVR asks for the case reference number (FR1-17, FR8-24 or FR8-30)\nWhen the customer enters the 9 digits on the keypad\nThen the IVR must accept them in the same way as a spoken reference\nAnd the prompt must tell the customer they can say it or enter it", "script": "", "st": "new"}, {"id": "FR1-N6", "title": "Enter a phone number on the keypad", "t": "Scenario: Enter a phone number on the keypad\nGiven the IVR needs a number to call the customer back\nAnd the customer’s number is withheld, or they want to use a different one\nWhen the customer enters a phone number on the keypad\nThen the IVR must check it against the agreed format rules\nAnd read it back for the customer to confirm", "script": "", "st": "new"}, {"id": "FR1-N10", "title": "Answer what the call is about on the keypad", "t": "Scenario: Answer what the call is about on the keypad\nGiven the IVR has asked what the call is about\nWhen the customer presses 1 for an existing application or 2 for a new condition\nThen the IVR must treat the answer the same as a spoken one (FR8-09 and FR8-11)\nAnd the prompt must tell the customer they can say it or press a number", "script": "", "st": "new"}, {"id": "FR1-N11", "title": "Choose Welsh on the keypad", "t": "Scenario: Choose Welsh on the keypad\nGiven the IVR offers the Welsh-language journey\nWhen the customer presses the agreed key for Welsh\nThen the IVR must treat it the same as saying “Welsh” (FR8-05)\nAnd the prompt must tell the customer they can say “Welsh” or press the key", "script": "", "st": "new"}]}, {"id": "FR1-F5", "t": "Provide clear IVR instructions", "story": "As a NewCo customer using the IVR,\nI want clear instructions about which identifier I need to provide,\nso that I can supply the correct information and be routed appropriately.", "sc": [{"id": "FR1-17", "title": "NewCo customer is asked to provide a case reference number", "t": "Scenario: NewCo customer is asked to provide a case reference number\nGiven the NewCo customer has reached a stage where their case must be identified\nWhen the IVR requests the customer’s case reference number\nThen the message must explain that it is the 9 digits next to “Our reference” at the top of every letter\nAnd the message must explain that the customer does not need to include the letters MED", "script": "", "st": "changed", "was": "Scenario: NewCo Customer is asked to provide a case reference number\nGiven the NewCo customer has reached a stage where their case must be identified\nWhen the IVR requests the customer's case reference number\nThen the message must explain which reference number is required\nAnd the message must explain where the customer can find it\nAnd the message must explain how the customer should enter or provide it", "was_script": "", "why": "Names the number the way letters show it. Keypad entry is a separate, new requirement (FR1-NF3)."}, {"id": "FR1-18", "title": "An alternative identifier is accepted", "t": "Scenario: An alternative identifier is accepted\nGiven an agreed alternative identifier can be used\nWhen the IVR asks the NewCo customer to identify their case\nThen the message must explain which alternative identifier is accepted\nAnd the message must explain the required format", "script": "", "st": "removed", "was": "Scenario: An alternative identifier is accepted\nGiven an agreed alternative identifier can be used\nWhen the IVR asks the NewCo customer to identify their case\nThen the message must explain which alternative identifier is accepted\nAnd the message must explain the required format", "was_script": "", "why": "There is no alternative identifier on the phone line (see FR1-14)."}, {"id": "FR1-19", "title": "NewCo customer enters the reference number in an invalid format", "t": "Scenario: NewCo customer enters the reference number in an invalid format\nGiven the customer has been asked to provide their case reference number\nWhen the customer enters the reference number in an invalid format\nThen the IVR must provide a clear error message\nAnd the IVR must provide another opportunity to enter the reference number\nAnd the number of retry attempts must follow the agreed IVR retry rules", "script": "", "st": "changed", "was": "Scenario: NewCo Customer enters information in an invalid format\nGiven the customer has been asked to provide an identifier\nWhen the customer enters the identifier in an invalid format\nThen the IVR must provide a clear error message\nAnd the IVR must provide another opportunity to enter the identifier\nAnd the number of retry attempts must follow the agreed IVR retry rules", "was_script": "", "why": "No alternative identifier (see FR1-14)."}, {"id": "FR1-20", "title": "Maximum retry attempts are reached", "t": "Scenario: Maximum retry attempts are reached\nGiven the NewCo customer has reached the maximum permitted number of identifier-entry attempts\nWhen the identifier has not been successfully captured\nThen the call must continue through the standard BAU route", "script": "", "st": "same"}], "st": "same"}, {"id": "FR1-F6", "t": "Maintain daily NewCo cohort routing data table", "story": "As an authorised operational user,\nI want eligible customers to be added to and removed from the shared routing table daily,\nso that IVR and web chat use current and consistent NewCo cohort information.", "sc": [{"id": "FR1-21", "title": "Add a customer to the NewCo cohort", "t": "Scenario: Add a customer to the NewCo cohort\nGiven a customer has become eligible for the NewCo cohort\nWhen the customer's record is added during the daily routing-table update\nThen the customer's identifier must be available for IVR and web-chat routing\nAnd the record must include the customer's active routing destination", "script": "", "st": "same"}, {"id": "FR1-22", "title": "Remove a customer from the NewCo cohort", "t": "Scenario: Remove a customer from the NewCo cohort\nGiven a customer is no longer eligible for the NewCo cohort\nWhen the customer's record is removed or made inactive during the daily update\nThen the customer must no longer be routed to a NewCo team\nAnd subsequent calls must follow the standard BAU route unless another routing rule applies", "script": "", "st": "tidied", "was": "Scenario: Remove a customer from the NewCo cohort\nGiven a customer is no longer eligible for the NewCo cohort\nWhen the customer's record is removed or made inactive during the daily update\nThen the customer must no longer be routed to an NEWCO team\nAnd subsequent calls must follow the standard BAU route unless another routing rule applies", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR1-23", "title": "Apply the same routing data to IVR and web chat", "t": "Scenario: Apply the same routing data to IVR and web chat\nGiven the daily NewCo cohort routing update has been completed\nWhen IVR or web chat checks a customer's identifier\nThen both channels must use the same current routing record\nAnd both channels must identify the same owning team or routing destination", "script": "", "st": "same"}, {"id": "FR1-24", "title": "Reject an incomplete routing record", "t": "Scenario: Reject an incomplete routing record\nGiven a new cohort record does not contain all mandatory routing information\nWhen the daily update is validated\nThen the incomplete record must not be activated\nAnd the validation issue must be recorded for investigation", "script": "", "st": "same"}, {"id": "FR1-25", "title": "Record routing table changes", "t": "Scenario: Record routing table changes\nGiven an authorised user or automated process changes a cohort record\nWhen the change is completed\nThen the system must record the identifier affected\nAnd the type of change\nAnd the date and time of the change\nAnd the user or process that made the change", "script": "", "st": "same"}], "st": "tidied", "was_t": "Maintain daily NewCo cohort routing data table", "was_story": "As an authorised operational user,\nI want eligible customers to be added to and removed from the shared routing table daily,\nso that IVR and web chat use current and consistent NEWCO cohort information."}, {"id": "FR1-F7", "t": "Support multiple NewCo teams and case-reference ranges", "story": "As a NewCo manager,\nI want the routing table to support multiple NewCo teams and case-reference ranges,\nso that calls can be directed to the correct team as the programme scales.", "sc": [{"id": "FR1-26", "title": "Route a case to its owning NewCo team", "t": "Scenario: Route a case to its owning NewCo team\nGiven the NewCo customer has provided a valid case reference number\nAnd the case reference number is recorded against \"<owning_team>\"\nAnd the active routing destination is \"<routing_destination>\"\nWhen the IVR validates the reference number\nThen the call must be routed to \"<routing_destination>\"", "script": "", "st": "tidied", "was": "Scenario: Route a case to its owning NEWCO team\nGiven the NewCo customer has provided a valid case reference number\nAnd the case reference number is recorded against \"<owning_team>\"\nAnd the active routing destination is \"<routing_destination>\"\nWhen the IVR validates the reference number\nThen the call must be routed to \"<routing_destination>\"", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR1-27", "title": "Route using an assigned case-reference range", "t": "Scenario: Route using an assigned case-reference range\nGiven a case reference range is assigned to a NewCo team\nAnd the customer's case reference number falls within that range\nWhen the IVR validates the reference number\nThen the call must be routed to the destination assigned to that case-reference range", "script": "", "st": "tidied", "was": "Scenario: Route using an assigned case-reference range\nGiven a case reference range is assigned to an NEWCO team\nAnd the customer's case reference number falls within that range\nWhen the IVR validates the reference number\nThen the call must be routed to the destination assigned to that case-reference range", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR1-28", "title": "Use individual ownership where it overrides a case-reference range", "t": "Scenario: Use individual ownership where it overrides a case-reference range\nGiven the customer's reference number falls within a configured case-reference range\nAnd the customer's routing record contains a specific active owning team\nWhen the IVR determines the routing destination\nThen the call must be routed to the specific owning team recorded against the customer\nAnd the agreed routing precedence rules must be applied", "script": "", "st": "same"}, {"id": "FR1-29", "title": "Add another NewCo team", "t": "Scenario: Add another NewCo team\nGiven a new NewCo team and routing destination have been approved\nWhen the team is added to the routing configuration\nThen eligible reference numbers must be assignable to the new team\nAnd existing IVR and web-chat routing must continue to operate", "script": "", "st": "tidied", "was": "Scenario: Add another NEWCO team\nGiven a new NEWCO team and routing destination have been approved\nWhen the team is added to the routing configuration\nThen eligible reference numbers must be assignable to the new team\nAnd existing IVR and web-chat routing must continue to operate", "why": "Wording tidied: “NewCo” and “adviser” written the same way throughout."}, {"id": "FR1-30", "title": "Owning team or routing destination is missing", "t": "Scenario: Owning team or routing destination is missing\nGiven the customer's identifier matches an active NewCo cohort record\nAnd the record does not contain a valid owning team or routing destination\nWhen the IVR attempts to route the call\nThen the call must follow the standard BAU route\nAnd the routing-data issue must be recorded for investigation", "script": "", "st": "same"}, {"id": "FR1-31", "title": "Configured NewCo destination is unavailable", "t": "Scenario: Configured NewCo destination is unavailable\nGiven the customer's identifier matches an active NewCo cohort record\nAnd the configured NewCo routing destination is unavailable\nWhen the IVR attempts to route the call\nThen the call must follow the agreed fallback route\nAnd the customer must not be left in an incomplete routing journey", "script": "", "st": "same"}], "st": "tidied", "was_t": "Support multiple NewCo teams and case-reference ranges", "was_story": "As an NewCo manager,\nI want the routing table to support multiple NEWCO teams and case-reference ranges,\nso that calls can be directed to the correct team as the programme scales."}]}, {"code": "FR2", "title": "Team Closed and Messages for the Team", "features": [{"id": "FR2-F1", "t": "Tell callers when the NewCo team is closed, and what they can do", "story": "As a customer calling the NewCo line,\nI want to receive a clear message when the team is closed,\nso that I understand why my call cannot be answered and what I can do next.", "sc": [{"id": "FR2-01", "title": "Customer calls outside NewCo operating hours", "t": "Scenario: Customer calls outside NewCo operating hours\nGiven the customer has qualified for the NewCo journey\nAnd the NewCo team is outside its operating hours: Monday to Friday, 8am to 4pm (subject to approval)\nAnd the phone line is within its operating hours: 8am to 7pm\nWhen the customer reaches the NewCo availability check\nThen the IVR must play the approved team-closed message\nAnd the message must say when the team is open\nAnd the customer must be offered the option to press 1 to leave a message for the team, so the team can call them back (FR2-F3)\nAnd the customer must be offered the option to press 2 to speak to another adviser in the BAU queue\nAnd the message must make clear that this adviser is not part of the team looking after their case", "script": "Team closed, BAU open:\nThe team looking after your case is closed at the moment. They’re open [days and hours]. You can leave your number and they’ll call you back. Or you can speak to another adviser now. They’re not part of your team, but they can help with most things.\nTo leave your number for your team, press 1. To speak to another adviser now, press 2.", "st": "changed", "was": "Scenario: Customer calls outside NewCo operating hours\nGiven the NewCo line is configured to close at 4:30pm\nAnd the current time is outside the configured operating hours\nWhen a customer calls the NewCo line\nThen the IVR must play the approved out-of-hours message\nAnd the message must explain that NewCo agents are currently unavailable\nAnd the caller must be offered the option to leave a voicemail for a callback", "was_script": "Team closed, BAU open:\nThe team looking after your case is closed at the moment. They're open [days and hours]. You can leave them a message and they'll call you back. Or an adviser can help you now.\nTo leave a message for your team, press 1. To speak to an adviser now, press 2.", "why": "Merged with FR8-32, which described the same moment. Applies between 4pm and 7pm, when the team is closed but the phone line is open. Operating hours set to Monday to Friday, 8am to 4pm (subject to approval), in place of 4:30pm here and 8:30 to 4:30 in the example. Press 1 now leaves a message for the team (their reference and number, no recording) rather than a voice message. The script makes clear that press 2 goes to an adviser outside the team.", "tbc": "Whether BAU advisers answer NewCo customers on press 2 is to be confirmed on 29 September."}, {"id": "FR2-02", "title": "Customer calls while the team is open", "t": "Scenario: Customer calls while the team is open\nGiven the customer’s reference matches an active NewCo cohort record\nAnd the NewCo team is within its operating hours\nWhen the call is routed\nThen the customer must join the NewCo queue for that team (FR8-24)\nAnd this must apply whether or not a NewCo agent is free\nAnd the unavailable message must not be played", "script": "", "st": "changed", "was": "Scenario: Customer calls when the line is open, but no NewCo agents are available\nGiven the current time is within the configured NewCo operating hours\nAnd no NewCo agents are available based on the agreed availability settings\nWhen a customer calls the NewCo line\nThen the IVR must play the approved unavailable message\nAnd the message must explain that no NewCo agents are currently available\nAnd the caller must be offered the option to leave a voicemail for a callback", "was_script": "Team busy (in hours, no agent free, or availability unknown):\nThe team looking after your case is busy helping other people right now. They know your case, and if you leave them a message, they'll call you back. Or an adviser can help you now.\nTo leave a message for your team, press 1. To speak to an adviser now, press 2.", "why": "While the team is open, cohort callers wait for their team rather than hearing an unavailable message (decided 26 September; FR8-24 says the same). FR2-03 and FR2-04 are merged in. A long wait is handled in the queue (FR8-N2 and FR8-N4)."}, {"id": "FR2-03", "title": "NewCo agent is available during operating hours", "t": "Scenario: NewCo agent is available during operating hours\nGiven the current time is within the configured NewCo operating hours\nAnd at least one eligible NewCo agent is available\nWhen a customer calls the NewCo line\nThen the call must follow the normal NewCo routing process\nAnd the out-of-hours or unavailable message must not be played", "script": "", "st": "merged", "was": "Scenario: NewCo agent is available during operating hours\nGiven the current time is within the configured NewCo operating hours\nAnd at least one eligible NewCo agent is available\nWhen a customer calls the NewCo line\nThen the call must follow the normal NewCo routing process\nAnd the out-of-hours or unavailable message must not be played", "was_script": "", "why": "Covered by FR2-02: the caller joins the NewCo queue whether or not an agent is free.", "into": "FR2-02"}, {"id": "FR2-04", "title": "NewCo availability cannot be determined", "t": "Scenario: NewCo availability cannot be determined\nGiven the current time is within the configured operating hours\nAnd the IVR cannot determine whether a NewCo agent is available\nWhen the customer reaches the availability check\nThen the IVR must play the approved unavailable message\nAnd the caller must be offered the option to leave a voicemail", "script": "", "st": "merged", "was": "Scenario: NewCo availability cannot be determined\nGiven the current time is within the configured operating hours\nAnd the IVR cannot determine whether a NewCo agent is available\nWhen the customer reaches the availability check\nThen the IVR must play the approved unavailable message\nAnd the caller must be offered the option to leave a voicemail", "was_script": "", "why": "Covered by FR2-02: availability no longer decides the route while the team is open.", "into": "FR2-02"}, {"id": "FR2-07", "title": "Customer doesn’t choose an option", "t": "Scenario: Customer doesn’t choose an option\nGiven the IVR has played the team-closed message\nWhen the customer does not press 1 or 2\nThen the IVR must play the approved closing message\nAnd the closing message must say when the team is open\nAnd the call must end", "script": "", "st": "changed", "was": "Scenario: Customer chooses not to leave a voicemail\nGiven the IVR has offered the customer the option to leave a voicemail\nWhen the customer declines or does not select the voicemail option\nThen the IVR must play the approved closing message\nAnd the closing message must explain how and when the customer can contact NewCo again\nAnd the call must end without being automatically transferred to the BAU contact centre", "was_script": "", "why": "Kept from the feature on redirection to BAU, which is removed. Press 2 now offers another adviser, so the rule against transferring to BAU no longer applies."}], "st": "changed", "why": "The team-closed options replace the unavailable message. While the team is open, callers wait in the NewCo queue. The example wording is replaced by the script under FR2-01.", "was_t": "Inform callers when the NewCo team is unavailable", "was_story": "As a customer calling the NewCo line,\nI want to receive a clear message when the team is unavailable,\nso that I understand why my call cannot be answered and what I can do next.\ni.e. “Our advisors currently unavailable to help you, Please leave a message with your reference number and an agent will call you back or, please call back Monday to Friday 8:30 – 4:30.”"}, {"id": "FR2-F2", "t": "Avoid inappropriate redirection to the BAU contact centre", "story": "As a customer calling when the NewCo team is unavailable,\nI want to be given an appropriate follow-up option,\nso that I am not transferred to a team that cannot fully answer my case-specific query.", "sc": [{"id": "FR2-05", "title": "Default out-of-hours message is played", "t": "Scenario: Default out-of-hours message is played\nGiven the customer has called outside NewCo operating hours\nWhen the IVR plays the default out-of-hours message\nThen the message must not direct the customer to contact the BAU contact centre\nAnd the message must offer the customer the option to leave a voicemail", "script": "", "st": "removed", "was": "Scenario: Default out-of-hours message is played\nGiven the customer has called outside NewCo operating hours\nWhen the IVR plays the default out-of-hours message\nThen the message must not direct the customer to contact the BAU contact centre\nAnd the message must offer the customer the option to leave a voicemail", "was_script": "", "why": "The team-closed message offers another adviser (FR2-01)."}, {"id": "FR2-06", "title": "No-agent message is played", "t": "Scenario: No-agent message is played\nGiven the NewCo line is open\nAnd no NewCo agents are available\nWhen the IVR plays the unavailable message\nThen the message must not direct the customer to contact the BAU contact centre\nAnd the message must offer the customer the option to leave a voicemail", "script": "", "st": "removed", "was": "Scenario: No-agent message is played\nGiven the NewCo line is open\nAnd no NewCo agents are available\nWhen the IVR plays the unavailable message\nThen the message must not direct the customer to contact the BAU contact centre\nAnd the message must offer the customer the option to leave a voicemail", "was_script": "", "why": "There is no unavailable message: while the team is open, callers wait in the NewCo queue (FR2-02)."}], "st": "removed", "why": "This feature said callers must not be directed to BAU. The team-closed options offer another adviser (FR2-01), as agreed on 26 September. Its third scenario now sits under FR2-01 as FR2-07."}, {"id": "FR2-F3", "t": "Take a message for the team (Given the NewCo team is closed, or the NewCo queue is busy and no callback is available, and the customer has pressed 1)", "story": "As a customer who can’t speak to my team now,\nI want to leave my number for them,\nso that I don’t have to call again.", "sc": [{"id": "FR2-08", "title": "Customer leaves a message for the team", "t": "Scenario: Customer leaves a message for the team\nGiven the customer has pressed 1 to leave a message for the team\nWhen the message starts\nThen the IVR must use the case reference number already given in the call (FR1-N7)\nAnd the IVR must capture the customer’s phone number automatically where it is not withheld (FR1-N8)\nAnd the IVR must read the number back for the customer to confirm\nAnd the customer must not be asked to record a voice message\nAnd the message must contain the case reference number and phone number only", "script": "", "st": "changed", "was": "Scenario: Customer chooses to leave a voicemail\nGiven the IVR has offered the voicemail option\nWhen the customer selects the option to leave a voicemail\nThen the IVR must play the approved voicemail instructions\nAnd the IVR must allow the customer to record a message", "was_script": "", "why": "A message for the team replaces the voice message. Merged with FR8-33."}, {"id": "FR2-09", "title": "The customer’s number is withheld or wrong", "t": "Scenario: The customer’s number is withheld or wrong\nGiven the customer’s number is withheld, or they say the number read back is wrong\nWhen the IVR asks for a number to call back on\nThen the customer must be able to enter a phone number on the keypad (FR1-N6)\nAnd the IVR must read it back for the customer to confirm\nAnd the number of attempts must follow the agreed retry rules", "script": "", "st": "changed", "was": "Scenario: Customer completes a voicemail recording\nGiven the customer is recording a voicemail\nWhen the customer completes and submits the recording\nThen the IVR must save the voicemail\nAnd the IVR must play a confirmation message\nAnd the confirmation must explain that the voicemail has been received for follow-up", "was_script": "", "why": "A message for the team replaces the voice message. Entering a number on the keypad is new (FR1-NF3)."}, {"id": "FR2-10", "title": "The message for the team is sent", "t": "Scenario: The message for the team is sent\nGiven the customer has confirmed the number to call back on\nWhen the IVR sends the message for the team\nThen it must go to the dedicated NewCo mailbox (FR2-13)\nAnd the customer must hear that the team will call them back, most likely on the next working day\nAnd the call must end after the confirmation message", "script": "", "st": "changed", "was": "Scenario: Customer does not record a message\nGiven the customer has selected the voicemail option\nWhen no audible message is captured within the configured time limit\nThen the IVR must inform the customer that no message was recorded\nAnd the IVR must offer another recording attempt in line with the agreed retry rules", "was_script": "", "why": "A message for the team replaces the voice message."}, {"id": "FR2-11", "title": "No valid number is captured", "t": "Scenario: No valid number is captured\nGiven the customer has not confirmed a valid number\nAnd the maximum number of attempts has been reached\nWhen the final attempt ends\nThen the IVR must play the approved closing message\nAnd the call must end without creating an empty message for the team", "script": "", "st": "changed", "was": "Scenario: Customer reaches the maximum number of recording attempts\nGiven the customer has not successfully recorded a voicemail\nAnd the maximum number of recording attempts has been reached\nWhen the final recording attempt ends\nThen the IVR must play the approved closing message\nAnd the call must end without creating an empty voicemail work item", "was_script": "", "why": "A message for the team replaces the voice message."}, {"id": "FR2-12", "title": "The mailbox cannot take the request", "t": "Scenario: The mailbox cannot take the request\nGiven the customer has chosen to leave a message for the team\nAnd the message cannot be sent\nWhen the IVR tries to send it\nThen the IVR must play an approved service-unavailable message\nAnd the message must say when the team is open\nAnd the customer must be offered the BAU route to speak to another adviser\nAnd the service failure must be recorded", "script": "", "st": "changed", "was": "Scenario: Voicemail service is unavailable\nGiven the NewCo team is unavailable\nAnd the voicemail service cannot accept a recording\nWhen the customer selects the voicemail option\nThen the IVR must play an approved service-unavailable message\nAnd the message must explain how and when the customer can contact NewCo again", "was_script": "", "why": "Merged with FR8-34, which offers the BAU route rather than ending the call. A message for the team replaces the voice message."}], "st": "changed", "why": "The developers confirmed on 28 September that the phone line can email the reference and phone number to the team without a voice message. That is the better experience: nothing to record or re-record, no failed recordings, it works for customers whose condition affects their speech, and the team already has the case from the reference. A voice mailbox is only needed to capture things like a name or reason for calling, which the team can ask when they call back. It replaces voicemail, and is offered when the team is closed or when the queue is busy and no callback is available (FR8-N4).", "was_t": "Offer a voicemail callback option (Given the NewCo team is unavailable and the IVR has played the approved out-of-hours or unavailable message)", "was_story": "As a customer calling when a NewCo agent is unavailable,\nI want to leave a voicemail requesting a callback,\nso that the NewCo team can review my query and contact me.\ni.e. “We're currently experiencing high demand and waiting times are longer than usual. You can continue to hold, switch to webchat by receiving a link via text message, or leave a voicemail and we'll contact you back. Press 1 for a webchat link, press 2 to leave a voicemail, or stay on the line to continue waiting.”"}, {"id": "FR2-F4", "t": "Deliver messages for the team to a dedicated NewCo mailbox", "story": "As a NewCo agent,\nI want customers’ messages for the team delivered to a dedicated NewCo mailbox,\nso that the team can access and manage them from one controlled location.", "sc": [{"id": "FR2-13", "title": "Successfully deliver a message for the team", "t": "Scenario: Successfully deliver a message for the team\nGiven the customer has confirmed their message for the team\nWhen the IVR sends it\nThen it must be delivered as an email to the dedicated NewCo mailbox\nAnd it must include the case reference number and the phone number to call back on\nAnd it must be available only to authorised users", "script": "", "st": "changed", "was": "Scenario: Successfully deliver a voicemail\nGiven the customer has completed and submitted a voicemail\nWhen the IVR processes the recording\nThen the voicemail must be delivered as a playable voice clip\nAnd the voice clip must be delivered to the dedicated NewCo mailbox\nAnd the voicemail must be available only to authorised users", "was_script": "", "why": "An email with the reference and number replaces the voice clip."}, {"id": "FR2-14", "title": "Provide information to support callback management", "t": "Scenario: Provide information to support callback management\nGiven a message for the team has been successfully delivered\nWhen it appears in the dedicated NewCo mailbox\nThen it must include the date and time it was received\nAnd it must show whether the team was closed or the queue was busy\nAnd it must show that the item originated from the IVR", "script": "", "st": "changed", "was": "Scenario: Provide information to support voicemail management\nGiven a voicemail has been successfully delivered\nWhen the voicemail appears in the dedicated NewCo mailbox\nThen the work item must include the date and time it was received\nAnd it must include the originating telephone number where technically available and permitted\nAnd it must show that the item originated from the IVR voicemail service", "was_script": "", "why": "The phone number is now always included (FR2-13). Adds why the customer couldn’t get through, which helps the team plan."}, {"id": "FR2-15", "title": "Message delivery fails", "t": "Scenario: Message delivery fails\nGiven the customer has confirmed a message for the team\nWhen the message for the team cannot be delivered to the dedicated NewCo mailbox\nThen the delivery failure must be recorded\nAnd the appropriate support team must be alerted in accordance with the agreed support process\nAnd the message for the team must be retained for an agreed period to allow delivery to be retried", "script": "", "st": "changed", "was": "Scenario: Voicemail delivery fails\nGiven the customer has completed a voicemail recording\nWhen the recording cannot be delivered to the dedicated NewCo mailbox\nThen the delivery failure must be recorded\nAnd the appropriate support team must be alerted in accordance with the agreed support process\nAnd the recording must be retained for an agreed period to allow delivery to be retried", "was_script": "", "why": "Messages for the team replace voicemail."}, {"id": "FR2-16", "title": "Message delivery is retried", "t": "Scenario: Message delivery is retried\nGiven a message delivery attempt has failed\nAnd the message for the team remains available for retry\nWhen the configured retry process is triggered\nThen the system must attempt to deliver the message for the team again\nAnd the outcome of the retry must be recorded", "script": "", "st": "changed", "was": "Scenario: Voicemail delivery is retried\nGiven a voicemail delivery attempt has failed\nAnd the recording remains available for retry\nWhen the configured retry process is triggered\nThen the system must attempt to deliver the recording again\nAnd the outcome of the retry must be recorded", "was_script": "", "why": "Messages for the team replace voicemail."}, {"id": "FR2-17", "title": "Unauthorised user attempts to access the mailbox", "t": "Scenario: Unauthorised user attempts to access the mailbox\nGiven the dedicated NewCo mailbox contains customer messages for the team\nAnd a user does not have the required access permission\nWhen the user attempts to access the mailbox\nThen access must be denied\nAnd the attempted access must be managed in accordance with the applicable security policy", "script": "", "st": "changed", "was": "Scenario: Unauthorised user attempts to access the mailbox\nGiven the dedicated NewCo mailbox contains customer voicemail recordings\nAnd a user does not have the required access permission\nWhen the user attempts to access the mailbox\nThen access must be denied\nAnd the attempted access must be managed in accordance with the applicable security policy", "was_script": "", "why": "Messages for the team replace voicemail."}], "st": "changed", "why": "Messages for the team arrive by email, with no voice clip.", "was_t": "Deliver voicemail recordings to a dedicated NewCo mailbox", "was_story": "As a NewCo agent,\nI want customer voicemail recordings delivered to a dedicated NewCo mailbox,\nso that the team can access and manage callback requests from one controlled location."}, {"id": "FR2-F5", "t": "Manage messages for the team as a formal NewCo workstream", "story": "As a NewCo team manager,\nI want messages for the team to be managed as a formal workstream,\nso that they can be prioritised, assigned and completed alongside web chat and casework.", "sc": [{"id": "FR2-18", "title": "New message for the team enters the workstream", "t": "Scenario: New message for the team enters the workstream\nGiven a message for the team has been delivered to the dedicated NewCo mailbox\nWhen it becomes available to the NewCo team\nThen it must be identifiable as a new callback work item\nAnd it must be available for triage and assignment", "script": "", "st": "changed", "was": "Scenario: New voicemail enters the workstream\nGiven a NewCo customer voicemail has been delivered to the dedicated NewCo mailbox\nWhen the voicemail becomes available to the NewCo team\nThen it must be identifiable as a new callback work item\nAnd it must be available for triage and assignment", "was_script": "", "why": "Messages for the team replace voicemail."}, {"id": "FR2-19", "title": "Agent takes ownership of a message for the team", "t": "Scenario: Agent takes ownership of a message for the team\nGiven a callback work item has not been assigned\nWhen an authorised Agent accepts the work item\nThen the work item must be marked as assigned\nAnd the responsible Agent must be identifiable\nAnd other Agents must be able to see that the item is being handled", "script": "", "st": "changed", "was": "Scenario: Agent takes ownership of a voicemail\nGiven a voicemail callback work item has not been assigned\nWhen an authorised Agent accepts the work item\nThen the work item must be marked as assigned\nAnd the responsible Agent must be identifiable\nAnd other Agents must be able to see that the item is being handled", "was_script": "", "why": "Messages for the team replace voicemail."}, {"id": "FR2-20", "title": "Agent reviews the case before calling the customer", "t": "Scenario: Agent reviews the case before calling the customer\nGiven a callback work item has been assigned to an Agent\nWhen the Agent prepares to make the callback\nThen the Agent must be able to open the case using the reference in the request\nAnd the Agent must be able to review the case before initiating the callback", "script": "", "st": "changed", "was": "Scenario: Agent reviews the voicemail before calling the customer\nGiven a voicemail work item has been assigned to an Agent\nWhen the Agent prepares to make the callback\nThen the Agent must be able to play the voice clip\nAnd the Agent must be able to review the customer's query before initiating the callback", "was_script": "", "why": "There is no voice clip to play. The reference opens the case."}, {"id": "FR2-21", "title": "Callback work item is completed", "t": "Scenario: Callback work item is completed\nGiven an Agent has reviewed the case\nAnd the callback has been attempted or completed\nWhen the Agent updates the work item\nThen the callback outcome must be recorded\nAnd the date and time of the callback attempt must be recorded\nAnd the work item status must be updated", "script": "", "st": "changed", "was": "Scenario: Callback work item is completed\nGiven an Agent has reviewed the voicemail\nAnd the callback has been attempted or completed\nWhen the Agent updates the work item\nThen the callback outcome must be recorded\nAnd the date and time of the callback attempt must be recorded\nAnd the work item status must be updated", "was_script": "", "why": "Messages for the team replace voicemail."}, {"id": "FR2-22", "title": "Message for the team has not been actioned within the agreed service level", "t": "Scenario: Message for the team has not been actioned within the agreed service level\nGiven a callback work item remains open\nAnd the agreed callback service level has been exceeded\nWhen the workstream is monitored\nThen the work item must be highlighted or escalated in accordance with the agreed operating process", "script": "", "st": "changed", "was": "Scenario: Voicemail has not been actioned within the agreed service level\nGiven a voicemail callback work item remains open\nAnd the agreed callback service level has been exceeded\nWhen the workstream is monitored\nThen the work item must be highlighted or escalated in accordance with the agreed operating process", "was_script": "", "why": "Messages for the team replace voicemail."}], "st": "changed", "why": "Messages for the team replace voicemail.", "was_t": "Manage voicemail as a formal NewCo workstream", "was_story": "As a NewCo team manager,\nI want voicemail callback requests to be managed as a formal workstream,\nso that they can be prioritised, assigned and completed alongside web chat and casework."}], "was_title": "Out-of-Hours and No-Agent Handling", "why": "FR2 now covers what happens when the team can’t answer: it is closed, or the queue is busy and no callback is available. The customer can ask the team to call them back, and the request goes to the team’s mailbox by email. FR8 covers triage and the queue. The out-of-hours options in FR8-32 to FR8-34 have moved here."}, {"code": "FR3", "title": "Agent Availability & Demand Management (Storm/SBT)", "features": [{"id": "FR3-F1", "t": "Configure IVR demand management controls", "story": "As an authorised service administrator,\nI want to configure demand-management rules within Storm/SBT,\nso that call volumes can be managed when Agent availability is low or waiting times are high.", "sc": [{"id": "FR3-01", "title": "Configure a queue-time threshold", "t": "Scenario: Configure a queue-time threshold\nGiven the user is authorised to manage IVR routing settings\nWhen the user configures an agreed maximum queue-time threshold\nThen the threshold must be saved in Storm/SBT\nAnd the threshold must be available to the IVR routing process\nAnd the change must not require a software deployment", "script": "", "st": "same"}, {"id": "FR3-02", "title": "Configure an Agent-availability threshold", "t": "Scenario: Configure an Agent-availability threshold\nGiven the user is authorised to manage IVR routing settings\nWhen the user configures an agreed minimum number of available Agents\nThen the threshold must be saved in Storm/SBT\nAnd the threshold must be available to the IVR routing process\nAnd the change must not require a software deployment", "script": "", "st": "same"}, {"id": "FR3-03", "title": "Configure the response to a threshold breach", "t": "Scenario: Configure the response to a threshold breach\nGiven a queue-time or Agent-availability threshold has been configured\nWhen an authorised user assigns an agreed demand-management response\nThen the response must be saved against the relevant threshold\nAnd the response must be one of the supported options\nAnd the configuration must identify the IVR route or queue to which it applies", "script": "", "st": "same"}, {"id": "FR3-04", "title": "Change a configured threshold", "t": "Scenario: Change a configured threshold\nGiven a demand management threshold is active\nWhen an authorised user changes the threshold\nThen the revised threshold must be applied within the agreed implementation time\nAnd the previous configuration must be retained in the audit history", "script": "", "st": "same"}, {"id": "FR3-05", "title": "Unauthorised user attempts to change a threshold", "t": "Scenario: Unauthorised user attempts to change a threshold\nGiven the user does not have permission to manage IVR routing settings\nWhen the user attempts to change a demand-management threshold or response\nThen the change must be rejected", "script": "", "st": "same"}], "st": "same"}, {"id": "FR3-F2", "t": "Manage demand using the queue-time threshold (Given an agreed queue-time threshold has been configured in Storm/SBT and an approved demand-management response has been assigned to the threshold)", "story": "As an operational manager,\nI want the IVR to apply a configured response when expected queue time becomes too long,\nso that additional calls do not create unmanaged demand.", "sc": [{"id": "FR3-06", "title": "Queue time remains within the threshold", "t": "Scenario: Queue time remains within the threshold\nGiven the current queue time is equal to or below the configured threshold\nWhen

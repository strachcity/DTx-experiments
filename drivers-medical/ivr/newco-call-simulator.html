<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewCo call simulator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

/* --- Palette and govuk-* layer: copied from components.html. --- */
:root{--black:#0b0c0c;--white:#fff;--blue:#1d70b8;--link:#1a65a6;--link-hover:#0f385c;--dark-blue:#0f385c;--green:#0f7a52;--green-hover:#0b5c3e;--green-shade:#083d29;--yellow:#fd0;--light-yellow:#fff7bf;--light-grey:#f4f8fb;--mid-grey:#cecece;--dark-grey:#484949;--red:#ca3535;--red-shade:#651b1b;--purple:#54319f;--focus:#fd0;--focus-text:#0b0c0c}
*,*::before,*::after{box-sizing:border-box}
body{font-family:"GDS Transport","Inter",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--black);background:var(--white);margin:0;padding:0;line-height:1.5;font-size:19px}

/* --- Header --- */
.govuk-header{background:var(--blue);color:var(--white);padding:10px 0}
.govuk-header__container{max-width:960px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:10px}
.govuk-header__homepage-link{display:inline-flex;align-items:center;color:var(--white);text-decoration:none}
.govuk-header__homepage-link:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.govuk-header__logotype{height:30px;width:162px;fill:currentcolor}
.service-nav{border-bottom:1px solid var(--mid-grey);background:var(--white);padding:12px 0}
.service-nav__wrapper{max-width:960px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.service-nav__name{font-weight:700;font-size:19px;color:var(--black);text-decoration:none}
.govuk-phase-banner{border-bottom:1px solid var(--mid-grey);padding:10px 0}
.govuk-phase-banner__wrapper{max-width:960px;margin:0 auto;padding:0 15px;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.govuk-phase-banner__tag{display:inline-block;background:var(--blue);color:var(--white);font-weight:700;font-size:14px;padding:2px 8px;text-transform:uppercase;letter-spacing:1px}
.phase-actions{margin-left:auto;display:flex;gap:15px;align-items:center}
.phase-actions a{font-size:16px;cursor:pointer}
.prototype-warning{background:var(--light-yellow);border:4px solid var(--yellow);padding:15px 20px;margin-bottom:30px;font-size:16px;line-height:1.5}
.prototype-warning strong{display:block;margin-bottom:4px}
.govuk-width-container{max-width:960px;margin:0 auto;padding:0 15px}
.govuk-main-wrapper{padding:30px 0 60px}
.govuk-skip-link{position:absolute;left:-9999px;top:0;background:var(--yellow);color:var(--black);padding:10px 15px;font-weight:700;z-index:10}
.govuk-skip-link:focus{left:0}

/* --- Typography --- */
h1,.govuk-heading-xl{font-size:48px;line-height:1.04;font-weight:700;margin:0 0 30px}
h2,.govuk-heading-l{font-size:36px;line-height:1.11;font-weight:700;margin:30px 0 20px}
h3,.govuk-heading-m{font-size:24px;line-height:1.25;font-weight:700;margin:20px 0 15px}
h4,.govuk-heading-s{font-size:19px;line-height:1.3;font-weight:700;margin:15px 0 10px}
p,.govuk-body{font-size:19px;margin:0 0 20px}
.govuk-body-s{font-size:16px}
.govuk-body-l{font-size:24px;line-height:1.25;margin:0 0 20px}
.govuk-caption{font-size:24px;color:var(--dark-grey);display:block;margin-bottom:5px}
a{color:var(--link)}a:hover{color:var(--link-hover)}
a:visited{color:var(--purple)}
a:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--focus-text);text-decoration:none}
.govuk-list{margin:0 0 20px;padding:0;list-style:none}
.govuk-list>li{margin-bottom:5px}
.govuk-list--bullet{list-style:disc;padding-left:20px}
.govuk-list--number{list-style:decimal;padding-left:20px}
.govuk-visually-hidden{position:absolute!important;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);border:0;white-space:nowrap}
hr.govuk-section-break{border:none;border-bottom:1px solid var(--mid-grey);margin:30px 0}
.govuk-back-link{display:inline-block;margin-bottom:15px;font-size:16px;color:var(--black);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.govuk-back-link::before{content:"\25c2 "}

/* --- Buttons --- */
.govuk-button{display:inline-block;padding:8px 20px;font-size:19px;font-weight:700;color:var(--white);background:var(--green);border:none;border-radius:0;border-bottom:2px solid var(--green-shade);cursor:pointer;text-decoration:none;line-height:1.2;-webkit-appearance:none;font-family:inherit}
.govuk-button:hover{background:var(--green-hover);color:var(--white)}
.govuk-button:focus{outline:3px solid var(--focus);outline-offset:0}
.govuk-button--secondary{background:#f3f3f3;color:var(--black);border-bottom-color:#858686}
.govuk-button--secondary:hover{background:#dbdad9;color:var(--black)}
.govuk-button-group{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin-top:20px}

/* --- Forms --- */
.govuk-form-group{margin-bottom:30px}
.govuk-fieldset{border:0;margin:0;padding:0}
.govuk-fieldset__legend{font-weight:700;font-size:19px;margin-bottom:10px;display:block}
.govuk-checkboxes__item{display:flex;align-items:flex-start;margin-bottom:15px;gap:12px}
.govuk-checkboxes__input{width:44px;height:44px;min-width:44px;margin:0;cursor:pointer;accent-color:var(--black)}
.govuk-checkboxes__label{font-size:19px;padding-top:10px;cursor:pointer}
.govuk-checkboxes__hint{font-size:16px;color:var(--dark-grey);margin-top:2px;display:block}
.govuk-label{display:block;font-weight:700;margin-bottom:5px}
.govuk-hint{font-size:16px;color:var(--dark-grey);margin-bottom:10px;display:block}
.govuk-select{font-family:inherit;font-size:19px;padding:5px 10px;border:2px solid var(--black);max-width:100%;background:var(--white)}
.govuk-select:focus{outline:3px solid var(--focus);outline-offset:0}

/* --- Summary list / table --- */
.govuk-summary-list{border-top:1px solid var(--mid-grey);margin:0 0 30px}
.govuk-summary-list__row{display:flex;border-bottom:1px solid var(--mid-grey);padding:12px 0;gap:15px}
.govuk-summary-list__key{flex:0 0 40%;font-weight:700}
.govuk-summary-list__value{flex:1}
@media(max-width:640px){.govuk-summary-list__row{flex-direction:column;gap:4px}.govuk-summary-list__key{flex:auto}}
.govuk-table{width:100%;border-collapse:collapse;margin-bottom:30px}
.govuk-table th{text-align:left;font-weight:700;padding:10px 15px 10px 0;border-bottom:2px solid var(--black)}
.govuk-table td{padding:10px 15px 10px 0;border-bottom:1px solid var(--mid-grey);vertical-align:top}

/* --- Tags / panels / content --- */
.govuk-tag{display:inline-block;font-size:19px;line-height:1.32;font-weight:700;padding:2px 8px 3px;border-radius:1px;max-width:160px;overflow-wrap:break-word;color:#0f385c;background:#d2e2f1}
.govuk-tag--blue{color:#0f385c;background:#d2e2f1}
.govuk-tag--green{color:#083d29;background:#cfe4dc}
.govuk-tag--purple{color:#2a1950;background:#ddd6ec}
.govuk-tag--red{color:#651b1b;background:#f4d7d7}
.govuk-tag--orange{color:#7a3c1c;background:#fde4d7}
.govuk-tag--teal{color:#0b4144;background:#d0e6e7}
.govuk-tag--yellow{color:#7a3c1c;background:#ffee80}
.govuk-tag--grey{color:#0b0c0c;background:#cecece}
.govuk-inset-text{border-left:10px solid var(--mid-grey);padding:15px 20px;margin:0 0 30px}
.govuk-details{margin-bottom:30px;display:block}
.govuk-details__summary{color:var(--link);cursor:pointer;text-decoration:underline;font-size:19px;margin-bottom:5px}
.govuk-details__summary:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--focus-text);text-decoration:none}
.govuk-details__text{border-left:5px solid var(--mid-grey);padding:15px 20px;font-size:19px}
.govuk-notification-banner{border:5px solid var(--blue);margin-bottom:30px}
.govuk-notification-banner__header{background:var(--blue);color:var(--white);padding:8px 15px;font-size:19px;font-weight:700}
.govuk-notification-banner__title{margin:0;font-size:19px}
.govuk-notification-banner__content{padding:20px 15px;font-size:19px}
.govuk-notification-banner__heading{font-size:24px;font-weight:700;margin:0 0 10px}

/* --- Footer --- */
.govuk-footer{background:var(--light-grey);border-top:10px solid var(--blue);padding:30px 0;margin-top:60px}
.govuk-footer__wrapper{max-width:960px;margin:0 auto;padding:0 15px}
.govuk-footer__meta-item{font-size:16px;color:var(--dark-grey)}

/* --- Design notes. Prototype annotation, never service UI. --- */
.design-note{border:2px dashed var(--purple);background:#f7f4fc;padding:15px 20px;margin:0 0 25px;font-size:16px}
.design-note strong{display:block;color:var(--purple);text-transform:uppercase;letter-spacing:1px;font-size:14px;margin-bottom:6px}
.design-note p{font-size:16px;margin:0 0 8px}
.design-note p:last-child{margin:0}

/* === Specific to this prototype. The phone, the scenario panel and the
       call transcript. None of this belongs in components.html. === */
.screen-index{list-style:none;margin:0 0 30px;padding:0}
.screen-index li{margin-bottom:18px}
.screen-index a{font-size:19px;font-weight:700}
.screen-index p{margin:2px 0 0;font-size:16px;color:var(--dark-grey)}

.sim{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap}
.sim__phone{flex:0 0 330px;max-width:100%;position:sticky;top:15px}
.sim__side{flex:1 1 380px;min-width:0}
@media(max-width:760px){.sim__phone{position:static;margin:0 auto}}

.phone{background:#1c1d21;border-radius:44px;padding:16px 18px 24px;color:#fff;box-shadow:inset 0 0 0 3px #3a3b40;width:330px;max-width:100%}
.phone.is-ringing .phone__screen{animation:buzz .5s linear infinite}
@keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media(prefers-reduced-motion:reduce){.phone.is-ringing .phone__screen{animation:none}.bars span{animation:none!important}}
.phone__notch{width:90px;height:22px;background:#000;border-radius:12px;margin:0 auto 10px}
.phone__screen{min-height:250px;text-align:center;padding:4px 4px 10px}
.phone__name{font-size:22px;font-weight:700;margin:0;line-height:1.3}
.phone__status{font-size:16px;color:#c8c9cc;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.phone__subs{background:rgba(255,255,255,.09);border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.4;text-align:left;min-height:110px}
.phone__subs p{font-size:16px;margin:0}
.phone__who{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:#aeb0b5;margin-bottom:4px}
.phone__subs mark.ph{background:#5a4d00;color:#fff;border-bottom-color:#fd0}
.phone__digits{font-size:26px;letter-spacing:3px;min-height:38px;margin-top:8px;font-variant-numeric:tabular-nums;word-break:break-all}
.phone__listen{font-size:14px;color:#c8c9cc;min-height:21px}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bars span{width:3px;background:#aeb0b5;height:4px;animation:bar 1s ease-in-out infinite}
.bars span:nth-child(2){animation-delay:.2s}.bars span:nth-child(3){animation-delay:.4s}
@keyframes bar{0%,100%{height:3px}50%{height:12px}}
.keypad{display:grid;grid-template-columns:repeat(3,70px);gap:12px 22px;justify-content:center;margin:4px 0 14px}
.key{width:70px;height:70px;border-radius:50%;border:none;background:#3a3b41;color:#fff;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.key:hover{background:#4a4b52}
.key:active,.key.is-pressed{background:#76777f}
.key:focus-visible,.callbtn:focus-visible,.say:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.key__n{font-size:30px}
.key__l{font-size:10px;letter-spacing:2px;margin-top:3px;color:#c8c9cc;min-height:10px}
.phone__say{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.phone__say-label{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#aeb0b5;text-align:center}
.say{background:transparent;color:#fff;border:2px solid #6b6c74;border-radius:22px;padding:7px 14px;font-family:inherit;font-size:16px;cursor:pointer;text-align:left}
.say:hover{border-color:#fff}
.phone__actions{display:flex;justify-content:center;gap:48px}
.callbtn{width:70px;height:70px;border-radius:50%;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
.callbtn svg{width:32px;height:32px;fill:currentcolor}
.callbtn--go{background:var(--green)}.callbtn--go:hover{background:var(--green-hover)}
.callbtn--end{background:var(--red)}.callbtn--end:hover{background:#a82b2b}
.callbtn--end svg{transform:rotate(135deg)}
.sim__controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:15px;min-height:44px}
.sim__controls .govuk-button{font-size:16px;padding:7px 14px}
.sim__hint{font-size:14px;color:var(--dark-grey);text-align:center;margin:10px 0 0}

.scenario{border:1px solid var(--mid-grey);background:var(--light-grey);padding:20px 20px 5px;margin-bottom:30px}
.scenario .govuk-form-group{margin-bottom:15px}
.scenario .govuk-select{width:100%}
.scenario h2{margin-top:0}
.letter{background:var(--white);border:1px solid var(--mid-grey);padding:12px 15px;margin:0 0 20px;font-size:16px}
.letter p{font-size:16px;margin:0}
.letter__ref{font-size:24px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums}
.scenario .govuk-details__text{background:var(--white)}
.scenario .govuk-checkboxes__label{font-size:16px}
.changed-flag{font-size:16px;font-weight:700;color:#7a3c1c}

.tag-key{list-style:none;margin:0 0 20px;padding:0;font-size:16px}
.tag-key li{margin-bottom:8px}
.log-tag{font-size:14px;max-width:none;padding:1px 6px;vertical-align:middle}
.call-log{list-style:none;margin:0 0 30px;padding:0;border-top:1px solid var(--mid-grey);max-height:640px;overflow:auto}
.log{display:flex;gap:12px;padding:10px 4px 10px 0;border-bottom:1px solid var(--mid-grey);font-size:16px}
.log p{font-size:16px;margin:4px 0 0}
.log__time{flex:0 0 52px;color:var(--dark-grey);font-variant-numeric:tabular-nums}
.log__body{flex:1;min-width:0}
.log__who{font-weight:700;margin-right:6px}
.log__hint{color:var(--dark-grey);font-size:14px;margin-left:4px}
.log--press .log__body{font-weight:700}
.log--sys .log__body,.log--time .log__body{color:var(--dark-grey)}
.log--gap .log__body{border-left:4px solid #7a3c1c;padding-left:10px}
.log__meta{font-size:14px;color:var(--purple);margin-top:4px}
.log__meta a{color:var(--purple)}
.empty-log{font-size:16px;color:var(--dark-grey);padding:10px 0}
mark.ph{background:var(--light-yellow);color:inherit;border-bottom:2px dotted #7a3c1c;padding:0 2px}
</style>
</head>

<div id="app"></div>
<footer class="govuk-footer" role="contentinfo">
  <div class="govuk-footer__wrapper">
    <p class="govuk-footer__meta-item">NewCo call simulator &mdash; Fictional, for workshop use only. Not a real GOV.UK service. Every caller, reference and phone number is invented.</p>
  </div>
</footer>

<script>
/* ================================================================
   NEWCO CALL SIMULATOR
   Plays the phone route from newco-routing-map.html as a call: the
   phone line reads each prompt aloud, and the caller answers on a
   keypad. The route and the NewCo scripts are copied from the map, so
   the call follows exactly what the map says, gaps included.
   ================================================================ */
(function(){

/* ====================================================================
   COPIED FROM newco-routing-map.html at commit ffcda25 (28 September).
   Do not edit here. When the map changes, paste its SCRIPTS and PHONE
   consts over these two, unchanged.
   ==================================================================== */
const SCRIPTS = {

  ref_format:{n:"Reference in the wrong format",src:"sug",t:"Sorry, we need the 9 digits next to \u201cOur reference\u201d at the top of your letter. Please try again."},
  fn_connect:{n:"Connecting to a NewCo agent",src:"req",req:"FR1-08",t:"Thank you. We’re putting you through to an adviser."},

  queue_msg:{n:"Waiting in the NewCo queue",src:"sug",t:"You're in the queue for the team looking after your case. [Estimated wait.]"},
  queue_cb:{n:"Callback offer in the NewCo queue",src:"sug",t:"You're waiting longer than usual. If you'd like the team looking after your case to call you back instead, press 1. Or stay on the line."},
  callback_ok:{n:"Callback confirmed",src:"sug",t:"We'll keep your place in the queue and call you back when it's your turn. Please keep your phone nearby. If you miss the call, you'll need to call us again."},
  team_closed:{n:"Team closed, BAU open",src:"req",req:"FR2-01",note:"Working answer for [days and hours]: Monday to Friday, 8am to 4pm (subject to approval).",t:"The team looking after your case is closed at the moment. They’re open [days and hours]. You can ask them to call you back. Or you can speak to another adviser now. They’re not part of your team, but they can help with most things.\nTo ask your team to call you back, press 1. To speak to another adviser now, press 2."},
  closing:{n:"Closing message",src:"sug",t:"Thank you for calling. The team looking after your case is open Monday to Friday, 8am to 4pm. Please call back then, and have our reference number ready. Goodbye.",note:"Hours are provisional."},

  busy_msg:{n:"Team busy, no callback available",src:"sug",t:"The team looking after your case is busy helping other people right now. You can ask them to call you back, or stay on the line and keep your place.\nTo ask your team to call you back, press 1. Or stay on the line."},
  cb_req_rb:{n:"Confirming the number for a callback request",src:"sug",t:"We’ll ask the team looking after your case to call you back on the number ending [last 3 digits]. If that’s right, press 1. To give a different number, press 2."},
  cb_req_enter:{n:"Entering a number for a callback request",src:"sug",t:"Please enter the number we should call you back on, then press hash.",note:"Keypad entry is new (FR1-NF3)."},
  cb_req_ok:{n:"Callback request sent",src:"sug",t:"Thank you. We’ve sent your request to the team looking after your case. They aim to call you back [by the end of the next working day]. Goodbye.",note:"How soon the team calls back is for the team to decide."},
  cb_req_unavail:{n:"Callback request can’t be sent",src:"sug",t:"Sorry, we can’t send your request at the moment. We’re putting you through to another adviser instead. They’re not part of your team, but they can help with most things. The team looking after your case is open Monday to Friday, 8am to 4pm.",note:"Hours are provisional. Follows FR2-12."},
  ref_where:{n:"No reference to hand",src:"sug",t:"Our reference is the 9-digit number at the top of every letter we send you. If you can't find it, stay on the line and an adviser will help you."},
  agent_ref:{n:"NewCo agent, end of a first notification",src:"sug",who:"Agent",t:"Your case reference number is [number]. Please keep it safe, and have it ready whenever you contact us. From [the next working day], it will put you through to the team looking after your case."},
  w_connect:{n:"Connecting to the team",src:"req",req:"FR4-01",t:"You're being connected to the team looking after your case."},
  w_queue:{n:"Waiting in the NewCo queue",src:"sug",t:"You're in the queue for the team looking after your case. [Position or estimated wait.]"},
  w_team_closed:{n:"Team closed",src:"sug",t:"The team looking after your case is closed at the moment. They’re open Monday to Friday, 8am to 4pm. We’re connecting you to another adviser. They’re not part of your team, but they can help with most things.",note:"Hours are provisional."}

const PHONE = {
  key:"phone", name:"Phone", sys:"Phone line", start:"p_start",
  lanes:[
    {id:"p1",t:"Every call starts here",nodes:[
      {id:"p_start",type:"step",k:"today",l:"Customer calls the DVLA medical line",d:"One number for everyone.",r:["FR1-01"]},
      {id:"p_open",type:"q",k:"today",l:"Are BAU phone lines open?",d:"The phone line is open 8am to 7pm. Outside these hours it says it's closed, as it does today. Out-of-hours callback requests for NewCo customers are a future gap."},
      {id:"p_closed",type:"end",k:"today",asis:true,l:"Existing closed message. Call ends.",d:"Plays before the NewCo branch: the call only branches to NewCo once the reference is asked for."},

      {id:"p_msgs",type:"step",k:"today",asis:true,l:"Told the wait time and that web chat may be quicker",d:"If web chat is closed, it isn't described as available.",r:["FR8-01","FR8-03"]},
      {id:"p_wcq",type:"q",k:"today",dflt:"Carries on by phone",l:"Does the caller choose web chat?",r:["FR8-02","FR8-04"]},
      {id:"p_wcend",type:"end",k:"today",l:"Sent a text with the web chat link. Not added to the queue.",d:"The text described in FR4-F2.",r:["FR8-02"]},

   ==================================================================== */
const NODE = {}, OUT = {}, LANE = {};

PHONE.lanes.forEach(ln=>ln.edges.forEach(e=>OUT[e[0]].push({to:e[1], l:e[2]||""})));
function next(id, label){
  const o = OUT[id], e = label==null ? o[0] : o.find(x=>x.l===label);
  if(!e) throw new Error("The map has no route from "+id+" for “"+label+"”");

/* ====================================================================

const state = {};

function newCall(){
  return {phase:"idle", sim:0, log:[], route:[], turn:0, listen:null, buffer:"",

    speaking:null, hold:null, humanAt:null, prompts:0, presses:0, gaps:0, outcome:null, endId:null};

/* ====================================================================
   Helpers
   ==================================================================== */
const $ = s=>document.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function note(title, body){
  if(!state.showNotes) return "";
  return '<div class="design-note"><strong>Design note — '+esc(title)+'</strong>'+body+'</div>';
}
function tag(kind){ const k=KINDS[kind]; return '<strong class="govuk-tag log-tag '+k.c+'">'+esc(k.t)+'</strong>'; }
function clock(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
function dur(s){ const m=Math.floor(s/60), r=s%60; return (m? m+" min ":"")+r+" sec"; }
function spacedRef(r){ return r.replace(/(\d{3})(\d{3})(\d{3})/,"$1 $2 $3"); }
function spacedPhone(p){ return p.replace(/^(\d{5})(\d{3})(\d+)$/,"$1 $2 $3"); }
function sayDigits(d){ return d.split("").join(" ").replace(/(\d \d \d) /g,"$1, "); }
function mapLink(id){ return 'newco-routing-map.html#/map/phone/'+id; }
function words(t){ return t.split(/\s+/).filter(Boolean).length; }


/* ====================================================================
   Prompts: which wording a step has, and its placeholders filled in
   ==================================================================== */
function promptOf(id){
  const n = NODE[id];
  if(n.sc && n.sc.length){ const s=SCRIPTS[n.sc[0]]; return {text:s.t, kind:s.src, who:s.who==="Agent"?"newco":"ivr", sc:n.sc[0]}; }
  if(ASIS[id]) return {text:typeof ASIS[id]==="function"?ASIS[id]():ASIS[id], kind:"asis", who:"ivr"};
  if(GAP[id])  return {text:GAP[id], kind:"gap", who:"ivr"};
  return null;
}
function phValue(key){
  const call = state.call || {}, cust = CUST();
  const num = call.cbNumber || cust.phone;
  switch(key){
    case "Estimated wait.": { const w=C().newcoWaitLong?WAITS.newcoLong:WAITS.newcoShort; return {show:"Your estimated wait is about "+w+" minutes.", say:"Your estimated wait is about "+w+" minutes."}; }
    case "bau wait": { const w=C().bauWaitLong?WAITS.bauLong:WAITS.bauShort; return {show:w+" minutes", say:w+" minutes"}; }
    case "last 3 digits": return {show:num.slice(-3), say:sayDigits(num.slice(-3))};
    case "caller number": return {show:spacedPhone(num), say:sayDigits(num)};
    case "days and hours": return {show:TEAM_HOURS, say:TEAM_HOURS};
    case "callback hours": return {show:BAU_CALLBACK_HOURS, say:BAU_CALLBACK_HOURS};
    case "by the end of the next working day": return {show:"by the end of the next working day", say:"by the end of the next working day"};
    case "number": return {show:spacedRef(NEW_REF), say:sayDigits(NEW_REF)};
    case "the next working day": return {show:NEXT_WORKING_DAY, say:NEXT_WORKING_DAY};
    case "adviser": return null;
  }
  return null;
}
/* One sentence at a time, so subtitles keep pace and long prompts don't
   hit the browser's cut-off for long utterances. */
function segments(text, who){
  return text.split(/\n+|(?<=[.?!])\s+(?=[A-Z“])/).filter(s=>s.trim()).map(s=>{
    let show="", say="", last=0;
    s.replace(/\[([^\]]+)\]/g,(m,key,i)=>{
      show += esc(s.slice(last,i)); say += s.slice(last,i);
      if(key==="adviser"){ const nm=ADVISERS[who==="bau"?"bau":"newco"]; show+=esc(nm); say+=nm; }
      else {
        const v = phValue(key);
        if(v){ show += '<mark class="ph" title="Placeholder in the script: ['+esc(key)+']. Made-up value.">'+esc(v.show)+'</mark>'; say += v.say; }
        else { show += '<mark class="ph">['+esc(key)+']</mark>'; say += key; }
      }
      last = i+m.length; return m;
    });
    show += esc(s.slice(last)); say += s.slice(last);
    return {show, say};
  });
}


/* ====================================================================
   Sound: voice, keypad tones, ringing, hold music. All made in the
   browser, nothing loaded.
   ==================================================================== */
const canSpeak = "speechSynthesis" in window;
let VOICES = [];
function loadVoices(){
  if(!canSpeak) return;
  const all = speechSynthesis.getVoices();
  VOICES = all.filter(v=>/^en[-_]GB/i.test(v.lang));
  if(!VOICES.length) VOICES = all.filter(v=>/^en/i.test(v.lang));
}
if(canSpeak){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function voiceFor(who){ if(!VOICES.length) return null; return who==="ivr" ? VOICES[0] : (VOICES[1]||VOICES[0]); }

let AC = null;
function ac(){
  if(!AC){ const A = window.AudioContext||window.webkitAudioContext; if(A) AC = new A(); }
  if(AC && AC.state==="suspended") AC.resume();
  return AC;
}
function tone(freqs, start, ms, vol, type){
  const a = ac(); if(!a || !state.sound) return;
  const g = a.createGain(); g.gain.value = vol||0.06; g.connect(a.destination);
  const t = a.currentTime + (start||0);
  freqs.forEach(f=>{ const o=a.createOscillator(); o.type=type||"sine"; o.frequency.value=f; o.connect(g); o.start(t); o.stop(t+ms/1000); });
}
const DTMF = {"1":[697,1209],"2":[697,1336],"3":[697,1477],"4":[770,1209],"5":[770,1336],"6":[770,1477],
  "7":[852,1209],"8":[852,1336],"9":[852,1477],"*":[941,1209],"0":[941,1336],"#":[941,1477]};
function ringCycle(){ tone([400,450],0,400,.05); tone([400,450],.6,400,.05); }  /* the UK double ring */
let MUSIC = null;
function startMusic(){
  stopMusic(); if(!state.sound) return;
  const notes=[523,659,784,659,587,698,880,698], i={n:0};
  MUSIC = setInterval(()=>{ tone([notes[i.n++%notes.length]],0,380,.03,"triangle"); }, 420);
}
function stopMusic(){ if(MUSIC){ clearInterval(MUSIC); MUSIC=null; } }
let RINGER = null;
function stopRinger(){ if(RINGER){ clearInterval(RINGER); RINGER=null; } }


/* ====================================================================
   The call engine
   Every step bumps call.turn. Anything waiting on speech, a timer or a
   hold checks its turn when it resumes, and stops if the call has moved
   on (a key cut the prompt off, or the caller hung up).
   ==================================================================== */
const T = {noInput:null, digit:null, auto:null, tick:null, hold:null};
function clearTimers(){ clearTimeout(T.noInput); clearTimeout(T.digit); clearTimeout(T.auto); clearTimeout(T.hold); T.noInput=T.digit=T.auto=T.hold=null; }

function log(e){ const call=state.call; e.at=call.sim; call.log.push(e); renderLog(); }
function gap(text){ state.call.gaps++; log({t:"gap", text}); }

function cutSpeech(){
  const sp = state.call && state.call.speaking;
  if(!sp) return;
  sp.cut = true;
  if(canSpeak) speechSynthesis.cancel();
  clearTimeout(T.auto);
  sp.resolve(false);
}

/* Speak a prompt. Resolves true when it finishes, false if cut off. */
function say(p, nodeId){
  const call = state.call;
  const segs = segments(p.text, p.who);
  call.prompts++;
  if(p.who!=="ivr" && call.humanAt==null){ call.humanAt = call.sim; }
  log({t:"say", who:p.who, kind:p.kind, html:segs.map(s=>s.show).join(" "), node:nodeId, sc:p.sc});
  return new Promise(resolve=>{
    let done=false, i=0;
    const sp = {cut:false, resolve:v=>{ if(!done){ done=true; call.speaking=null; renderPhone(); resolve(v); } }};
    call.speaking = sp; call.subs = {who:p.who, html:""};
    const step = ()=>{
      if(sp.cut || done) return;
      if(i>=segs.length){ sp.resolve(true); return; }
      const s = segs[i++];
      call.subs = {who:p.who, html:s.show}; renderPhone();
      if(state.sound && canSpeak && speechSynthesis.getVoices().length){
        const u = new SpeechSynthesisUtterance(s.say);
        u.voice = voiceFor(p.who); u.lang = "en-GB"; u.rate = 1;
        u.pitch = p.who==="ivr" ? 1 : (p.who==="newco" ? 1.15 : .85);
        u.onend = step; u.onerror = step;
        sp.utter = u;   /* kept, so the browser doesn't drop it mid-sentence */
        speechSynthesis.speak(u);
      } else {
        T.auto = setTimeout(step, Math.max(1500, words(s.say)*380));
      }
    };
    step();
  });
}

function startCall(){
  ac();   /* audio can only start from the click */
  hangUpQuietly();
  state.call = newCall();
  const call = state.call;
  call.phase = "dialling";
  if(state.startAt){
    const lane = LANE[state.startAt].id;
    if(lane==="p4"||lane==="p5"){ call.ref = CUST().ref; call.refGiven = !!call.ref; }
    log({t:"sys", text:"Started part-way through, at “"+NODE[state.startAt].l+"”."+(call.refGiven?" Treated as if the reference was already given.":"")});
  }
  renderAll();
  T.tick = setInterval(()=>{ const c=state.call; if(c && ["dialling","live","hold","waiting","ringing"].includes(c.phase)){ c.sim++; renderClock(); } }, 1000);
  ringCycle(); setTimeout(ringCycle, 3000);
  const my = ++call.turn;
  T.auto = setTimeout(()=>{ if(state.call!==call || my!==call.turn) return; call.phase="live"; go(state.startAt||PHONE.start); }, 5200);
}

async function go(id){
  const call = state.call, my = ++call.turn;
  clearTimers();
  const n = NODE[id];
  /* Digits typed while the step before was still talking belong to this question: keep them. */
  if(!(call.listen && call.listen.q===id && n.type==="q")){ call.listen = null; call.buffer = ""; }
  call.at = id; call.route.push(id);
  if(n.type==="go") return go(n.to);

  if(n.type==="q"){
    if(SYSTEM[id]){
      const r = SYSTEM[id]();
      if(r.gap) gap(r.gap);
      log({t:"sys", node:id, text:n.l+" "+r.a+(r.why?" ("+r.why+")":"")});
      return go(next(id, r.a));
    }
    return ask(id);
  }

  /* A step or an end */
  const person = PERSON[id];
  if(id==="p_cbq"){
    log({t:"sys", node:id, text:n.l});
    call.phase = "waiting";
    await hold(C().newcoWaitLong?WAITS.newcoLong:WAITS.newcoShort, "Waiting for the callback", false);
    if(my!==call.turn) return;
    return go(next(id));
  }
  const p = promptOf(id);
  const ahead = aheadQ(id);
  if(ahead) listen(ahead, id);
  else if(INPUT[id]) listen(id, id);
  const personSpeaks = async ()=>{
    const h = HUMAN[person.human];
    await say({text:h.t, kind:"human", who:h.who}, id);
    if(my===call.turn && (n.type==="end" || id==="p_fnagent")) log({t:"sys", text:"The conversation with the adviser isn't simulated."});
  };
  if(person && person.hold){
    /* "Please hold" plays first, then the queue, then a person answers */
    if(p){ await say(p, id); if(my!==call.turn) return; }
    const mins = person.hold==="newco" ? (C().newcoWaitLong?WAITS.newcoLong:WAITS.newcoShort) : (C().bauWaitLong?WAITS.bauLong:WAITS.bauShort);
    await hold(mins, person.hold==="newco"?"In the NewCo queue":"In the main queue", true);
    if(my!==call.turn) return;
    await personSpeaks(); if(my!==call.turn) return;
  } else {
    if(person && person.human){ await personSpeaks(); if(my!==call.turn) return; }
    if(p){ await say(p, id); if(my!==call.turn) return; }
    else if(!person && n.type==="step"){ log({t:"sys", node:id, text:n.l}); }
  }

  if(n.type==="end") return finish(id);
  if(INPUT[id]) return waitForInput(my);
  return go(next(id));
}

/* The caller question straight after a step, if there is one: keys pressed
   while the step is still talking count as the answer to it. */
function aheadQ(id){
  const o = OUT[id]; if(o.length!==1) return null;
  const q = NODE[o[0].to], spec = INPUT[q.id];
  if(q.type!=="q" || !spec) return null;
  if(spec.auto && spec.auto()) return null;
  return q.id;
}

async function ask(qid){
  const call = state.call, my = call.turn, spec = INPUT[qid];
  if(!spec) throw new Error("No input set up for "+qid);
  if(spec.auto){
    const a = spec.auto();
    if(a){ log({t:"sys", node:qid, text:NODE[qid].l+" "+a+" (automatically)"}); return go(next(qid,a)); }
  }
  if(spec.ring) return ring(qid);
  if(qid==="p_cbnum" && !C().numberShown) gap("The map's callback lane doesn't cover a withheld number. The simulator only offers to take a different number.");
  if(!call.listen || call.listen.q!==qid) listen(qid, qid);
  const p = promptOf(qid);
  if(p){ await say(p, qid); if(my!==call.turn) return; }
  waitForInput(my);
}

function listen(q, replay){ const call=state.call; call.listen = {q, spec:INPUT[q], replay}; call.buffer = ""; renderPhone(); }

function waitForInput(my){
  const call = state.call;
  if(!call.listen || my!==call.turn) return;
  clearTimeout(T.noInput); clearTimeout(T.digit);
  if(call.buffer){ T.digit = setTimeout(()=>{ if(my===call.turn) complete(); }, INTERDIGIT_MS); }
  else {
    call.waitUntil = Date.now()+NO_INPUT_MS; renderPhone();
    T.noInput = setTimeout(()=>{ if(my===call.turn) noInput(); }, NO_INPUT_MS);
  }
}

function noInput(){
  const call = state.call, L = call.listen, spec = L.spec;
  log({t:"press", text:"Pressed nothing"});
  if(spec.none!==undefined){
    const r = typeof spec.none==="function" ? spec.none() : spec.none;
    return resolveAnswer(r);
  }
  replayOrGiveUp("pressed nothing");
}

function replayOrGiveUp(why){
  const call = state.call, L = call.listen;
  call.repeats[L.q] = (call.repeats[L.q]||0)+1;
  if(call.repeats[L.q] <= 2){
    gap("The map doesn't say what happens when the caller "+why+" here. The simulator plays the prompt again.");
    call.listen = null; call.buffer = "";
    if(L.replay===L.q){ clearTimers(); call.turn++; return ask(L.q); }
    return go(L.replay);
  }
  const q = NODE[L.q], a = q.dflt || OUT[L.q][0].l;
  gap("Still no answer. The map doesn't say what happens next, so the simulator takes “"+a+"”.");
  return go(next(L.q, a));
}

/* An answer is a label on the map, or RETRY, or NEXT for a step that
   collects digits and then carries on. */
const RETRY = {retry:true}, NEXT = {next:true};
function resolveAnswer(r){
  const call = state.call, L = call.listen;
  if(r===NEXT) return go(next(L.q));
  if(r===RETRY){
    /* The first try at the reference happened at p_refq, before p_retryq */
    call.tries[L.q] = (call.tries[L.q]||0)+1;
    const used = call.tries[L.q] + (L.q==="p_retryq"?1:0);
    if(used < MAX_TRIES){ call.listen = null; call.buffer = ""; return go(L.replay); }
    if(L.spec.fail===NEXT){ gap("Out of tries. The map doesn't say what happens now, so the call carries on."); return go(next(L.q)); }
    return go(next(L.q, L.spec.fail));
  }
  return go(next(L.q, r));
}

function complete(){
  const call = state.call, L = call.listen; if(!L) return;
  const b = call.buffer;
  log({t:"press", text:"Entered "+(b||"nothing")});
  return resolveAnswer(L.spec.done(b));
}

/* The caller presses a key */
function press(k){
  const call = state.call;
  tone(DTMF[k], 0, 160, .06);
  flashKey(k);
  if(!call || !["live"].includes(call.phase)) return;
  call.presses++;
  const L = call.listen;
  if(!L){ log({t:"press", text:"Pressed "+k+" (nothing is listening)"}); return; }
  const spec = L.spec;
  if(spec.collect){
    cutSpeech();
    clearTimeout(T.noInput);
    if(k==="#"){ return complete(); }
    if(k==="*") return;
    call.buffer += k; renderPhone();
    if(call.buffer.length>=spec.collect && !spec.hash) return complete();
    if(call.buffer.length>=spec.collect+4) return complete();
    if(!call.speaking){ clearTimeout(T.digit); const my=call.turn; T.digit=setTimeout(()=>{ if(my===call.turn) complete(); }, INTERDIGIT_MS); }
    return;
  }
  cutSpeech();
  log({t:"press", text:"Pressed "+k});
  const keys = typeof spec.keys==="function" ? spec.keys() : spec.keys;
  if(keys && keys[k]) return resolveAnswer(keys[k]);
  if(spec.other) return resolveAnswer(spec.other);
  replayOrGiveUp("presses a key that isn't an option");
}

/* The caller says something, where the phone line takes speech */
function speak(i){
  const call = state.call, L = call && call.listen; if(!L || call.phase!=="live") return;
  const o = L.spec.say[i];
  cutSpeech();
  if(o.ref){
    const ref = CUST().ref;
    if(!ref){ log({t:"press", text:"Said “I don't have a reference”"}); return resolveAnswer(L.spec.none!==undefined ? (typeof L.spec.none==="function"?L.spec.none():L.spec.none) : RETRY); }
    log({t:"press", text:"Said “"+spacedRef(ref)+"”"});
    call.buffer = ref;
    return resolveAnswer(L.spec.done(ref));
  }
  log({t:"press", text:"Said “"+o.heard+"”"});
  return resolveAnswer(o.a);
}

function hold(mins, label, music){
  const call = state.call, my = call.turn;
  return new Promise(resolve=>{
    if(call.phase!=="waiting") call.phase = "hold";
    call.hold = {mins, label, done:()=>{
      if(!call.hold) return;
      clearTimeout(T.hold); stopMusic();
      call.hold = null; call.sim += mins*60;
      if(call.phase==="hold") call.phase = "live";
      log({t:"time", text:label+": "+mins+" minutes pass"});
      renderAll(); resolve();
    }};
    if(music) startMusic();
    renderAll();
    T.hold = setTimeout(()=>{ if(my===call.turn && call.hold) call.hold.done(); }, HOLD_MS);
  });
}

function ring(qid){
  const call = state.call, my = call.turn;
  call.phase = "ringing"; call.listen = {q:qid, spec:INPUT[qid], replay:qid};
  ringCycle(); RINGER = setInterval(ringCycle, 3000);
  renderAll();
  T.noInput = setTimeout(()=>{ if(my===call.turn){ stopRinger(); call.phase="live"; log({t:"press", text:"Didn't answer"}); go(next(qid, INPUT[qid].none)); } }, RING_MS);
}
function answerRing(yes){
  const call = state.call; if(!call || call.phase!=="ringing") return;
  stopRinger(); clearTimeout(T.noInput);
  call.phase = "live";
  log({t:"press", text:yes?"Answered the callback":"Declined the callback"});
  go(next(call.listen.q, yes?INPUT[call.listen.q].answer:INPUT[call.listen.q].none));
}

function finish(id){
  const call = state.call;
  call.phase = "ended"; call.endId = id; call.outcome = NODE[id].l;
  call.listen = null; call.turn++;
  clearTimers(); clearInterval(T.tick); stopMusic(); stopRinger();
  renderAll();
}
function hangUp(){
  const call = state.call; if(!call || ["idle","ended"].includes(call.phase)) return;
  cutSpeech(); log({t:"press", text:"Hung up"});
  call.phase = "ended"; call.outcome = "The caller hung up"; call.endId = null;
  call.listen = null; call.turn++;
  clearTimers(); clearInterval(T.tick); stopMusic(); stopRinger();
  if(canSpeak) speechSynthesis.cancel();
  renderAll();
}
function hangUpQuietly(){
  if(state.call){ state.call.turn++; cutSpeech(); }
  clearTimers(); clearInterval(T.tick); stopMusic(); stopRinger();
  if(canSpeak) speechSynthesis.cancel();
}

function renderPhone(){
  const el = $("#phone-screen"); if(!el) return;
  const call = state.call || newCall();
  const ph = call.phase;
  let name = "DVLA medical line", status = "", body = "";
  if(ph==="idle"){ status = "Ready to call"; body = '<div class="phone__subs"><p>Press the green button to call.</p><p style="margin-top:8px">'+esc(TIMES[C().time].t)+'</p></div>'; }
  else if(ph==="dialling"){ status = "Calling… "+clock(call.sim); }
  else if(ph==="ringing"){ name = "Incoming call"; status = "DVLA"; body = '<div class="phone__subs"><p>The phone line is calling you back.</p></div>'; }
  else if(ph==="ended"){ status = "Call ended · "+clock(call.sim); body = '<div class="phone__subs"><p>'+esc(call.outcome)+'</p></div>'; }
  else if(ph==="waiting"){ name = "No call"; status = clock(call.sim);
    body = '<div class="phone__subs"><span class="phone__who">Waiting</span><p>'+esc(call.hold?call.hold.label+": about "+call.hold.mins+" minutes":"")+'</p></div>'; }
  else if(ph==="hold"){ status = "On hold · "+clock(call.sim);
    body = '<div class="phone__subs"><span class="phone__who">♫ Hold music</span><p>'+esc(call.hold?call.hold.label+": about "+call.hold.mins+" minutes":"")+'</p></div>'; }
  else {
    status = clock(call.sim);
    const s = call.subs;
    body = '<div class="phone__subs" aria-live="polite">'
      + (s ? '<span class="phone__who">'+(call.speaking?'<span class="bars" aria-hidden="true"><span></span><span></span><span></span></span>':'')+esc(WHO[s.who])+'</span><p>'+s.html+'</p>' : '')
      + '</div>';
  }
  const listening = call.listen && ph==="live" && !call.speaking;
  el.innerHTML = '<p class="phone__name">'+esc(name)+'</p><p class="phone__status" id="phone-clock">'+esc(status)+'</p>'+body
    + '<div class="phone__digits" aria-live="polite">'+esc(call.buffer||"")+'</div>'
    + '<div class="phone__listen">'+(listening ? "Listening for your answer…" : "")+'</div>';
  $("#phone").classList.toggle("is-ringing", ph==="ringing");

  const sayEl = $("#phone-say");
  const opts = ph==="live" && call.listen && call.listen.spec.say;
  sayEl.innerHTML = opts ? '<span class="phone__say-label">Speak instead</span>'+opts.map((o,i)=>'<button type="button" class="say" data-say="'+i+'">'+esc(o.ref?"Say the reference ("+(CUST().ref?spacedRef(CUST().ref):"you don't have one")+")":o.label)+'</button>').join("") : "";

  const act = $("#phone-actions");
  if(ph==="idle"||ph==="ended") act.innerHTML = '<button type="button" class="callbtn callbtn--go" id="btn-call">'+HANDSET+'<span class="govuk-visually-hidden">'+(ph==="ended"?"Call again":"Call the DVLA medical line")+'</span></button>';
  else if(ph==="ringing") act.innerHTML = '<button type="button" class="callbtn callbtn--end" id="btn-decline">'+HANDSET+'<span class="govuk-visually-hidden">Decline</span></button><button type="button" class="callbtn callbtn--go" id="btn-answer">'+HANDSET+'<span class="govuk-visually-hidden">Answer</span></button>';
  else if(ph==="waiting") act.innerHTML = "";
  else act.innerHTML = '<button type="button" class="callbtn callbtn--end" id="btn-end">'+HANDSET+'<span class="govuk-visually-hidden">End call</span></button>';

  const ctl = $("#sim-controls"); let c = "";
  if(call.speaking) c += '<button type="button" class="govuk-button govuk-button--secondary" id="btn-skip">Skip this message</button>';
  if(call.hold) c += '<button type="button" class="govuk-button govuk-button--secondary" id="btn-wait">Skip the wait</button>';
  ctl.innerHTML = c;
}
function renderClock(){
  const call = state.call, el = $("#phone-clock"); if(!el || !call) return;
  const ph = call.phase;
  el.textContent = ph==="dialling" ? "Calling… "+clock(call.sim) : ph==="hold" ? "On hold · "+clock(call.sim) : clock(call.sim);

    +'<select class="govuk-select" id="cond-time">'+Object.keys(TIMES).map(k=>'<option value="'+k+'"'+(C().time===k?" selected":"")+'>'+esc(TIMES[k].t)+'</option>').join("")+'</select></div>'
    +'<div class="govuk-form-group"><fieldset class="govuk-fieldset"><legend class="govuk-fieldset__legend">The phone system finds that</legend>'
    + CONDS.map(c=>'<div class="govuk-checkboxes__item"><input class="govuk-checkboxes__input" type="checkbox" id="cond-'+c[0]+'" data-cond="'+c[0]+'"'+(C()[c[0]]?" checked":"")+'><label class="govuk-checkboxes__label" for="cond-'+c[0]+'">'+esc(c[1].replace("X minutes",X_MINUTES+" minutes"))+(c[2]?'<span class="govuk-checkboxes__hint">'+esc(c[2])+'</span>':'')+'</label></div>').join("")
    +'</fieldset></div>';
  const started = state.startAt ? '<p class="govuk-body-s">Starts part-way through, at <strong>'+esc(NODE[state.startAt].l)+'</strong>. <a href="#/call/'+s.id+'">Start from the beginning</a>.</p>' : "";
  return '<span class="govuk-caption">'+esc(s.t)+'</span><h1 class="govuk-heading-xl">Call the DVLA medical line</h1>'
    + note("The argument",
        '<p>Time to a person is the measure. Play the same scenario twice, once listening to everything and once pressing keys as soon as you know the answer, and compare. Keys cut a prompt off, as on the real line.</p>'
       +'<p>On the existing-application route the caller is offered a callback and a text before anyone asks for the reference that would send them to their team. Hearing it in order makes that easier to see than it is on the map.</p>')
    +'<div class="sim"><div class="sim__phone">'+phoneShell()+'</div><div class="sim__side">'
    +'<div class="scenario"><h2 class="govuk-heading-m">Scenario</h2>'
    +'<div class="govuk-form-group"><label class="govuk-label" for="scn">Who is calling, and when</label><select class="govuk-select" id="scn">'
    + SCENARIOS.map(x=>'<option value="'+x.id+'"'+(x.id===s.id?" selected":"")+'>'+esc(x.t)+'</option>').join("")+'</select></div>'
    +'<p class="govuk-body-s">'+esc(s.blurb)+'</p>'+started
    +'<div class="letter"><p><strong>'+esc(cust.name)+'</strong>, calling from '+esc(spacedPhone(cust.phone))+'</p><p>'+esc(cust.about)+'</p>'
    +(cust.ref ? '<p style="margin-top:8px">Their letter says: Our reference <span class="letter__ref">'+esc(spacedRef(cust.ref))+'</span></p>' : '<p style="margin-top:8px">No letter, so no reference.</p>')+'</div>'
    +(state.startAt ? '' : '<h3 class="govuk-heading-s">To follow this route</h3><ol class="govuk-list govuk-list--number govuk-body-s">'+s.play.map(p=>'<li>'+esc(p)+'</li>').join("")+'</ol>')
    +'<details class="govuk-details"><summary class="govuk-details__summary">Change what the phone system decides'+(state.changed?' <span class="changed-flag">(changed)</span>':'')+'</summary><div class="govuk-details__text">'
    +'<p class="govuk-body-s">Changes apply from the next decision, so you can steer a call while it\'s going.</p>'+conds+'</div></details>'
    +'<div class="govuk-checkboxes__item"><input class="govuk-checkboxes__input" type="checkbox" id="opt-sound"'+(state.sound?" checked":"")+'><label class="govuk-checkboxes__label" for="opt-sound">Play sound<span class="govuk-checkboxes__hint">'+(canSpeak?"The voice, keypad tones and hold music.":"This browser can't read aloud. Subtitles only.")+'</span></label></div>'
    +'</div>'
    +'<div id="call-summary"></div>'
    +'<h2 class="govuk-heading-m">What the caller hears</h2>'
    +'<details class="govuk-details"><summary class="govuk-details__summary">What the labels mean</summary><div class="govuk-details__text">'+tagKey()+'</div></details>'
    +'<div class="govuk-checkboxes__item"><input class="govuk-checkboxes__input" type="checkbox" id="opt-sys"'+(state.showSys?" checked":"")+'><label class="govuk-checkboxes__label" for="opt-sys">Show what the phone system decides</label></div>'
    +'<ol class="call-log" id="call-log" aria-live="polite"></ol>'
    +'</div></div>';
}

const RENDER = {"all-screens":renderAllScreens, "prompts":renderPrompts, "call":renderCallScreen};
const TITLES = {"all-screens":"NewCo call simulator", "prompts":"Every prompt – NewCo call simulator", "call":"Call – NewCo call simulator"};

function warn(){
  return '<div class="prototype-warning"><strong>⚠ Fictional prototype</strong>'
    +'This simulates a phone line for a workshop. It is not a real DVLA phone line or service and makes no real decisions. Every caller, reference and phone number is invented, and today\'s wording is stand-in text until the real scripts arrive.</div>';
}

function renderChrome(inner){
  return '<header class="govuk-header" role="banner"><div class="govuk-header__container"><a href="#/all-screens" class="govuk-header__homepage-link">'+LOGO+'</a></div></header>'
    +'<div class="service-nav"><div class="service-nav__wrapper"><a class="service-nav__name" href="#/all-screens">NewCo call simulator</a><a href="newco-routing-map.html" style="font-size:16px">Routing map</a></div></div>'
    +'<div class="govuk-phase-banner"><div class="govuk-phase-banner__wrapper"><span class="govuk-phase-banner__tag">Prototype</span><span>This is not a real service.</span>'
    +'<span class="phase-actions"><a href="#" id="toggle-notes">'+(state.showNotes?"Hide":"Show")+' design notes</a><a href="#/all-screens">All screens</a></span></div></div>'
    +'<div class="govuk-width-container"><main class="govuk-main-wrapper" id="main">'+warn()
    +(state.screen!=="all-screens" ? '<a class="govuk-back-link" href="#/all-screens">Back to all screens</a>' : '')
    + inner +'</main></div>';
}

let lastKey = null;
function router(){
  const parts = (location.hash||"#/all-screens").replace(/^#\/?/,"").split("/");
  let screen = RENDER[parts[0]] ? parts[0] : "all-screens";
  const key = parts.join("/");
  if(key!==lastKey){
    hangUpQuietly();
    if(screen==="call"){
      state.sc = SC_BY_ID[parts[1]] ? parts[1] : "team-open";
      state.startAt = parts[2] && NODE[parts[2]] ? parts[2] : null;
      state.cond = {...BASE, ...SC_BY_ID[state.sc].c};
      state.changed = false;
      state.call = newCall();
    } else state.call = null;
    lastKey = key;
    window.scrollTo(0,0);
  }
  state.screen = screen;
  $("#app").innerHTML = renderChrome(RENDER[screen]());
  document.title = TITLES[screen];
  if(screen==="call") renderAll();
}
function go_(h){ if(location.hash===h) router(); else location.hash=h; }

/* One listener for the whole page, so re-rendering never loses handlers. */
document.addEventListener("click", e=>{
  const t = e.target.closest("button, a"); if(!t) return;
  if(t.id==="toggle-notes"){ e.preventDefault(); state.showNotes=!state.showNotes; router(); return; }
  if(t.dataset.key){ press(t.dataset.key); return; }
  if(t.dataset.say!==undefined){ speak(+t.dataset.say); return; }
  if(t.id==="btn-call"||t.id==="btn-again") return startCall();
  if(t.id==="btn-end") return hangUp();
  if(t.id==="btn-answer") return answerRing(true);
  if(t.id==="btn-decline") return answerRing(false);
  if(t.id==="btn-skip") return cutSpeech();
  if(t.id==="btn-wait"){ const c=state.call; if(c&&c.hold) c.hold.done(); return; }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.id==="scn") return go_("#/call/"+t.value);
  if(t.id==="opt-sound"){ state.sound=t.checked; if(!t.checked){ stopMusic(); if(canSpeak) speechSynthesis.cancel(); } return; }
  if(t.id==="opt-sys"){ state.showSys=t.checked; renderLog(); return; }
  if(t.id==="cond-time"||t.dataset.cond){
    if(t.id==="cond-time") state.cond.time = t.value; else state.cond[t.dataset.cond] = t.checked;
    state.changed = true;
    const flag = document.querySelector(".scenario summary");
    if(flag && !flag.querySelector(".changed-flag")) flag.insertAdjacentHTML("beforeend",' <span class="changed-flag">(changed)</span>');
    if(state.call && !["idle","ended"].includes(state.call.phase)){
      const what = t.id==="cond-time" ? "Time of the call: "+TIMES[t.value].t : CONDS.find(c=>c[0]===t.dataset.cond)[1].replace("X minutes",X_MINUTES+" minutes")+": "+(t.checked?"yes":"no");
      log({t:"sys", text:"Facilitator changed – "+what});
    } else renderPhone();
  }
});
document.addEventListener("keydown", e=>{
  if(state.screen!=="call" || e.ctrlKey || e.metaKey || e.altKey) return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(/^[0-9*#]$/.test(e.key)){ e.preventDefault(); press(e.key); }
});

window.addEventListener("hashchange", router);
router();
})();
</script>

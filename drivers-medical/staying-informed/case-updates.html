<a class="govuk-skip-link" href="#main">Skip to main content</a>
<div id="app"></div>
<footer class="govuk-footer" role="contentinfo">
  <div class="govuk-footer__wrapper">
    <p class="govuk-footer__meta-item">Case updates prototype. Fictional, for workshop use only. Not a real DVLA or GOV.UK service. The cases, letters and template codes are invented, and so are all personal details apart from the name.</p>
  </div>
</footer>

<script>
/* ================================================================
   CASE UPDATES (Drivers Medical, staying informed)

   The idea being demonstrated: the case timeline is built from the
   letters DVLA already sends and receives, not from new case states.
   Dynamics logs every letter on a case in its Communications tab. A
   template map turns each logged row into something a customer can
   read. derive() below is the whole argument: the timeline and the
   status card are worked out from three things and never written by
   hand.

     1. COMMUNICATIONS rows, one per letter, with Dynamics' own fields
     2. TEMPLATE_MAP, the rule for each template code
     3. caseStatus, one of the five real case status values

   The derivation rules are numbered 1 to 9 to match the README and
   the handover. Rules this prototype added are marked "added".
   ================================================================ */

/* === TEMPLATE CODES ARE INVENTED. This repo is public. The real DGU
       codes are mapped privately and never appear here. === */

/* === FICTIONAL DATA. The name is used with permission; every other
       detail is invented. Contact details use reserved ranges
       (example.com, 07700 900xxx). The licence number has a month field
       of 66, which no real licence number can have, so it cannot have
       been issued to anyone. === */
const CUSTOMER = {
  name:'Jack Strachan',
  title:'Mr',
  dob:'1979-06-14',
  email:'jack.strachan@example.com',
  mobile:'07700 900412',
  licenceNo:'STRAC766149J99ZZ',
  conditions:['Diabetes'],
  licenceFrom:'2024-03-11',
  licenceTo:'2027-03-10'
};

/* For prototype use only: the paper-letter code and date of birth. */
const PAPER_CODE = 'HX7K9MPQ';

/* Prototype assumptions, each flagged on the screen it affects. */
const RELEASE_WORKING_DAYS = 4;  // a decision's full copy appears 4 working days after posting. A legal question, not settled.
const QUIET_DAYS = 21;           // over 3 weeks with no new entry counts as a quiet period
/* Every decision waits for release, not only notices, so the neutral
   "decision posted" message says nothing about the outcome. The
   handover's rule held back notices only, which means the neutral
   message could only ever be bad news. */
const HOLD_ALL_DECISIONS = true;

/* ---------------------------------------------------------------
   TEMPLATE_MAP: the rule for each template code.

   From the handover:
     timelineState  With us | Waiting on you | Waiting on someone else |
                    Decided | Information only | Not a timeline event
                    ("Not shown" is dropped: shown: 'No' already says it)
     summary        plain English. Never the code.
     shown          Yes | Signal only | Receipt only | No
     servesNotice   true if the letter serves a legal notice

   Added by this prototype:
     status         the status card headline, when this row sets the
                    current state
     outcome        kept | revoked, for decisions
     canDrive       the "can I drive?" answer, for decisions only.
                    Ordinary letters cannot answer it, so an open case
                    uses DEFAULT_DRIVE.
     reply          true if the customer can reply online
   --------------------------------------------------------------- */
const TEMPLATE_MAP = {
  'RCV-MED-NOTIFICATION': {timelineState:'With us', shown:'Receipt only', servesNotice:false,
    summary:'your form telling us about your medical condition',
    status:'We’re looking at the form you sent us'},
  'ACK-NOTIFICATION': {timelineState:'Information only', shown:'Yes', servesNotice:false,
    summary:'We’ve received your form and started looking at your diabetes'},
  'REQ-QUESTIONNAIRE': {timelineState:'Waiting on you', shown:'Yes', servesNotice:false,
    summary:'We asked you to fill in a medical questionnaire',
    status:'We need you to fill in a medical questionnaire'},
  'RCV-QUESTIONNAIRE': {timelineState:'With us', shown:'Receipt only', servesNotice:false,
    summary:'your medical questionnaire',
    status:'We’re looking at your medical questionnaire'},
  'HP-REPORT-REQUEST': {timelineState:'Waiting on someone else', shown:'Signal only', servesNotice:false,
    summary:'We asked a doctor who treats you for a report',
    status:'We’re waiting for a report from a doctor who treats you'},
  'HP-REPORT-CHASE': {timelineState:'Waiting on someone else', shown:'Signal only', servesNotice:false,
    summary:'We reminded your doctor to send their report'},
  'ACK-HP-LETTER': {timelineState:'Information only', shown:'Yes', servesNotice:false,
    summary:'We’ve written to tell you we’ve asked your doctor for a report'},
  'RCV-HP-REPORT': {timelineState:'With us', shown:'Receipt only', servesNotice:false,
    summary:'the report from your doctor',
    status:'We have your doctor’s report and we’re looking at it'},
  'REQ-GLUCOSE-READINGS': {timelineState:'Waiting on you', shown:'Yes', servesNotice:false,
    summary:'We asked you for your blood glucose readings',
    status:'We need your blood glucose readings', reply:true},
  /* Added. An online reply is not a letter, so today it would write no
     row to the Communications tab. The prototype assumes it does. */
  'RCV-ONLINE-REPLY': {timelineState:'With us', shown:'Receipt only', servesNotice:false,
    summary:'your blood glucose readings, sent online',
    status:'We’re looking at the blood glucose readings you sent'},
  'INT-CASE-SUMMARY': {timelineState:'Not a timeline event', shown:'No', servesNotice:false,
    summary:'Internal copy of the case summary for the file'},
  'DEC-LICENCE-KEPT': {timelineState:'Decided', shown:'Yes', servesNotice:false,
    summary:'You can keep your licence', outcome:'kept',
    canDrive:{answer:'Yes, you can keep driving', detail:'We’ve sent you a new licence. It lasts 3 years.'}},
  'DEC-REVOKE': {timelineState:'Decided', shown:'Yes', servesNotice:true,
    summary:'We’ve taken away your driving licence', outcome:'revoked',

/* --- Dates. All dates are ISO strings, read as UTC. --- */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function dt(s){ const p=s.split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2])); }
function iso(d){ return d.toISOString().slice(0,10); }
function addDays(s,n){ const d=dt(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); }
function isWeekend(s){ const w=dt(s).getUTCDay(); return w===0||w===6; }
/* Skips weekends only. Bank holidays are not handled: a prototype
   simplification, flagged in the notes. */
function nextWorkingDay(s){ let x=addDays(s,1); while(isWeekend(x)) x=addDays(x,1); return x; }
function addWorkingDays(s,n){ let x=s; for(let i=0;i<n;i++) x=nextWorkingDay(x); return x; }
function daysBetween(a,b){ return Math.round((dt(b)-dt(a))/86400000); }
function fmt(s){ if(!s) return ''; const d=dt(s); return d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]+' '+d.getUTCFullYear(); }
function fmtDay(s){ return DAYS[dt(s).getUTCDay()]+' '+fmt(s); }

/* ================================================================
   derive(): the thing being demonstrated.
   Everything the customer sees about their case comes out of here.
   ================================================================ */
function isRequest(row){ return row.direction==='Outgoing' && !!row.responseDueBy && !/Not expected/.test(row.responseStatus); }
function isResolved(row){ return /Received/.test(row.responseStatus); }
const OPEN_STATE_KEY = {'With us':'with-us','Waiting on you':'waiting-you','Waiting on someone else':'waiting-other'};

function derive(){
  const today = state.today;
  const entries = [], hidden = [];
  const rows = state.communications.slice().sort((a,b)=> a.createdOn<b.createdOn?-1:a.createdOn>b.createdOn?1:0);

  rows.forEach(row=>{
    const rule = TEMPLATE_MAP[row.code];
    if(!rule){
      hidden.push({row, rule:null, why:'No rule in the template map for this code. An unmapped code shows nothing: the derivation fails closed.'});
      return;
    }
    if(rule.shown==='No' || rule.timelineState==='Not a timeline event'){
      hidden.push({row, rule, why:'The rule says this letter is not a timeline event, so it is never shown.'});
      return;
    }
    const incoming = row.direction==='Incoming';
    const visibleFrom = incoming ? row.createdOn : nextWorkingDay(row.createdOn);
    if(today < visibleFrom){
      hidden.push({row, rule, pending:true, why:'Rule 2: an outgoing letter appears from the next working day after it is created, when it leaves the building. This one appears on '+fmt(visibleFrom)+'.'});
      return;
    }
    const e = {row, rule, date:visibleFrom, incoming, applied:['Rule 1: the customer sees the summary, never the code.']};
    if(incoming){
      e.kind = 'receipt';
      e.applied.push('Rule 3: an incoming item shows “Received on” the date we logged it.');
      if(rule.shown==='Receipt only') e.applied.push('Rule 5: receipt only. The form itself is not shown.');
    } else if(rule.shown==='Signal only'){
      e.kind = 'signal';
      e.applied.push('Rule 2: shown from the next working day, '+fmt(visibleFrom)+'.');
      e.applied.push('Rule 4: a letter to a healthcare professional is a signal, never content. It cannot be opened.');
    } else {
      e.kind = 'letter';
      e.applied.push('Rule 2: shown from the next working day, '+fmt(visibleFrom)+'.');
    }
    if(rule.timelineState==='Decided'){
      const holds = rule.servesNotice || HOLD_ALL_DECISIONS;
      e.releaseOn = holds ? addWorkingDays(visibleFrom, RELEASE_WORKING_DAYS) : visibleFrom;
      if(today < e.releaseOn){
        e.kind = 'neutral';
        e.applied.push('Rule 8: decisions are paper first. Until '+fmt(e.releaseOn)+' only the neutral “decision posted” message shows.');
      } else if(holds){
        e.applied.push('Rule 8: the full copy was released on '+fmt(e.releaseOn)+', '+RELEASE_WORKING_DAYS+' working days after posting.');
      } else {
        e.applied.push('Rule 8: a positive decision shows from the next working day.');
      }
    }
    if(isRequest(row)){
      e.request = true;
      e.resolved = isResolved(row);
      e.applied.push(e.resolved
        ? 'Rule 6: the response status includes “Received”, so this request is resolved.'
        : 'Rule 6: no reply yet, so this request is still open.');
    }
    entries.push(e);
  });

  /* Rule 7, extended. In order:
       a. the latest decision on the timeline (added: a decision ends the case)
       b. a Closed or Cancelled case status (added), held back while a
          decision letter has not left the building yet
       c. the latest unresolved request
       d. the latest entry that carries a state
       e. the case status, as the frame */
  let current = null, heldBack = null;
  const latest = list => list.length ? list[list.length-1] : null;
  const decision = latest(entries.filter(e=>e.rule.timelineState==='Decided'));
  if(decision){
    current = {key: decision.kind==='neutral' ? 'posted' : decision.rule.outcome, entry:decision,
      why:'The latest decision on the timeline sets the state. A decision ends the case, so nothing before it can.'};
  }
  if(!current && (state.caseStatus==='Closed' || state.caseStatus==='Cancelled')){
    const pending = hidden.find(h=>h.pending && h.rule && h.rule.timelineState==='Decided');
    if(pending){
      heldBack = 'The case status is already '+state.caseStatus+', but the decision letter has not left the building yet. Showing “closed” now would tell the customer a decision has been made before the paper does, so it is held back.';
    } else {
      current = {key:CASE_STATUS[state.caseStatus].key, why:'The case status is '+state.caseStatus+', which overrides the letters.'};
    }
  }
  if(!current){
    const req = latest(entries.filter(e=>e.request && !e.resolved));
    if(req) current = {key:OPEN_STATE_KEY[req.rule.timelineState], entry:req, why:'Rule 7: the latest unresolved request.'};
  }
  if(!current){
    const last = latest(entries.filter(e=>OPEN_STATE_KEY[e.rule.timelineState] && !(e.request && e.resolved)));
    if(last) current = {key:OPEN_STATE_KEY[last.rule.timelineState], entry:last, why:'Rule 7: there is no open request, so the latest entry that carries a state.'};
  }
  if(!current){
    current = {key:CASE_STATUS[state.caseStatus].key, why:'Rule 7: nothing on the timeline carries a state, so the case status ('+state.caseStatus+') is the frame.'};
  }
  current.heldBack = heldBack;

  /* Rule 9: quiet periods. */
  const lastEntry = latest(entries);
  if(lastEntry && ['with-us','waiting-other'].includes(current.key) && daysBetween(lastEntry.date, today) > QUIET_DAYS){
    current.quietSince = lastEntry.date;
  }

  return {entries:entries.slice().reverse(), hidden, current};
}

/* The status card, from the derived current state. */
function statusCard(der){
  const cur = der.current, e = cur.entry, info = STATE_INFO[cur.key];
  const m = {key:cur.key, tag:info.tag, colour:info.colour, holder:info.holder, drive:DEFAULT_DRIVE, action:null, next:'', why:cur.why};
  switch(cur.key){
    case 'waiting-you':
      if(!e){ m.headline = CASE_STATUS[state.caseStatus].status; m.next = info.usualWait; break; }
      m.headline = e.rule.status;
      m.next = 'Reply by '+fmt(e.row.responseDueBy)+'. '+info.usualWait;
      if(e.rule.reply) m.action = {text:'Reply now', href:'#reply-method'};
      else m.action = {text:'Read the letter', href:'#letter-'+e.row.id};
      break;
    case 'waiting-other': {
      m.headline = e.rule.status;
      const chases = der.entries.filter(x=>x.row.code==='HP-REPORT-CHASE' && x.row.createdOn>e.row.createdOn);
      let next = 'We asked them to reply by '+fmt(e.row.responseDueBy)+'. ';
      if(e.row.responseDueBy < state.today){
        next = 'We asked them to reply by '+fmt(e.row.responseDueBy)+' and they have not replied yet. ';
        if(chases.length) next += 'We sent them a reminder on '+fmt(chases[0].date)+'. ';
      }
      m.next = next + info.usualWait + ' We’ll pick it up again as soon as the report arrives.';
      break;
    }
    case 'with-us':
      m.headline = e ? (e.rule.status || CASE_STATUS['With DVLA'].status) : CASE_STATUS['With DVLA'].status;
      m.next = 'We’ll write to you when we’ve decided, or if we need anything else. '+info.usualWait;
      break;
    case 'posted':
      m.headline = 'We’ve posted you a decision about your licence. It should arrive within 1 to 4 days.';
      m.holder = 'We’ve made a decision';
      m.next = 'Read the letter as soon as it arrives. You’ll also be able to read it here from '+fmt(e.releaseOn)+'.';
      m.drive = {answer:'Your letter will tell you', detail:'Read the letter we’ve posted you. It explains what our decision means for your driving.'};
      break;
    case 'kept':
      m.headline = 'You can keep your licence';
      m.holder = 'We’ve made a decision';
      m.next = 'Your new licence should arrive within 1 week. You do not need to do anything else.';
      m.drive = e.rule.canDrive;
      m.action = {text:'Read the letter', href:'#letter-'+e.row.id};
      break;
    case 'revoked':
      m.headline = 'We’ve taken away your driving licence';
      m.holder = 'We’ve made a decision';
      m.next = 'Send us your licence. You can apply to get it back once you’ve gone 3 months without a severe hypo. If you disagree with our decision, you can appeal: the letter explains how and by when.';
      m.drive = e.rule.canDrive;
      m.action = {text:'Read the letter', href:'#letter-'+e.row.id};
      break;
    case 'closed':
    case 'cancelled':
    case 'renewal':
      m.headline = CASE_STATUS[state.caseStatus].status;
      m.next = info.usualWait || 'You do not need to do anything.';
      break;
  }
  if(cur.quietSince){
    m.quiet = 'No new updates since '+fmt(cur.quietSince)+'. Our medical team is still looking at it. '+(info.usualWait||'');
  }
  return m;
}

/* What the customer may see on the rest of the account. The licence
   card reads from the driver record, which changes on day 0. Here it
   is held to the same release rule as the letter. */
function licenceStatus(der){
  return der.current.key==='revoked' ? 'Revoked. You must not drive.' : 'You have a full driving licence';
}

/* ================================================================
   Rendering helpers
   ================================================================ */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function navigate(h){ if(location.hash===h){ route(); } else { location.hash = h; } }
function note(title, body){
  if(!state.showNotes) return '';
  return `<div class="design-note"><strong>Design note — ${esc(title)}</strong>${body}</div>`;
}
function question(who, q){ return `<p><b>Open question (${esc(who)}):</b> ${q}</p>`; }
function toggleNotes(){ state.showNotes = !state.showNotes; route(); }
function toggleBuilt(){ state.showBuilt = !state.showBuilt; route(); }
function tag(text, colour){ return `<strong class="govuk-tag govuk-tag--${colour}">${esc(text)}</strong>`; }
function merge(text, row){ return String(text).replace(/\{due\}/g, fmt(row.responseDueBy)); }
function rowById(id){ return state.communications.find(r=>r.id===id); }

function builtRow(row){
  return `<table><tbody>
    <tr><th scope="row">code</th><td><code>${esc(row.code)}</code></td></tr>
    <tr><th scope="row">direction</th><td>${esc(row.direction)}</td></tr>
    <tr><th scope="row">createdOn</th><td>${esc(row.createdOn)}</td></tr>
    <tr><th scope="row">responseDueBy</th><td>${esc(row.responseDueBy||'—')}</td></tr>
    <tr><th scope="row">responseStatus</th><td>${esc(row.responseStatus||'—')}</td></tr>
    <tr><th scope="row">printStatus</th><td>${esc(row.printStatus||'—')}</td></tr>
  </tbody></table>`;
}
function builtRule(rule){
  if(!rule) return '<p>No template rule for this code.</p>';
  return `<p><b>Template rule:</b> timelineState <code>${esc(rule.timelineState)}</code>, shown <code>${esc(rule.shown)}</code>, servesNotice <code>${rule.servesNotice}</code>, summary “${esc(rule.summary)}”.</p>`;
}
function built(entry){
  if(!state.showBuilt) return '';
  return `<div class="cu-built"><span class="cu-built__label">How this was built — Communications row</span>${builtRow(entry.row)}${builtRule(entry.rule)}
    <ul>${entry.applied.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`;
}

function warn(){
  const options = SCENARIO_ORDER.map(k=>`<option value="${k}"${k===state.scenario?' selected':''}>${esc(SCENARIOS[k].label)}</option>`).join('');
  return `<div class="prototype-warning"><strong>⚠ Fictional prototype</strong>
    This is a fictional prototype of Drivers Medical case updates. It is not a real DVLA or GOV.UK service and it makes no real licensing decisions. The cases, letters and template codes are invented.
    <div class="prototype-warning__control">
      <label for="scenario-picker">Show this situation</label>
      <select id="scenario-picker" onchange="switchScenario(this.value)">${options}</select>
    </div>
  </div>`;
}

function renderChrome(inner, opts){
  const o = opts || {};
  const signedIn = state.access==='oneLogin';
  let html = `<header class="govuk-header" role="banner"><div class="govuk-header__container">
    <a href="#all-screens" class="govuk-header__homepage-link">${LOGO}</a>
    ${signedIn ? '<a class="govuk-header__signout" href="#" onclick="signOut();return false;">Sign out</a>' : ''}
  </div></header>`;
  html += `<div class="service-nav"><div class="service-nav__wrapper">
    <a class="service-nav__name" href="${signedIn?'#account':'#sign-in'}">Driver and vehicles account</a>
    ${signedIn ? '<a href="#not-built" style="margin-left:auto">Manage your account</a>' : ''}
  </div></div>`;
  html += `<div class="govuk-phase-banner"><div class="govuk-phase-banner__wrapper">
    <span class="govuk-phase-banner__tag">Prototype</span>
    <span>This is not a real service.</span>
    <span class="phase-actions">
      <a href="#" onclick="toggleNotes();return false;">${state.showNotes?'Hide':'Show'} design notes</a>
      <a href="#" onclick="toggleBuilt();return false;">${state.showBuilt?'Hide':'Show'} how this was built</a>
      <a href="#all-screens">All screens</a>
    </span>
  </div></div>`;
  html += `<div class="govuk-width-container"><main class="govuk-main-wrapper" id="main">${warn()}`;
  if(o.back) html += `<a class="govuk-back-link" href="${o.back[0]}">${esc(o.back[1])}</a>`;
  html += o.full ? inner : `<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">${inner}</div></div>`;
  html += '</main></div>';
  return html;
}

/* From the yellow box: stay on the account or health page if that is
   where you are, otherwise go to the account. */
function switchScenario(key){
  const here = state.screen;
  startScenario(key);
  if(here==='health') navigate('#health');
}
function startScenario(key){
  const notes = state.showNotes, builtOn = state.showBuilt;
  resetState(key);
  state.showNotes = notes; state.showBuilt = builtOn;
  state.access = 'oneLogin';
  navigate('#account');
}
function signIn(){ state.access = 'oneLogin'; navigate('#account'); }
function signOut(){ state.access = null; navigate('#sign-in'); }

function renderAllScreens(){
  const der = derive();
  const link = (href, text, hint) => `<li><a href="${href}">${esc(text)}</a>${hint?`<span>${esc(hint)}</span>`:''}</li>`;
  const scenarios = SCENARIO_ORDER.map(k=>`<li><a href="#account" onclick="startScenario('${k}');return false;">${esc(SCENARIOS[k].label)}</a><span>${esc(SCENARIOS[k].blurb)}</span></li>`).join('');
  const letters = der.entries.filter(e=>e.kind==='letter');
  const openReq = openReplyRequest(der);
  return `<h1 class="govuk-heading-xl">Case updates</h1>
    <p class="govuk-body-l">Pick a situation to open it at the customer’s account. You can also switch from the yellow box on any screen.</p>
    ${note('What this prototype argues',
      '<p>Customers can see what’s happening with their health and driving, everything we’ve sent them, and what they need to do, without DVLA inventing a single new case state. Every entry on the timeline comes from a row Dynamics already logs. Turn on “Show how this was built” to see the row and the rule behind each one.</p>')}
    <ul class="cu-index">${scenarios}</ul>
    <h2 class="govuk-heading-m">Screens for the situation you last opened</h2>
    <p class="govuk-body-s">${esc(SCENARIOS[state.scenario].label)}</p>
    <ul class="cu-index">
      ${link('#notification','The notification','')}
      ${link('#sign-in','Sign in','')}
      ${link('#code','Use the code from your letter','Works in “Waiting on you”.')}
      ${link('#account','Your account','')}
      ${link('#health','Your health and driving','')}
      ${letters.map(e=>link('#letter-'+e.row.id,'Letter: '+e.rule.summary,'')).join('')}
      ${openReq ? link('#reply-method','Reply: how do you check your blood glucose?','')
        + link('#reply-upload','Reply: upload your readings','')
        + link('#reply-check','Reply: check your answers','')
        + link('#reply-sent','Reply: readings sent','') : ''}
    </ul>`;
}

function renderStatusCard(der){
  const m = statusCard(der);
  let html = `<div class="cu-status">
    ${tag(m.tag, m.colour)}
    <p class="cu-status__headline">${esc(m.headline)}</p>
    <dl class="govuk-summary-list">
      <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Who it’s with</dt><dd class="govuk-summary-list__value">${esc(m.holder)}</dd></div>
      <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">What happens next</dt><dd class="govuk-summary-list__value">${esc(m.next)}</dd></div>
      <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Can I drive?</dt><dd class="govuk-summary-list__value"><b>${esc(m.drive.answer)}</b><br>${esc(m.drive.detail)}</dd></div>
    </dl>
    ${m.action ? `<div class="cu-status__action"><a class="govuk-button" href="${m.action.href}">${esc(m.action.text)}</a></div>` : ''}
  </div>`;
  if(m.quiet) html += `<div class="govuk-inset-text">${esc(m.quiet)}</div>`;
  if(state.showBuilt){
    const cur = der.current;
    html += `<div class="cu-built"><span class="cu-built__label">How this was built — status card</span>
      <p><b>Current state:</b> ${esc(STATE_INFO[cur.key].state)}. ${esc(cur.why)}</p>
      ${cur.entry ? `<p><b>From row:</b> <code>${esc(cur.entry.row.id)}</code> <code>${esc(cur.entry.row.code)}</code>, created ${esc(cur.entry.row.createdOn)}.</p>` : ''}
      <p><b>Case status in Dynamics:</b> ${esc(state.caseStatus)}.</p>
      ${cur.heldBack ? `<p><b>Held back:</b> ${esc(cur.heldBack)}</p>` : ''}
      ${cur.quietSince ? `<p><b>Rule 9:</b> the latest entry is ${daysBetween(cur.quietSince,state.today)} days old, over the ${QUIET_DAYS}-day limit, so the quiet-period message shows.</p>` : ''}
      <p><b>Can I drive:</b> ${cur.entry && cur.entry.rule.canDrive && cur.key!=='posted' ? 'from the decision’s template rule.' : cur.key==='posted' ? 'silent until the full copy is released.' : 'the default for an open case. Letters cannot answer it.'}</p>
    </div>`;
  }
  return html;
}

function timelineItem(e){
  const r = e.row, rule = e.rule;
  let body = '';
  if(e.kind==='receipt'){
    body = `<span class="cu-timeline__title">Received on ${fmt(r.createdOn)}: ${esc(rule.summary)}</span>
      <p class="govuk-body-s">Forms can take a few days to reach us and be added to your records.</p>`;
  } else if(e.kind==='signal'){
    body = `<span class="cu-timeline__date">Sent on ${fmt(e.date)}</span>
      <span class="cu-timeline__title">${esc(rule.summary)}</span>
      <p class="govuk-body-s">This letter went to your doctor, not to you, so you cannot open it here.</p>`;
  } else if(e.kind==='neutral'){
    body = `<span class="cu-timeline__date">Posted on ${fmt(e.date)}</span>
      <span class="cu-timeline__title">We’ve posted you a decision about your licence. It should arrive within 1 to 4 days.</span>
      <p class="govuk-body-s">You’ll be able to read it here from ${fmt(e.releaseOn)}.</p>`;
  } else {
    let status = '';
    if(e.request && !e.resolved) status = `<p>${tag('Waiting on you','orange')} Reply by ${fmt(r.responseDueBy)}</p>`;
    if(e.request && e.resolved) status = `<p class="govuk-body-s">You’ve replied to this letter.</p>`;
    body = `<span class="cu-timeline__date">Posted on ${fmt(e.date)}</span>
      <span class="cu-timeline__title"><a href="#letter-${r.id}">${esc(rule.summary)}</a></span>${status}`;
  }
  return `<li class="cu-timeline__item">${body}${built(e)}</li>`;
}

function renderCase(){
  const der = derive();
  let hiddenHtml = '';
  if(state.showBuilt && der.hidden.length){
    hiddenHtml = `<div class="cu-built"><span class="cu-built__label">How this was built — rows not on the timeline</span>`
      + der.hidden.map(h=>`${builtRow(h.row)}${builtRule(h.rule)}<p><b>Why not shown:</b> ${esc(h.why)}</p>`).join('<hr>')
      + '</div>';
  }
  const items = der.entries.map(timelineItem).join('');
  return `<h1 class="govuk-heading-xl">Your health and driving</h1>
    <p class="cu-ref"><span class="cu-ref__label">Your reference</span><span class="cu-ref__number">${esc(state.reference)}</span><span class="cu-ref__hint">Give this number if you call us.</span></p>
    ${note('The reference is front and centre',
      '<p>It is the number people give when they call, so it sits where the application tracker puts its own, straight under the heading.</p>'
      +'<p>It is also the one place the case shows through. A reference belongs to a case, so someone with two things open at once has two.</p>'
      + question('Data','What is the real format of a Drivers Medical case reference? The one here is invented.'))}
    <dl class="govuk-summary-list">
      <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Conditions you’ve told us about</dt><dd class="govuk-summary-list__value">${esc(CUSTOMER.conditions.join(', '))}<br><a href="#not-built">Tell us about a change</a></dd></div>
    </dl>
    ${note('About the person, not the case',
      '<p>Dynamics opens a case for each notification or renewal. The customer never sees one. They see one page about their health and their licence: the conditions they have told us about, what is happening now, whether they can drive, and every letter we have sent them.</p>'
      +'<p>With one case open, the two are the same thing. They part when there is more than one: a renewal and a new condition, say, open at the same time. This page would then show one status per thing we are looking at, and one list of letters across them.</p>'
      + question('Policy','When two things are open at once, which one answers “can I drive?”. Presumably the strictest, but that needs saying.'))}
    ${note('The status card answers the call before the timeline explains it',
      '<p>What’s happening, who it’s with, what happens next and roughly when, and can I drive. Those four are what people phone to ask. The timeline underneath is the evidence for the card, not the answer.</p>'
      + (der.current.key==='waiting-other' ? question('Research','Should “Waiting on someone else” name who, such as “your GP”, or stay general? It stays general here, because the template code says a healthcare professional was written to, not which one.') : '')
      + (der.current.key==='posted' ? question('Legal (Keya)','How should the “decision posted” message be framed, and when can the full copy appear? This prototype waits '+RELEASE_WORKING_DAYS+' working days after posting. Every decision waits here, good or bad, so this message says nothing about the outcome. If only notices waited, as the handover proposed, it could only ever mean bad news.') : '')
      + (der.current.quietSince ? '<p>The quiet period is the gap the letters cannot fill. Between letters, things happen on a case — it is allocated, a DVLA doctor reads it, it waits in a queue — and none of those write a row to the Communications tab. Until they do, the honest thing is to say nothing new has happened and how long this stage usually takes.</p>' : ''))}
    ${renderStatusCard(der)}
    <h2 class="govuk-heading-l">Letters and updates</h2>
    ${note('Built from letters that already exist',
      '<p>Every entry below is a letter DVLA already sends or receives. Nothing was added to the case management system to make this page. Turn on “Show how this was built” to see the Communications row and the template rule behind each entry.</p>'
      + question('Data','Is the Communications data available outside Dynamics, to a customer account?')
      + '<p>Outgoing letters appear from the next working day, skipping weekends only. Bank holidays are not handled in the prototype.</p>')}
    ${items ? `<ol class="cu-timeline">${items}</ol>` : '<p class="govuk-body">Nothing yet. Letters will appear here once we’ve posted you the first one.</p>'}
    <p class="govuk-body-s">We still post you every letter. Letters appear here from the day after we post them.</p>
    ${hiddenHtml}`;
}

function cantOpen(e, row){
  return `<h1 class="govuk-heading-xl">You cannot open this here</h1>
    <p class="govuk-body">${e && e.kind==='neutral' ? 'We’ve posted you this letter. You’ll be able to read it here from '+fmt(e.releaseOn)+'.' : row && row.direction==='Incoming' ? 'This is something you or someone else sent us. We show when it arrived, not what it says.' : 'This letter is not one you can read online.'}</p>
    <p class="govuk-body"><a href="#health">Go back to your health and driving</a></p>`;
}

function renderLetter(id){
  const der = derive();
  const e = der.entries.find(x=>x.row.id===id);
  if(!e || e.kind!=='letter') return cantOpen(e, rowById(id));
  const L = LETTERS[e.row.code];
  if(!L) return cantOpen(e, e.row);
  const open = e.request && !e.resolved;
  const isDecision = e.rule.timelineState==='Decided';
  /* The paper letter's salutation and sign-off are dropped. What is
     left is the body, set as a page. */
  const body = L.letter.filter(p=>!/^Dear /.test(p) && !/^Drivers Medical, DVLA/.test(p));
  return `<h1 class="govuk-heading-xl">${esc(e.rule.summary)}</h1>
    <p class="govuk-body-s">We posted this letter to you on ${fmt(e.date)}.</p>
    <p class="govuk-body">${esc(CUSTOMER.name)}<br>Your reference: <b>${esc(state.reference)}</b></p>
    ${built(e)}
    <h2 class="govuk-heading-m">What this means for your driving</h2>
    <p class="govuk-body">${esc(merge(L.forYourDriving, e.row))}</p>
    <h2 class="govuk-heading-m">What you need to do</h2>
    <p class="govuk-body">${esc(merge(L.whatToDo, e.row))}</p>
    ${open && e.rule.reply ? '<a class="govuk-button" href="#reply-method">Reply now</a>' : ''}
    ${isDecision && e.rule.outcome==='revoked' ? note('Weight without cruelty',
      '<p>The outcome is said plainly, once, at the top. What follows is what to do now: send the licence back, when you can apply again, and how to appeal. A bad outcome with no route forward is the version that generates the call.</p>') : ''}
    <h2 class="govuk-heading-m">Why we wrote to you</h2>
    ${body.map(p=>`<p class="govuk-body">${esc(merge(p, e.row))}</p>`).join('')}
    <h2 class="govuk-heading-m">Our address</h2>
    <p class="govuk-body">Drivers Medical<br>DVLA<br>Swansea<br>SA99 1ZZ</p>
    <details class="govuk-details"><summary class="govuk-details__summary">The letter as we posted it</summary>
      <div class="govuk-details__text"><p><a href="#pdf-${e.row.id}">Download the letter as a PDF</a></p></div></details>
    ${note('A letter set as a page, like an HMRC message',
      '<p>The paper letter is the legal record. Online it reads as a page: what it means for your driving, then what to do, then the body of the letter with its own heading. The PDF of the posted letter is there for anyone who wants it.</p>'
      + question('Technical','Can the customer account read letters from Azure Blob storage? The page here is built from the template; the PDF is the letter as posted.'))}
    <p class="govuk-body"><a href="#health">Back to your health and driving</a></p>`;
}

function renderPdf(id){
  const row = rowById(id);
  const rule = row && TEMPLATE_MAP[row.code];
  return `<h1 class="govuk-heading-xl">${esc(rule ? rule.summary : 'Letter')} (PDF)</h1>
    <div class="cu-pdf">In the real service this opens the PDF of the letter as it was posted.</div>
    ${note('The PDF is the letter as posted',
      question('Technical','Can the customer account read letters from Azure Blob storage, where Dynamics keeps them?'))}
    <p class="govuk-body"><a href="#letter-${esc(id)}">Back to the letter</a></p>`;
}

/* --- Reply journey: one Waiting on you request with reply: true. --- */
function openReplyRequest(der){
  return (der||derive()).entries.find(e=>e.request && !e.resolved && e.rule.reply) || null;
}
function nothingToReply(){
  return `<h1 class="govuk-heading-xl">You do not have anything to reply to</h1>
    <p class="govuk-body">We are not waiting for anything from you at the moment. If we need something, we’ll write to you and it will appear in your account.</p>
    <p class="govuk-body"><a href="${state.access==='code'?'#sign-in':'#health'}">${state.access==='code'?'Sign in to your account':'Go to your health and driving'}</a></p>`;
}
function errorSummary(){
  if(!state.errors) return '';
  return `<div class="govuk-error-summary" role="alert" tabindex="-1"><h2>There is a problem</h2><ul>`
    + state.errors.map(e=>`<li><a href="#" onclick="document.getElementById('${e.field}').focus();return false;">${esc(e.text)}</a></li>`).join('')
    + '</ul></div>';
}
function fieldError(field){
  const e = state.errors && state.errors.find(x=>x.field===field);
  return e ? `<p class="govuk-error-message"><span class="govuk-visually-hidden">Error:</span> ${esc(e.text)}</p>` : '';
}
function backFromReply(){ return state.access==='code' ? ['#code','Back'] : ['#health','Back to your health and driving']; }

const METHODS = {meter:'With a finger-prick meter', sensor:'With a sensor (continuous glucose monitor)', both:'Both'};

function renderReplyMethod(){
  if(!openReplyRequest()) return nothingToReply();
  const v = state.reply.method;
  const err = state.errors && state.errors.length;
  return `${errorSummary()}<form onsubmit="event.preventDefault();submitMethod();">
    <div class="govuk-form-group${err?' govuk-form-group--error':''}"><fieldset class="govuk-fieldset">
      <legend class="govuk-fieldset__legend govuk-fieldset__legend--l"><h1 class="govuk-fieldset__heading">How do you check your blood glucose?</h1></legend>
      ${fieldError('method-meter')}
      <div class="govuk-radios">${Object.keys(METHODS).map(k=>`<div class="govuk-radios__item"><input class="govuk-radios__input" id="method-${k}" name="method" type="radio" value="${k}"${v===k?' checked':''}><label class="govuk-radios__label" for="method-${k}">${esc(METHODS[k])}</label></div>`).join('')}</div>
    </fieldset></div>
    <button class="govuk-button" type="submit">Continue</button>
  </form>`;
}
function submitMethod(){
  const picked = document.querySelector('input[name="method"]:checked');
  if(!picked){ state.errors=[{field:'method-meter', text:'Select how you check your blood glucose'}]; return route(); }
  state.errors = null; state.reply.method = picked.value;
  navigate(state.reply.changing ? '#reply-check' : '#reply-upload');
}

function renderReplyUpload(){
  if(!openReplyRequest()) return nothingToReply();
  const err = state.errors && state.errors.length;
  return `${errorSummary()}<form onsubmit="event.preventDefault();submitUpload();">
    <div class="govuk-form-group${err?' govuk-form-group--error':''}">
      <h1 class="govuk-label-wrapper"><label class="govuk-label govuk-label--l" for="readings">Upload your blood glucose readings</label></h1>
      <div class="govuk-hint">Readings from the last 3 months. You can usually download them from your meter or sensor app. PDF, CSV or a photo, under 10MB.</div>
      ${state.reply.file ? `<p class="govuk-body">Selected: <b>${esc(state.reply.file)}</b></p>` : ''}
      ${fieldError('readings')}
      <input class="govuk-file-upload" id="readings" name="readings" type="file" onchange="pickFile(this)">
    </div>
    <p class="govuk-body-s"><a href="#" onclick="state.reply.file='glucose-readings-aug-to-oct.pdf';state.errors=null;route();return false;">Prototype: use an example file</a></p>
    <button class="govuk-button" type="submit">Continue</button>
  </form>`;
}
function pickFile(input){ if(input.files && input.files[0]) state.reply.file = input.files[0].name; }
function submitUpload(){
  if(!state.reply.file){ state.errors=[{field:'readings', text:'Select a file with your blood glucose readings'}]; return route(); }
  state.errors = null; navigate('#reply-check');
}

function renderReplyCheck(){
  const req = openReplyRequest();
  if(!req) return nothingToReply();
  state.reply.changing = true;
  return `<h1 class="govuk-heading-xl">Check your answers before sending them</h1>
    <dl class="govuk-summary-list">
      <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">How you check your blood glucose</dt><dd class="govuk-summary-list__value">${esc(METHODS[state.reply.method]||'Not answered')}</dd><dd class="govuk-summary-list__actions"><a href="#reply-method">Change<span class="govuk-visually-hidden"> how you check your blood glucose</span></a></dd></div>
      <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Your readings</dt><dd class="govuk-summary-list__value">${esc(state.reply.file||'No file')}</dd><dd class="govuk-summary-list__actions"><a href="#reply-upload">Change<span class="govuk-visually-hidden"> your readings</span></a></dd></div>
    </dl>
    <h2 class="govuk-heading-m">Now send your reply</h2>
    <p class="govuk-body">By sending this reply you are confirming that, to the best of your knowledge, the details you are giving are correct.</p>
    <button class="govuk-button" type="button" onclick="sendReply()">Accept and send</button>
    ${note('The reply lands on the same record as the paper one',
      '<p>Sending writes an incoming row to the Communications tab and marks the request “Despatched, Received”. Rule 6 then resolves it, and the status card moves to “With us”.</p>'
      +'<p>That incoming row is an assumption. An online reply is not a letter, so today it would write nothing to the Communications tab. Without it, this whole model cannot see a digital reply.</p>')}`;
}
function sendReply(){
  const req = openReplyRequest();
  if(!req){ return navigate('#reply-sent'); }
  if(!state.reply.method || !state.reply.file){ return navigate(!state.reply.method ? '#reply-method' : '#reply-upload'); }
  req.row.responseStatus = 'Despatched, Received';
  state.communications.push(inc('r'+(state.communications.length+1), 'RCV-ONLINE-REPLY', state.today));
  state.reply.sent = true; state.reply.changing = false;
  navigate('#reply-sent');
}
function renderReplySent(){
  const byCode = state.access==='code';
  return `<div class="govuk-panel"><h1 class="govuk-panel__title">Readings sent</h1><div class="govuk-panel__body">Your reference<br><strong>${esc(state.reference)}</strong></div></div>
    ${!state.reply.sent ? '<p class="govuk-body-s">Prototype: you opened this screen directly, so nothing was sent.</p>' : ''}
    <h2 class="govuk-heading-m">What happens next</h2>
    <p class="govuk-body">We’ll look at your readings alongside your doctor’s report. This usually takes 4 to 8 weeks, because one of our doctors may need to read them. We’ll write to you when we’ve decided, or if we need anything else.</p>
    <p class="govuk-body">You do not need to post the paper form as well.</p>
    <h2 class="govuk-heading-m">Can I drive?</h2>
    <p class="govuk-body">Yes. You can keep driving while we look at your diabetes, as long as your doctor has not told you to stop.</p>
    ${byCode
      ? '<p class="govuk-body">To see your letters and what’s happening, <a href="#sign-in">sign in to your driver and vehicles account</a>.</p>'
      : '<p class="govuk-body"><a href="#health">Go to your health and driving</a></p>'}
    ${note('The reference, then what happens next',
      '<p>The reference is the one customers already use when they call, so it goes in the panel. On its own it would generate the next call, so this page also says what happens next, roughly when, and whether they can drive.</p>')}`;
}

/* --- The paper code route. --- */
function renderCode(){
  const err = state.errors && state.errors.length;
  const v = state.codeForm || {};
  return `${errorSummary()}<h1 class="govuk-heading-xl">Reply using the code on your letter</h1>
    <p class="govuk-body">The code is printed at the top of the letter we posted you. It lets you reply to that letter and nothing else.</p>
    <form onsubmit="event.preventDefault();submitCode();">
      <div class="govuk-form-group${err?' govuk-form-group--error':''}">
        <label class="govuk-label" for="code">Code</label>
        <div class="govuk-hint">For example, HX7K 9MPQ</div>
        ${fieldError('code')}
        <input class="govuk-input govuk-input--width-10" id="code" name="code" type="text" autocomplete="off" spellcheck="false" value="${esc(v.code||'')}">
      </div>
      <div class="govuk-form-group"><fieldset class="govuk-fieldset" role="group">
        <legend class="govuk-fieldset__legend">Date of birth</legend>
        <div class="govuk-hint">For example, 14 6 1979</div>
        ${fieldError('dob-day')}
        <div class="govuk-date-input">
          <div class="govuk-date-input__item"><label class="govuk-date-input__label" for="dob-day">Day</label><input class="govuk-input govuk-input--width-2" id="dob-day" type="text" inputmode="numeric" value="${esc(v.day||'')}"></div>
          <div class="govuk-date-input__item"><label class="govuk-date-input__label" for="dob-month">Month</label><input class="govuk-input govuk-input--width-2" id="dob-month" type="text" inputmode="numeric" value="${esc(v.month||'')}"></div>
          <div class="govuk-date-input__item"><label class="govuk-date-input__label" for="dob-year">Year</label><input class="govuk-input govuk-input--width-4" id="dob-year" type="text" inputmode="numeric" value="${esc(v.year||'')}"></div>
        </div>
      </fieldset></div>
      <button class="govuk-button" type="submit">Continue</button>
    </form>
    <p class="govuk-body-s">Prototype: use code <b>HX7K 9MPQ</b> and date of birth <b>14 6 1979</b>. <a href="#" onclick="state.codeForm={code:'HX7K 9MPQ',day:'14',month:'6',year:'1979'};route();return false;">Fill them in</a></p>
    ${note('The code reaches one letter',
      '<p>A customer with only the paper letter replies to the same request, and the reply lands on the same record. The code does not open the timeline or any other letter.</p>'
      + question('DPP','What identity check is enough for this layer? The prototype has no lockout and treats the code as single-use once a reply is sent.'))}`;
}
function submitCode(){
  const code = document.getElementById('code').value;
  const day = document.getElementById('dob-day').value, month = document.getElementById('dob-month').value, year = document.getElementById('dob-year').value;
  state.codeForm = {code, day, month, year};
  const dob = year && month && day ? year.trim()+'-'+String(month.trim()).padStart(2,'0')+'-'+String(day.trim()).padStart(2,'0') : '';
  if(code.replace(/\s/g,'').toUpperCase()!==PAPER_CODE || dob!==CUSTOMER.dob){
    state.errors = [{field:'code', text:'Enter the code and date of birth exactly as they appear on your letter'}];
    return route();
  }
  state.errors = null;
  if(state.access!=='oneLogin') state.access = 'code';
  navigate('#reply-method');
}

function renderNotBuilt(){
  return `<h1 class="govuk-heading-xl">Not built in this prototype</h1>
    <p class="govuk-body">This link shows where something sits on the real account. Only health and driving is built here.</p>
    <p class="govuk-body"><a href="#account">Back to your account</a></p>`;
}

/* ================================================================
   Router. Plain #name hashes, so any screen can be linked directly.
   ================================================================ */
const SCREENS = {
  'all-screens': {title:'All screens', render:renderAllScreens, full:true},
  'notification':{title:'The notification', render:renderNotification},
  'sign-in':     {title:'Sign in', render:renderSignIn},
  'account':     {title:'Your account', render:renderAccount, full:true, signedIn:true},
  'health':      {title:'Your health and driving', render:renderCase, signedIn:true, back:['#account','Back to your account']},
  'letter':      {title:'Letter', render:renderLetter, signedIn:true, back:['#health','Back to your health and driving']},
  'pdf':         {title:'Letter (PDF)', render:renderPdf, signedIn:true},
  'reply-method':{title:'How do you check your blood glucose?', render:renderReplyMethod, back:'reply'},
  'reply-upload':{title:'Upload your readings', render:renderReplyUpload, back:['#reply-method','Back']},
  'reply-check': {title:'Check your answers', render:renderReplyCheck, back:['#reply-upload','Back']},
  'reply-sent':  {title:'Readings sent', render:renderReplySent},
  'code':        {title:'Reply using the code on your letter', render:renderCode, back:['#sign-in','Back']},
  'not-built':   {title:'Not built', render:renderNotBuilt}
};

function route(){
  let key = (location.hash || '').replace(/^#\/?/, '') || 'all-screens';
  let param = null;
  const m = key.match(/^(letter|pdf)-(.+)$/);
  if(m){ key = m[1]; param = m[2]; }
  if(!SCREENS[key]) key = 'all-screens';
  if(state.screen !== key) state.errors = null;
  state.screen = key;
  const s = SCREENS[key];
  /* Any screen can be opened directly in a workshop, so a signed-in
     screen opened cold signs the customer in, as the index would. */
  if(s.signedIn && state.access!=='oneLogin') state.access = 'oneLogin';
  const back = s.back==='reply' ? backFromReply() : s.back;
  document.getElementById('app').innerHTML = renderChrome(s.render(param), {full:s.full, back});
  document.title = s.title+' — Case updates prototype';
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);
</script>
</body>
</html>

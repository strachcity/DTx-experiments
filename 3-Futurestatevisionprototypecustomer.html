const app = () => document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function navigate(h){ if(location.hash===h){ route(); } else { location.hash = h; } }
function primaryCondition(){ return state.conditions[0] || 'epilepsy'; }
function conditionNames(){ return state.conditions.map(c=>conditions[c].name).join(', ') || '—'; }
function j(){ return state.journey ? JOURNEYS[state.journey] : null; }

function warn(){
  return '<div class="prototype-warning"><strong>⚠ Fictional prototype</strong>This is a fictional prototype showing the future state Drivers Medical customer journey. It does not make real DVLA licensing decisions, and all personal details shown are invented.</div>';
}
/* Design notes are prototype annotations, not part of the service UI. */
function note(title, body){
  if(!state.showNotes) return '';
  return '<div class="design-note"><strong>Design note — '+esc(title)+'</strong>'+body+'</div>';
}
function back(fallback){
  const jj = j();
  if(jj && state.stepIndex>0) return '<button class="govuk-back-link" onclick="stepBack()">Back</button>';
  if(jj) return '<a class="govuk-back-link" href="#/hub">Back to journeys</a>';
  return fallback ? '<a class="govuk-back-link" href="'+fallback+'">Back</a>' : '';
}

/* --- journey control --- */
function startJourney(id){
  const jj = JOURNEYS[id];
  if(!jj) return navigate('#/hub');
  const keepNotes = state.showNotes;
  jj.preset();
  state.showNotes = keepNotes;
  state.journey = id;
  state.stepIndex = 0;
  navigate(jj.steps[0].h);
}
function advance(fallbackHash){
  const jj = j();
  if(jj){
    if(state.stepIndex + 1 < jj.steps.length){
      state.stepIndex++;
      navigate(jj.steps[state.stepIndex].h);
    } else {
      navigate('#/journey-complete');
    }
    return;
  }
  if(fallbackHash) navigate(fallbackHash);
}
function stepBack(){
  const jj = j();
  if(jj && state.stepIndex>0){
    state.stepIndex--;
    navigate(jj.steps[state.stepIndex].h);
  } else { navigate('#/hub'); }
}
function exitJourney(){
  state.journey = null;
  navigate('#/hub');
}

function radioPage(opts){
  const {caption,title,hint,name,options,richOptions,stateKey,fallbackBack,fallbackNext,onNext} = opts;
  let html = warn()+back(fallbackBack);
  if(opts.note) html += opts.note;
  html += '<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">';
  html += '<div class="govuk-form-group"><fieldset>';
  if(caption) html += '<span class="govuk-caption">'+esc(caption)+'</span>';
  html += '<legend class="govuk-fieldset__legend govuk-fieldset__legend--l"><h1 class="govuk-fieldset__heading">'+esc(title)+'</h1></legend>';
  if(hint) html += '<span class="govuk-hint">'+esc(hint)+'</span>';
  html += '<div style="margin-top:20px;">';
  const list = richOptions || Object.entries(options).map(([value,label])=>({value,label}));
  list.forEach(o=>{
    const checked = state[stateKey]===o.value?' checked':'';
    html += '<div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="'+name+'" id="'+name+'-'+o.value+'" value="'+o.value+'"'+checked+'>'
      +'<div><label class="govuk-radios__label" for="'+name+'-'+o.value+'">'+(o.hint?'<strong>'+esc(o.label)+'</strong>':esc(o.label))+'</label>'
      +(o.hint?'<span class="govuk-radios__hint">'+esc(o.hint)+'</span>':'')+'</div></div>';
  });
  html += '</div></fieldset></div><button class="govuk-button" id="continue-btn">Continue</button></div></div>';
  app().innerHTML = html;
  document.getElementById('continue-btn').addEventListener('click',()=>{
    const sel = document.querySelector('input[name="'+name+'"]:checked');
    if(!sel){alert('Please select an option.');return;}
    if(stateKey) state[stateKey]=sel.value;
    if(onNext) onNext(sel.value); else advance(fallbackNext);
  });
}

function renderPrescreen(){
  let qs = '';
  state.conditions.forEach(key=>{
    const c = conditions[key];
    const val = state.prescreen[key];
    qs += '<div class="govuk-form-group"><fieldset>'
      +'<legend class="govuk-fieldset__legend">'+esc(c.name)+'</legend>'
      +'<span class="govuk-hint">'+esc(c.prescreen)+'</span>'
      +'<div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="ps-'+key+'" id="ps-'+key+'-yes" value="yes"'+(val==='yes'?' checked':'')+'><label class="govuk-radios__label" for="ps-'+key+'-yes">Yes</label></div>'
      +'<div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="ps-'+key+'" id="ps-'+key+'-no" value="no"'+(val==='no'?' checked':'')+'><label class="govuk-radios__label" for="ps-'+key+'-no">No</label></div>'
      +'</fieldset></div>';
  });
  app().innerHTML = warn()+back('#/conditions')
    +note('Filtering out','<p>Answering “no” to every pre-screening question exits the service without creating a case at all. In the current service these people still write in and still take up casework capacity.</p>')
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<span class="govuk-caption">First series notification</span>'
    +'<h1 class="govuk-heading-l">A few questions before we start</h1>'
    +'<p class="govuk-body">Your answers tell us whether you need to notify us at all. Many people do not.</p>'
    + qs
    +'<button class="govuk-button" id="continue-btn">Continue</button>'
    +'</div></div>';
  document.getElementById('continue-btn').addEventListener('click',()=>{
    const answers = {};
    for(const key of state.conditions){
      const sel = document.querySelector('input[name="ps-'+key+'"]:checked');
      if(!sel){alert('Please answer the question about '+conditions[key].name+'.');return;}
      answers[key]=sel.value;
    }
    state.prescreen = answers;
    const needed = state.conditions.filter(k=>answers[k]==='yes');
    if(!needed.length){ navigate('#/prescreen-exit'); return; }
    state.conditions = needed;
    advance('#/questionnaire/0');
  });
}

    +'</div></div>';
}

function renderQuestionnaire(idx){
  const i = parseInt(idx,10)||0;
  if(i>=state.conditions.length){ advance('#/check-answers'); return; }
  const key = state.conditions[i];
  const c = conditions[key];
  const stored = state.answers[key] || {};

  let fields = '';
  c.questions.forEach(q=>{
    fields += '<div class="govuk-form-group">';
    if(q.type==='radio'){
      fields += '<fieldset><legend class="govuk-fieldset__legend">'+esc(q.label)+'</legend>';
      if(q.hint) fields += '<span class="govuk-hint">'+esc(q.hint)+'</span>';
      Object.entries(q.options).forEach(([val,label])=>{
        fields += '<div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="q-'+q.id+'" id="q-'+q.id+'-'+val+'" value="'+val+'"'+(stored[q.id]===val?' checked':'')+'>'
          +'<label class="govuk-radios__label" for="q-'+q.id+'-'+val+'">'+esc(label)+'</label></div>';
      });
      fields += '</fieldset>';
    } else {
      fields += '<label class="govuk-label" for="q-'+q.id+'">'+esc(q.label)+'</label>';
      if(q.hint) fields += '<span class="govuk-hint">'+esc(q.hint)+'</span>';
      fields += '<input class="govuk-input" type="text" id="q-'+q.id+'" value="'+esc(stored[q.id]||'')+'">';
    }
    fields += '</div>';
  });

  app().innerHTML = warn()
    + (i===0 ? back('#/prescreen') : '<a class="govuk-back-link" href="#/questionnaire/'+(i-1)+'">Back</a>')
    
    + note('One or two clicks','<p>The blueprint asks for a condition-specific first-series questionnaire answerable in <strong>one or two clicks</strong>, for single or multiple conditions. Keeping each set this short is what makes same-session decisions possible.</p>')
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<span class="govuk-caption">First series notification — condition '+(i+1)+' of '+state.conditions.length+'</span>'
    +'<h1 class="govuk-heading-l">About your '+esc(c.name.toLowerCase())+'</h1>'
    + fields
    +'<button class="govuk-button" id="continue-btn">Continue</button>'
    +'</div></div>';

  document.getElementById('continue-btn').addEventListener('click',()=>{
    const out = {};
    for(const q of c.questions){
      if(q.type==='radio'){
        const sel = document.querySelector('input[name="q-'+q.id+'"]:checked');
        if(!sel){alert('Please answer: '+q.label);return;}
        out[q.id]=sel.value;
      } else {
        const v = document.getElementById('q-'+q.id).value.trim();
        if(!v){alert('Please answer: '+q.label);return;}
        out[q.id]=v;
      }
    }
    state.answers[key]=out;
    /* More conditions to answer? Stay on this step of the journey. */
    if(i+1 < state.conditions.length){ navigate('#/questionnaire/'+(i+1)); return; }
    advance(state.secondNeeded ? '#/second-series-info' : '#/check-answers');
  });
}

function renderCheckAnswers(){
  let rows = '<div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Conditions reported</dt>'
    +'<dd class="govuk-summary-list__value">'+esc(conditionNames())+'</dd>'
    +'<dd class="govuk-summary-list__actions"><a href="#/conditions">Change</a></dd></div>';
  state.conditions.forEach((key,i)=>{
    const c = conditions[key]; const stored = state.answers[key]||{};
    c.questions.forEach(q=>{
      const raw = stored[q.id];
      const val = q.type==='radio' ? (q.options[raw]||'—') : (raw||'—');
      rows += '<div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">'+esc(q.label)+'</dt>'
        +'<dd class="govuk-summary-list__value">'+esc(val)+'</dd>'
        +'<dd class="govuk-summary-list__actions"><a href="#/questionnaire/'+i+'">Change</a></dd></div>';
    });

function renderUpload(){
  const cond = primaryCondition();
  let files = '';
  if(state.uploads.length){
    state.uploads.forEach((f,i)=>{

  }
  const guide = (evidenceGuidance[cond]||[]).map(g=>'<li>'+esc(g)+'</li>').join('');
  app().innerHTML = warn()+back('#/second-series-choose')
    +note('Guidance at the point of need','<p>The blueprint asks for guidance on what documents are accepted for that specific condition, shown where the customer is uploading — not buried in a separate help page.</p>')
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<span class="govuk-caption">Second series notification</span>'
    +'<h1 class="govuk-heading-l">Upload your evidence</h1>'
    +'<div class="govuk-inset-text"><p style="margin:0;"><strong>What we need:</strong> '+esc(evidenceNeeded[cond])+'</p></div>'
    +'<h2 class="govuk-heading-m">What makes a document acceptable</h2>'
    +'<ul class="govuk-body">'+guide+'</ul>'
    +'<div class="dropzone" id="dropzone">'
    +'<div class="dropzone__title">Drag and drop your files here</div>'
    +'<div class="dropzone__hint">or <a href="#" id="browse">choose a file from your device</a><br>PDF, JPG or PNG, up to 10MB each. Most people photograph the letter with their phone.</div>'
    +'</div>'
    +'<input type="file" id="fileInput" multiple style="display:none;">'
    + files
    +'<button class="govuk-button" id="continue-btn">Continue</button>'
    +'</div></div>';

  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  document.getElementById('browse').addEventListener('click',e=>{e.preventDefault();fi.click();});
  dz.addEventListener('click',()=>fi.click());
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('is-over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('is-over'));
  dz.addEventListener('drop',e=>{
    e.preventDefault(); dz.classList.remove('is-over');
    Array.from(e.dataTransfer.files).forEach(f=>state.uploads.push(f.name));
    route();
  });
  fi.addEventListener('change',e=>{
    Array.from(e.target.files).forEach(f=>state.uploads.push(f.name));
    route();
  });
  document.querySelectorAll('[data-remove]').forEach(b=>{
    b.addEventListener('click',()=>{ state.uploads.splice(parseInt(b.dataset.remove,10),1); route(); });
  });
  document.getElementById('continue-btn').addEventListener('click',()=>{
    if(!state.uploads.length){
      if(!confirm('No file added. Add a sample document so the prototype can continue?')) return;
      state.uploads.push('neurology-report-march-2026.pdf');
    }
    advance('#/upload-review');
  });
}

    +'<p class="govuk-body">'+(on
      ? 'From now on we will review your licence for you. If nothing has changed, we will renew it and tell you. If something needs your attention, we will contact you first.'
      : 'We will send you a reminder 8 weeks before your next review, and you can confirm it then.')+'</p>'
    +'<p class="govuk-body">You can change this at any time from <a href="#/manage">manage your medical licence</a>.</p>'
    +'<div class="button-row">'
    +'<button class="govuk-button" onclick="advance(\'#/account\')">Finish</button>'
    +'<a class="govuk-button govuk-button--secondary" href="#/account" style="text-decoration:none;">Return to your account</a>'
    +'</div></div></div>';
}

function renderManage(){
  app().innerHTML = warn()+ (j()? back():'<a class="govuk-back-link" href="#/account">Back</a>') 
    +note('Self service','<p>Everything on this list is currently a phone call or a letter. Moving it into the account is what turns “managing your licence” from a DVLA process into something the customer controls.</p>')
    +'<h1 class="govuk-heading-l">Manage your medical licence</h1>'
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<dl class="govuk-summary-list">'
    +'<div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Current licence</dt><dd class="govuk-summary-list__value">Group 1, 3 year medical review</dd></div>'
    +'<div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Status</dt><dd class="govuk-summary-list__value">'+(state.licencePaused?'<span class="govuk-tag govuk-tag--orange">Paused</span>':'<span class="govuk-tag govuk-tag--green">Active</span>')+'</dd></div>'
    +'<div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Conditions on record</dt><dd class="govuk-summary-list__value">'+esc(conditionNames())+'</dd></div>'
    +'<div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Automatic review</dt><dd class="govuk-summary-list__value">'+(state.autoRenew==='yes'?'On':state.autoRenew==='no'?'Off':'Not set')+'</dd></div>'
    +'</dl>'
    +'<h2 class="govuk-heading-m">What would you like to do?</h2>'
    +'<ul class="task-list">'
    +'<li class="task-list__item"><div class="task-list__name"><strong><a href="#/update-condition">Tell us your condition has changed</a></strong>'
    +'<span class="task-list__hint">If it has got better or worse, or your treatment has changed</span></div><span class="govuk-tag govuk-tag--blue">Anytime</span></li>'
    +'<li class="task-list__item"><div class="task-list__name"><strong><a href="#/renewal-preferences">Choose how your licence is reviewed</a></strong>'
    +'<span class="task-list__hint">Automatically, or remind me to confirm</span></div><span class="govuk-tag govuk-tag--'+(state.autoRenew?'green':'grey')+'">'+(state.autoRenew?'Set':'Not set')+'</span></li>'
    + (state.licencePaused
      ? '<li class="task-list__item"><div class="task-list__name"><strong><a href="#/resume">Resume your licence</a></strong><span class="task-list__hint">Start driving again without reapplying</span></div><span class="govuk-tag govuk-tag--orange">Paused</span></li>'
      : '<li class="task-list__item"><div class="task-list__name"><strong><a href="#/pause">Pause your licence</a></strong><span class="task-list__hint">If you are not driving at the moment</span></div><span class="govuk-tag govuk-tag--grey">Optional</span></li>')
    +'<li class="task-list__item"><div class="task-list__name"><strong><a href="#/surrender">Surrender your licence</a></strong>'
    +'<span class="task-list__hint">Give up your licence permanently</span></div><span class="govuk-tag govuk-tag--grey">Optional</span></li>'
    +'</ul>'
    + (j()?'<div class="button-row"><button class="govuk-button" onclick="advance()">Continue</button></div>':'')
    +'</div></div>';
}

function renderPause(){
  app().innerHTML = warn()+back('#/manage')
    +note('Pause, not surrender','<p>Offering a pause is the blueprint’s alternative to people quietly surrendering a licence they could keep. The entitlement stays open, so returning to driving does not mean reapplying from scratch.</p>')
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<span class="govuk-caption">Managing your licence</span>'
    +'<h1 class="govuk-heading-l">Pause your licence</h1>'
    +'<p class="govuk-body">Pausing keeps your entitlement open. You will not be able to drive while it is paused, but you can resume at any time without reapplying or having another medical assessment.</p>'
    +'<div class="govuk-inset-text"><p style="margin:0;">We will still remind you when your medical review is due, so your licence does not lapse while it is paused.</p></div>'
    +'<div class="govuk-form-group"><fieldset>'
    +'<legend class="govuk-fieldset__legend">Why are you pausing it?</legend>'
    +'<span class="govuk-hint">This helps us understand how the service is working. It does not affect your entitlement.</span>'
    +'<div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="reason" id="r1" value="health" checked><label class="govuk-radios__label" for="r1">My health means I am not driving at the moment</label></div>'
    +'<div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="reason" id="r2" value="choice"><label class="govuk-radios__label" for="r2">I have chosen not to drive for now</label></div>'
    +'<div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="reason" id="r3" value="other"><label class="govuk-radios__label" for="r3">Another reason</label></div>'
    +'</fieldset></div>'
    +'<div class="govuk-form-group"><div class="govuk-checkboxes__item">'
    +'<input class="govuk-checkboxes__input" type="checkbox" id="pauseConfirm">'
    +'<label class="govuk-checkboxes__label" for="pauseConfirm">I understand I must not drive while my licence is paused</label></div></div>'
    +'<button class="govuk-button" id="continue-btn">Pause my licence</button>'
    +'</div></div>';
  document.getElementById('continue-btn').addEventListener('click',()=>{
    if(!document.getElementById('pauseConfirm').checked){alert('Please confirm you understand before continuing.');return;}
    state.licencePaused = true;
    advance('#/pause-done');
  });
}

function renderPauseDone(){
  app().innerHTML = warn()
    +'<div class="govuk-panel"><h1 class="govuk-panel__title">Licence paused</h1><div class="govuk-panel__body">You must not drive</div></div>'
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<p class="govuk-body">Your entitlement is still yours — it is just on hold. You can resume it at any time from your account, without reapplying.</p>'
    +'<p class="govuk-body">We have sent a confirmation to '+esc(person.email)+' and updated your driving record.</p>'
    +'<div class="button-row">'
    +'<button class="govuk-button" onclick="advance(\'#/account\')">Continue</button>'
    +'<a class="govuk-button govuk-button--secondary" href="#/account" style="text-decoration:none;">Return to your account</a>'
    +'</div></div></div>';
}

function renderResume(){
  app().innerHTML = warn()+ (j()? back():'<a class="govuk-back-link" href="#/manage">Back</a>') 
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<span class="govuk-caption">Managing your licence</span>'
    +'<h1 class="govuk-heading-l">Resume your licence</h1>'
    +'<p class="govuk-body">Your licence has been paused since 7 August 2026. To start driving again, confirm that nothing about your condition has changed while it was paused.</p>'
    +'<div class="govuk-form-group"><fieldset>'
    +'<legend class="govuk-fieldset__legend">Has anything changed since you paused your licence?</legend>'
    +'<div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="resumeChanged" id="rc-no" value="no" checked><label class="govuk-radios__label" for="rc-no">No, nothing has changed</label></div>'
    +'<div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="resumeChanged" id="rc-yes" value="yes"><label class="govuk-radios__label" for="rc-yes">Yes, something has changed</label></div>'
    +'</fieldset></div>'
    +'<div class="govuk-inset-text"><p style="margin:0;">If nothing has changed, your licence is restored straight away and your review date is unaffected.</p></div>'
    +'<button class="govuk-button" id="continue-btn">Resume my licence</button>'
    +'</div></div>';
  document.getElementById('continue-btn').addEventListener('click',()=>{
    const sel = document.querySelector('input[name="resumeChanged"]:checked');
    if(sel && sel.value==='yes'){ state.journey=null; navigate('#/update-condition'); return; }
    state.licencePaused = false;
    advance('#/resume-done');
  });
}

function renderResumeDone(){
  app().innerHTML = warn()
    +'<div class="govuk-panel"><h1 class="govuk-panel__title">Licence resumed</h1><div class="govuk-panel__body">You can drive again from today</div></div>'
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<p class="govuk-body">Your entitlement has been restored and your medical review date has not changed. You did not need to reapply or have another assessment.</p>'
    +'<button class="govuk-button" id="continue-btn">Continue</button>'
    +'</div></div>';
  document.getElementById('continue-btn').addEventListener('click',()=>advance('#/manage'));
}

function renderRenewalPreferences(){
  radioPage({
    caption:'Managing your licence',
    title:'How would you like your licence to be reviewed?',
    hint:'Your next review is due on 7 August 2029. You can change this at any time.',
    name:'autoRenew',
    stateKey:'autoRenew',
    note:note('On or off, any time','<p>The blueprint treats automatic renewal as a customer-controlled setting rather than a one-off decision, so it can be switched off as easily as it was switched on.</p>'),
    richOptions:[
      {value:'yes',label:'Review it automatically',hint:'We check your record and renew without you doing anything, as long as nothing has changed'},
      {value:'no',label:'Remind me and I will confirm',hint:'We will send you a reminder 8 weeks before'}
    ],
    fallbackBack:'#/manage',
    fallbackNext:'#/auto-renew-done'
  });
}

function renderUpdateCondition(){
  radioPage({
    caption:'Managing your licence',
    title:'How has your condition changed?',
    hint:'Telling us early usually means we can deal with it without you losing your licence.',
    name:'conditionUpdate',
    stateKey:'conditionUpdate',
    richOptions:[
      {value:'none',label:'Nothing has changed',hint:'You just want to confirm your details are still correct'},
      {value:'better',label:'It has improved',hint:'For example, you have been free of symptoms, or your treatment has been reduced'},
      {value:'worse',label:'It has got worse',hint:'For example, you have had a new episode, or your treatment has changed'},
      {value:'new',label:'I have a new condition to report',hint:'This will start a new notification'}
    ],
    fallbackBack:'#/manage',
    onNext(val){
      if(val==='new'){ state.stage=0; navigate('#/conditions'); return; }
      if(val!=='none') state.stage = 1;
      navigate('#/update-sent');
    }
  });
}

function renderUpdateSent(){
  if(state.conditionUpdate==='none'){
    app().innerHTML = warn()
      +'<div class="govuk-panel"><h1 class="govuk-panel__title">Details confirmed</h1><div class="govuk-panel__body">Nothing has changed</div></div>'
      +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
      +'<p class="govuk-body">Thank you for confirming. Nothing about your licence changes, and there is nothing else for you to do.</p>'
      +'<p class="govuk-body">Tell us straight away if that changes — reporting early usually means we can deal with it without you losing your licence.</p>'
      +'<div class="button-row">'
      +'<a class="govuk-button" href="#/manage" style="text-decoration:none;">Back to managing your licence</a>'
      +'<a class="govuk-button govuk-button--secondary" href="#/account" style="text-decoration:none;">Return to your account</a>'
      +'</div></div></div>';
    return;
  }
  app().innerHTML = warn()
    +'<div class="govuk-panel"><h1 class="govuk-panel__title">Update sent</h1><div class="govuk-panel__body">Case reference<br><strong>'+caseRef+'</strong></div></div>'
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<h2 class="govuk-heading-m">What happens next</h2>'
    +'<p class="govuk-body">A caseworker will review your update and confirm whether anything about your licence needs to change. We will be in touch within '+esc(caseworker.responseTime)+'.</p>'
    +'<p class="govuk-body">You can keep driving unless your doctor has told you to stop, or we write to tell you otherwise.</p>'
    +'<div class="button-row">'
    +'<a class="govuk-button" href="#/status" style="text-decoration:none;">View your case status</a>'
    +'<a class="govuk-button govuk-button--secondary" href="#/account" style="text-decoration:none;">Return to your account</a>'
    +'</div></div></div>';
}

function renderSurrender(){
  app().innerHTML = warn()+'<a class="govuk-back-link" href="#/manage">Back</a>'
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<h1 class="govuk-heading-l">Surrender your licence</h1>'
    +'<div class="govuk-warning-text"><span class="govuk-warning-text__icon" aria-hidden="true">!</span>'
    +'<span class="govuk-warning-text__text">If you surrender your licence you must stop driving straight away, and you would need to reapply to drive again.</span></div>'
    +'<div class="govuk-inset-text"><p style="margin:0;"><strong>Have you considered pausing instead?</strong> Pausing keeps your entitlement open so you can start driving again without reapplying. <a href="#/pause">Pause my licence instead</a>.</p></div>'
    +'<p class="govuk-body">You do not need to post your licence to us. We will record the surrender as soon as you confirm it — destroy your photocard yourself.</p>'
    +'<div class="govuk-form-group"><div class="govuk-checkboxes__item">'
    +'<input class="govuk-checkboxes__input" type="checkbox" id="surrenderConfirm">'
    +'<label class="govuk-checkboxes__label" for="surrenderConfirm">I confirm I want to surrender my licence and will stop driving now</label></div></div>'
    +'<button class="govuk-button govuk-button--warning" id="continue-btn">Surrender my licence</button>'
    +'</div></div>';
  document.getElementById('continue-btn').addEventListener('click',()=>{
    if(!document.getElementById('surrenderConfirm').checked){alert('Please confirm before continuing.');return;}
    state.hasMedicalLicence = false;
    navigate('#/surrender-done');
  });
}

function renderSurrenderDone(){
  app().innerHTML = warn()
    +'<div class="govuk-panel"><h1 class="govuk-panel__title">Licence surrendered</h1><div class="govuk-panel__body">Reference<br><strong>'+caseRef+'</strong></div></div>'
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<p class="govuk-body">You must stop driving now. Destroy your photocard — you do not need to post it to us.</p>'
    +'<p class="govuk-body">If you want to drive again, you can reapply at any time from your account.</p>'
    +'<a class="govuk-button" href="#/account" style="text-decoration:none;">Return to your account</a>'
    +'</div></div>';
}

/* --- challenge / appeal --- */
function renderChallenge(){
  app().innerHTML = warn()+'<a class="govuk-back-link" href="#/decision-issue">Back</a>'
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<h1 class="govuk-heading-l">Challenge this decision</h1>'
    +'<p class="govuk-body">If you think we have got something wrong, or your circumstances have changed, ask us to look at your case again. A different caseworker will review it.</p>'
    +'<p class="govuk-body">This is free and usually takes 10 working days. It does not affect your right to appeal to a tribunal later.</p>'
    +'<div class="govuk-form-group"><label class="govuk-label" for="challengeReason">Tell us why you think the decision is wrong</label>'
    +'<span class="govuk-hint">Include anything we may not have seen, such as a newer test result.</span>'
    +'<textarea class="govuk-textarea" id="challengeReason"></textarea></div>'
    +'<button class="govuk-button" id="continue-btn">Send challenge</button>'
    +'<p class="govuk-body" style="margin-top:20px;"><a href="#/appeal">Or appeal directly to a tribunal</a></p>'
    +'</div></div>';
  document.getElementById('continue-btn').addEventListener('click',()=>{
    const r = document.getElementById('challengeReason').value.trim();
    if(!r){alert('Please tell us why you think the decision is wrong.');return;}
    app().innerHTML = warn()
      +'<div class="govuk-panel"><h1 class="govuk-panel__title">Challenge sent</h1><div class="govuk-panel__body">Case reference<br><strong>'+caseRef+'</strong></div></div>'
      +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
      +'<p class="govuk-body">A different caseworker will review your case and we will be in touch within 10 working days. Your current licence is not affected while we review it.</p>'
      +'<a class="govuk-button" href="#/account" style="text-decoration:none;">Return to your account</a>'
      +'</div></div>';
  });
}

function renderAppeal(){
  app().innerHTML = warn()+'<a class="govuk-back-link" href="#/decision-issue">Back</a>'
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<h1 class="govuk-heading-l">Appeal to a tribunal</h1>'
    +'<p class="govuk-body">If you have challenged our decision and still disagree, you can appeal to an independent tribunal. In England and Wales this is a magistrates’ court. In Scotland it is the sheriff court.</p>'
    +'<h2 class="govuk-heading-m">Before you appeal</h2>'
    +'<ul class="govuk-body"><li>you must appeal within 6 months of our decision</li>'
    +'<li>you should ask us to review the decision first — it is faster and free</li>'
    +'<li>you may want to get independent advice</li></ul>'
    +'<div class="govuk-inset-text"><p style="margin:0;">The tribunal is independent of DVLA. We will send them everything we hold about your case, and you can send them your own evidence.</p></div>'
    +'<div class="button-row">'
    +'<a class="govuk-button" href="#/appeal" style="text-decoration:none;">Start an appeal</a>'
    +'<a class="govuk-button govuk-button--secondary" href="#/challenge" style="text-decoration:none;">Ask DVLA to review it first</a>'
    +'</div></div></div>';
}

/* ================================================================
   ROUTER
   ================================================================ */
function route(){
  const hash = location.hash || '#/hub';
  const parts = hash.split('/');
  const base = '#/' + (parts[1] || 'hub');
  const arg = parts[2];
  window.scrollTo(0,0);
  renderChrome();

  switch(base){
    case '#/hub':                 renderHub();break;
    case '#/all-screens':         renderAllScreens();break;
    case '#/journey-complete':    renderJourneyComplete();break;

    case '#/signin':              renderSignIn();break;
    case '#/account-setup':       renderAccountSetup();break;
    case '#/account':             renderAccount();break;

    case '#/report-start':        renderReportStart();break;
    case '#/conditions':          renderConditions();break;
    case '#/prescreen':           renderPrescreen();break;
    case '#/prescreen-exit':      renderPrescreenExit();break;
    case '#/questionnaire':       renderQuestionnaire(arg);break;
    case '#/check-answers':       renderCheckAnswers();break;

    case '#/second-series-info':  renderSecondSeriesInfo();break;
    case '#/second-series-choose':renderSecondSeriesChoose();break;
    case '#/upload':              renderUpload();break;
    case '#/upload-review':       renderUploadReview();break;
    case '#/appt-company':        renderApptCompany();break;
    case '#/appt-branch':         renderApptBranch();break;
    case '#/appt-datetime':       renderApptDateTime();break;
    case '#/appt-review':         renderApptReview();break;
    case '#/appt-manage':         renderApptManage();break;
    case '#/gp-details':          renderGpDetails();break;
    case '#/nhs-link':            renderNhsLink();break;
    case '#/consent-share':       renderConsentShare();break;
    case '#/second-confirm':      renderSecondConfirm();break;

    case '#/status':              renderStatus();break;
    case '#/messages':            renderMessages();break;
    case '#/decision-ready':      state.stage=4; state.messagesRead=false; navigate('#/messages'); return;

    case '#/decision-issue':      renderDecisionIssue();break;
    case '#/accept-licence':      renderAcceptLicence();break;
    case '#/licence-next-steps':  renderLicenceNextSteps();break;
    case '#/decision-revoke':     renderDecisionRevoke();break;
    case '#/challenge':           renderChallenge();break;
    case '#/appeal':              renderAppeal();break;

    case '#/renewal-notice':      renderRenewalNotice();break;
    case '#/renewal-start':       renderRenewalStart();break;
    case '#/renewal-changed':     renderRenewalChanged();break;
    case '#/renewal-done':        renderRenewalDone();break;
    case '#/auto-renew-offer':    renderAutoRenewOffer();break;
    case '#/auto-renew-done':     renderAutoRenewDone();break;
    case '#/renewal-preferences': renderRenewalPreferences();break;
    case '#/manage':              renderManage();break;
    case '#/pause':               renderPause();break;
    case '#/pause-done':          renderPauseDone();break;
    case '#/resume':              renderResume();break;
    case '#/resume-done':         renderResumeDone();break;
    case '#/update-condition':    renderUpdateCondition();break;
    case '#/update-sent':         renderUpdateSent();break;
    case '#/surrender':           renderSurrender();break;
    case '#/surrender-done':      renderSurrenderDone();break;

    default:                      renderHub();break;
  }
}
window.addEventListener('hashchange',route);
window.addEventListener('DOMContentLoaded',route);
</script>
</body>
</html>

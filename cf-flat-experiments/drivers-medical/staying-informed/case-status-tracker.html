<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drivers Medical — Case status tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
:root{--black:#0b0c0c;--white:#fff;--blue:#1d70b8;--dark-blue:#003078;--green:#00703c;--green-hover:#005a30;--yellow:#ffdd00;--light-yellow:#fff7bf;--light-grey:#f3f2f1;--mid-grey:#b1b4b6;--dark-grey:#505a5f;--red:#d4351c;--purple:#4c2c92;--focus:#ffdd00;--focus-text:#0b0c0c}
*,*::before,*::after{box-sizing:border-box}
body{font-family:"GDS Transport","Inter",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--black);background:var(--white);margin:0;padding:0;line-height:1.5;font-size:19px}

/* --- Header --- */
.govuk-header{background:var(--blue);color:var(--white);padding:10px 0}
.govuk-header__container{max-width:960px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:10px}
.govuk-header__logotype-text{font-size:30px;font-weight:700;color:var(--white);text-decoration:none}
.govuk-header__logotype-text:hover{text-decoration:underline}
.govuk-header__signout{margin-left:auto;font-size:19px;font-weight:700;color:var(--white);text-decoration:none;cursor:pointer}
.govuk-header__signout:hover{text-decoration:underline}
.govuk-crown{width:36px;height:32px;vertical-align:middle;margin-right:4px}
.service-nav{border-bottom:1px solid var(--mid-grey);background:var(--white);padding:12px 0}
.service-nav__wrapper{max-width:960px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.service-nav__name{font-weight:700;font-size:19px;color:var(--black);text-decoration:none}
.service-nav__links{margin-left:auto;display:flex;gap:20px;align-items:center}
.service-nav__link{font-size:19px;color:var(--blue);cursor:pointer}
.service-nav__count{display:inline-block;background:var(--red);color:var(--white);font-size:14px;font-weight:700;border-radius:20px;padding:1px 8px;margin-left:6px}
.govuk-phase-banner{border-bottom:1px solid var(--mid-grey);padding:10px 0}
.govuk-phase-banner__wrapper{max-width:960px;margin:0 auto;padding:0 15px;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.govuk-phase-banner__tag{display:inline-block;background:var(--blue);color:var(--white);font-weight:700;font-size:14px;padding:2px 8px;text-transform:uppercase;letter-spacing:1px}
.phase-actions{margin-left:auto;display:flex;gap:15px;align-items:center}
.phase-actions a{font-size:16px;cursor:pointer}
.prototype-warning{background:var(--light-yellow);border:4px solid var(--yellow);padding:15px 20px;margin-bottom:30px;font-size:16px;line-height:1.5}
.prototype-warning strong{display:block;margin-bottom:4px}
.govuk-width-container{max-width:960px;margin:0 auto;padding:0 15px}
.govuk-main-wrapper{padding:30px 0 60px}

/* --- Typography --- */
h1,.govuk-heading-xl{font-size:48px;line-height:1.04;font-weight:700;margin:0 0 30px}
h2,.govuk-heading-l{font-size:36px;line-height:1.11;font-weight:700;margin:30px 0 20px}
h3,.govuk-heading-m{font-size:24px;line-height:1.25;font-weight:700;margin:20px 0 15px}
h4,.govuk-heading-s{font-size:19px;line-height:1.3;font-weight:700;margin:15px 0 10px}
p,.govuk-body{font-size:19px;margin:0 0 20px}
.govuk-body-s{font-size:16px}
.govuk-body-l{font-size:24px;line-height:1.25;margin:0 0 20px}
.govuk-caption{font-size:24px;color:var(--dark-grey);display:block;margin-bottom:5px}
a{color:var(--blue)}a:hover{color:var(--dark-blue)}
a:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--focus-text);text-decoration:none}
.govuk-back-link{display:inline-block;margin-bottom:15px;font-size:16px;color:var(--black);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.govuk-back-link::before{content:"\25c2 "}

/* --- Buttons --- */
.govuk-button{display:inline-block;padding:8px 20px;font-size:19px;font-weight:700;color:var(--white);background:var(--green);border:none;border-radius:0;border-bottom:2px solid #002d18;cursor:pointer;text-decoration:none;line-height:1.2;-webkit-appearance:none;font-family:inherit}
.govuk-button:hover{background:var(--green-hover);color:var(--white)}
.govuk-button:focus{outline:3px solid var(--focus);outline-offset:0}
.govuk-button--start{font-size:24px;padding:12px 30px}
.govuk-button--start::after{content:" \2192"}
.govuk-button--secondary{background:var(--light-grey);color:var(--black);border-bottom-color:var(--mid-grey)}
.govuk-button--secondary:hover{background:#dbdad9;color:var(--black)}
.govuk-button--warning{background:var(--red);border-bottom-color:#55150b}
.govuk-button--warning:hover{background:#aa2716}
.button-row{display:flex;gap:15px;flex-wrap:wrap;margin-top:20px}

/* --- Forms --- */
.govuk-form-group{margin-bottom:30px}
.govuk-fieldset__legend{font-weight:700;font-size:19px;margin-bottom:10px;display:block}
.govuk-fieldset__legend--l{font-size:36px;line-height:1.11;margin-bottom:20px}
.govuk-fieldset__heading{font-size:inherit;line-height:inherit;font-weight:inherit;margin:0}
.govuk-radios__item,.govuk-checkboxes__item{display:flex;align-items:flex-start;margin-bottom:15px;gap:12px}
.govuk-radios__input,.govuk-checkboxes__input{width:44px;height:44px;min-width:44px;margin:0;cursor:pointer;accent-color:var(--black)}
.govuk-radios__label,.govuk-checkboxes__label{font-size:19px;padding-top:10px;cursor:pointer}
.govuk-radios__hint{font-size:16px;color:var(--dark-grey);margin-top:2px;display:block}
.govuk-label{display:block;font-weight:700;margin-bottom:5px}
.govuk-hint{font-size:16px;color:var(--dark-grey);margin-bottom:10px;display:block}
.govuk-input{font-family:inherit;font-size:19px;padding:5px 10px;border:2px solid var(--black);width:100%;max-width:400px}
.govuk-input:focus{outline:3px solid var(--focus)}
.govuk-textarea{font-family:inherit;font-size:19px;padding:5px 10px;border:2px solid var(--black);width:100%;min-height:120px}

/* --- Summary / table --- */
.govuk-summary-list{border-top:1px solid var(--mid-grey);margin:0 0 30px}
.govuk-summary-list__row{display:flex;border-bottom:1px solid var(--mid-grey);padding:12px 0;gap:15px}
.govuk-summary-list__key{flex:0 0 32%;font-weight:700}
.govuk-summary-list__value{flex:1}
.govuk-summary-list__actions{flex:0 0 80px;text-align:right}
@media(max-width:640px){.govuk-summary-list__row{flex-direction:column;gap:4px}.govuk-summary-list__key{flex:auto}.govuk-summary-list__actions{text-align:left}}
.govuk-table{width:100%;border-collapse:collapse;margin-bottom:30px}
.govuk-table th{text-align:left;font-weight:700;padding:10px 15px 10px 0;border-bottom:2px solid var(--black)}
.govuk-table td{padding:10px 15px 10px 0;border-bottom:1px solid var(--mid-grey);vertical-align:top}

/* --- Tags / panels --- */
.govuk-tag{display:inline-block;font-size:14px;font-weight:700;padding:2px 8px;text-transform:uppercase;letter-spacing:1px;color:var(--white)}
.govuk-tag--green{background:var(--green)}.govuk-tag--yellow{background:#b58840}.govuk-tag--orange{background:#b84605}.govuk-tag--red{background:var(--red)}.govuk-tag--blue{background:var(--blue)}.govuk-tag--grey{background:var(--dark-grey)}.govuk-tag--purple{background:var(--purple)}
.govuk-inset-text{border-left:10px solid var(--mid-grey);padding:15px 20px;margin:0 0 30px}
.govuk-panel{background:var(--green);color:var(--white);padding:35px;text-align:center;margin-bottom:30px}
.govuk-panel__title{font-size:48px;font-weight:700;margin:0 0 15px}
.govuk-panel__body{font-size:36px}
.govuk-warning-text{display:flex;gap:15px;align-items:flex-start;margin-bottom:30px}
.govuk-warning-text__icon{flex:0 0 35px;height:35px;background:var(--black);color:var(--white);border-radius:50%;text-align:center;font-weight:700;line-height:35px;font-size:24px}
.govuk-warning-text__text{font-weight:700}
.govuk-notification-banner{border:5px solid var(--blue);margin-bottom:30px}
.govuk-notification-banner__header{background:var(--blue);color:var(--white);padding:8px 15px;font-size:19px;font-weight:700}
.govuk-notification-banner__content{padding:20px 15px;font-size:19px}
.govuk-notification-banner__content p{margin:0 0 10px}
.govuk-notification-banner__content p:last-child{margin:0}
.govuk-notification-banner--success{border-color:var(--green)}
.govuk-notification-banner--success .govuk-notification-banner__header{background:var(--green)}

/* --- Grid --- */
.govuk-grid-row{display:flex;flex-wrap:wrap;margin:0 -15px}
.govuk-grid-column-two-thirds{flex:0 0 66.66%;max-width:66.66%;padding:0 15px}
.govuk-grid-column-one-third{flex:0 0 33.33%;max-width:33.33%;padding:0 15px}
.govuk-grid-column-full{flex:0 0 100%;max-width:100%;padding:0 15px}
@media(max-width:640px){.govuk-grid-column-two-thirds,.govuk-grid-column-one-third{flex:0 0 100%;max-width:100%}}

/* --- Account cards --- */
.account-card{border:1px solid var(--mid-grey);border-top:5px solid var(--blue);background:var(--white);padding:20px 25px;margin-bottom:30px}
.account-card h3{margin-top:0}
.account-card__head{display:flex;align-items:baseline;gap:15px;flex-wrap:wrap}
.account-card__head h3{flex:1}
.account-panel{border:1px solid var(--mid-grey);border-top:5px solid var(--blue);background:var(--light-grey);padding:20px;margin-bottom:30px}
.account-panel h3{margin-top:0}
.service-btn{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--green);color:var(--white);font-weight:700;font-size:19px;padding:10px 15px;margin-bottom:10px;text-decoration:none;border:none;border-bottom:2px solid #002d18;cursor:pointer;text-align:left;font-family:inherit}
.service-btn:hover{background:var(--green-hover);color:var(--white)}
.service-btn::after{content:"\203a";font-size:24px;line-height:1}
.detail-list{border:none;margin:0}
.detail-list__row{display:flex;border-bottom:1px solid var(--mid-grey);padding:12px 0;gap:15px}
.detail-list__row:last-child{border-bottom:none}
.detail-list__key{flex:0 0 40%;font-weight:700}
.detail-list__value{flex:1}
@media(max-width:640px){.detail-list__row{flex-direction:column;gap:2px}.detail-list__key{flex:auto}}

/* --- Journey hub --- */
.hub-hero{background:var(--light-grey);border-left:10px solid var(--blue);padding:30px 35px;margin-bottom:40px}
.hub-hero h1{margin-bottom:15px}
.hub-hero p:last-child{margin-bottom:0}
.journey-group{margin-bottom:45px}
.journey-group__title{border-bottom:2px solid var(--black);padding-bottom:8px;margin-bottom:8px}
.journey-group__desc{font-size:16px;color:var(--dark-grey);margin-bottom:20px}
.journey-links{list-style:none;margin:0;padding:0}
.journey-links li{margin-bottom:22px}
.journey-links a{font-size:24px;font-weight:700}
.journey-links p{margin:4px 0 0;font-size:16px;color:var(--dark-grey);max-width:44em}

/* --- Design notes --- */
.design-note{border:2px dashed var(--purple);background:#f7f4fc;padding:15px 20px;margin:0 0 25px;font-size:16px}
.design-note strong{display:block;color:var(--purple);text-transform:uppercase;letter-spacing:1px;font-size:14px;margin-bottom:6px}
.design-note p{font-size:16px;margin:0 0 8px}
.design-note p:last-child{margin:0}

/* --- Dropzone --- */
.dropzone{border:3px dashed var(--mid-grey);background:var(--light-grey);padding:35px 25px;text-align:center;margin-bottom:20px;cursor:pointer}
.dropzone.is-over{border-color:var(--green);background:#e8f0e8}
.dropzone__title{font-weight:700;font-size:19px;margin-bottom:8px}
.dropzone__hint{font-size:16px;color:var(--dark-grey)}
.file-list{list-style:none;margin:0 0 20px;padding:0}
.file-list__item{display:flex;justify-content:space-between;align-items:center;gap:15px;background:var(--light-grey);padding:10px 15px;margin-bottom:10px;font-size:16px}
.file-list__remove{background:none;border:none;color:var(--red);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:16px}

/* --- Option cards --- */
.option-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:30px}
@media(max-width:900px){.option-cards{grid-template-columns:1fr}}
.option-card{border:2px solid var(--mid-grey);padding:20px;cursor:pointer;background:var(--white);text-align:left;font-family:inherit;font-size:19px}
.option-card:hover{border-color:var(--black)}
.option-card h3{margin:8px 0;font-size:19px}
.option-card p{margin:0;font-size:16px;color:var(--dark-grey)}

/* --- Provider / branch cards --- */
.choice-list{list-style:none;margin:0 0 30px;padding:0}
.choice-list__item{border:2px solid var(--mid-grey);padding:18px 20px;margin-bottom:12px;cursor:pointer;background:var(--white);display:flex;gap:15px;align-items:flex-start;width:100%;text-align:left;font-family:inherit;font-size:19px}
.choice-list__item:hover{border-color:var(--black)}
.choice-list__body{flex:1}
.choice-list__body strong{display:block}
.choice-list__body span{font-size:16px;color:var(--dark-grey)}

/* --- Time slots --- */
.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:25px}
@media(max-width:640px){.slot-grid{grid-template-columns:repeat(2,1fr)}}
.slot{border:2px solid var(--mid-grey);background:var(--white);padding:10px;font-family:inherit;font-size:19px;cursor:pointer}
.slot:hover{border-color:var(--black)}
.slot.is-selected{background:var(--green);color:var(--white);border-color:var(--green)}

/* --- Timeline / task list --- */
.timeline{list-style:none;margin:0 0 30px;padding:0 0 0 25px;border-left:4px solid var(--mid-grey)}
.timeline__item{position:relative;padding:0 0 25px 20px}
.timeline__item::before{content:"";position:absolute;left:-32px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--mid-grey);border:3px solid var(--white)}
.timeline__item--done::before{background:var(--green)}
.timeline__item--now::before{background:var(--blue)}
.timeline__date{font-size:16px;color:var(--dark-grey);display:block}
.timeline__title{font-weight:700;display:block}
.task-list{border-top:1px solid var(--mid-grey);margin:0 0 30px;padding:0;list-style:none}
.task-list__item{display:flex;align-items:center;gap:15px;border-bottom:1px solid var(--mid-grey);padding:15px 0;flex-wrap:wrap}
.task-list__name{flex:1;min-width:200px}
.task-list__name strong{display:block}
.task-list__hint{font-size:16px;color:var(--dark-grey)}
.message-list{list-style:none;margin:0 0 30px;padding:0;border-top:1px solid var(--mid-grey)}
.message-list__item{border-bottom:1px solid var(--mid-grey);padding:15px 0}
.message-list__item--unread{border-left:5px solid var(--blue);padding-left:15px}
.message-list__meta{font-size:16px;color:var(--dark-grey)}

/* --- Screen index --- */
.index-group{margin-bottom:30px}
.index-group h3{margin-bottom:10px}
.index-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:800px){.index-list{grid-template-columns:1fr}}
.index-list a{display:block;padding:8px 12px;background:var(--light-grey);text-decoration:none;font-size:16px;border-left:4px solid var(--blue)}
.index-list a:hover{background:#e4e3e2}

hr.govuk-section-break{border:none;border-bottom:1px solid var(--mid-grey);margin:30px 0}
.govuk-footer{background:var(--light-grey);border-top:1px solid var(--mid-grey);padding:30px 0;margin-top:60px}
.govuk-footer__wrapper{max-width:960px;margin:0 auto;padding:0 15px}
.govuk-footer__meta-item{font-size:16px;color:var(--dark-grey)}

/* ================================================================
   CASE STATUS TRACKER — components added for this prototype
   ================================================================ */

/* --- Active state hero --- */
.state-hero{border:1px solid var(--mid-grey);border-top:8px solid var(--blue);background:var(--white);padding:30px 30px 10px;margin-bottom:30px}
.state-hero--action{border-top-color:#b84605;background:#fff8f3}
.state-hero--good{border-top-color:var(--green)}
.state-hero--bad{border-top-color:var(--red);background:#fdf5f3}
.state-hero__eyebrow{display:block;font-size:16px;color:var(--dark-grey);margin-bottom:10px}
.state-hero__title{font-size:36px;line-height:1.11;font-weight:700;margin:0 0 15px}
.state-hero__lead{font-size:24px;line-height:1.3;margin:0 0 25px;max-width:30em}
.state-facts{border-top:1px solid var(--mid-grey);margin:0;padding:0}
.state-facts__row{display:flex;gap:20px;border-bottom:1px solid var(--mid-grey);padding:14px 0}
.state-facts__key{flex:0 0 34%;font-weight:700;margin:0}
.state-facts__val{flex:1;margin:0}
@media(max-width:640px){.state-hero{padding:22px 20px 8px}.state-hero__title{font-size:27px}.state-hero__lead{font-size:19px}.state-facts__row{flex-direction:column;gap:2px}.state-facts__key{flex:auto}}

/* --- Can I drive --- */
.drive{display:flex;gap:22px;align-items:flex-start;border:1px solid var(--mid-grey);border-left:10px solid var(--green);background:var(--white);padding:22px 25px;margin-bottom:35px}
.drive--no{border-left-color:var(--red)}
.drive--depends{border-left-color:#b58840}
.drive__mark{flex:0 0 46px;height:46px;border-radius:50%;background:var(--green);color:var(--white);font-size:26px;font-weight:700;line-height:46px;text-align:center}
.drive--no .drive__mark{background:var(--red)}
.drive--depends .drive__mark{background:#b58840}
.drive__body{flex:1;min-width:0}
.drive__answer{font-size:24px;font-weight:700;line-height:1.25;margin:0 0 8px}
.drive__detail{margin:0}
@media(max-width:640px){.drive{padding:18px 20px;gap:15px}.drive__answer{font-size:19px}}

/* --- Sign in / errors --- */
.govuk-error-summary{border:5px solid var(--red);padding:20px 25px;margin-bottom:30px}
.govuk-error-summary h2{margin:0 0 10px;font-size:24px}
.govuk-error-summary ul{margin:0;padding-left:20px}
.govuk-error-summary li{margin-bottom:6px}
.govuk-error-summary a{color:var(--red);font-weight:700}
.govuk-form-group--error{border-left:5px solid var(--red);padding-left:15px}
.govuk-error-message{color:var(--red);font-weight:700;display:block;margin-bottom:10px}
.govuk-input--error{border-color:var(--red)}
.auth-lede{font-size:24px;line-height:1.3;margin:0 0 25px;max-width:30em}
.auth-list{margin:0 0 25px;padding-left:20px}
.auth-list li{margin-bottom:8px}
.prototype-warning code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:700;background:var(--white);padding:1px 5px;border:1px solid var(--mid-grey)}

/* --- Conditions strand list ---
   Only ever shown when there is more than one condition. One row per
   condition, each carrying its own state, because they do not move at
   the same speed and the mismatch is what generates the call. --- */
.strands{list-style:none;margin:0 0 35px;padding:0;border-top:1px solid var(--mid-grey)}
.strand{display:flex;gap:20px;align-items:flex-start;border-bottom:1px solid var(--mid-grey);padding:16px 0}
.strand__name{flex:0 0 34%;font-weight:700;margin:0}
.strand__body{flex:1;min-width:0}
.strand__body p{margin:6px 0 0;font-size:16px}
.strand--blocking .strand__name::after{content:"This is what is holding up your case";display:block;font-weight:400;font-size:16px;color:var(--dark-grey);margin-top:4px}
@media(max-width:640px){.strand{flex-direction:column;gap:4px}.strand__name{flex:auto}}

/* --- Third party chase --- */
.chase{background:var(--light-grey);border-left:5px solid var(--dark-grey);padding:15px 20px;margin:0 0 25px;font-size:16px}
.chase strong{display:block;margin-bottom:4px}
.chase p{font-size:16px;margin:0}

/* --- Prototype control, inside the fictional-prototype banner ---
   Prototype furniture, not service UI. It lives in the banner that is
   already flagged as not-a-real-service, so the page below it reads as
   the service and nothing else. --- */
.prototype-warning__control{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid rgba(11,12,12,.25)}
.prototype-warning__control label{font-weight:700;flex:0 0 auto;margin:0}
.prototype-warning__control select{font-family:inherit;font-size:16px;padding:5px 8px;border:2px solid var(--black);background:var(--white);flex:1;min-width:200px;max-width:380px}
.prototype-warning__control a{flex:0 0 auto}

/* --- Support --- */
.support{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:35px}
@media(max-width:800px){.support{grid-template-columns:1fr}}
.support-card{border:1px solid var(--mid-grey);background:var(--white);padding:20px 25px}
.support-card h3{margin-top:0}
.support-card p{font-size:16px;margin:0 0 10px}
.support-card p:last-child{margin:0}
.support-card__big{font-size:24px;font-weight:700;display:block;margin-bottom:6px}
.chat-shell{border:1px solid var(--mid-grey);background:var(--light-grey);height:90px;margin-bottom:12px;position:relative}
.chat-shell::after{content:"Webchat is not built in this prototype";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--dark-grey);text-align:center;padding:0 15px}

</style>
</head>
<body>
<div id="chrome"></div>
<div class="govuk-width-container">
  <main class="govuk-main-wrapper" id="app" role="main"></main>
</div>

  <div class="govuk-footer__wrapper">

function redact(v){
  if(state.mode !== 'lite' || typeof v !== 'string') return v;
  let out = v;
  REDACTIONS.forEach(([re, to]) => { out = out.replace(re, to); });

  out = out.replace(/\s{2,}/g, ' ').replace(/\s+([.,])/g, '$1').trim();

  if(/^[A-Z]/.test(v) && /^[a-z]/.test(out)) out = out.charAt(0).toUpperCase() + out.slice(1);

}

let state = {};
function resetState(){
  state = { screen:'with-caseworker', showNotes:state.showNotes||false,
            mode:state.mode||'full', unlocked:false, attempts:0, authErrors:null };
}
resetState();

/* ================================================================
   HELPERS
   ================================================================ */
const app = () => document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function navigate(h){ if(location.hash===h){ route(); } else { location.hash = h; } }
function cur(){ return SCREENS[state.screen] || SCREENS['with-caseworker']; }
function content(){
  const k = CONTENT[state.screen] || CONTENT['with-caseworker'];
  if(state.mode !== 'lite') return k;
  /* Redact a copy. The full content is never mutated, so switching back
     to Full in a workshop always shows the original wording. */
  const v = Object.assign({}, k);
  ['title','lead','who','howLong','next','due','ifNot','cta'].forEach(f=>{ if(v[f]) v[f] = redact(v[f]); });
  if(k.chase) v.chase = { title:redact(k.chase.title), body:redact(k.chase.body) };
  if(k.drive) v.drive = { verdict:k.drive.verdict,
    answer:LITE_DRIVE.answers[k.drive.verdict] || redact(k.drive.answer),
    detail:LITE_DRIVE[k.drive.verdict] };
  if(k.timeline) v.timeline = k.timeline.map(e=>({ date:e.date, title:redact(e.title), body:redact(e.body) }));
  if(k.strands) v.strands = k.strands.map((st,i)=>({ cond:st.cond, state:st.state, blocking:st.blocking,
    label: i===0 ? 'The first condition you told us about' : 'The second condition you told us about',
    note: redact(st.note) }));
  return v;
}
function setMode(m){ state.mode = m; route(); }

/* The prototype control lives inside this banner on purpose: it is the
   one part of the page already flagged as not a real service, so the
   page below it can be read as the service and nothing else. */
function warn(withControl, withKeys){
  let html = '<div class="prototype-warning"><strong>⚠ Fictional prototype</strong>'
    +'This is a fictional prototype of a Drivers Medical case status tracker. It does not show a real case, it makes no real DVLA licensing decisions, and all personal details shown are invented.';
  if(withKeys){
    html += '<div class="prototype-warning__control">'
      +'<span>Use code <code>'+esc(ACCESS.code)+'</code> and licence ending <code>'+esc(licenceEnd())+'</code>. Never enter real details.</span>'
      +'<a href="#" onclick="skipSignIn();return false;">Skip the sign-in</a>'
      +'</div>';
  }
  if(withControl){
    let opts = '';
    SCREEN_GROUPS.forEach(([title,keys])=>{
      opts += '<optgroup label="'+esc(title)+'">';
      keys.forEach(k=>{ opts += '<option value="'+k+'"'+(k===state.screen?' selected':'')+'>'+esc(LABELS[k])+'</option>'; });
      opts += '</optgroup>';
    });
    html += '<div class="prototype-warning__control">'
      +'<label for="state-switcher">Show this case as</label>'
      +'<select id="state-switcher" onchange="navigate(\'#/tracker/\'+this.value)">'+opts+'</select>'
      +'<a href="#/all-screens">All screens</a>'
      +'</div>'
      +'<div class="prototype-warning__control">'
      +'<label for="mode-switcher">Version</label>'
      +'<select id="mode-switcher" onchange="setMode(this.value)">'
      +'<option value="full"'+(state.mode!=='lite'?' selected':'')+'>Full \u2014 names the condition</option>'
      +'<option value="lite"'+(state.mode==='lite'?' selected':'')+'>Lite \u2014 no health data</option>'
      +'</select>'
      +'<span>Same case, same sign-in. Only what the page holds changes.</span>'
      +'</div>';
  }
  return html+'</div>';
}
/* Design notes are prototype annotations, not part of the service UI. */
function note(title, body){
  if(!state.showNotes) return '';
  return '<div class="design-note"><strong>Design note — '+esc(title)+'</strong>'+body+'</div>';
}
function toggleNotes(){ state.showNotes = !state.showNotes; route(); }

/* --- Everything below is derived from caseState and its sub-fields.
       No summary label is stored anywhere. --- */
function tag(){
  const c = cur();
  switch(c.caseState){
    case 'received':          return {text:'Received', colour:'blue'};
    case 'with-caseworker':   return {text:'In review', colour:'blue'};
    case 'with-dvla-doctor':  return {text:'In review', colour:'blue'};
    case 'with-third-party':  return {text:'Waiting', colour:'grey'};
    case 'action-needed':     return {text:'Action needed', colour:'orange'};
    case 'decided':           return (c.outcome==='refused'||c.outcome==='revoked')
                                ? {text:'Decided', colour:'red'} : {text:'Decided', colour:'green'};
    case 'closed':            return {text:'Closed', colour:'grey'};
  }
}
function isBad(){ const c=cur(); return c.outcome==='refused'||c.outcome==='revoked'; }

/* 1. Active state. When something is needed from the customer this
      block leads with that and takes priority over the whole page. */
function renderHero(){
  const c = cur(), k = content(), t = tag();
  let mod = '';
  if(c.caseState==='action-needed') mod = ' state-hero--action';
  else if(c.caseState==='decided' && !isBad()) mod = ' state-hero--good';
  else if(isBad()) mod = ' state-hero--bad';

  let html = '<div class="state-hero'+mod+'">'
    +'<span class="state-hero__eyebrow"><span class="govuk-tag govuk-tag--'+t.colour+'">'+esc(t.text)+'</span> &nbsp;Last updated '+esc(today)+'</span>'
    +'<h2 class="state-hero__title">'+esc(k.title)+'</h2>'
    +'<p class="state-hero__lead">'+esc(k.lead)+'</p>';

  if(k.cta){
    html += '<p class="govuk-body"><a class="govuk-button" href="#" onclick="stub(event)">'+esc(k.cta)+'</a></p>';
  }

  html += '<dl class="state-facts">';
  if(k.due)  html += '<div class="state-facts__row"><dt class="state-facts__key">When we need it by</dt><dd class="state-facts__val">'+esc(k.due)+'</dd></div>';
  if(k.ifNot)html += '<div class="state-facts__row"><dt class="state-facts__key">If you do not</dt><dd class="state-facts__val">'+esc(k.ifNot)+'</dd></div>';
  html += '<div class="state-facts__row"><dt class="state-facts__key">Who has your case</dt><dd class="state-facts__val">'+esc(k.who)+'</dd></div>'
    +'<div class="state-facts__row"><dt class="state-facts__key">How long this usually takes</dt><dd class="state-facts__val">'+esc(k.howLong)+'</dd></div>'
    +'<div class="state-facts__row"><dt class="state-facts__key">What happens next</dt><dd class="state-facts__val">'+esc(k.next)+'</dd></div>'
    +'</dl></div>';
  return html;
}

/* 2. Can I drive. Never shown as a bare verdict — the sentence that
      explains it is part of the answer. */
function renderDrive(){
  const d = content().drive;
  const mod = d.verdict==='no' ? ' drive--no' : d.verdict==='depends' ? ' drive--depends' : '';
  const mark = d.verdict==='no' ? '✕' : d.verdict==='depends' ? '!' : '✓';
  return '<h2 class="govuk-heading-m">Can I drive?</h2>'
    +'<div class="drive'+mod+'"><div class="drive__mark" aria-hidden="true">'+mark+'</div>'
    +'<div class="drive__body"><p class="drive__answer">'+esc(d.answer)+'</p>'
    +'<p class="drive__detail">'+esc(d.detail)+'</p></div></div>';
}

/* 2. Your conditions. Absent when there is only one — a single-row
      breakdown of a single condition is noise. When there is more than
      one, the case can only be as far along as its slowest condition,
      and this block is where that is said out loud. */
function renderConditions(){
  const k = content();
  if(!k.strands || k.strands.length < 2) return '';
  let rows = '';
  k.strands.forEach(st=>{
    const meta = STRAND[st.state];
    rows += '<li class="strand'+(st.blocking?' strand--blocking':'')+'">'
      +'<p class="strand__name">'+esc(st.label || CONDITIONS[st.cond].name)+'</p>'
      +'<div class="strand__body"><span class="govuk-tag govuk-tag--'+meta.colour+'">'+esc(meta.label)+'</span>'
      +'<p>'+esc(st.note)+'</p></div></li>';
  });
  return '<h2 class="govuk-heading-m">Your conditions</h2>'
    +'<p class="govuk-body">You told us about more than one condition. We look at each one separately, then make a single decision about your licence.</p>'
    +'<ul class="strands">'+rows+'</ul>';
}

/* 3. Timeline, newest first. The same state can appear more than
      once — a case that goes out for evidence and comes back is with
      a caseworker twice, and the timeline has to show that. */
function renderTimeline(){
  const k = content();
  const events = k.timeline.slice().reverse();
  let html = '<h2 class="govuk-heading-m">What has happened so far</h2>';
  if(k.chase){
    html += '<div class="chase"><strong>'+esc(k.chase.title)+'</strong><p>'+esc(k.chase.body)+'</p></div>';
  }
  html += '<ul class="timeline">';
  events.forEach((e,i)=>{
    html += '<li class="timeline__item timeline__item--'+(i===0?'now':'done')+'">'
      +'<span class="timeline__date">'+esc(e.date)+'</span>'
      +'<span class="timeline__title">'+esc(e.title)+'</span>'+esc(e.body)+'</li>';
  });
  if(events.length===1){
    html += '<li class="timeline__item"><span class="timeline__date">Nothing else yet</span>'
      +'<span class="timeline__title">This is everything</span>Your case has only just arrived, so there is nothing else to show. Every time it moves we will add it here.</li>';
  }
  return html+'</ul>';
}

/* 4. Relevant information — condition guidance first, then the
      personal details the customer may need to quote on the phone. */
function renderRelevant(){
  const k = content();
  const conds = k.conditions || ['epilepsy'];

  if(state.mode === 'lite'){
    /* The guidance block is the one place the condition name genuinely
       earns its keep, so in this version it goes entirely rather than
       being watered down into something vague. Saying less is honest;
       saying it vaguely would not be. */
    return '<h2 class="govuk-heading-m">Your case</h2>'
      +'<dl class="detail-list">'
      +'<div class="detail-list__row"><dt class="detail-list__key">Case reference</dt><dd class="detail-list__value">'+esc(caseRef)+'</dd></div>'
      +'<div class="detail-list__row"><dt class="detail-list__key">Date we received it</dt><dd class="detail-list__value">7 August 2026</dd></div>'
      +'</dl>'
      +'<div class="govuk-inset-text"><p style="margin:0;">We do not show your name, your date of birth, your driving licence number or what you told us about on this page. The letter we sent you has those details.</p></div>';
  }

  let guidance = '';
  conds.forEach(c=>{
    guidance += '<h2 class="govuk-heading-m">Driving with '+esc(CONDITIONS[c].short)+'</h2>'
      +'<p class="govuk-body">These rules apply whatever we decide about your case.</p>'
      +'<ul class="govuk-body">'+GUIDANCE[c]+'</ul>';
  });
  const label = conds.length > 1 ? 'Conditions you told us about' : 'Condition you told us about';
  const value = conds.map(c=>CONDITIONS[c].name).join('<br>');
  return guidance
    +'<h2 class="govuk-heading-m">Your details</h2>'
    +'<dl class="detail-list">'
    +'<div class="detail-list__row"><dt class="detail-list__key">Case reference</dt><dd class="detail-list__value">'+esc(caseRef)+'</dd></div>'
    +'<div class="detail-list__row"><dt class="detail-list__key">Name</dt><dd class="detail-list__value">'+esc(person.title+' '+person.name)+'</dd></div>'
    +'<div class="detail-list__row"><dt class="detail-list__key">Date of birth</dt><dd class="detail-list__value">'+esc(person.dob)+'</dd></div>'
    +'<div class="detail-list__row"><dt class="detail-list__key">Driving licence number</dt><dd class="detail-list__value">'+esc(person.licenceNo)+'</dd></div>'
    +'<div class="detail-list__row"><dt class="detail-list__key">'+label+'</dt><dd class="detail-list__value">'+value+'</dd></div>'
    +'</dl>';
}

function renderSignIn(){
  const e = state.authErrors || {};
  const list = e.list || [];

    summary = '<div class="govuk-error-summary" id="error-summary" tabindex="-1">'
      +'<h2 class="govuk-heading-m">There is a problem</h2><ul>'
      + list.map(f => '<li><a href="#" onclick="focusField(\''+f[0]+'\');return false;">'+esc(f[1])+'</a></li>').join('')
      +'</ul></div>';
  }
  const grp = f => 'govuk-form-group' + (e[f] ? ' govuk-form-group--error' : '');
  const inp = f => 'govuk-input' + (e[f] ? ' govuk-input--error' : '');
  /* A field can be flagged without carrying its own message — when the
     pair does not match, the message belongs to the pair, not to one
     of them. An empty message element would be an empty panel. */
  const msg = f => (e[f] && e[f].trim()) ? '<span class="govuk-error-message">'+esc(e[f])+'</span>' : '';

  app().innerHTML = warn(false, true)
    +'<a class="govuk-back-link" href="#/start">Back</a>'
    + summary
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<h1 class="govuk-heading-l">Enter your details</h1>'
    +'<div class="'+grp('code')+'">'
    +'<label class="govuk-label" for="code">Code from your letter</label>'
    +'<span class="govuk-hint">It is 9 characters, in three groups. For example, '+esc(ACCESS.code)+'</span>'
    + msg('code')
    +'<input class="'+inp('code')+'" id="code" type="text" autocomplete="off" spellcheck="false" value="'+esc(e.codeValue||'')+'">'
    +'</div>'
    +'<div class="'+grp('licence')+'">'
    +'<label class="govuk-label" for="licence">Last 8 characters of your driving licence number</label>'
    +'<span class="govuk-hint">This is on the front of your licence, in section 5. For example, '+esc(licenceEnd())+'</span>'
    + msg('licence')
    +'<input class="'+inp('licence')+'" id="licence" type="text" autocomplete="off" spellcheck="false" value="'+esc(e.licenceValue||'')+'">'
    +'</div>'
    +'<button class="govuk-button" id="continue-btn">Continue</button>'
    +'<p class="govuk-body" style="margin-top:20px;"><a href="#/no-code">I do not have my code</a></p>'
    +'</div></div>';

  document.getElementById('continue-btn').addEventListener('click', submitSignIn);
  ['code','licence'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', ev=>{ if(ev.key==='Enter') submitSignIn(); });
  });
  const sum = document.getElementById('error-summary');
  if(sum) sum.focus();
}

function focusField(id){ const el = document.getElementById(id); if(el) el.focus(); }

function submitSignIn(){
  const codeRaw = document.getElementById('code').value;
  const licRaw  = document.getElementById('licence').value;
  const errors = { list:[], codeValue:codeRaw, licenceValue:licRaw };

  if(!codeRaw.trim()){
    errors.code = 'Enter the code from your letter';
    errors.list.push(['code', errors.code]);
  }
  if(!licRaw.trim()){
    errors.licence = 'Enter the last 8 characters of your driving licence number';
    errors.list.push(['licence', errors.licence]);
  }

  if(!errors.list.length){
    const ok = normalise(codeRaw) === normalise(ACCESS.code)
            && normalise(licRaw)  === normalise(licenceEnd());
    if(ok){
      state.unlocked = true;
      state.attempts = 0;
      state.authErrors = null;
      return navigate('#/tracker/'+state.screen);
    }
    state.attempts += 1;
    if(state.attempts >= MAX_ATTEMPTS){
      state.authErrors = null;
      return navigate('#/locked');
    }
    /* Which of the two is wrong is not said on purpose — naming the
       wrong field tells someone holding a stolen letter which half
       they already have right. */
    const m = 'The code and licence number do not match a case';
    errors.code = m; errors.licence = ' ';
    errors.list.push(['code', m]);
  }
  state.authErrors = errors;
  route();
}

function renderLocked(){
  app().innerHTML = warn(false, true)
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<h1 class="govuk-heading-l">You have tried too many times</h1>'
    +'<p class="auth-lede">For your security we have stopped any more attempts on this case for 15 minutes.</p>'
    +'<p class="govuk-body">If you are sure your details are right, check that you are reading the code from the most recent letter we sent you. Older codes stop working when we send a new one.</p>'
    +'<h2 class="govuk-heading-m">If you would rather not wait</h2>'
    +'<p class="govuk-body">Call us on <strong>0300 790 6806</strong>, Monday to Friday 8am to 5pm, Saturday 8am to 1pm. We can tell you where your case is over the phone.</p>'
    +'<p class="govuk-body"><a href="#" onclick="signOut();return false;">Try again</a></p>'
    +'</div></div>';
}

function renderNoCode(){
  app().innerHTML = warn(false, true)
    +'<a class="govuk-back-link" href="#/start">Back</a>'
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'
    +'<h1 class="govuk-heading-l">Get a new code</h1>'
    +'<p class="auth-lede">We will post a new code to the address on your driving licence. It usually arrives within 5 working days.</p>'
    +'<p class="govuk-body">We will not email or text it. The code opens your medical case, so we only send it to an address we already hold for you.</p>'
    +'<p class="govuk-body">Sending a new code stops the old one working.</p>'
    +'<a class="govuk-button" href="#" onclick="stub(event)" style="text-decoration:none;">Request a new code</a>'
    +'<hr class="govuk-section-break">'
    +'<h2 class="govuk-heading-m">If you need an answer sooner</h2>'
    +'<p class="govuk-body">Call us on <strong>0300 790 6806</strong>. We can tell you where your case is without the code, once we have checked who you are.</p>'
    +'</div></div>';
}

function renderTracker(){
  const lite = state.mode === 'lite';
  const introNote = lite
    ? note('What this version hides, and what it costs',
        '<p>This is the same case with no health data on the page. Gone: the condition names, the clinical driving rules, the named doctor and the specialist organisations, the team name that gave away the condition category, and your name, date of birth and licence number.</p>'
       +'<p>What survives is almost everything the page was for \u2014 where the case is, who has it, how long that step usually takes, what happens next, and what you must do by when. That is the finding: the diagnosis was carrying very little of the value.</p>'
       +'<p>The cost is concentrated in one place. Where the honest answer to "can I drive" is "it depends", this version can no longer say what it depends on, so it sends you back to the letter. Switch between the two versions on that screen to see the size of the trade.</p>')
    : note('Why there is no progress indicator',
        '<p>A flight tracker can show a plane three quarters of the way across because the route is fixed. A medical case is not: it can go out to a GP, come back, and go out again. Any indicator of progress — a stepper, a bar, a percentage — would be wrong the first time that happened.</p>'
       +'<p>So the page does not try. It answers where the case is now, and puts the real answer to "when" directly underneath, as a range with a reason attached.</p>');

  app().innerHTML = warn(true)
    + introNote
    +'<span class="govuk-caption">Case '+esc(caseRef)+'</span>'
    +'<h1 class="govuk-heading-l">'+(lite ? 'Your case' : 'Your medical condition case')+'</h1>'
    + note('The wait is a range with a reason',
        '<p>Over half of the calls this service takes are people asking where their case is. A status on its own is what generates that call. The argument this block makes is that a status is only useful bolted to two other things: how long this step usually takes, and what happens next.</p>'
       +'<p>Where the honest answer is that we do not know — the consultant who has not replied to three letters — it says so. A made-up range that passes would be worse.</p>')
    + renderHero()
    + note('Driving comes before the case',
        '<p>The whiteboard put "can you drive" in a contextual information block below the timeline. It is moved up here because it is the question a customer actually opens this page to answer, and the one they will ring about if the page does not.</p>')
    + renderDrive()
    + note('One case, several conditions',
        '<p>A driver can tell us about two things at once, and they do not move at the same speed. The evidence for one can be back while the other is still with a consultant.</p>'
       +'<p>The argument this block makes is that the case is only as far along as its slowest condition, and that saying which one is holding things up is what stops the call. Without it, a customer whose diabetes evidence came back three weeks ago reads the page as DVLA having lost their case.</p>')
    + renderConditions()
    + renderTimeline()
    + note('Waiting is not the same as nothing happening',
        '<p>When DVLA is waiting on a third party the timeline shows when the request went out and whether it has been chased. Without that, a customer reading a four-week gap assumes their case has been forgotten. Showing the chase is what makes the wait legible rather than suspicious.</p>')
    + renderRelevant()
    + renderSupport();
}

function renderAllScreens(){
  let html = warn()+'<a class="govuk-back-link" href="'+(state.unlocked ? '#/tracker/'+esc(state.screen) : '#/start')+'">'+(state.unlocked ? 'Back to the tracker' : 'Back to the start')+'</a>'
    +'<h1 class="govuk-heading-l">All screens</h1>'
    +'<p class="govuk-body">Every state this case can be in. Each one opens the tracker directly, so a single state can be put on a screen in a workshop without clicking through anything first.</p>'
    + (state.unlocked ? '' : '<div class="govuk-inset-text"><p style="margin:0;">You are signed out, so these links will ask for the code first. <a href="#" onclick="skipSignIn();return false;">Skip the sign-in</a> to open any screen directly.</p></div>');
  SCREEN_GROUPS.forEach(([title,keys])=>{
    html += '<div class="index-group"><h3 class="govuk-heading-m">'+esc(title)+'</h3><ul class="index-list">';
    keys.forEach(k=>{ html += '<li><a href="#/tracker/'+k+'">'+esc(LABELS[k])+'</a></li>'; });
    html += '</ul></div>';
  });
  app().innerHTML = html;
}

/* ================================================================
   ROUTER
   ================================================================ */
/* Reachable without the code. All screens stays outside the gate on
   purpose — it is prototype furniture, and a workshop should not have
   to sign in before putting a single state on a screen. */
const OPEN_ROUTES = ['#/start','#/signin','#/no-code','#/locked','#/all-screens'];

function route(){
  const hash = location.hash || '#/start';
  const parts = hash.split('/');
  const base = '#/' + (parts[1] || 'start');
  const arg = parts[2];
  window.scrollTo(0,0);

  if(base === '#/tracker' && arg && SCREENS[arg]) state.screen = arg;
  if(!state.unlocked && OPEN_ROUTES.indexOf(base) === -1) return navigate('#/start');
  if(base !== '#/signin') state.authErrors = null;
  renderChrome();

  switch(base){
    case '#/start':       renderStart(); break;
    case '#/signin':      renderSignIn(); break;
    case '#/no-code':     renderNoCode(); break;
    case '#/locked':      renderLocked(); break;
    case '#/all-screens': renderAllScreens(); break;
    case '#/tracker':     renderTracker(); break;
    default:              state.unlocked ? renderTracker() : renderStart(); break;
  }
}
window.addEventListener('hashchange',route);
window.addEventListener('DOMContentLoaded',route);
</script>

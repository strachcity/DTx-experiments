<script>
/* ======================================================================
   Drivers Medical Pathway Prototype — Single-page vanilla JS app
   ====================================================================== */

// ---------- state ----------
const state = {
  condition: '',
  licenceType: '',
  previousApproval: '',
  recentChange: '',
  multipleConditions: '',
  evidence: ''
};

const conditionLabels = {
  diabetes: 'Diabetes',
  epilepsy: 'Epilepsy',
  visual: 'Visual disorder',
  heart: 'Heart condition',
  sleep: 'Sleep apnoea'
};
const licenceLabels = { group1: 'Group 1 (car / motorcycle)', group2: 'Group 2 (lorry / bus)' };
const yesNo = { yes: 'Yes', no: 'No' };

// ---------- routing logic ----------
function calculatePathway() {
  const multi = state.multipleConditions === 'yes';
  const change = state.recentChange === 'yes';
  const prevApproval = state.previousApproval === 'yes';
  const g1 = state.licenceType === 'group1';
  const evidenceAvail = state.evidence === 'yes';

  if (multi || change)          return 'multi';
  if (prevApproval && !change)  return 'review';
  if (g1 && evidenceAvail)      return 'declare';
  return 'evidence';
}

const pathwayMeta = {
  declare: {
    name: 'Declare and approve',
    confidence: 'High',
    confidenceTag: 'green',
    evidenceNeeded: 'None — audit checks only',
    team: 'Auto-approval team with audit sample',
    reason: 'Group 1 licence, evidence available, no complicating factors.',
    customerMsg: 'Based on what you have told us, your case can move quickly. We will carry out background audit checks but you do not need to provide new evidence. You will receive a decision by post.',
    suggestedAction: 'Release with audit flag'
  },
  review: {
    name: 'Review, not renewal',
    confidence: 'High',
    confidenceTag: 'green',
    evidenceNeeded: 'None unless something has changed',
    team: 'Review team',
    reason: 'Previously approved, no recent change reported.',
    customerMsg: 'Because you were previously approved and nothing has changed, we do not need new evidence. Your case will be reviewed based on your existing record. You will receive a decision by post.',
    suggestedAction: 'Review existing record, confirm or update'
  },
  evidence: {
    name: 'Evidence-targeted assessment',
    confidence: 'Medium',
    confidenceTag: 'yellow',
    evidenceNeeded: 'One specific piece of clinical evidence',
    team: 'Evidence assessment team',
    reason: 'Evidence is needed before a decision can be made. The case does not meet the criteria for automatic approval or simple review.',
    customerMsg: 'We need one specific piece of evidence before we can make a decision. We will write to you explaining exactly what is needed and how to send it. Once we receive it, your case will be assessed.',
    suggestedAction: 'Request targeted evidence, then assess'
  },
  multi: {
    name: 'Multi-condition / complex case',
    confidence: 'Low',
    confidenceTag: 'red',
    evidenceNeeded: 'Multiple — to be determined by caseworker',
    team: 'Specialist clinical team',
    reason: 'Multiple conditions or a recent change in condition. Requires human clinical judgement.',
    customerMsg: 'Because your situation involves more than one condition or a recent change, your case will be reviewed by a specialist team. They will contact you if they need more information. This may take longer than a straightforward case.',
    suggestedAction: 'Escalate to specialist, gather evidence'
  }
};

// ---------- scenarios ----------
const scenarios = [
  {
    title: 'Simple renewal, no changes',
    desc: 'Diabetes, Group 1, previously approved, no recent change, single condition, evidence available.',
    tag: 'Review, not renewal', tagClass: 'green',
    data: { condition:'diabetes', licenceType:'group1', previousApproval:'yes', recentChange:'no', multipleConditions:'no', evidence:'yes' }
  },
  {
    title: 'New condition reported',
    desc: 'Epilepsy, Group 1, first time, no recent change, single condition, no evidence.',
    tag: 'Evidence-targeted', tagClass: 'yellow',
    data: { condition:'epilepsy', licenceType:'group1', previousApproval:'no', recentChange:'no', multipleConditions:'no', evidence:'no' }
  },
  {
    title: 'Multiple conditions with recent change',
    desc: 'Heart condition, Group 1, previously approved, recent change, multiple conditions.',
    tag: 'Complex case', tagClass: 'red',
    data: { condition:'heart', licenceType:'group1', previousApproval:'yes', recentChange:'yes', multipleConditions:'yes', evidence:'yes' }
  },
  {
    title: 'Straightforward with evidence',
    desc: 'Visual disorder, Group 1, first time, no recent change, single condition, evidence available.',
    tag: 'Declare and approve', tagClass: 'green',
    data: { condition:'visual', licenceType:'group1', previousApproval:'no', recentChange:'no', multipleConditions:'no', evidence:'yes' }
  }
];

// ---------- helpers ----------
const $ = sel => document.querySelector(sel);
const app = () => document.getElementById('app');

function navigate(hash) {
  location.hash = hash;
}

function warningBanner() {
  return `<div class="prototype-warning">
    <strong>⚠ Fictional prototype</strong>
    This is a fictional prototype for exploring a future Drivers Medical service model. It does not make real DVLA licensing decisions.
  </div>`;
}

function backLink(target) {
  return `<a class="govuk-back-link" href="${target}">Back</a>`;
}

function radioPage(opts) {
  const { title, name, options, backTarget, nextHash, stateKey } = opts;
  let html = warningBanner();
  html += backLink(backTarget);
  html += `<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">`;
  html += `<div class="govuk-form-group">
    <fieldset>
      <legend class="govuk-fieldset__legend govuk-fieldset__legend--xl">${title}</legend>
      <div style="margin-top:20px;">`;
  for (const [val, label] of Object.entries(options)) {
    const checked = state[stateKey] === val ? ' checked' : '';
    html += `<div class="govuk-radios__item">
      <input class="govuk-radios__input" type="radio" name="${name}" id="${name}-${val}" value="${val}"${checked}>
      <label class="govuk-radios__label" for="${name}-${val}">${label}</label>
    </div>`;
  }
  html += `</div></fieldset></div>`;
  html += `<button class="govuk-button" id="continue-btn">Continue</button>`;
  html += `</div></div>`;
  app().innerHTML = html;

  document.getElementById('continue-btn').addEventListener('click', () => {
    const selected = document.querySelector(`input[name="${name}"]:checked`);
    if (!selected) { alert('Please select an option.'); return; }
    state[stateKey] = selected.value;
    navigate(nextHash);
  });
}

// ---------- router ----------
function route() {
  const hash = location.hash || '#/start';
  window.scrollTo(0,0);

  switch(hash) {
    case '#/start':                renderStart(); break;
    case '#/scenario-selector':    renderScenarioSelector(); break;
    case '#/condition':            renderCondition(); break;
    case '#/licence-type':         renderLicenceType(); break;
    case '#/previous-approval':    renderPreviousApproval(); break;
    case '#/recent-change':        renderRecentChange(); break;
    case '#/multiple-conditions':  renderMultipleConditions(); break;
    case '#/evidence':             renderEvidence(); break;
    case '#/check-answers':        renderCheckAnswers(); break;
    case '#/routing-result':       renderRoutingResult(); break;
    case '#/customer-next-step':   renderCustomerNextStep(); break;
    case '#/caseworker-view':      renderCaseworkerView(); break;
    case '#/feedback-loop':        renderFeedbackLoop(); break;
    default:                       renderStart(); break;
  }
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);
</script>

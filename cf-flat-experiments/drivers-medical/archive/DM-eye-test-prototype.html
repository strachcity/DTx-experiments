<script>
/* === STATE === */
const state = {
  condition:'', licenceType:'', previousApproval:'', recentChange:'',
  multipleConditions:'', evidence:'',
  eyeTestChoice:'', eyeTestDate:'', eyeTestProvider:'',
  eyeTestCentre:'', eyeTestBookingDate:'', eyeTestBookingTime:''
};

/* === LOOKUP DATA === */
const conditionLabels = {diabetes:'Diabetes',epilepsy:'Epilepsy',visual:'Visual disorder',heart:'Heart condition',sleep:'Sleep apnoea'};
const licenceLabels = {group1:'Group 1 (car / motorcycle)',group2:'Group 2 (lorry / bus)'};

const eyeTestCentres = {
  specsavers:{name:'Specsavers',address:'High Street, Swansea, SA1 3QQ'},
  visionexpress:{name:'Vision Express',address:'Kingsway, Cardiff, CF10 3PB'},
  boots:{name:'Boots Opticians',address:'Queen Street, Bristol, BS1 4NT'},
  dvla:{name:'DVLA On-site Eye Test Unit',address:'DVLA, Longview Road, Morriston, Swansea, SA6 7JL'},
  independent:{name:'Independent Opticians',address:'Park Place, Newport, NP20 4SR'}
};

const bookingDates = [
  'Monday 8 June 2026','Wednesday 10 June 2026','Friday 12 June 2026',
  'Tuesday 16 June 2026','Thursday 18 June 2026'
];
const bookingTimes = ['9:00am','10:30am','12:00pm','2:00pm','3:30pm'];

/* === ROUTING LOGIC === */
function calculatePathway(){
  const multi=state.multipleConditions==='yes', change=state.recentChange==='yes',
        prev=state.previousApproval==='yes', g1=state.licenceType==='group1',
        ev=state.evidence==='yes';
  if(multi||change) return 'multi';
  if(prev&&!change) return 'review';
  if(g1&&ev) return 'declare';
  return 'evidence';
}

const pathwayMeta = {
  declare:{name:'Declare and approve',confidence:'High',confidenceTag:'green',evidenceNeeded:'None — audit checks only',team:'Auto-approval team with audit sample',reason:'Group 1 licence, evidence available, no complicating factors.',customerMsg:'Based on what you have told us, your case can move quickly. We will carry out background audit checks but you do not need to provide new evidence. You will receive a decision by post.',suggestedAction:'Release with audit flag'},
  review:{name:'Review, not renewal',confidence:'High',confidenceTag:'green',evidenceNeeded:'None unless something has changed',team:'Review team',reason:'Previously approved, no recent change reported.',customerMsg:'Because you were previously approved and nothing has changed, we do not need new evidence. Your case will be reviewed based on your existing record. You will receive a decision by post.',suggestedAction:'Review existing record, confirm or update'},
  evidence:{name:'Evidence-targeted assessment',confidence:'Medium',confidenceTag:'yellow',evidenceNeeded:'One specific piece of clinical evidence',team:'Evidence assessment team',reason:'Evidence is needed before a decision can be made. The case does not meet the criteria for automatic approval or simple review.',customerMsg:'We need one specific piece of evidence before we can make a decision. We will write to you explaining exactly what is needed and how to send it. Once we receive it, your case will be assessed.',suggestedAction:'Request targeted evidence, then assess'},
  multi:{name:'Multi-condition / complex case',confidence:'Low',confidenceTag:'red',evidenceNeeded:'Multiple — to be determined by caseworker',team:'Specialist clinical team',reason:'Multiple conditions or a recent change in condition. Requires human clinical judgement.',customerMsg:'Because your situation involves more than one condition or a recent change, your case will be reviewed by a specialist team. They will contact you if they need more information. This may take longer than a straightforward case.',suggestedAction:'Escalate to specialist, gather evidence'}
};

/* === SCENARIOS === */
const scenarios = [
  {title:'Simple renewal, no changes',desc:'Diabetes, Group 1, previously approved, no recent change, single condition, evidence available.',tag:'Review, not renewal',tagClass:'green',data:{condition:'diabetes',licenceType:'group1',previousApproval:'yes',recentChange:'no',multipleConditions:'no',evidence:'yes',eyeTestChoice:'',eyeTestDate:'',eyeTestProvider:'',eyeTestCentre:'',eyeTestBookingDate:'',eyeTestBookingTime:''}},
  {title:'New condition reported',desc:'Epilepsy, Group 1, first time, no recent change, single condition, no evidence.',tag:'Evidence-targeted',tagClass:'yellow',data:{condition:'epilepsy',licenceType:'group1',previousApproval:'no',recentChange:'no',multipleConditions:'no',evidence:'no',eyeTestChoice:'',eyeTestDate:'',eyeTestProvider:'',eyeTestCentre:'',eyeTestBookingDate:'',eyeTestBookingTime:''}},
  {title:'Multiple conditions with recent change',desc:'Heart condition, Group 1, previously approved, recent change, multiple conditions.',tag:'Complex case',tagClass:'red',data:{condition:'heart',licenceType:'group1',previousApproval:'yes',recentChange:'yes',multipleConditions:'yes',evidence:'yes',eyeTestChoice:'',eyeTestDate:'',eyeTestProvider:'',eyeTestCentre:'',eyeTestBookingDate:'',eyeTestBookingTime:''}},
  {title:'Eye condition with existing results',desc:'Visual disorder, Group 1, first time, no recent change, single condition, evidence available. Eye test results already provided.',tag:'Declare and approve',tagClass:'green',data:{condition:'visual',licenceType:'group1',previousApproval:'no',recentChange:'no',multipleConditions:'no',evidence:'yes',eyeTestChoice:'have-results',eyeTestDate:'14 March 2026',eyeTestProvider:'Specsavers, Swansea',eyeTestCentre:'',eyeTestBookingDate:'',eyeTestBookingTime:''}}
];

/* === HELPERS === */
const app = () => document.getElementById('app');
function navigate(h){ location.hash = h; }
function warn(){return '<div class="prototype-warning"><strong>\u26a0 Fictional prototype</strong>This is a fictional prototype for exploring a future Drivers Medical service model. It does not make real DVLA licensing decisions.</div>';}
function back(t){return '<a class="govuk-back-link" href="'+t+'">Back</a>';}

function eyeTestInfoHtml(){
  if(state.condition!=='visual') return '';
  if(state.eyeTestChoice==='have-results'){
    return '<div class="govuk-inset-text"><p style="margin:0;"><strong>Eye test evidence:</strong> We have your eye test results from '+esc(state.eyeTestProvider)+' on '+esc(state.eyeTestDate)+'. These will be reviewed as part of your case.</p></div>';
  }
  if(state.eyeTestChoice==='book'){
    const c = eyeTestCentres[state.eyeTestCentre];
    const cName = c ? c.name+', '+c.address : state.eyeTestCentre;
    return '<div class="govuk-inset-text"><p style="margin:0;"><strong>Eye test booked:</strong> Your eye test is booked at '+esc(cName)+' on '+esc(state.eyeTestBookingDate)+' at '+esc(state.eyeTestBookingTime)+'. Attend your appointment and we will receive the results directly.</p></div>';
  }
  return '';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* === RADIO PAGE HELPER === */
function radioPage(opts){
  const {title,name,options,backTarget,nextHash,stateKey,richOptions} = opts;
  let html = warn()+back(backTarget);
  html += '<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">';
  html += '<div class="govuk-form-group"><fieldset>';
  html += '<legend class="govuk-fieldset__legend govuk-fieldset__legend--xl">'+title+'</legend>';
  html += '<div style="margin-top:20px;">';
  if(richOptions){
    richOptions.forEach(o => {
      const checked = state[stateKey]===o.value?' checked':'';
      html += '<div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="'+name+'" id="'+name+'-'+o.value+'" value="'+o.value+'"'+checked+'>';
      html += '<div><label class="govuk-radios__label" for="'+name+'-'+o.value+'"><strong>'+o.label+'</strong></label>';
      if(o.hint) html += '<span class="govuk-radios__hint">'+o.hint+'</span>';
      html += '</div></div>';
    });
  } else {
    for(const [val,label] of Object.entries(options)){
      const checked = state[stateKey]===val?' checked':'';
      html += '<div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="'+name+'" id="'+name+'-'+val+'" value="'+val+'"'+checked+'>';
      html += '<label class="govuk-radios__label" for="'+name+'-'+val+'">'+label+'</label></div>';
    }
  }
  html += '</div></fieldset></div>';
  html += '<button class="govuk-button" id="continue-btn">Continue</button>';
  html += '</div></div>';
  app().innerHTML = html;
  document.getElementById('continue-btn').addEventListener('click',()=>{
    const sel = document.querySelector('input[name="'+name+'"]:checked');
    if(!sel){alert('Please select an option.');return;}
    state[stateKey] = sel.value;
    if(typeof nextHash==='function') navigate(nextHash(sel.value));
    else navigate(nextHash);
  });
}

    +'<tr><td>Evidence-targeted assessment</td><td>25%</td><td>21</td></tr>'
    +'<tr><td>Multi-condition / complex case</td><td>14%</td><td>42</td></tr>'
    +'</tbody></table>'
    +'<div style="display:flex;gap:15px;flex-wrap:wrap;margin-top:20px;">'
    +'<a class="govuk-button govuk-button--secondary" href="#/caseworker-view" style="text-decoration:none;">Back to caseworker view</a>'
    +'<a class="govuk-button govuk-button--secondary" href="#/start" style="text-decoration:none;">Start again</a></div>';
}

/* === ROUTER === */
function route(){
  const hash = location.hash||'#/start';
  window.scrollTo(0,0);
  switch(hash){
    case '#/start':               renderStart();break;
    case '#/scenario-selector':   renderScenarioSelector();break;
    case '#/condition':           renderCondition();break;
    case '#/licence-type':        renderLicenceType();break;
    case '#/previous-approval':   renderPreviousApproval();break;
    case '#/recent-change':       renderRecentChange();break;
    case '#/multiple-conditions': renderMultipleConditions();break;
    case '#/evidence':            renderEvidence();break;
    case '#/eye-test-choice':     renderEyeTestChoice();break;
    case '#/eye-test-provide':    renderEyeTestProvide();break;
    case '#/eye-test-centre':     renderEyeTestCentre();break;
    case '#/eye-test-date':       renderEyeTestDate();break;
    case '#/eye-test-time':       renderEyeTestTime();break;
    case '#/eye-test-confirmation': renderEyeTestConfirmation();break;
    case '#/check-answers':       renderCheckAnswers();break;
    case '#/routing-result':      renderRoutingResult();break;
    case '#/customer-next-step':  renderCustomerNextStep();break;
    case '#/caseworker-view':     renderCaseworkerView();break;
    case '#/feedback-loop':       renderFeedbackLoop();break;
    default:                      renderStart();break;
  }
}
window.addEventListener('hashchange',route);
window.addEventListener('DOMContentLoaded',route);
</script>
</body>
</html>

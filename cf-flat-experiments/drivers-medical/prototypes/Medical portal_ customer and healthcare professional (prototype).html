<!DOCTYPE html>
<html lang="en-GB" class="govuk-template">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medical evidence service: customer and healthcare professional journeys (prototype)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
<style>



/* --- govuk-* layer, copied from components.html. --- */
:root{--black:#0b0c0c;--white:#fff;--blue:#1d70b8;--link:#1a65a6;--link-hover:#0f385c;--dark-blue:#0f385c;--green:#0f7a52;--green-hover:#0b5c3e;--green-shade:#083d29;--yellow:#fd0;--light-yellow:#fff7bf;--light-grey:#f4f8fb;--mid-grey:#cecece;--dark-grey:#484949;--red:#ca3535;--red-shade:#651b1b;--purple:#54319f;--focus:#fd0;--focus-text:#0b0c0c}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--white)}
body{font-family:"GDS Transport","Inter",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--black);background:var(--white);margin:0;padding:0;line-height:1.5;font-size:19px}

.govuk-header{background:var(--blue);color:var(--white);padding:10px 0}
.govuk-header__container{max-width:960px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:10px}
.govuk-header__homepage-link{display:inline-flex;align-items:center;color:var(--white);text-decoration:none}
.govuk-header__homepage-link:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.govuk-header__logotype{height:30px;width:162px;fill:currentcolor}
.govuk-header__signout{margin-left:auto;font-size:19px;font-weight:700;color:var(--white);text-decoration:none;cursor:pointer}
.govuk-header__signout:hover{text-decoration:underline}
.service-nav{border-bottom:1px solid var(--mid-grey);background:var(--white);padding:12px 0}
.service-nav__wrapper{max-width:960px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.service-nav__name{font-weight:700;font-size:19px;color:var(--black);text-decoration:none}
.govuk-phase-banner{border-bottom:1px solid var(--mid-grey);padding:10px 0}
.govuk-phase-banner__wrapper{max-width:960px;margin:0 auto;padding:0 15px;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.govuk-phase-banner__tag{display:inline-block;background:var(--blue);color:var(--white);font-weight:700;font-size:14px;padding:2px 8px;text-transform:uppercase;letter-spacing:1px}
.phase-actions{margin-left:auto;display:flex;gap:15px;align-items:center;flex-wrap:wrap}
.phase-actions a{font-size:16px;cursor:pointer}
.prototype-warning{background:var(--light-yellow);border:4px solid var(--yellow);padding:15px 20px;margin-bottom:30px;font-size:16px;line-height:1.5}
.prototype-warning strong{display:block;margin-bottom:4px}
.govuk-width-container{max-width:960px;margin:0 auto;padding:0 15px}
.govuk-main-wrapper{padding:30px 0 60px}
.govuk-skip-link{position:absolute;left:-9999px;top:0;background:var(--yellow);color:var(--black);padding:10px 15px;font-weight:700;z-index:10}
.govuk-skip-link:focus{left:0}

h1,.govuk-heading-xl{font-size:48px;line-height:1.04;font-weight:700;margin:0 0 30px}
h2,.govuk-heading-l{font-size:36px;line-height:1.11;font-weight:700;margin:30px 0 20px}
h3,.govuk-heading-m{font-size:24px;line-height:1.25;font-weight:700;margin:20px 0 15px}
h4,.govuk-heading-s{font-size:19px;line-height:1.3;font-weight:700;margin:15px 0 10px}
p,.govuk-body{font-size:19px;margin:0 0 20px}
.govuk-body-s{font-size:16px}
.govuk-body-l{font-size:24px;line-height:1.25;margin:0 0 20px}
.govuk-caption{font-size:24px;color:var(--dark-grey);display:block;margin-bottom:5px}
a{color:var(--link)}a:hover{color:var(--link-hover)}
a:visited{color:var(--purple)}
a:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--focus-text);text-decoration:none}
.govuk-list{margin:0 0 20px;padding:0;list-style:none}
.govuk-list>li{margin-bottom:5px}
.govuk-list--bullet{list-style:disc;padding-left:20px}
.govuk-list--number{list-style:decimal;padding-left:20px}
.govuk-visually-hidden{position:absolute!important;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);border:0;white-space:nowrap}
hr.govuk-section-break{border:none;border-bottom:1px solid var(--mid-grey);margin:30px 0}
.govuk-back-link{display:inline-block;margin-bottom:15px;font-size:16px;color:var(--black);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.govuk-back-link::before{content:"\25c2 "}

.govuk-button{display:inline-block;padding:8px 20px;font-size:19px;font-weight:700;color:var(--white);background:var(--green);border:none;border-radius:0;border-bottom:2px solid var(--green-shade);cursor:pointer;text-decoration:none;line-height:1.2;-webkit-appearance:none;font-family:inherit}
.govuk-button:hover{background:var(--green-hover);color:var(--white)}
.govuk-button:visited{color:var(--white)}
.govuk-button:focus{outline:3px solid var(--focus);outline-offset:0}
.govuk-button--start{font-size:24px;padding:12px 30px}
.govuk-button--start::after{content:" \2192"}
.govuk-button--secondary{background:#f3f3f3;color:var(--black);border-bottom-color:#858686}
.govuk-button--secondary:hover,.govuk-button--secondary:visited{background:#dbdad9;color:var(--black)}
.govuk-button-group{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin-top:20px}

.govuk-form-group{margin-bottom:30px}
.govuk-fieldset{border:0;margin:0;padding:0}
.govuk-fieldset__legend{font-weight:700;font-size:19px;margin-bottom:10px;display:block}
.govuk-fieldset__legend--l{font-size:36px;line-height:1.11;margin-bottom:20px}
.govuk-fieldset__legend--xl{font-size:48px;line-height:1.04;margin-bottom:25px}
.govuk-fieldset__heading{font-size:inherit;line-height:inherit;font-weight:inherit;margin:0}
.govuk-radios__item,.govuk-checkboxes__item{display:flex;align-items:flex-start;margin-bottom:15px;gap:12px}
.govuk-radios__input,.govuk-checkboxes__input{width:44px;height:44px;min-width:44px;margin:0;cursor:pointer;accent-color:var(--black)}
.govuk-radios__label,.govuk-checkboxes__label{font-size:19px;padding-top:10px;cursor:pointer}
.govuk-radios__hint,.govuk-checkboxes__hint{font-size:16px;color:var(--dark-grey);margin-top:2px;display:block}
.govuk-label{display:block;font-weight:700;margin-bottom:5px}
.govuk-label--l{font-size:36px;line-height:1.11;margin-bottom:15px}
.govuk-label-wrapper{margin:0}
.govuk-hint{font-size:16px;color:var(--dark-grey);margin-bottom:10px;display:block}
.govuk-input{font-family:inherit;font-size:19px;padding:5px 10px;border:2px solid var(--black);width:100%;max-width:400px}
.govuk-input:focus,.govuk-select:focus,.govuk-textarea:focus{outline:3px solid var(--focus);outline-offset:0}
.govuk-input--width-2{max-width:65px}.govuk-input--width-4{max-width:100px}.govuk-input--width-10{max-width:250px}.govuk-input--width-20{max-width:400px}
.govuk-file-upload{font-family:inherit;font-size:19px;padding:5px 0;max-width:400px}
.govuk-date-input{display:flex;gap:20px;flex-wrap:wrap}
.govuk-date-input__item{flex:0 0 auto}
.govuk-date-input__label{display:block;font-weight:700;margin-bottom:5px;font-size:19px}

.govuk-summary-list{border-top:1px solid var(--mid-grey);margin:0 0 30px}
.govuk-summary-list__row{display:flex;border-bottom:1px solid var(--mid-grey);padding:12px 0;gap:15px}
.govuk-summary-list__key{flex:0 0 32%;font-weight:700;margin:0}
.govuk-summary-list__value{flex:1;margin:0;min-width:0}
.govuk-summary-list__actions{flex:0 0 80px;text-align:right;margin:0}
@media(max-width:640px){.govuk-summary-list__row{flex-direction:column;gap:4px}.govuk-summary-list__key{flex:auto}.govuk-summary-list__actions{text-align:left}}
.govuk-table{width:100%;border-collapse:collapse;margin-bottom:30px}
.govuk-table th{text-align:left;font-weight:700;padding:10px 15px 10px 0;border-bottom:2px solid var(--black)}
.govuk-table td{padding:10px 15px 10px 0;border-bottom:1px solid var(--mid-grey);vertical-align:top}

.govuk-tag{display:inline-block;font-size:19px;line-height:1.32;font-weight:700;padding:2px 8px 3px;border-radius:1px;max-width:260px;overflow-wrap:break-word;color:#0f385c;background:#d2e2f1}
.govuk-tag--blue{color:#0f385c;background:#d2e2f1}
.govuk-tag--green{color:#083d29;background:#cfe4dc}
.govuk-tag--purple{color:#2a1950;background:#ddd6ec}
.govuk-tag--red{color:#651b1b;background:#f4d7d7}
.govuk-tag--orange{color:#7a3c1c;background:#fde4d7}
.govuk-tag--teal{color:#0b4144;background:#d0e6e7}
.govuk-tag--yellow{color:#7a3c1c;background:#ffee80}
.govuk-tag--grey{color:#0b0c0c;background:#cecece}
.govuk-inset-text{border-left:10px solid var(--mid-grey);padding:15px 20px;margin:0 0 30px}
.govuk-panel{background:var(--green);color:var(--white);padding:35px;text-align:center;margin-bottom:30px}
.govuk-panel__title{font-size:48px;font-weight:700;margin:0 0 15px}
.govuk-panel__body{font-size:24px}
.govuk-warning-text{display:flex;gap:15px;align-items:flex-start;margin-bottom:30px}
.govuk-warning-text__icon{flex:0 0 35px;height:35px;background:var(--black);color:var(--white);border-radius:50%;text-align:center;font-weight:700;line-height:35px;font-size:24px}
.govuk-warning-text__text{font-weight:700}
.govuk-details{margin-bottom:30px;display:block}
.govuk-details__summary{color:var(--link);cursor:pointer;text-decoration:underline;font-size:19px;margin-bottom:5px}
.govuk-details__text{border-left:5px solid var(--mid-grey);padding:15px 20px;font-size:19px}
.govuk-details__text p{margin:0 0 10px}
.govuk-details__text p:last-child{margin:0}
.govuk-notification-banner{border:5px solid var(--blue);margin-bottom:30px}
.govuk-notification-banner__header{background:var(--blue);color:var(--white);padding:8px 15px;font-size:19px;font-weight:700}
.govuk-notification-banner__title{margin:0;font-size:19px}
.govuk-notification-banner__content{padding:20px 15px;font-size:19px}
.govuk-notification-banner__heading{font-size:24px;font-weight:700;margin:0 0 10px}
.govuk-notification-banner__content p{margin:0 0 10px}
.govuk-notification-banner__content p:last-child{margin:0}

.govuk-error-summary{border:5px solid var(--red);padding:20px 25px;margin-bottom:30px}
.govuk-error-summary h2{margin:0 0 10px;font-size:24px}
.govuk-error-summary ul{margin:0;padding-left:20px}
.govuk-error-summary li{margin-bottom:6px}
.govuk-error-summary a{color:var(--red);font-weight:700}
.govuk-form-group--error{border-left:5px solid var(--red);padding-left:15px}
.govuk-error-message{color:var(--red);font-weight:700;display:block;margin-bottom:10px}
.govuk-input--error{border-color:var(--red)}

.govuk-grid-row{display:flex;flex-wrap:wrap;margin:0 -15px}
.govuk-grid-column-two-thirds{flex:0 0 66.66%;max-width:66.66%;padding:0 15px;min-width:0}
.govuk-grid-column-one-third{flex:0 0 33.33%;max-width:33.33%;padding:0 15px;min-width:0}
.govuk-grid-column-full{flex:0 0 100%;max-width:100%;padding:0 15px;min-width:0}
@media(max-width:640px){.govuk-grid-column-two-thirds,.govuk-grid-column-one-third{flex:0 0 100%;max-width:100%}}

.govuk-footer{background:var(--light-grey);border-top:10px solid var(--blue);padding:30px 0;margin-top:60px}
.govuk-footer__wrapper{max-width:960px;margin:0 auto;padding:0 15px}
.govuk-footer__meta-item{font-size:16px;color:var(--dark-grey)}

.design-note{border:2px dashed var(--purple);background:#f7f4fc;padding:15px 20px;margin:0 0 25px;font-size:16px}
.design-note strong{display:block;color:var(--purple);text-transform:uppercase;letter-spacing:1px;font-size:14px;margin-bottom:6px}
.design-note p{font-size:16px;margin:0 0 8px}
.design-note p:last-child{margin:0}
.design-note ul{margin:0 0 8px;padding-left:20px}

/* --- Specific to this prototype. Not part of components.html. --- */

/* The situation picker sits inside the yellow warning, so nobody
   mistakes it for service UI. */
.prototype-warning__control{display:flex;gap:10px 15px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid #e6d36b}
.prototype-warning__control label{font-weight:700}
.prototype-warning__control select{font-family:inherit;font-size:16px;padding:4px 8px;border:2px solid var(--black);background:var(--white);max-width:100%}
.prototype-warning__control select:focus{outline:3px solid var(--focus);outline-offset:0}

/* Account page cards, after the DVLA driver and vehicles account. */
.acct-card{border:1px solid var(--mid-grey);border-top:10px solid var(--blue);padding:20px 20px 5px;margin-bottom:30px}
.acct-card__head{display:flex;justify-content:space-between;align-items:baseline;gap:10px 20px;flex-wrap:wrap;margin-bottom:15px}
.acct-card__head h2{margin:0;font-size:24px;line-height:1.25}
.acct-card .govuk-summary-list{margin-bottom:15px}
.acct-side{background:#f3f2f1;border-top:10px solid var(--blue);padding:20px;margin-bottom:30px}
.acct-side h2{font-size:24px;margin:0 0 20px}
.acct-side__link{display:flex;justify-content:space-between;align-items:center;background:var(--green);color:var(--white);font-weight:700;text-decoration:none;padding:8px 12px;margin-bottom:12px;border-bottom:2px solid var(--green-shade)}
.acct-side__link:visited{color:var(--white)}
.acct-side__link:hover{background:var(--green-hover);color:var(--white)}
.acct-side__link::after{content:"\203A";font-size:24px;line-height:1}

/* The reference, front and centre, as on the application tracker. */
.cu-ref{margin:-15px 0 30px}
.cu-ref__label{display:block;font-size:16px;color:var(--dark-grey)}
.cu-ref__number{display:block;font-size:30px;line-height:1.25;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.cu-ref__hint{display:block;font-size:16px;color:var(--dark-grey)}

/* Contact, at the bottom of the page, from the case status tracker. */
.support{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:35px}
@media(max-width:800px){.support{grid-template-columns:1fr}}
.support-card{border:1px solid var(--mid-grey);background:var(--white);padding:20px 25px}
.support-card h3{margin-top:0}
.support-card p{font-size:16px;margin:0 0 10px}
.support-card p:last-child{margin:0}
.support-card__big{font-size:24px;font-weight:700;display:block;margin-bottom:6px}

/* The case status card. */
.cu-status{border:5px solid var(--blue);padding:20px 20px 0;margin-bottom:30px}
.cu-status__headline{font-size:24px;line-height:1.25;font-weight:700;margin:10px 0 20px}
.cu-status .govuk-summary-list{margin-bottom:20px}
.cu-status__action{margin-bottom:20px}

/* The timeline, newest first. */
.cu-timeline{list-style:none;margin:0 0 30px;padding:0;border-top:1px solid var(--mid-grey)}
.cu-timeline__item{padding:15px 0;border-bottom:1px solid var(--mid-grey)}
.cu-timeline__date{display:block;font-size:16px;color:var(--dark-grey);margin-bottom:2px}
.cu-timeline__title{display:block;font-weight:700;margin-bottom:5px}
.cu-timeline__item p{margin:0 0 5px}
.cu-timeline__item .govuk-tag{font-size:16px}

/* "How this was built". A demo layer, distinct from design notes. */
.cu-built{border:2px dashed #0b4144;background:#eef6f6;padding:10px 15px;margin:10px 0 5px;font-size:14px}
.cu-built__label{display:block;color:#0b4144;text-transform:uppercase;letter-spacing:1px;font-weight:700;font-size:13px;margin-bottom:6px}
.cu-built table{border-collapse:collapse;width:100%;margin-bottom:6px}
.cu-built th,.cu-built td{text-align:left;padding:2px 10px 2px 0;vertical-align:top;font-size:14px;border-bottom:1px solid #c5dddd}
.cu-built th{font-weight:700;width:34%}
.cu-built code,.cu-mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.cu-built ul{margin:4px 0 0;padding-left:18px}
.cu-built p{font-size:14px;margin:0 0 4px}
.cu-scroll{overflow-x:auto;margin-bottom:30px}
.cu-scroll .govuk-table{margin-bottom:0;font-size:16px}

.cu-pdf{background:#f3f2f1;border:1px solid var(--mid-grey);padding:40px 20px;text-align:center;margin-bottom:30px;color:var(--dark-grey)}

/* Phone and inbox mock-ups for the notification. */
.cu-device{border:2px solid var(--black);border-radius:6px;padding:15px 20px;margin-bottom:25px;max-width:480px}
.cu-device__label{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dark-grey);margin-bottom:8px;display:block}
.cu-device p{font-size:16px;margin:0 0 8px}
.cu-device p:last-child{margin:0}

.cu-index{list-style:none;margin:0 0 30px;padding:0}
.cu-index li{margin-bottom:12px}
.cu-index a{font-weight:700}
.cu-index span{display:block;font-size:16px;color:var(--dark-grey)}

html{color-scheme:light}
.govuk-textarea{font-family:inherit;font-size:19px;padding:5px 10px;border:2px solid var(--black);width:100%;min-height:120px;display:block}
.govuk-textarea:focus{outline:3px solid var(--focus);outline-offset:0}
.govuk-form-group--error .govuk-textarea,.govuk-form-group--error .govuk-input{border-color:var(--red)}
.govuk-select{font-family:inherit;font-size:19px;padding:5px;border:2px solid var(--black)}
.govuk-panel__body strong{font-size:36px;letter-spacing:1px}
.govuk-button[disabled]{opacity:.5}
</style>
</head>
<body>
<a class="govuk-skip-link" href="#" onclick="document.getElementById('main').scrollIntoView();return false">Skip to main content</a>
<div id="app"></div>

/* ---------- all screens ---------- */
const li=(h,t,d)=>`<li><a href="${h}">${t}</a><span>${d}</span></li>`;
const rAll=()=>chrome(`<h1 class="govuk-heading-xl">All screens</h1><p class="govuk-body">Two journeys linked by one declaration. What the customer tells us is what the healthcare professional is later shown, and DVLA only asks the doctor when something needs checking.</p><h2 class="govuk-heading-m">Customer</h2><ul class="cu-index">${li("#sign-in","Sign in","GOV.UK One Login, simulated")}${li("#account","Account: your health and driving","The card changes as the case moves")}${li("#declare-start","Tell us about your Parkinson’s","Start page, then one question per page, check answers, confirmation")}</ul><h2 class="govuk-heading-m">Healthcare professional</h2><ul class="cu-index">${li("#hcp-sign-in","Sign in","Registered clinician, or staff acting for one")}${li("#hcp-requests","Your evidence requests","Confirm, targeted questions, or attach what you already have")}</ul><h2 class="govuk-heading-m">DVLA</h2><ul class="cu-index">${li("#dvla-record","Case record (concept)","Where the information goes, and the random verification control")}</ul>${note("Start anywhere","<p>Do the customer journey first, then open the healthcare professional journey. The request built from your answers appears at the bottom of the requests list.</p>")}`,{});
/* ---------- customer ---------- */
const cvis=()=>CP.filter(p=>!p.s||p.s(CA));
function cstatus(){
 if(!sub)return{tag:"Not started",col:"grey",head:"You haven’t told us about your Parkinson’s yet.",next:"It takes a few minutes. You can answer ‘I’m not sure’ to anything you don’t know.",go:1};
 const r=sub.r,a=ans[4];
 if(!r)return{tag:"With us",col:"blue",head:"We’re looking at what you told us",next:"We don’t expect to need to ask your doctor. We’ll write to you when we have a decision."};
 if(a._sent&&!a._adm)return{tag:"With us",col:"blue",head:"We’re looking at information from your doctor",next:"We’ll write to you when we have a decision."};
 return{tag:"Waiting on someone else",col:"purple",head:r.task=="Confirm"?"We’ve asked a doctor who treats you to check what you told us":"We’ve asked a doctor who treats you a few clinical questions",next:"You don’t need to do anything. We’ll tell you if we need anything from you."}}
const rSignIn=()=>chrome(`<h1 class="govuk-heading-xl">Sign in to your driver and vehicles account</h1><p class="govuk-body">You’ll sign in with GOV.UK One Login. You can tell us about a health condition and see what’s happening with your case.</p><div class="govuk-inset-text">Prototype: One Login is simulated here. You do not need to enter any details.</div><button class="govuk-button" type="button" onclick="access=true;navigate('#account')">Continue to GOV.UK One Login</button>${note("Same front door as the rest of the account","<p>Health and driving is a card on the customer’s existing account, not a new service to find.</p>"+qn("DPP","What identity level is needed before a customer can make a declaration that carries most of a decision?"))}`);
function rAccount(){const s=cstatus();
 return chrome(`<h1 class="govuk-heading-xl">Your driver and vehicles account</h1><div class="acct-card"><div class="acct-card__head"><h2>Your health and driving</h2></div><dl class="govuk-summary-list">${sub?row("Reference","<b>"+REF+"</b>"):""}${sub?row("Condition you’ve told us about","Parkinson’s"):""}${row("What’s happening",tag(s.tag,s.col)+"<br>"+s.head)}${row("What happens next",s.next)}</dl>${s.go?`<p><button class="govuk-button" type="button" onclick="navigate('#declare-start')">Tell us about your Parkinson’s</button></p>`:""}</div>${note("The card follows the case","<p>Status wording follows the case updates prototype: With us, Waiting on someone else. It changes when the doctor’s request is sent and answered.</p>"+qn("Policy","Should the customer see that a doctor has been asked, and what for?"))}`,{})}
const rDStart=()=>chrome(`<span class="govuk-caption">Your health and driving</span><h1 class="govuk-heading-xl">Tell us about your Parkinson’s</h1><p class="govuk-body">Your answers carry most of the decision. We only ask your doctor when something needs checking.</p><p class="govuk-body"><strong>You do not need to request new medical evidence to complete this.</strong></p><p class="govuk-body">You can answer ‘I’m not sure’ to anything you do not know.</p><button class="govuk-button govuk-button--start" type="button" onclick="ccur=cvis()[0].id;cchk=false;err=null;navigate('#declare-question')">Start now</button>${note("The declaration is data, not a form to scan","<p>Answers are held as structured data so DVLA can spot exceptions and contradictions, and so the doctor is shown them instead of being asked again.</p>"+qn("Policy","What is the legal footing for treating the declaration as the main evidence on a first notification?"))}`,{back:["navigate('#account')","Back to your account"]});
function rDQ(){const v=cvis();if(!v.find(p=>p.id==ccur))ccur=v[0].id;const p=v.find(x=>x.id==ccur);
 return qpage(p,CA,"Tell us about your Parkinson’s","cnext()","cback()","c")}
function cnext(){const p=cvis().find(x=>x.id==ccur),v=readF(p);if(v==null){err=errMsg(p);route();return}
 CA[p.id]=v;err=null;const vs=cvis();
 if(cchk){const u=vs.find(x=>CA[x.id]===undefined);if(u){ccur=u.id;navigate("#declare-question")}else{cchk=false;navigate("#declare-check")}return}
 const i=vs.findIndex(x=>x.id==ccur);if(i+1<vs.length){ccur=vs[i+1].id;navigate("#declare-question")}else navigate("#declare-check")}
function cback(){const v=cvis();err=null;if(cchk){cchk=false;navigate("#declare-check");return}const i=v.findIndex(p=>p.id==ccur);if(i>0){ccur=v[i-1].id;navigate("#declare-question")}else navigate("#declare-start")}
function cbackCheck(){const v=cvis();ccur=v[v.length-1].id;navigate("#declare-question")}
function cchg(id){ccur=id;cchk=true;err=null;navigate("#declare-question")}
const rDCheck=()=>chrome(`<h1 class="govuk-heading-xl">Check your answers before sending them</h1><dl class="govuk-summary-list">${cvis().map(p=>row(esc(p.l),esc(val(CA,p)),`<a href="#" onclick="cchg('${p.id}');return false;">Change<span class="govuk-visually-hidden"> ${esc(p.l)}</span></a>`)).join("")}</dl><h2 class="govuk-heading-m">Now send your information</h2><p class="govuk-body">By submitting this, you confirm that the information you’ve provided is true to the best of your knowledge.</p><button class="govuk-button" type="button" onclick="buildCase();navigate('#declare-sent')">Accept and send</button>`,{back:["cbackCheck()","Back"]});
function rDSent(){if(!sub)return rAccount();const r=sub.r;
 return chrome(`<div class="govuk-panel"><h1 class="govuk-panel__title">Information sent</h1><div class="govuk-panel__body">Your reference number<br><strong>${REF}</strong></div></div><p class="govuk-body">Prototype only: nothing has actually been sent.</p><h2 class="govuk-heading-m">What happens next</h2><p class="govuk-body">${!r?"Based on your answers, we don’t expect to need to ask your doctor. We’ll review what you told us and write to you.":r.task=="Confirm"?"We’ll ask a doctor who treats you to check your answers against their records. They won’t need to write a report. You don’t need to do anything.":"We’ll ask a doctor who treats you a few clinical questions. You don’t need to do anything."}</p><div class="govuk-button-group"><button class="govuk-button" type="button" onclick="navigate('#account')">Go to your account</button>${r?`<button class="govuk-button govuk-button--secondary" type="button" onclick="navigate('#hcp-sign-in')">See what the doctor receives</button>`:`<button class="govuk-button govuk-button--secondary" type="button" onclick="navigate('#dvla-record')">See the DVLA case record</button>`}</div>${note("Illustrative routing rules","<p>Not DVLA rules. A request is created if the customer withholds consent, says sleepiness has affected their driving, or says their condition has got worse or their medication has changed. Otherwise no request is sent, which tests whether the declaration alone can carry the decision. Licence type is collected but not used yet.</p>"+qn("Medical","Which declared answers should be risk indicators, and which only exceptions?"))}`,{})}
/* ---------- healthcare professional ---------- */
function login(){const r=document.querySelector("input[name=r]:checked");U.name=document.getElementById("nm").value.trim();U.reg=document.getElementById("rg").value.trim();U.clin=document.getElementById("cl").value.trim();U.role=r?r.value:"";
 if(!U.role||!U.name||!U.reg||(U.role=="admin"&&!U.clin)){err="Choose how you’re using the service and fill in every box"+(U.role=="admin"?", including the clinician’s name":"");route();return}
 user=Object.assign({},U);err=null;navigate("#hcp-requests")}
const rHSign=()=>chrome(`${err?`<div class="govuk-error-summary" role="alert"><h2>There is a problem</h2><ul><li>${esc(err)}</li></ul></div>`:""}<h1 class="govuk-heading-xl">Sign in to the medical evidence service</h1><p class="govuk-body">For healthcare professionals, and the practice or hospital staff who complete requests for them.</p><div class="govuk-inset-text">Prototype: no real check is made. A real service would verify the registration against the professional register.</div><div class="govuk-form-group"><fieldset class="govuk-fieldset"><legend class="govuk-fieldset__legend">How are you using the service?</legend><div class="govuk-radios"><div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="r" id="r1" value="hcp" ${U.role=="hcp"?"checked":""}><label class="govuk-radios__label" for="r1">I’m a registered healthcare professional</label></div><div class="govuk-radios__item"><input class="govuk-radios__input" type="radio" name="r" id="r2" value="admin" ${U.role=="admin"?"checked":""}><label class="govuk-radios__label" for="r2">I’m completing requests for a clinician (practice or hospital staff)</label></div></div></fieldset></div><div class="govuk-form-group"><label class="govuk-label" for="nm">Your name</label><input class="govuk-input" id="nm" value="${esc(U.name)}"></div><div class="govuk-form-group"><label class="govuk-label" for="rg">Clinician’s professional registration number</label><span class="govuk-hint">For example, a GMC number</span><input class="govuk-input govuk-input--width-10" id="rg" value="${esc(U.reg)}"></div><div class="govuk-form-group"><label class="govuk-label" for="cl">Clinician’s name</label><span class="govuk-hint">Only if you’re completing requests for a clinician</span><input class="govuk-input" id="cl" value="${esc(U.clin)}"></div><button class="govuk-button" type="button" onclick="login()">Continue</button>${note("Admin staff act for the clinician","<p>The admin route ends with the clinician approving before anything is sent to DVLA.</p>"+qn("DPP","How do we verify the person is a registered healthcare professional, and how do practice and hospital admin teams complete tasks for them?"))}`,{svc:"hcp"});
function openCase(i){ci=i;navigate("#hcp-request")}
function rHReqs(){return chrome(`<h1 class="govuk-heading-xl">Your evidence requests</h1><p class="govuk-body">Each request says why we’re asking and what we need. We only ask for what the patient couldn’t tell us.</p><div class="cu-scroll"><table class="govuk-table"><thead><tr><th>Patient</th><th>What we need</th><th>Status</th><th><span class="govuk-visually-hidden">Action</span></th></tr></thead><tbody>${CASES.map((c,i)=>`<tr><td>${c.pt}<span class="govuk-hint">${c.ref} · ${c.cond}</span></td><td>${tag(c.task,TC[c.task])}<span class="govuk-hint">${c.tag}</span></td><td>${ans[i]._sent?tag(ans[i]._adm?"Awaiting approval":"Sent","green"):tag("New","blue")}</td><td><a href="#" onclick="openCase(${i});return false;">Open<span class="govuk-visually-hidden"> ${c.ref}</span></a></td></tr>`).join("")}</tbody></table></div>${CASES.length<5?`<p class="govuk-body">Complete the customer journey to add a request built from your own answers.</p>`:""}<p class="govuk-body-s">Prefer paper? You can still return the paper form. Using the digital service is optional.</p>${note("Tasks are chosen by what each case needs","<p>Not by condition form. If the declaration predicts the outcome, some cases would never be sent here at all.</p>"+qn("Policy","What do we pay for a quick confirmation compared with a full report?"))}`,{svc:"hcp",full:true})}
function rHReq(){const c=CASES[ci];if(!c)return rHReqs();
 return chrome(`<span class="govuk-caption">${c.pt} · ${c.ref}</span><h1 class="govuk-heading-xl">${c.cond}: ${TL[c.task]}</h1><div class="govuk-inset-text"><strong>Why we’re asking you.</strong> ${c.why}</div><h2 class="govuk-heading-m">What the patient told us</h2><dl class="govuk-summary-list">${c.decl.map(([l,v])=>row(l,esc(v))).join("")}</dl><h2 class="govuk-heading-m">What we need from you</h2><p class="govuk-body">${TD[c.task]}</p><p class="govuk-body">Fee: ${FEE}, paid digitally when you submit.</p><button class="govuk-button govuk-button--start" type="button" onclick="startTask()">Start</button><details class="govuk-details"><summary class="govuk-details__summary">Prefer to use paper?</summary><div class="govuk-details__text">You can still return the paper form. Using the digital service is optional.</div></details>${note("Reason, declaration, then the ask","<p>"+TN[c.task]+" "+c.n+"</p>"+qn("Medical","What will a healthcare professional put their name to? ‘Nothing in my records contradicts this’ is very different from ‘this patient is safe to drive’. Use the wording switch at the top to compare."))}`,{svc:"hcp",back:["navigate('#hcp-requests')","Back to your requests"]})}
const hvis=()=>CASES[ci].pages().filter(p=>!p.s||p.s(ans[ci]));
function startTask(){cur=hvis()[0].id;t0=Date.now();chk=false;err=null;navigate("#hcp-question")}
function rHQ(){if(!CASES[ci])return rHReqs();const v=hvis();if(!v.find(p=>p.id==cur))cur=v[0].id;const p=v.find(x=>x.id==cur),c=CASES[ci];
 return qpage(p,ans[ci],c.cond+": "+c.task.toLowerCase(),"hnext()","hback()","hcp")}
function hnext(){const p=hvis().find(x=>x.id==cur),v=readF(p);if(v==null){err=errMsg(p);route();return}
 ans[ci][p.id]=v;err=null;const vs=hvis();
 if(chk){const u=vs.find(x=>ans[ci][x.id]===undefined);if(u){cur=u.id;navigate("#hcp-question")}else{chk=false;navigate("#hcp-check")}return}
 const i=vs.findIndex(x=>x.id==cur);if(i+1<vs.length){cur=vs[i+1].id;navigate("#hcp-question")}else navigate("#hcp-check")}
function hback(){const v=hvis();err=null;if(chk){chk=false;navigate("#hcp-check");return}const i=v.findIndex(p=>p.id==cur);if(i>0){cur=v[i-1].id;navigate("#hcp-question")}else navigate("#hcp-request")}
function hbackCheck(){const v=hvis();cur=v[v.length-1].id;navigate("#hcp-question")}
function hchg(id){cur=id;chk=true;err=null;navigate("#hcp-question")}
function sendH(){const a=ans[ci];a._sent=1;a._adm=adm()?1:0;navigate("#hcp-sent")}
function rHCheck(){if(!CASES[ci])return rHReqs();const v=hvis(),a=ans[ci];
 return chrome(`<h1 class="govuk-heading-xl">Check your answers before sending</h1><dl class="govuk-summary-list">${v.map(p=>row(esc(p.l),esc(val(a,p)),`<a href="#" onclick="hchg('${p.id}');return false;">Change<span class="govuk-visually-hidden"> ${esc(p.l)}</span></a>`)).join("")}</dl>${CASES[ci].task=="Attach"&&v.length<4?`<div class="govuk-inset-text">The letter covered everything we needed, so you were asked ${v.length} question${v.length==1?"":"s"}.</div>`:""}<h2 class="govuk-heading-m">${adm()?"Send for approval":"Now send your response"}</h2><p class="govuk-body">${adm()?"By sending this, you confirm the information is accurate to the best of your knowledge. "+esc(user.clin)+" must approve it before it goes to DVLA.":"By sending this, you confirm the information is accurate to the best of your professional knowledge and based on the patient’s records."}</p><button class="govuk-button" type="button" onclick="sendH()">${adm()?"Send to clinician for approval":"Accept and send"}</button>`,{svc:"hcp",back:["hbackCheck()","Back"]})}
function rHSent(){if(!CASES[ci])return rHReqs();const s=Math.round((Date.now()-t0)/1000),tm=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
 return chrome(`<div class="govuk-panel"><h1 class="govuk-panel__title">${adm()?"Ready for approval":"Response sent"}</h1><div class="govuk-panel__body">${CASES[ci].ref}</div></div><p class="govuk-body">Prototype only: nothing has actually been sent.</p><h2 class="govuk-heading-m">What happens next</h2><p class="govuk-body">${adm()?esc(user.clin)+" will be asked to review and approve this before anything goes to DVLA.":"DVLA will review your response alongside the patient’s declaration. We’ll only contact you again if we need further clinical information."}</p><div class="govuk-inset-text"><strong>Payment.</strong> ${FEE} will be paid to the account on your profile ${adm()?"once the clinician approves":"when you submit"}. Prototype: no payment is made and the fee is a placeholder.</div><p class="govuk-body-s">Time on this task: ${tm}</p><div class="govuk-button-group"><button class="govuk-button" type="button" onclick="navigate('#hcp-requests')">Back to your requests</button>${ci==4?`<button class="govuk-button govuk-button--secondary" type="button" onclick="navigate('#dvla-record')">See the DVLA case record</button>`:""}</div>${note("Where the response goes","<p>In a real service it would go to the case owner’s queue so returns do not sit waiting to be scanned and indexed, and it would trigger payment. Not designed here.</p>"+qn("Policy","How do fees work when a confirmation takes minutes and a report takes half an hour?"))}`,{svc:"hcp"})}
/* ---------- DVLA record ---------- */
function rRec(){
 if(!sub)return chrome(`<h1 class="govuk-heading-xl">DVLA case record</h1><p class="govuk-body">Nothing received yet. Complete the customer journey and send it, and this page shows where the information goes.</p><button class="govuk-button" type="button" onclick="navigate('#sign-in')">Start the customer journey</button>`,{});
 const r=sub.r,c=CASES[4],a=ans[4],sent=c&&a._sent,pg=c?c.pages().filter(p=>!p.s||p.s(a)):[];
 return chrome(`<span class="govuk-caption">Concept, not a designed caseworker tool</span><h1 class="govuk-heading-xl">DVLA case record</h1><p class="govuk-body">${REF}</p><h2 class="govuk-heading-m">1. Received from the customer</h2><dl class="govuk-summary-list">${sub.dl.map(([l,v])=>row(l,esc(v))).join("")}</dl><h2 class="govuk-heading-m">2. Evidence route</h2>${r?`<div class="govuk-inset-text">${tag(r.task,TC[r.task])} ${r.tag}<br>${r.why}</div>`:`<div class="govuk-inset-text">No request to the doctor. The declaration is enough to proceed.</div>`}<h2 class="govuk-heading-m">3. Doctor’s response</h2><p class="govuk-body">${!r?"Not needed.":!sent?"The request is waiting in the doctor’s evidence requests.":a._adm?"Completed by an admin. Awaiting clinician approval.":"Response received."}</p>${sent?`<dl class="govuk-summary-list">${pg.map(p=>row(esc(p.l),esc(val(a,p)))).join("")}</dl>`:""}<h2 class="govuk-heading-m">4. Random verification</h2><p class="govuk-body">A sample of declarations is checked to keep them honest and measure accuracy. It only changes the route when no exception or risk indicator applies.</p><button class="govuk-button govuk-button--secondary" type="button" onclick="SAMPLE=!SAMPLE;buildCase();route()">${SAMPLE?"Remove from random sample":"Select for random verification"}</button>${note("A concept view","<p>Shows the chain end to end. Not a designed caseworker tool.</p>")}`,{})}
/* ---------- router ---------- */
const ROUTES={"all-screens":rAll,"sign-in":rSignIn,"account":rAccount,"declare-start":rDStart,"declare-question":rDQ,"declare-check":rDCheck,"declare-sent":rDSent,"hcp-sign-in":rHSign,"hcp-requests":rHReqs,"hcp-request":rHReq,"hcp-question":rHQ,"hcp-check":rHCheck,"hcp-sent":rHSent,"dvla-record":rRec};
function route(){let h=(location.hash||"#all-screens").slice(1);if(!ROUTES[h])h="all-screens";
 if(["account","declare-start","declare-question","declare-check","declare-sent"].includes(h)&&!access)h="sign-in";
 if(h.startsWith("hcp-")&&h!="hcp-sign-in"&&!user)h="hcp-sign-in";
 if(h=="hcp-sign-in"&&user)h="hcp-requests";
 document.getElementById("app").innerHTML=ROUTES[h]();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);route();
</script>
</body></html>

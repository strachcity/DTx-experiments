<title>Example service (prototype)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

/* --- Palette. Values taken from govuk-frontend 6.0.0 (the GOV.UK
       rebrand), read from its compiled custom properties rather than
       guessed. GDS Transport is licence-restricted off gov.uk, so Inter
       stands in for it, as in every prototype here. --- */
:root{--black:#0b0c0c;--white:#fff;--blue:#1d70b8;--link:#1a65a6;--link-hover:#0f385c;--dark-blue:#0f385c;--green:#0f7a52;--green-hover:#0b5c3e;--green-shade:#083d29;--yellow:#fd0;--light-yellow:#fff7bf;--light-grey:#f4f8fb;--mid-grey:#cecece;--dark-grey:#484949;--red:#ca3535;--red-shade:#651b1b;--purple:#54319f;--focus:#fd0;--focus-text:#0b0c0c}
*,*::before,*::after{box-sizing:border-box}
body{font-family:"GDS Transport","Inter",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--black);background:var(--white);margin:0;padding:0;line-height:1.5;font-size:19px}

/* --- Header --- */
.govuk-header{background:var(--blue);color:var(--white);padding:10px 0}
.govuk-header__container{max-width:960px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:10px}
.govuk-header__homepage-link{display:inline-flex;align-items:center;color:var(--white);text-decoration:none}
.govuk-header__homepage-link:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.govuk-header__logotype{height:30px;width:162px;fill:currentcolor}
.govuk-header__signout{margin-left:auto;font-size:19px;font-weight:700;color:var(--white);text-decoration:none;cursor:pointer}
.govuk-header__signout:hover{text-decoration:underline}
.service-nav{border-bottom:1px solid var(--mid-grey);background:var(--white);padding:12px 0}
.service-nav__wrapper{max-width:960px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.service-nav__name{font-weight:700;font-size:19px;color:var(--black);text-decoration:none}
.govuk-phase-banner{border-bottom:1px solid var(--mid-grey);padding:10px 0}
.govuk-phase-banner__wrapper{max-width:960px;margin:0 auto;padding:0 15px;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.govuk-phase-banner__tag{display:inline-block;background:var(--blue);color:var(--white);font-weight:700;font-size:14px;padding:2px 8px;text-transform:uppercase;letter-spacing:1px}
.phase-actions{margin-left:auto;display:flex;gap:15px;align-items:center}
.phase-actions a{font-size:16px;cursor:pointer}
.prototype-warning{background:var(--light-yellow);border:4px solid var(--yellow);padding:15px 20px;margin-bottom:30px;font-size:16px;line-height:1.5}
.prototype-warning strong{display:block;margin-bottom:4px}
.govuk-width-container{max-width:960px;margin:0 auto;padding:0 15px}
.govuk-main-wrapper{padding:30px 0 60px}
.govuk-skip-link{position:absolute;left:-9999px;top:0;background:var(--yellow);color:var(--black);padding:10px 15px;font-weight:700;z-index:10}
.govuk-skip-link:focus{left:0}

/* --- Typography --- */
h1,.govuk-heading-xl{font-size:48px;line-height:1.04;font-weight:700;margin:0 0 30px}
h2,.govuk-heading-l{font-size:36px;line-height:1.11;font-weight:700;margin:30px 0 20px}
h3,.govuk-heading-m{font-size:24px;line-height:1.25;font-weight:700;margin:20px 0 15px}
h4,.govuk-heading-s{font-size:19px;line-height:1.3;font-weight:700;margin:15px 0 10px}
p,.govuk-body{font-size:19px;margin:0 0 20px}
.govuk-body-s{font-size:16px}
.govuk-body-l{font-size:24px;line-height:1.25;margin:0 0 20px}
.govuk-caption{font-size:24px;color:var(--dark-grey);display:block;margin-bottom:5px}
a{color:var(--link)}a:hover{color:var(--link-hover)}
a:visited{color:var(--purple)}
a:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--focus-text);text-decoration:none}
.govuk-list{margin:0 0 20px;padding:0;list-style:none}
.govuk-list>li{margin-bottom:5px}
.govuk-list--bullet{list-style:disc;padding-left:20px}
.govuk-list--number{list-style:decimal;padding-left:20px}
.govuk-visually-hidden{position:absolute!important;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);border:0;white-space:nowrap}
hr.govuk-section-break{border:none;border-bottom:1px solid var(--mid-grey);margin:30px 0}
.govuk-back-link{display:inline-block;margin-bottom:15px;font-size:16px;color:var(--black);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.govuk-back-link::before{content:"\25c2 "}

/* --- Buttons --- */
.govuk-button{display:inline-block;padding:8px 20px;font-size:19px;font-weight:700;color:var(--white);background:var(--green);border:none;border-radius:0;border-bottom:2px solid var(--green-shade);cursor:pointer;text-decoration:none;line-height:1.2;-webkit-appearance:none;font-family:inherit}
.govuk-button:hover{background:var(--green-hover);color:var(--white)}
.govuk-button:focus{outline:3px solid var(--focus);outline-offset:0}
.govuk-button--start{font-size:24px;padding:12px 30px}
.govuk-button--start::after{content:" \2192"}
.govuk-button--secondary{background:#f3f3f3;color:var(--black);border-bottom-color:#858686}
.govuk-button--secondary:hover{background:#dbdad9;color:var(--black)}
.govuk-button--warning{background:var(--red);border-bottom-color:var(--red-shade)}
.govuk-button--warning:hover{background:#a82b2b}
.govuk-button-group{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin-top:20px}
.button-row{display:flex;gap:15px;flex-wrap:wrap;margin-top:20px}

/* --- Forms --- */
.govuk-form-group{margin-bottom:30px}
.govuk-fieldset__legend{font-weight:700;font-size:19px;margin-bottom:10px;display:block}
.govuk-fieldset__legend--l{font-size:36px;line-height:1.11;margin-bottom:20px}
.govuk-fieldset__legend--xl{font-size:48px;line-height:1.04;margin-bottom:25px}
.govuk-fieldset__heading{font-size:inherit;line-height:inherit;font-weight:inherit;margin:0}
.govuk-radios__item,.govuk-checkboxes__item{display:flex;align-items:flex-start;margin-bottom:15px;gap:12px}
.govuk-radios__input,.govuk-checkboxes__input{width:44px;height:44px;min-width:44px;margin:0;cursor:pointer;accent-color:var(--black)}
.govuk-radios__label,.govuk-checkboxes__label{font-size:19px;padding-top:10px;cursor:pointer}
.govuk-radios__hint,.govuk-checkboxes__hint{font-size:16px;color:var(--dark-grey);margin-top:2px;display:block}
.govuk-radios__conditional{margin:0 0 15px 22px;padding:15px 0 0 20px;border-left:4px solid var(--mid-grey)}
.govuk-radios__divider,.govuk-checkboxes__divider{font-size:19px;margin:0 0 15px;color:var(--black)}
.govuk-label{display:block;font-weight:700;margin-bottom:5px}
.govuk-hint{font-size:16px;color:var(--dark-grey);margin-bottom:10px;display:block}
.govuk-input{font-family:inherit;font-size:19px;padding:5px 10px;border:2px solid var(--black);width:100%;max-width:400px}
.govuk-input:focus,.govuk-select:focus,.govuk-textarea:focus{outline:3px solid var(--focus);outline-offset:0}
.govuk-input--width-2{max-width:65px}.govuk-input--width-4{max-width:100px}.govuk-input--width-10{max-width:250px}.govuk-input--width-20{max-width:400px}
.govuk-textarea{font-family:inherit;font-size:19px;padding:5px 10px;border:2px solid var(--black);width:100%;min-height:120px}
.govuk-select{font-family:inherit;font-size:19px;padding:5px 10px;border:2px solid var(--black);max-width:400px;background:var(--white)}
.govuk-character-count__message{font-size:16px;color:var(--dark-grey);margin-top:5px}
.govuk-character-count__message--over{color:var(--red);font-weight:700}
.govuk-file-upload{font-family:inherit;font-size:19px;padding:5px 0;max-width:400px}
.govuk-date-input{display:flex;gap:20px;flex-wrap:wrap}
.govuk-date-input__item{flex:0 0 auto}
.govuk-date-input__label{display:block;font-weight:700;margin-bottom:5px;font-size:19px}

/* --- Summary list / table / task list --- */
.govuk-summary-list{border-top:1px solid var(--mid-grey);margin:0 0 30px}
.govuk-summary-list__row{display:flex;border-bottom:1px solid var(--mid-grey);padding:12px 0;gap:15px}
.govuk-summary-list__key{flex:0 0 32%;font-weight:700}
.govuk-summary-list__value{flex:1}
.govuk-summary-list__actions{flex:0 0 80px;text-align:right}
@media(max-width:640px){.govuk-summary-list__row{flex-direction:column;gap:4px}.govuk-summary-list__key{flex:auto}.govuk-summary-list__actions{text-align:left}}
.govuk-table{width:100%;border-collapse:collapse;margin-bottom:30px}
.govuk-table th{text-align:left;font-weight:700;padding:10px 15px 10px 0;border-bottom:2px solid var(--black)}
.govuk-table td{padding:10px 15px 10px 0;border-bottom:1px solid var(--mid-grey);vertical-align:top}
.govuk-task-list{list-style:none;margin:0 0 30px;padding:0;border-top:1px solid var(--mid-grey)}
.govuk-task-list__item{display:flex;gap:15px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--mid-grey)}
.govuk-task-list__name-and-hint{flex:1}
.govuk-task-list__hint{font-size:16px;color:var(--dark-grey);margin-top:2px}
.govuk-task-list__status{flex:0 0 auto;text-align:right;padding-top:2px}

/* --- Tags / panels / content --- */
.govuk-tag{display:inline-block;font-size:19px;line-height:1.32;font-weight:700;padding:2px 8px 3px;border-radius:1px;max-width:160px;overflow-wrap:break-word;color:#0f385c;background:#d2e2f1}
.govuk-tag--blue{color:#0f385c;background:#d2e2f1}
.govuk-tag--green{color:#083d29;background:#cfe4dc}
.govuk-tag--purple{color:#2a1950;background:#ddd6ec}
.govuk-tag--red{color:#651b1b;background:#f4d7d7}
.govuk-tag--orange{color:#7a3c1c;background:#fde4d7}
.govuk-tag--teal{color:#0b4144;background:#d0e6e7}
.govuk-tag--magenta{color:#651b3e;background:#f4d7e5}
.govuk-tag--yellow{color:#7a3c1c;background:#ffee80}
.govuk-tag--grey{color:#0b0c0c;background:#cecece}
.govuk-inset-text{border-left:10px solid var(--mid-grey);padding:15px 20px;margin:0 0 30px}
.govuk-panel{background:var(--green);color:var(--white);padding:35px;text-align:center;margin-bottom:30px}
.govuk-panel__title{font-size:48px;font-weight:700;margin:0 0 15px}
.govuk-panel__body{font-size:36px}
.govuk-warning-text{display:flex;gap:15px;align-items:flex-start;margin-bottom:30px}
.govuk-warning-text__icon{flex:0 0 35px;height:35px;background:var(--black);color:var(--white);border-radius:50%;text-align:center;font-weight:700;line-height:35px;font-size:24px}
.govuk-warning-text__text{font-weight:700}
.govuk-details{margin-bottom:30px;display:block}
.govuk-details__summary{color:var(--link);cursor:pointer;text-decoration:underline;font-size:19px;margin-bottom:5px}
.govuk-details__summary:focus{outline:3px solid var(--focus);background:var(--focus);color:var(--focus-text);text-decoration:none}
.govuk-details__text{border-left:5px solid var(--mid-grey);padding:15px 20px;font-size:19px}
.govuk-details__text p{margin:0 0 10px}
.govuk-details__text p:last-child{margin:0}
.govuk-notification-banner{border:5px solid var(--blue);margin-bottom:30px}
.govuk-notification-banner__header{background:var(--blue);color:var(--white);padding:8px 15px;font-size:19px;font-weight:700}
.govuk-notification-banner__title{margin:0;font-size:19px}
.govuk-notification-banner__content{padding:20px 15px;font-size:19px}
.govuk-notification-banner__heading{font-size:24px;font-weight:700;margin:0 0 10px}
.govuk-notification-banner__content p{margin:0 0 10px}
.govuk-notification-banner__content p:last-child{margin:0}
.govuk-notification-banner--success{border-color:var(--green)}
.govuk-notification-banner--success .govuk-notification-banner__header{background:var(--green)}

/* --- Errors --- */
.govuk-error-summary{border:5px solid var(--red);padding:20px 25px;margin-bottom:30px}
.govuk-error-summary h2{margin:0 0 10px;font-size:24px}
.govuk-error-summary ul{margin:0;padding-left:20px}
.govuk-error-summary li{margin-bottom:6px}
.govuk-error-summary a{color:var(--red);font-weight:700}
.govuk-form-group--error{border-left:5px solid var(--red);padding-left:15px}
.govuk-error-message{color:var(--red);font-weight:700;display:block;margin-bottom:10px}
.govuk-input--error,.govuk-select--error,.govuk-textarea--error{border-color:var(--red)}

/* --- Grid --- */
.govuk-grid-row{display:flex;flex-wrap:wrap;margin:0 -15px}
.govuk-grid-column-two-thirds{flex:0 0 66.66%;max-width:66.66%;padding:0 15px}
.govuk-grid-column-one-third{flex:0 0 33.33%;max-width:33.33%;padding:0 15px}
.govuk-grid-column-full{flex:0 0 100%;max-width:100%;padding:0 15px}
@media(max-width:640px){.govuk-grid-column-two-thirds,.govuk-grid-column-one-third{flex:0 0 100%;max-width:100%}}

/* --- Footer --- */
.govuk-footer{background:var(--light-grey);border-top:10px solid var(--blue);padding:30px 0;margin-top:60px}
.govuk-footer__wrapper{max-width:960px;margin:0 auto;padding:0 15px}
.govuk-footer__meta-item{font-size:16px;color:var(--dark-grey)}

/* --- Design notes. Prototype annotation, never service UI. --- */
.design-note{border:2px dashed var(--purple);background:#f7f4fc;padding:15px 20px;margin:0 0 25px;font-size:16px}
.design-note strong{display:block;color:var(--purple);text-transform:uppercase;letter-spacing:1px;font-size:14px;margin-bottom:6px}
.design-note p{font-size:16px;margin:0 0 8px}
.design-note p:last-child{margin:0}

/* --- Reference-file furniture. Not part of the design system: these
       classes exist only to lay this catalogue out, and must not be
       copied into a service prototype. --- */
.ref-index{list-style:none;margin:0 0 30px;padding:0}
.ref-index li{margin-bottom:18px}
.ref-index a{font-size:24px;font-weight:700}
.ref-index p{margin:2px 0 0;font-size:16px;color:var(--dark-grey);max-width:44em}
.ref-block{border-top:2px solid var(--black);padding-top:20px;margin-bottom:45px}
.ref-block__title{margin:0 0 5px}
.ref-demo{background:var(--light-grey);border:1px solid var(--mid-grey);padding:25px 25px 10px;margin-bottom:15px}
.ref-demo--plain{background:var(--white)}
.ref-code{background:#0b0c0c;color:#e8e8e8;padding:15px 20px;margin:0 0 25px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ref-swatches{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:25px;padding:0;list-style:none}
.ref-swatch{flex:0 0 auto;width:150px;font-size:14px}
.ref-swatch__chip{height:48px;border:1px solid var(--mid-grey)}
.ref-swatch__name{display:block;font-weight:700;margin-top:4px}
.ref-swatch__hex{display:block;color:var(--dark-grey);font-family:ui-monospace,Menlo,Consolas,monospace}
</style>
</head>

/* One entry per screen. The All screens index is built from this. */
const SCREENS = {
  'start':        {title:'Start page'},
  'question':     {title:'How would you like us to contact you?'},
  'check':        {title:'Check your answers'},
  'confirmation': {title:'Request sent'}
};

let state;
function resetState(){
  state = { screen:'all-screens', showNotes:false, answers:{ contact:'' } };
}
resetState();

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function go(screen){ location.hash = '#/'+screen; }
function note(title, body){
  if(!state.showNotes) return '';
  return '<div class="design-note"><strong>Design note: '+esc(title)+'</strong>'+body+'</div>';
}
function toggleNotes(){ state.showNotes = !state.showNotes; route(); }
function warn(){
  return '<div class="prototype-warning"><strong>⚠ Fictional prototype</strong>'
    +'This is a fictional prototype. It is not a real GOV.UK service and all personal details shown are invented.</div>';
}

/* ---------------------------------------------------------------- */

function renderStart(){
  return '<h1 class="govuk-heading-xl">'+esc(SERVICE_NAME)+'</h1>'
    +'<p class="govuk-body">Use this service to tell us how you want to be contacted.</p>'
    + note('Why this page exists','<p>Replace with the argument this screen is making.</p>')
    +'<a href="#/question" class="govuk-button govuk-button--start" role="button">Start now</a>';
}

function renderQuestion(){
  const opt = (v, label) => '<div class="govuk-radios__item"><input class="govuk-radios__input" id="contact-'+v+'" name="contact" type="radio" value="'+v+'"'+(state.answers.contact===v?' checked':'')+'><label class="govuk-label govuk-radios__label" for="contact-'+v+'">'+label+'</label></div>';
  return '<form onsubmit="saveQuestion(event)" novalidate><div class="govuk-form-group"><fieldset class="govuk-fieldset">'
    +'<legend class="govuk-fieldset__legend govuk-fieldset__legend--l"><h1 class="govuk-fieldset__heading">How would you like us to contact you?</h1></legend>'
    +'<div class="govuk-radios">'+opt('email','Email')+opt('post','Post')+'</div>'
    +'</fieldset></div><button type="submit" class="govuk-button">Continue</button></form>';
}
function saveQuestion(e){
  e.preventDefault();
  const picked = document.querySelector('input[name="contact"]:checked');
  state.answers.contact = picked ? picked.value : '';
  go('check');
}

function renderCheck(){
  const label = {email:'Email', post:'Post'}[state.answers.contact] || 'Not answered';
  return '<h1 class="govuk-heading-l">Check your answers</h1>'
    +'<dl class="govuk-summary-list"><div class="govuk-summary-list__row">'
    +'<dt class="govuk-summary-list__key">Contact by</dt>'
    +'<dd class="govuk-summary-list__value">'+esc(label)+'</dd>'
    +'<dd class="govuk-summary-list__actions"><a class="govuk-link" href="#/question">Change<span class="govuk-visually-hidden"> how we contact you</span></a></dd>'
    +'</div></dl>'
    +'<button class="govuk-button" onclick="go(\'confirmation\')">Send request</button>';
}

function renderConfirmation(){
  return '<div class="govuk-panel govuk-panel--confirmation"><h1 class="govuk-panel__title">Request sent</h1>'
    +'<div class="govuk-panel__body">Your reference number<br><strong>EX-4821-9930</strong></div></div>'
    +'<h2 class="govuk-heading-m">What happens next</h2>'
    +'<p class="govuk-body">We will contact '+esc(PERSON.name)+' within 10 working days.</p>';
}

function renderAllScreens(){
  let items = '';
  Object.keys(SCREENS).forEach(k=>{ items += '<li><a href="#/'+k+'">'+esc(SCREENS[k].title)+'</a></li>'; });
  return '<h1 class="govuk-heading-l">All screens</h1><ul class="ref-index">'+items+'</ul>'
    +'<button class="govuk-button govuk-button--secondary" onclick="resetState();route()">Reset prototype</button>';
}

const RENDER = {
  'all-screens': renderAllScreens,
  'start': renderStart,
  'question': renderQuestion,
  'check': renderCheck,
  'confirmation': renderConfirmation
};

function renderChrome(inner){
  return '<header class="govuk-header" role="banner"><div class="govuk-header__container">'
    +'<a href="#/start" class="govuk-header__homepage-link">'+LOGO+'</a></div></header>'
    +'<div class="service-nav"><div class="service-nav__wrapper">'
    +'<a class="service-nav__name" href="#/start">'+esc(SERVICE_NAME)+'</a></div></div>'
    +'<div class="govuk-phase-banner"><div class="govuk-phase-banner__wrapper">'
    +'<span class="govuk-phase-banner__tag">Prototype</span><span>This is not a real service.</span>'
    +'<span class="phase-actions"><a href="#" onclick="toggleNotes();return false;">'+(state.showNotes?'Hide':'Show')+' design notes</a>'
    +'<a href="#/all-screens">All screens</a></span></div></div>'
    +'<div class="govuk-width-container"><main class="govuk-main-wrapper" id="main">'+warn()
    +'<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">'+inner+'</div></div></main></div>';
}

function route(){
  const key = (location.hash || '#/all-screens').replace(/^#\/?/, '') || 'all-screens';
  state.screen = RENDER[key] ? key : 'all-screens';
  document.getElementById('app').innerHTML = renderChrome(RENDER[state.screen]());
  document.title = (SCREENS[state.screen] ? SCREENS[state.screen].title : 'All screens') + ' – ' + SERVICE_NAME + ' (prototype)';
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);
</script>
